<script>
/* ===== The Battle Lab: the battle engine, live =================================================================
   Runs the real battle engine (27_battle.html, held to Python's battle/scouting_report.py section for section by
   app/test_battle_parity.mjs) with Smogon's damage calculator in the page. Change a member, a move, an item, the
   coach's settings or a phrase rule and the lineup's whole scouting file regenerates: member cards, call sheets,
   advance reports, game plans, play calls by situation, the self-scout, the coach profile and the league. Every
   sentence shows the rule that wrote it and the numbers that triggered it; every call opens the fight behind it.

function battleReady() {
  if (!S.battleP) S.battleP = Promise.all([API.data('calc'), API.data('battle'), recordsReady().catch(function () { return null; })]).then(function (r) {
    if (!window.calc || !window.calc.calculate) { var el = document.createElement('script'); el.text = r[0].code; document.head.appendChild(el); }
    if (!window.calc || !window.calc.calculate) throw new Error('the damage calculator didn\'t load');
    if (freshOn() || !(r[1].lineups || []).length) r[1].lineups = v2Lineups();   // v2 (D-078): your six teams are the Battle Lab's lineups
    Battle.init(r[1], window.calc);
    S.bPack = r[1]; S.bEng = Battle.engine(); S.blBase = {};
    return Battle;
  }).catch(function (e) { S.battleP = null; throw e; });
  return S.battleP;
}
function v2Lineups() {   // your teams as the battle engine's lineups (slots in order; empty move slots get the strongest set); an example while none is built
  var out = JOURNEYS.map(function (g) { var t = Teams.get(g), m = Teams.members(t).filter(Boolean); if (!m.length) return null;
    return {id: g, chapter: g, game: g, title: whose(t) + ' ' + GAME_NAME[g], thesis: t.profile.philosophy || '', status: 'working', decision: 'D-078', variation: null,
      members: m.map(function (x) { var b = Object.assign({}, x.build); delete b.id; delete b.species; return [x.ind.species, b]; })}; }).filter(Boolean);
  if (!out.length) out.push({id: 'heartgold', chapter: 'heartgold', game: 'heartgold', title: 'An example: Red\'s six (until you build a team)', thesis: '', status: 'example', decision: 'D-078', variation: null,
    members: [['Pikachu', {}], ['Espeon', {}], ['Snorlax', {}], ['Venusaur', {}], ['Charizard', {}], ['Blastoise', {}]]});
  return out;
}
var BL = null, BV = null, BLRUN = {token: 0, last: null};
var COACH_KNOBS = [
  ['aggression', 'Aggression', 'How much accuracy counts when it picks an attack: 0 counts it twice, 50 is the default (hits ÷ accuracy), 100 ignores it.', 50],
  ['patience', 'Patience', 'The most HP it will have lost and still set up (boosts, Substitute, screens, weather).', 50],
  ['heal_line', 'Heal line', 'Heal at or under this HP %, even if the next hit wouldn\'t knock it out. Also where "3rd and long" starts.', 30],
  ['risk_tolerance', 'Risk tolerance', 'The lowest accuracy it calls when a surer attack is available.', 85]];
function blClone(o) { return JSON.parse(JSON.stringify(o)); }
function blBaseLineup(id) { return S.bPack.lineups.filter(function (x) { return x.id === id; })[0]; }
function blBaseCoach(id) { return (S.bPack.coaches || {})[id] || {}; }
function blLoad(id) {
  var lu = blBaseLineup(id) || S.bPack.lineups[0], old = BL || {};

    tab: old.tab || 'members', opp: 0, profile: old.profile !== false};

}
function blSave() { if (BL) store('battlelab', {base: BL.base, lu: BL.lu, coach: BL.coach, book: BL.book, off: BL.off, show: BL.show, tab: BL.tab, opp: BL.opp, profile: BL.profile}); }
function bvSave() { if (BV && BV.save) BV.save(); }
function blEdited() {
  var b = blBaseLineup(BL.base);
  return JSON.stringify(BL.lu.members) !== JSON.stringify(b.members) || JSON.stringify(BL.coach) !== JSON.stringify(blBaseCoach(BL.base)) ||
    Object.keys(BL.book).length > 0 || Object.keys(BL.off).length > 0;
}
function blBook() {
  if (!Object.keys(BL.book).length && !Object.keys(BL.off).length) return S.bPack.phrasebook;
  var book = blClone(S.bPack.phrasebook);
  Object.keys(BL.book).forEach(function (k) { var p = k.split('/'), r = (book[p[0]] || []).filter(function (x) { return x.id === p[1]; })[0]; if (r && r.when[+p[2]]) r.when[+p[2]][2] = BL.book[k]; });

  return book;
}
function battleLab(id) {

      '<p class="lede">Change a member, a move, an item, the coach\'s settings or a phrase rule, and the whole scouting file rewrites itself the way the engine would: member cards, call sheets, advance reports, game plans, play calls by situation, the self-scout, the coach profile and the league. Every fight is played out here with Smogon\'s damage calculator. Every sentence shows the rule that wrote it; every call opens the fight behind it. Nothing here changes canon.</p></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="blReset()">Back to the original</button><button class="btn" onclick="blExport()">Copy as a lineup</button><button class="btn gold" onclick="blSaveVariant()">Save this variant</button></div></div>' +
      '<div class="slgrid" style="margin-top:16px"><div id="blin"></div><div id="blout"><div id="blprog"></div><div id="blres"></div></div></div>';
  });

      '<input type="range" min="0" max="100" value="' + v + '" data-coach="' + k[0] + '"' + (on ? '' : ' disabled') + ' style="width:100%"><div class="tiny muted">' + esc(k[2]) + '</div></div>';
  }).join('') + '<div class="slrow"><label class="small"><b>Tempo</b></label><select class="f" id="bltempo"><option value="">any: priority whenever it\'s the best attack (default)</option><option value="finish"' + (BL.coach.tempo === 'finish' ? ' selected' : '') + '>finish: priority only to finish</option></select></div>';
  var bookN = Object.keys(BL.book).length + Object.keys(BL.off).length, P = S.bPack;
  var book = ['player', 'opponent', 'trainer', 'self', 'plan'].map(function (kind) {
    var rules = P.phrasebook[kind] || [], touched = rules.some(function (r) { return BL.off[kind + '/' + r.id] || r.when.some(function (c, j) { return (kind + '/' + r.id + '/' + j) in BL.book; }); });
    return '<details' + (touched ? ' open' : '') + '><summary class="small" style="cursor:pointer;padding:6px 0"><b>' + esc(BL_KIND[kind]) + '</b> <span class="tiny muted">' + rules.length + ' rules</span></summary>' + rules.map(function (r) {
      var nums = r.when.map(function (c, j) { return [c, j]; }).filter(function (x) { return typeof x[0][2] === 'number'; }), off = BL.off[kind + '/' + r.id];
      return '<div style="padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)' + (off ? ';opacity:.5' : '') + '"><label class="tiny"><input type="checkbox" data-rule-off="' + kind + '/' + r.id + '"' + (off ? '' : ' checked') + '> <span class="rule">' + esc(r.id) + '</span> <span class="muted">' + esc((Battle.SECTION_TITLES[r.section] || r.section) + (r.group ? ' · group ' + r.group : '')) + '</span></label>' +
        '<div class="tiny muted" style="margin:2px 0 0 18px">' + esc(r.say.length > 120 ? r.say.slice(0, 117) + '…' : r.say) + '</div>' +
        nums.map(function (x) { var c = x[0], key = kind + '/' + r.id + '/' + x[1], cur = key in BL.book ? BL.book[key] : c[2];
          return '<div class="knob" style="margin-left:18px"><span class="tiny">' + esc(c[0] + ' ' + c[1]) + '</span><input class="f" type="number" step="any" value="' + cur + '" data-book="' + key + '"' + (cur !== c[2] ? ' style="border-color:var(--ember)"' : '') + '><span class="tiny muted">was ' + c[2] + '</span></div>'; }).join('') + '</div>'; }).join('') + '</details>';
  }).join('');
  return card('The lineup', '<label class="l">Start from</label><select class="f" id="blbase">' + Object.keys(byCh).map(function (ch) { return '<optgroup label="' + esc(GAME_NAME[ch] || ch) + '">' + byCh[ch].map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (BL.base === x.id ? ' selected' : '') + '>' + esc(x.title) + '</option>'; }).join('') + '</optgroup>'; }).join('') + '</select>' +
    '<div class="tiny muted" style="margin-top:6px">' + esc(GAME_NAME[lu.game]) + ' · Gen ' + gen + ' rules · ' + esc(lu.thesis || '') + (lu.variation ? ' · ' + esc(lu.variation.why || '') : '') + '</div>' +
    '<label class="small" style="display:block;margin-top:8px"><input type="checkbox" id="blprof"' + (BL.profile ? ' checked' : '') + '> build the coach profile too (every member against the whole usage field: the slowest part)</label>',
    {eyebrow: 'Who', tools: false}) +
    card('The six', team + (lu.members.length < 6 ? '<button class="btn sm" style="margin-top:8px" onclick="blAdd()">+ Add a member</button>' : '') +
      '<p class="tiny muted" style="margin:8px 0 0">Open slots get the engine\'s strongest set (its best reliable STAB attack, the attacks adding the most new super-effective types, then its best setup or recovery move). The engine reads moves, item, nature and ability; it meets each trainer at their top level.</p>',
      {eyebrow: plural(lu.members.length, 'member'), tools: false, style: 'margin-top:16px'}) +
    card('The coach', coach + '<p class="tiny muted" style="margin:8px 0 0">Coach settings are prescriptive: the play calls by situation and the field play sheets use them; the fights that pick the calls and the descriptive profile never do.</p>',
      {eyebrow: 'How it calls the game', tools: false, style: 'margin-top:16px'}) +
    card('The phrase book' + (bookN ? ' ' + chip(bookN + ' changed', 'ember') : ''), '<p class="tiny muted" style="margin:0 0 8px">battle/phrasebook.json: every line in the file is one of these rules, fired by numbers the engine measured. Change a threshold or silence a rule and every sentence that reads it moves. Your changes live only in this lab.</p>' + book +
      (bookN ? '<button class="btn sm" style="margin-top:8px" onclick="BL.book={};BL.off={};blChanged(true)">Reset the phrase book</button>' : ''), {eyebrow: 'Advanced: how the sentences get chosen', tools: false, style: 'margin-top:16px'}) +
    ((S.variants || []).filter(function (x) { return String(x.base || '').indexOf('battle:') === 0; }).length ? card('Saved variants', S.variants.map(function (x, i) { return [x, i]; }).filter(function (x) { return String(x[0].base || '').indexOf('battle:') === 0; }).reverse().slice(0, 12).map(function (x) {
      return '<div class="line small click" data-variant="' + x[1] + '"><b>' + esc(x[0].title) + '</b> <span class="tiny muted">' + esc(x[0].note || '') + ' · ' + fmtDate(x[0].at) + '</span></div>'; }).join(''), {eyebrow: 'The Variants tab', tools: false, style: 'margin-top:16px'}) : '');
}
var BL_KIND = {player: 'Member cards (player)', opponent: 'Their Pokémon (opponent)', trainer: 'The trainer', self: 'The self-scout', plan: 'The game plan'};
function blBind(p) {
  var box = p.querySelector('#blin'); box.innerHTML = blInputs();
  box.addEventListener('input', function (e) {
    var t = e.target, k;
    if ((k = t.getAttribute('data-coach'))) { BL.coach[k] = +t.value; document.getElementById('blc-' + k).textContent = t.value; blChanged(false, 500); }
    else if ((k = t.getAttribute('data-book'))) { var v = parseFloat(t.value); if (!isNaN(v)) { var p0 = k.split('/'), r = S.bPack.phrasebook[p0[0]].filter(function (x) { return x.id === p0[1]; })[0];
      if (v === r.when[+p0[2]][2]) delete BL.book[k]; else BL.book[k] = v; blChanged(false, 500); } }
  });

    var t = e.target, k;

    else if (t.id === 'blprof') { BL.profile = t.checked; blChanged(); }
    else if (t.id === 'bltempo') { if (t.value) BL.coach.tempo = t.value; else delete BL.coach.tempo; blChanged(); }
    else if ((k = t.getAttribute('data-coach-on'))) { if (t.checked) BL.coach[k] = COACH_KNOBS.filter(function (x) { return x[0] === k; })[0][3]; else delete BL.coach[k]; blChanged(true); }
    else if ((k = t.getAttribute('data-rule-off'))) { if (t.checked) delete BL.off[k]; else BL.off[k] = true; blChanged(true); }
  });
  box.addEventListener('click', function (e) { var el = e.target.closest('[data-variant]'); if (!el) return;
    var x = S.variants[+el.getAttribute('data-variant')];
    try { var o = JSON.parse(x.json); BL = Object.assign(BL, o); BV = BL; blChanged(true); toast('Loaded <b>' + esc(x.title) + '</b>.'); } catch (err) { toast('That variant can\'t be read.'); } });
}
var blTimer = null;
function blChanged(redrawInputs, wait) {
  blSave();
  if (redrawInputs) { var box = document.getElementById('blin'); if (box) box.innerHTML = blInputs(); }
  clearTimeout(blTimer); blTimer = setTimeout(blRun, wait || 150);
}
function blMove(i, d) { var t = BL.lu.members, j = i + d; if (j < 0 || j >= t.length) return; var x = t[i]; t[i] = t[j]; t[j] = x; blChanged(true); }
function blRemove(i) { if (BL.lu.members.length <= 1) return toast('A lineup needs at least one member.'); BL.lu.members.splice(i, 1); blChanged(true); }
function blAdd() { BL.lu.members.push(['Snorlax', {}]); blChanged(true); blEdit(BL.lu.members.length - 1); }
function blReset() { blLoad(BL.base); BV = BL; BV.render = blRender; BV.save = blSave; BV.lab = true; blChanged(true); toast('Back to the original.'); }
function blEdit(i) {
  var sb = BL.lu.members[i], b = sb[1] || {}, game = BL.lu.game, gen = Battle.GAME_GEN[game], P = S.bPack, learn = [];
  try { learn = Battle.learnable(sb[0], game); } catch (e) { learn = []; }
  var species = Object.keys(P.gens[gen].species).map(function (id) { return P.gens[gen].species[id][0]; }).filter(function (n) { return P.gens[gen].learn[n.toLowerCase().replace(/[^a-z0-9]/g, '')]; }).sort();
  var items = []; try { var it = window.calc.Generations.get(gen).items; for (var x of it) items.push(x.name); } catch (e) {}
  var abil = gen >= 3 ? Battle.abilities(gen, sb[0]) : [], natures = Object.keys(P.natures).map(cap).sort(), fill = [];
  try { fill = Battle.strongestSet(sb[0], game, b.rejected || []); } catch (e) {}

    '<form id="blform" onsubmit="return blSaveMember(event,' + i + ')"><datalist id="bldex">' + species.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('') + '</datalist>' +
    '<datalist id="blmv">' + learn.map(function (m) { return '<option>' + esc(m) + '</option>'; }).join('') + '</datalist><datalist id="blitems">' + items.sort().map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</datalist>' +
    '<label class="l">Species</label><input class="f" name="species" list="bldex" value="' + esc(sb[0]) + '">' +
    '<label class="l">Moves (blank slots: the engine\'s strongest set fills them)</label>' + [0, 1, 2, 3].map(function (k) { return '<input class="f" name="mv' + k + '" list="blmv" value="' + esc((b.moves || [])[k] || '') + '" style="margin-bottom:6px" placeholder="' + esc(fill[k] ? 'engine: ' + fill[k] : '') + '">'; }).join('') +
    '<div class="tiny muted">The engine\'s strongest set for it right now: ' + esc(fill.join(', ') || '—') + '</div>' +

    (gen >= 3 ? '<label class="l">Ability (blank: its first)</label><select class="f" name="ability"><option value="">—</option>' + abil.map(function (a) { return '<option' + (a === b.ability ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('') + '</select>' : '<p class="tiny muted">Gen 2 has no natures or abilities.</p>') +

    '<div style="margin-top:12px"><button class="btn gold">Save and rebuild</button></div></form>');
}
function blSaveMember(e, i) {
  e.preventDefault();
  var f = e.target, val = function (n) { return f[n] ? f[n].value.trim() : ''; }, old = BL.lu.members[i][1] || {}, nb = {};
  var sp = val('species') || BL.lu.members[i][0];
  try { Battle.species(Battle.GAME_GEN[BL.lu.game], sp); } catch (err) { toast(esc(sp) + ' isn\'t a species this game\'s calculator knows.'); return false; }
  var moves = [0, 1, 2, 3].map(function (k) { return val('mv' + k); }).filter(Boolean);
  if (moves.length) nb.moves = moves;
  ['item', 'nature', 'ability'].forEach(function (k) { if (val(k)) nb[k] = val(k); });
  var rej = val('rejected').split(',').map(function (x) { return x.trim(); }).filter(Boolean); if (rej.length) nb.rejected = rej;

}
/* ---- running the engine ---- */
function blRun() {
  var tok = ++BLRUN.token, eng = S.bEng, base = blBaseLineup(BL.base), key = BL.base + (BL.profile ? '|p' : '|n'), steps = 0, t0 = Date.now();
  var opps = eng.opponents(base.game).length, total = opps + 1 + (BL.profile ? 2 * BL.lu.members.length : 0), phase = '';
  var prog = function (label) {
    steps++; var el = document.getElementById('blprog'); if (!el) return;
    el.innerHTML = '<div class="notice" style="margin-bottom:12px"><div class="goal" style="padding:0"><span class="small"><b>' + esc(phase) + '</b> · ' + esc(label) + '</span><span class="tiny muted">' + ((Date.now() - t0) / 1000).toFixed(1) + ' s</span></div>' +
      '<div class="bar" style="margin-top:6px"><i style="width:' + Math.min(100, Math.round(100 * (steps % (total + 1)) / total)) + '%"></i></div></div>';
  };
  var runGen = function (gen) { return new Promise(function (res, rej) { (function step() {
    if (tok !== BLRUN.token) return rej({cancelled: true});
    var r; try { r = gen.next(); } catch (e) { return rej(e); }
    if (r.done) return res(r.value);
    prog(r.value); setTimeout(step, 0); })(); }); };
  var baseP = S.blBase[key] ? Promise.resolve(S.blBase[key]) : (phase = 'The original', steps = 0, eng.book = S.bPack.phrasebook,
    runGen(eng.chapterGen(base, blBaseCoach(BL.base), {profile: BL.profile})).then(function (d) { S.blBase[key] = d; return d; }));
  return baseP.then(function (bd) {
    if (!blEdited()) return [bd, bd];
    phase = 'Your version'; steps = 0; eng.book = blBook();
    return runGen(eng.chapterGen(BL.lu, BL.coach, {profile: BL.profile})).then(function (d) { return [d, bd]; });
  }).then(function (r) {
    if (tok !== BLRUN.token) return;
    eng.book = S.bPack.phrasebook;
    BLRUN.last = {d: r[0], base: r[1], ms: Date.now() - t0, stats: eng.stats()};
    var el = document.getElementById('blprog'); if (el) el.innerHTML = '';
    blRender();
  }).catch(function (e) {
    eng.book = S.bPack.phrasebook;
    if (e && e.cancelled) return;
    var el = document.getElementById('blprog');
    if (el) el.innerHTML = '<div class="notice" style="border-color:var(--ember);margin-bottom:12px">The engine stopped: ' + esc(e && e.message || e) + '. Python would stop here too; change the member it names.</div>';
    console.error(e);
  });
}
/* ---- the output ---- */

function blHow(d) {

    ['3 · Every one-on-one', 'The evaluation layer (battle/evaluate.py) plays each matchup turn by turn: priority, then speed; weather, Leftovers, poison, Leech Seed and the rest at the end of each turn. Each side has plans (an opening plus three habits: build, disrupt, sustain); the result is our best plan against their best answer (here ' + plural(plans, 'plan pair') + ' for the first matchup). A habit gets credit when taking it out makes the result worse. The game\'s trainers pick moves with their cartridge AI flags (battle/trainer_policy.py). ' + st.fights.toLocaleString() + ' fights played so far. Open any call\'s "fight" to see one turn by turn.'],
    ['4 · The grid and the call sheet', 'Each trainer is met at their top level. The call is the member whose fight ranks best (wins first, then the odds, the HP left, the speed of it); the backup is the next. The advance report reads the same fights as types: our best hit of each type on each of theirs.'],
    ['5 · Down and distance', 'Each situation (opening, 1st and 10, short yardage, goal line, 3rd and long, blitz, two-minute) stages a fight and asks the policy for its call. The coach\'s settings apply here.'],
