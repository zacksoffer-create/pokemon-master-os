var SL = null;
function getPath(o, p) { return p.split('.').reduce(function (x, k) { return x == null ? x : x[k]; }, o); }

function slLoad(tid, vid) {

    {eyebrow: 'Who', tools: false}) +
    card('The sliders', sliders + '<p class="tiny muted" style="margin:8px 0 0">Untick a slider to leave it unauthored: the report then reads the team\'s measured value. The dashed mark under each one is what the team measures right now.</p>', {eyebrow: 'Authored style', tools: false, style: 'margin-top:16px'}) +

function slBind(p) {

  });

var slTimer = null;

function slEdit(i) {

    '<label class="l">EVs (blank: the default spread)</label><div class="ivgrid">' + STATS.map(function (s) { return '<div><div class="tiny muted" style="text-align:center">' + STAT_NAME[s] + '</div><input class="f" name="ev-' + s + '" type="number" min="0" max="252" step="4" value="' + (s in ev ? ev[s] : '') + '"></div>'; }).join('') + '</div>' +

    source: b.source && b.source.indexOf('the Scouting Lab') < 0 ? b.source + ' (edited in the Scouting Lab)' : (b.source || 'the Scouting Lab'), _edited: true};
  if (val('nickname')) nb.nickname = val('nickname'); if (val('level')) nb.level = +val('level'); if (val('item')) nb.item = val('item');
  if (val('nature')) nb.nature = val('nature'); if (val('ability')) nb.ability = val('ability');
  var iv = {}, ev = {}; STATS.forEach(function (s) { if (val('iv-' + s) !== '') iv[s] = +val('iv-' + s); if (val('ev-' + s) !== '') ev[s] = +val('ev-' + s); });
  if (Object.keys(iv).length) nb.ivs = iv; if (Object.keys(ev).length) nb.evs = ev;
  if (val('friendship') !== '') nb.friendship = +val('friendship'); if (val('ball')) nb.ball = val('ball');
  if (val('ribbons')) nb.ribbons = val('ribbons').split(',').map(function (x) { return x.trim(); }).filter(Boolean);

function slReset() { var b = SL.base.split('/'); SL.rules = {}; slLoad(b[0], b[1]); slChanged(true); toast('Back to the original.'); }

function slDiff(cur, base) {   // sentences: kept, added, dropped
  var bt = base.map(function (p) { return p.text; }), ct = cur.map(function (p) { return p.text; });
  return cur.map(function (p) { return Object.assign({}, p, {state: bt.indexOf(p.text) >= 0 ? 'same' : 'new'}); })
    .concat(base.filter(function (p) { return ct.indexOf(p.text) < 0; }).map(function (p) { return Object.assign({}, p, {state: 'gone'}); }));
}
function slSentences(cur, base, missed, section) {
  var list = SL.show.diff ? slDiff(cur, base) : cur.map(function (p) { return Object.assign({}, p, {state: 'same'}); });
  var html = list.map(function (p) {
    return '<div class="sent ' + p.state + '"><div>' + esc(p.text) + '</div><div class="tiny" style="margin-top:3px"><span class="rule">' + esc(p.rule) + '</span> <span class="muted">' + esc(p.trigger) + '</span>' +
      (p.state === 'new' ? ' ' + chip('new', 'forest') : p.state === 'gone' ? ' ' + chip('gone', 'ember') : '') + '</div></div>'; }).join('') || '<div class="tiny muted">Nothing in this section.</div>';
  if (SL.show.missed) { var m = (missed || []).filter(function (x) { return x.section === section; });
    if (m.length) html += '<div class="missed"><div class="eyebrow" style="margin-bottom:4px">Rules that stayed quiet</div>' + m.map(function (x) { return '<div class="tiny"><span class="rule">' + esc(x.rule) + '</span> ' + esc(x.why) + '</div>'; }).join('') + '</div>'; }
  return html;
}
function slChangesList(rep, base) {

    if (a.authored !== b.authored) out.push(cap(k) + ' authored ' + (b.authored == null ? '—' : b.authored) + ' → ' + (a.authored == null ? '—' : a.authored));
    if (a.measured !== b.measured) out.push(cap(k) + ' measured ' + (b.measured == null ? '—' : b.measured) + ' → ' + (a.measured == null ? '—' : a.measured));
    if (!!a.disagreement !== !!b.disagreement) out.push(cap(k) + (a.disagreement ? ' now disagrees with the team' : ' no longer disagrees')); });
  var s = rep.matrix.summary, t = base.matrix.summary;

  if (s.strengths.join() !== t.strengths.join()) out.push('Strengths ' + (t.strengths.join(', ') || 'none') + ' → ' + (s.strengths.join(', ') || 'none'));
  if (s.bring !== t.bring) out.push('Bring ' + t.bring + ' → ' + s.bring);
  var ps = rep.playsheet, pb = base.playsheet;
  if (ps && pb) {
    if (ps.ace.derived !== pb.ace.derived) out.push('Ace ' + pb.ace.derived + ' → ' + ps.ace.derived);
    ['even', 'ahead', 'behind'].forEach(function (st) { if (ps.go_to[st].species !== pb.go_to[st].species) out.push('Go-to when ' + st + ': ' + (pb.go_to[st].species || '—') + ' → ' + (ps.go_to[st].species || '—')); });
    if (ps.aggression.ratio !== pb.aggression.ratio) out.push('Aggression ' + pb.aggression.ratio + '% → ' + ps.aggression.ratio + '%');
    if (ps.type_read.covered_n !== pb.type_read.covered_n) out.push('Types they hit super-effectively ' + pb.type_read.covered_n + ' → ' + ps.type_read.covered_n);
    ps.roles.forEach(function (r) { var o = pb.roles.filter(function (x) { return x.species === r.species; })[0]; if (o && o.primary.role !== r.primary.role) out.push(r.species + ': ' + o.primary.name + ' → ' + r.primary.name); });
  }
