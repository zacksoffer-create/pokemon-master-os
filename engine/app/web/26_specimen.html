      if (sp.shiny && !sh) card.conflicts.push('Gen 2 shininess is fixed by DVs: Def = Spe = Spc = 10, Atk in {2,3,6,7,10,11,14,15}');
      if (sp.ball) card.notes.push(sp.ball + ' Ball: Gen 2 doesn\'t store a ball. Story-only detail');

    var evt = STATS6.reduce(function (a, s) { return a + ev[s]; }, 0); if (evt > 510) card.conflicts.push('EV total ' + evt + ' > 510');
    var pk = S.scoutPack && S.scoutPack.species[sp.species] && S.scoutPack.species[sp.species].g[gen], abilities = (pk ? pk.ab : d.ab) || [], slot = abilities.indexOf(sp.ability) >= 0 && abilities.length > 1 ? abilities.indexOf(sp.ability) : null;

  function showdown(sp, card) {
