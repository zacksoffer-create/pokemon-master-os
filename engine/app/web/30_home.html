<script>
/* ===== The living estate: what the Sheet's logs say, and the models the home and Glasshouse share ============ */
var LOGS = ['Eggs', 'Egg Walks', 'Plantings', 'Harvests', 'Readings', 'Feedings', 'Journal', 'Timeline', 'Specimens'];
function loadLive(fresh) {
  return Promise.all(LOGS.map(function (t) { return API.tab(t, fresh).catch(function () { return []; }); })).then(function (r) {
    S.L = {}; LOGS.forEach(function (t, i) { S.L[t] = r[i] || []; }); return S.L;
  });
}
function lineCycles(line) { var d = dexOf(line); return d ? d.cyc : 20; }
function eggsModel() {
  var walks = S.L['Egg Walks'] || [];
  return (S.L.Eggs || []).filter(function (e) { return String(e.status || 'incubating') !== 'hatched'; }).map(function (e) {
    var cyc = Number(e.cycles) || lineCycles(e.line), laps = 0, last = null;
    walks.filter(function (w) { return w.egg === e.id; }).forEach(function (w) {
      laps += (Number(w.laps) || 0) * (String(w.magcargo).toLowerCase() === 'true' || w.magcargo === true ? 2 : 1);
      last = w.at || last;
    });
    return {id: e.id, line: e.line, sire: e.sire, dam: e.dam, cycles: cyc, laps: laps, pct: Math.min(1, laps / cyc), left: Math.max(0, cyc - laps), last: last, laid: e.laid};
  }).sort(function (a, b) { return b.pct - a.pct; });
}
function cropHours(berry) { var c = (S.hq.glasshouse.crops || []).filter(function (x) { return x.berry === berry; })[0]; return c ? c.hours_to_harvest : 24; }
function berriesModel() {
  var harvested = {}; (S.L.Harvests || []).forEach(function (h) { harvested[h.planting] = h; });
  return (S.L.Plantings || []).filter(function (p) { return !harvested[p.id]; }).map(function (p) {
    var hours = Number(p.hours) || cropHours(p.berry), start = new Date(p.planted), ready = new Date(start.getTime() + hours * 3600e3);
    var pct = Math.max(0, Math.min(1, (Date.now() - start) / (hours * 3600e3)));
    return {id: p.id, plot: p.plot, berry: p.berry, hours: hours, ready: ready, pct: pct, done: pct >= 1};
  }).sort(function (a, b) { return a.ready - b.ready; });
}
/* Environmental targets are proposals for the design, not measurements and not game mechanics. An instrument shows
   only readings logged on the Readings tab (or in the app); with none it says so. Nothing here is generated. */
var ENV = [
  {room: 'Hearth hall', metric: 'Temperature', unit: '°C', target: 31, spread: 1.6, color: '#DE7C42'},
  {room: 'Hearth hall', metric: 'Humidity', unit: '%', target: 64, spread: 5, color: '#9CCBDD'},
  {room: 'Glasshouse rings', metric: 'Temperature', unit: '°C', target: 24, spread: 2.2, color: '#5E8F68'},
  {room: 'Glasshouse rings', metric: 'Light', unit: 'klx', target: 18, spread: 4, color: '#E2CC98'},
  {room: 'Cold vault', metric: 'Temperature', unit: '°C', target: 2, spread: .7, color: '#9CCBDD'},
  {room: 'Nursery yard', metric: 'Temperature', unit: '°C', target: 20, spread: 2.4, color: '#5E8F68'}
];
function envModel() {
  var R = S.L.Readings || [];
  return ENV.map(function (m, k) {
    var real = R.filter(function (r) { return r.room === m.room && r.metric === m.metric; }).map(function (r) { return {at: r.at, v: Number(r.value), src: r.source || 'entered'}; });
    if (real.length) return Object.assign({}, m, {series: real.slice(-24).map(function (x) { return x.v; }), now: real[real.length - 1].v, src: real[real.length - 1].src, at: real[real.length - 1].at, sim: false});
    return Object.assign({}, m, {series: [], now: null, src: 'no reading yet', none: true});
  });
}
function timelineModel(limit) {
  var ev = (S.L.Timeline || []).map(function (t) { return {at: t.at, kind: t.kind || 'note', text: t.text, ref: t.ref, live: true}; });
  (S.hq.decisions || []).forEach(function (d) { ev.push({at: d.date, kind: 'decision', text: d.id + ' · ' + d.title, ref: '#/record', live: false}); });
  ev.sort(function (a, b) { return dateKey(b.at) - dateKey(a.at); });
  return ev.slice(0, limit || 12);
}
function progressModel() {
  var h = S.hq, prog = h.program, done = prog.filter(function (p) { return p.status === 'done'; }).length;
  var hatched = (S.L.Eggs || []).filter(function (e) { return e.status === 'hatched'; }).length;
  var staffed = h.facilities.filter(function (f) { return !f.open.length; }).length;
  var approved = h.world.filter(function (w) { return w.status === 'approved'; }).length;
  var locked = h.chapters.filter(function (c) { return c.locked; }).length;
  var journal = S.journal ? Object.keys(S.journal.entries.reduce(function (o, e) { if (e.sp) o[e.sp] = 1; return o; }, {})).length : null;
  return [
    {k: 'Breeding program', v: done, of: prog.length, note: done ? '' : 'every line is planned; none kept yet', color: 'ember'},
    {k: 'Facilities fully staffed', v: staffed, of: h.facilities.length, note: h.open_jobs.join(', ') + ' still open', color: 'forest'},
    {k: 'World records approved', v: approved, of: h.world.length, note: (h.world.length - approved) + ' waiting on you', color: ''},
    {k: 'Chapters locked', v: locked, of: h.chapters.length, note: 'HeartGold is home', color: ''},
    {k: 'Eggs hatched at Blackthorn', v: hatched, of: null, note: 'the studbook grows from here', color: 'ice'},
    {k: 'Species with field notes', v: journal == null ? '…' : journal, of: 493, note: 'the atlas, researched', color: 'forest'}
  ];
}
function priorities() {
  var out = [], eggs = eggsModel(), berries = berriesModel(), h = S.hq;
  eggs.filter(function (e) { return e.left <= 3; }).forEach(function (e) { out.push({icon: '🥚', text: e.line + ' egg is ' + e.left + ' laps from hatching', act: "openForm('walk','" + e.id + "')", tone: 'ember'}); });
  berries.filter(function (b) { return b.done; }).forEach(function (b) { out.push({icon: '🍒', text: b.berry + ' on plot ' + b.plot + ' is ready to harvest', act: "openForm('harvest','" + b.id + "')", tone: 'forest'}); });
  if (!eggs.length) out.push({icon: '🥚', text: 'No eggs in the racks', act: "openForm('egg')", tone: 'gold'});
  if (!berries.length) out.push({icon: '🌱', text: 'The berry rings are bare. Plant the medicine crop', act: "openForm('plant')", tone: 'gold'});
  if (h.kpis.rule_issues) out.push({icon: '⚠', text: h.kpis.rule_issues + ' studbook rule issues', act: "nav('#/breeding/studbook')", tone: 'ember'});
  return out.slice(0, 6);
}

/* ---- quick-action forms (they write to the Canon DB Sheet) ---- */
function openForm(kind, ref) {
  var h = S.hq, f = '', title = '';
  var lines = Estate.ready() ? Estate.lines().map(function (l) { return '<option value="' + esc(l.line) + '|">' + esc(l.line) + ' · ' + esc(l.why) + '</option>'; }).join('')   // v2.5: your blueprints' and teams' lines
    : h.program.filter(function (p) { return p.hatches_as; }).map(function (p) { return '<option value="' + esc(p.hatches_as) + '|' + esc(p.stud_id) + '">' + esc(p.hatches_as) + ' · ' + esc(p.target) + '</option>'; }).join('');
  var eggs = eggsModel().map(function (e) { return '<option value="' + esc(e.id) + '"' + (e.id === ref ? ' selected' : '') + '>' + esc(e.line) + ' · ' + esc(e.id) + ' (' + e.left + ' laps left)</option>'; }).join('');
  var crops = h.glasshouse.crops.map(function (c) { return '<option>' + esc(c.berry) + '</option>'; }).join('');
  var plots = berriesModel().map(function (b) { return '<option value="' + esc(b.id) + '"' + (b.id === ref ? ' selected' : '') + '>' + esc(b.berry) + ' · plot ' + esc(b.plot) + '</option>'; }).join('');
  var who = (Estate.ready() ? estateRes().map(function (r) { return r.label; }) : h.party.map(function (p) { return p.sp; })).map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('') + '<option>the nursery</option><option>a hatchling</option>';   // v2.5: the residents
  var rooms = ENV.map(function (m) { return m.room; }).filter(function (r, i, a) { return a.indexOf(r) === i; }).map(function (r) { return '<option>' + esc(r) + '</option>'; }).join('');
  if (kind === 'egg') { title = 'Lay an egg'; f = '<label class="l">Line and its stud</label><select class="f" name="line">' + lines + '</select><label class="l">Dam (a line female)</label><input class="f" name="dam" placeholder="one of yours, or a note"><label class="l">Note</label><input class="f" name="note">'; }
  if (kind === 'walk') { title = 'Record an egg walk'; f = eggs ? '<label class="l">Egg</label><select class="f" name="egg">' + eggs + '</select><label class="l">Laps of the hatching loop</label><input class="f" name="laps" type="number" min="1" value="5"><label class="l"><input type="checkbox" name="magcargo" checked> A Flame Body or Magma Armor Pokémon walked with it (each lap counts twice)</label><label class="l">Note</label><input class="f" name="note">' : '<div class="empty">No eggs in the racks yet. Lay one first.</div>'; }
  if (kind === 'plant') { title = 'Plant berries'; f = '<label class="l">Berry</label><select class="f" name="berry">' + crops + '</select><label class="l">Plot</label><input class="f" name="plot" placeholder="e.g. R2-07"><label class="l">Note</label><input class="f" name="note">'; }
  if (kind === 'harvest') { title = 'Log a harvest'; f = plots ? '<label class="l">Planting</label><select class="f" name="planting">' + plots + '</select><label class="l">Berries harvested</label><input class="f" name="yield" type="number" min="0" max="5" value="5"><label class="l">Note</label><input class="f" name="note">' : '<div class="empty">Nothing planted yet.</div>'; }
  if (kind === 'reading') { title = 'Log a reading'; f = '<label class="l">Room</label><select class="f" name="room">' + rooms + '</select><div class="row"><div><label class="l">Metric</label><select class="f" name="metric"><option>Temperature</option><option>Humidity</option><option>Light</option></select></div><div><label class="l">Value</label><input class="f" name="value" type="number" step="0.1"></div></div><label class="l">Unit</label><input class="f" name="unit" value="°C"><label class="l">Source</label><select class="f" name="source"><option>entered</option><option>simulated</option></select>'; }
  if (kind === 'feeding') { title = 'Log a feeding'; f = '<label class="l">Who</label><select class="f" name="who">' + who + '</select><label class="l">Food</label><input class="f" name="food" placeholder="MooMoo Milk, Oran Berry, Poffin…"><label class="l">Amount</label><input class="f" name="amount"><label class="l">Note</label><input class="f" name="note">'; }
  if (kind === 'note') { title = 'Write an observation'; f = '<label class="l">Title</label><input class="f" name="title"><div class="row"><div><label class="l">Kind</label><select class="f" name="kind"><option value="observation">personal observation</option><option value="hypothesis">research hypothesis</option><option value="world-building">world-building</option></select></div><div><label class="l">Species</label><input class="f" name="species" list="dexlist"></div></div><label class="l">What you saw or think</label><textarea class="f" name="text" rows="5"></textarea><label class="l">Source</label><input class="f" name="source" placeholder="where it comes from">'; }
  openDrawer('<div class="eyebrow">Quick action · writes to the Canon DB Sheet</div><h2 style="margin:6px 0 4px">' + title + '</h2><p class="muted small">Saved to the Sheet as a new row; it shows in the timeline.</p>' +
    '<form id="qa" onsubmit="return submitForm(event,\'' + kind + '\')">' + f + '<div style="margin-top:18px"><button class="btn gold">Save</button></div></form>' +
    '<datalist id="dexlist">' + (S.atlas.species || []).map(function (s) { return '<option>' + esc(s.name) + '</option>'; }).join('') + '</datalist>');
}
function submitForm(ev, kind) {
  ev.preventDefault();
  var fd = {}; Array.prototype.forEach.call(ev.target.elements, function (el) { if (el.name) fd[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
  var now = new Date().toISOString(), tab, row, line;
  if (kind === 'egg') { var p = fd.line.split('|'); tab = 'Eggs'; row = {id: 'EGG-' + p[0].toUpperCase() + '-' + Date.now().toString(36).slice(-4).toUpperCase(), line: p[0], sire: p[1], dam: fd.dam, laid: now, cycles: lineCycles(p[0]), status: 'incubating', note: fd.note}; line = 'A ' + p[0] + ' egg went into the racks'; }
  if (kind === 'walk') { tab = 'Egg Walks'; row = {at: now, egg: fd.egg, laps: Number(fd.laps), magcargo: fd.magcargo, note: fd.note}; line = fd.laps + ' laps walked with ' + fd.egg; }
  if (kind === 'plant') { tab = 'Plantings'; row = {id: 'PLOT-' + Date.now().toString(36).toUpperCase(), plot: fd.plot, berry: fd.berry, planted: now, hours: cropHours(fd.berry), note: fd.note}; line = fd.berry + ' planted on ' + (fd.plot || 'a plot'); }
  if (kind === 'harvest') { tab = 'Harvests'; row = {at: now, planting: fd.planting, yield: Number(fd.yield), note: fd.note}; line = 'Harvested ' + fd.yield + ' berries'; }
  if (kind === 'reading') { tab = 'Readings'; row = {at: now, room: fd.room, metric: fd.metric, value: Number(fd.value), unit: fd.unit, source: fd.source}; line = fd.room + ' ' + fd.metric.toLowerCase() + ': ' + fd.value + ' ' + fd.unit; }
  if (kind === 'feeding') { tab = 'Feedings'; row = {at: now, who: fd.who, food: fd.food, amount: fd.amount, note: fd.note}; line = fd.who + ' fed ' + fd.food; }
  if (kind === 'note') { tab = 'Journal'; row = {at: now, title: fd.title, kind: fd.kind, species: fd.species, text: fd.text, source: fd.source}; line = 'Journal: ' + (fd.title || fd.text.slice(0, 60)); }
  if (!tab) return false;
  API.append(tab, Object.assign(row, {_timeline: line})).then(function () {
    closeDrawer(); toast('Saved to the <b>' + esc(tab) + '</b> tab.'); loadLive(true).then(go);
  }).catch(function (e) { toast('Couldn\'t save: ' + esc(e && e.message || e)); });
  return false;
}

/* ---- the party profile ---- */
function partyProfile(sp) {
  var p = S.hq.party.filter(function (x) { return x.sp === sp; })[0], d = dexOf(sp) || {}, b = p.b || {};
  var lin = S.hq.lineage.filter(function (r) { return r.id === p.lineage; })[0] || {};
  var base = {}; STATS.forEach(function (s, i) { base[s] = (d.b || [])[i]; });
  openDrawer('<div style="display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:center">' +
    '<img src="' + art(p.n) + '" style="width:220px;height:220px;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.5))">' +
    '<div><div class="eyebrow">HeartGold · the home team · 🔒 locked (D-006)</div><h1 style="margin:6px 0">' + esc(sp) + '</h1>' +
    '<div>' + types(p.t) + ' <span class="muted small">' + esc(d.genus || '') + '</span></div>' +
    '<p class="lede" style="margin-top:12px">' + esc((p.life[0] || {}).say || '') + '</p></div></div><hr class="rule">' +
    '<div class="grid"><div class="c6">' +
      '<div class="eyebrow">Training · the build on record</div><div style="margin:8px 0 4px">' + (b.moves || []).map(function (m) { return chip(m, 'gold'); }).join(' ') + '</div>' +
      '<dl class="kv" style="margin-top:10px"><dt>Item</dt><dd>' + esc(b.item || '—') + '</dd><dt>Nature</dt><dd>' + esc(b.nature || b.nature_note || '—') + '</dd><dt>Ability</dt><dd>' + esc(b.ability || (d.ab || []).join(' or ')) + '</dd><dt>On record</dt><dd>' + esc(b.status || '') + '</dd>' + (b.rejected ? '<dt>Rejected</dt><dd>' + esc(b.rejected.join(', ')) + '</dd>' : '') + '</dl>' +
      '<div class="eyebrow" style="margin-top:18px">Life roles · the world records</div>' + p.life.map(function (w) { return '<div class="line forest"><b>' + esc(cap(w.cap)) + '</b> · ' + esc(w.say) + ' <span class="muted tiny">' + esc(w.id) + '</span></div>'; }).join('') +
      '<div class="eyebrow" style="margin-top:18px">At Blackthorn</div><dl class="kv" style="margin-top:8px"><dt>Land</dt><dd>' + esc(p.res.land) + '</dd><dt>Climate</dt><dd>' + esc(p.res.climate) + ' · water ' + esc(p.res.water) + '</dd><dt>Native to</dt><dd>' + esc(p.res.native) + '</dd><dt>Jobs</dt><dd class="small">' + esc((p.res.jobs || []).join('; ')) + '</dd></dl>' +
    '</div><div class="c6">' +
      '<div class="eyebrow">Biology · base stats (Gen 4)</div><div style="margin-top:8px">' + statBars(base, 160) + '</div>' +
      '<dl class="kv" style="margin-top:12px"><dt>Size</dt><dd>' + (d.h || '') + ' m · ' + (d.w || '') + ' kg</dd><dt>Habitat</dt><dd>' + esc(d.hab || '—') + '</dd><dt>Egg groups</dt><dd>' + esc((d.eg || []).join(', ')) + '</dd><dt>Egg cycles</dt><dd>' + (d.cyc || '') + ' (' + (d.cyc || 0) * 255 + ' steps)</dd></dl>' +
      '<div class="eyebrow" style="margin-top:18px">Pokédex</div><p class="serif" style="font-size:17px;font-style:italic;color:var(--ivory-2)">“' + esc(d.dex || '') + '”</p><div class="muted tiny">' + esc(GAME_NAME[d.dexg] || d.dexg || '') + '</div>' +
      '<div class="eyebrow" style="margin-top:18px">Breeding</div><div style="margin-top:6px">' + (p.breeding || []).map(function (r) { return chip(r, 'violet'); }).join(' ') + '</div>' +
      '<p class="small muted" style="margin-top:8px">Studbook id <span class="mono">' + esc(p.lineage) + '</span> · sex ' + esc(lin.sex || 'open') + ' · fate ' + esc(lin.fate || 'open') + '</p>' +
      '<a class="btn sm" href="#/breeding/tree/' + encodeURIComponent(p.lineage) + '" onclick="closeDrawer()">Open in the studbook →</a> <a class="btn sm ghost" href="#/atlas/' + p.n + '" onclick="closeDrawer()">The atlas page →</a>' +
    '</div></div>');
}

/* ---- the home dashboard ---- */
/* v2 (D-078): Home leads with your six teams and what to do next; the modes beneath; the estate's day folded below */
function home() {
  return Promise.all([recordsReady(), loadLive().catch(function () { return null; }), gearReady().catch(function () { return null; })]).then(function () {
    var h = S.hq, d = new Date(), hour = d.getHours(), greet = hour < 5 ? 'Good night' : hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    var inds = Object.keys(S.store.individuals || {}).map(function (k) { return S.store.individuals[k]; }).filter(function (i) { return i.status !== 'retired'; })
      .sort(function (a, b) { return String(b.at || '').localeCompare(String(a.at || '')); });
    after(function () { if (typeof callsBadge === 'function') callsBadge(); });   // the calls waiting, in Start here
    return '<section class="hero" style="min-height:220px">' + Art.hero() + '<div class="veil"></div><div class="say"><div class="eyebrow">Blackthorn · World Headquarters</div>' +
      '<h1>' + greet + ', ' + esc(h.champion.name || 'Trainer') + '.</h1><p class="lede">Six journeys, each its own team and its own trainer. Build them one Pokémon at a time: every move, nature and spread read live against the League; then take them into the Arena.</p></div></section>' +
      homeNext(inds) +
      '<div class="ornament" style="margin:22px 0 12px">your teams</div>' + journeyCards() +
      (inds.length ? '<div class="ornament" style="margin:22px 0 12px">recently built</div><div class="pickgrid">' + inds.slice(0, 8).map(function (i) {
        return '<a class="pick" href="#/pokemon/' + encodeURIComponent(i.id) + '">' + inBall(i.species, i.game, i.ball, i.shiny, 56) + '<div><b>' + esc(i.nickname || i.species) + '</b><div class="tiny muted">' + esc(GAME_NAME[i.game]) + (i.at ? ' · ' + esc(ago(i.at)) : '') + '</div></div></a>'; }).join('') + '</div>' : '') +
      homeModes() + homeEstate();
  });
}
function homeNext(inds) {   // what to do next, from where you are
  var steps = [], first = JOURNEYS.filter(function (g) { return Teams.filled(Teams.get(g)); })[0];
  if (!inds.length) steps = [['1', 'Open your HeartGold team', '#/team/heartgold'], ['2', 'Add your first Pokémon to a slot', '#/pokemon/new/heartgold/0'], ['3', 'Build it: moves, nature, ability, item, ball, EVs', null], ['4', 'Battle the team in the Arena', null]];
  else {
    var last = inds[0], t = first ? Teams.get(first) : null, n = t ? Teams.filled(t) : 0, unbuilt = inds.filter(function (i) { return !i.build; });
    steps.push(['→', 'Keep building ' + (last.nickname || last.species) + ' (' + GAME_NAME[last.game] + ')', '#/pokemon/' + encodeURIComponent(last.id)]);
    if (unbuilt.length) steps.push(['→', plural(unbuilt.length, 'Pokémon') + ' not built yet: ' + unbuilt.slice(0, 3).map(function (i) { return i.nickname || i.species; }).join(', '), '#/pokemon/' + encodeURIComponent(unbuilt[0].id)]);
    if (t && n < 6) steps.push(['→', 'Fill the ' + GAME_NAME[first] + ' team (' + n + ' of 6)', '#/team/' + first]);
    if (t) steps.push(['→', 'Battle ' + (t.profile.name || 'your') + '\'s ' + GAME_NAME[first] + ' in the Arena', '#/team/' + first]);
  }
  return card(inds.length ? 'Pick up where you left off' : 'Start here', steps.map(function (s) {
    return '<div class="ach"><div class="m"><b style="color:var(--gold)">' + s[0] + '</b></div><div class="small">' + (s[2] ? '<a href="' + s[2] + '">' + esc(s[1]) + '</a>' : esc(s[1])) + '</div></div>'; }).join('') +
    '<div class="ach" id="homecallsrow" style="display:none"><div class="m"><b style="color:var(--ember-2)">!</b></div><div class="small"><a href="#/calls">Your calls</a>: <span id="homecalls"></span></div></div>' +
    (inds.length ? '' : '<div class="tiny muted" style="margin-top:6px">A fresh start (D-078): every team is blank, and your earlier records are kept in the project, not shown here.</div>'),
    {eyebrow: inds.length ? 'Next' : 'A fresh start', tools: false, style: 'margin-top:16px'});
}
var HOME_MODES = [
  ['tlab', '#/team', 'Your teams', 'six journeys, six trainers'], ['plab', '#/pokemon', 'Your Pokémon', 'every one of yours, ready to build'],
  ['arena', '#/arena', 'The Arena', 'any team against any team, six on six'], ['legends', '#/legends', 'Legends', 'the all-time teams, and a best of seven'],
  ['leagues', '#/leagues', 'Leagues', 'a season, standings, awards and playoffs'], ['draft', '#/draft', 'The Draft', 'draft an era\'s Pokémon against five GMs'],
  ['biology', '#/biology', 'Field Biology', 'the natural history of all 493'], ['eco', '#/ecosystems', 'Ecosystems', 'Johto\'s and Kanto\'s communities and food webs'],
  ['trainers', '#/trainers', 'Trainer Library', 'every trainer and version, anime included'], ['builds', '#/builds', 'The builds book', 'the ladder\'s sets and the trainers\''],
  ['homestead', '#/estate', 'The Estate', 'who lives and works at Blackthorn'], ['spark', '#/v2', 'What\'s new in v2', 'the redesign, and every call in it']
];
function homeModes() {
  return '<div class="ornament" style="margin:22px 0 12px">play · study · build</div><div class="modes">' + HOME_MODES.map(function (m) {
    return '<a class="mode" href="' + m[1] + '">' + Art.icon(m[0]) + '<b>' + esc(m[2]) + '</b><span>' + esc(m[3]) + '</span></a>'; }).join('') + '</div>';
}
function homeEstate() {   // the estate's day: the Sheet's logs, folded away until you want them
  var eggs = eggsModel(), berries = berriesModel(), env = envModel(), none = env.every(function (e) { return e.none; });
  return '<details class="estate-day" style="margin-top:22px"' + (store('home-estate') ? ' open' : '') + ' ontoggle="store(\'home-estate\', this.open)"><summary class="ornament" style="cursor:pointer">the estate today ▾</summary><div class="grid" style="margin-top:12px">' +
    '<div class="c4">' + card('Today', priorities().map(function (p) { return '<div class="line ' + p.tone + '" style="cursor:pointer" onclick="' + p.act + '">' + p.icon + ' ' + esc(p.text) + '</div>'; }).join('') +
      '<div class="ornament" style="margin:14px 0 10px">quick actions</div><div style="display:flex;flex-wrap:wrap;gap:6px">' +
      [['walk', 'Egg walk'], ['egg', 'Lay an egg'], ['plant', 'Plant'], ['harvest', 'Harvest'], ['feeding', 'Feeding'], ['reading', 'Reading'], ['note', 'Observation']].map(function (a) { return '<button class="btn sm" onclick="openForm(\'' + a[0] + '\')">' + a[1] + '</button>'; }).join('') + '</div>', {eyebrow: 'Daily priorities'}) + '</div>' +
    '<div class="c4">' + card('Incubation', eggs.length ? '<div class="eggs">' + eggs.slice(0, 4).map(function (e, i) { return '<div class="egg">' + Art.egg(e.pct, TYPE[(dexOf(e.line) || {t: ['Normal']}).t[0]], 'h' + i) + '<div class="ln">' + esc(e.line) + '</div><div class="sub">' + e.laps + ' / ' + e.cycles + ' laps</div></div>'; }).join('') + '</div>'
      : '<div class="empty">No eggs in the racks.</div>', {eyebrow: 'Egg walking', link: ['#/glasshouse/eggs', 'Racks']}) + '</div>' +
    '<div class="c4">' + card('Berry rings', berries.length ? berries.slice(0, 5).map(function (b) { return '<div class="berry"><img src="' + itemSprite(b.berry) + '"><div style="flex:1"><div class="small"><b>' + esc(b.berry) + '</b> <span class="muted">· plot ' + esc(b.plot) + '</span></div><div class="bar forest"><i style="width:' + (b.pct * 100).toFixed(0) + '%"></i></div></div><span class="tiny ' + (b.done ? '' : 'muted') + '">' + (b.done ? 'ready' : hrs((b.ready - Date.now()) / 3600e3)) + '</span></div>'; }).join('')
      : '<div class="empty">Nothing planted.</div>', {eyebrow: 'Cultivation', link: ['#/glasshouse/berries', 'All plots']}) + '</div>' +
    '<div class="c6">' + card('Living conditions', (none ? '<div class="tiny muted">No readings logged yet.</div>' : env.map(function (e) { return '<div class="small">' + esc(e.room + ' · ' + e.metric) + ': ' + (e.none ? 'no reading' : e.now + e.unit) + '</div>'; }).join('')), {eyebrow: 'Environmental monitoring', link: ['#/glasshouse/environment', 'Instruments']}) + '</div>' +
    '<div class="c6">' + card('The living timeline', '<div class="timeline">' + timelineModel(8).map(function (t) { return '<div class="tl ' + (t.live ? 'ember' : '') + '"><div class="when">' + esc(t.live ? fmtTime(t.at) : fmtDate(t.at)) + ' · ' + esc(t.kind.toUpperCase()) + '</div><div class="small">' + esc(t.text) + '</div></div>'; }).join('') + '</div>', {eyebrow: 'Recent activity', link: ['#/record', 'The record']}) + '</div>' +
    '</div></details>';
}
function bindMap(el) {   // the estate plate's pins: a facility opens its page, a place its own
  if (!el) return;
  el.querySelectorAll('[data-place]').forEach(function (g) {
    g.addEventListener('click', function () {
      var k = g.getAttribute('data-place');
      nav(k === 'sevii' ? '#/sevii' : k === 'blackthorn-city' || k === 'geothermal' ? '#/estate/' + k : facilityHref(k));
    });
  });
}
route(/^\/?$/, home, 'Home', '#/');
</script>
