<script>
/* ===== Breeding stock: blueprints, the line's catalogue, the designer, compare =================================
   docs/specs/BREEDING_INHERITANCE_ECOLOGY.md; MASTER_PLAN §4.5 and Phase 4. A blueprint is a build marked as breeding
   stock (kind "blueprint" in My Builds): the whole starting set an egg hatches with, checked by the stock engine
   (23_stock, the browser's copy of breeding/stock.py, held to it by app/test_stock_parity.mjs). Saving adds a version;
   recording a hatch makes one of your Pokémon from it (its hatch moves kept for good). The spec's four questions:
   what a line can start with (#/stock/<game>/<species>), how to make an exact set (the designer), what makes two sets
   different (compare), and what a set might suggest (the evidence by kind, then a reading of it by fixed rules, each
   sentence a hypothesis that names what it rests on: A-09). */
var ST = {d: null, timer: null};
var PURPOSES = ['competitive', 'environment', 'versatility', 'personal', 'other'];
var HOW_CHIP = {'default': ['at hatch', ''], egg: ['egg move', 'gold'], tm: ['father\'s TM', 'ice'], shared: ['both parents', 'forest'], 'light-ball': ['Light Ball', 'violet']};
var WEATHER = {Hail: ['Snow Cloak', 'Ice Body'], Sandstorm: ['Sand Veil'], 'Rain Dance': ['Swift Swim', 'Rain Dish', 'Hydration', 'Dry Skin'],
  'Sunny Day': ['Chlorophyll', 'Solar Power', 'Leaf Guard', 'Flower Gift', 'Dry Skin']};   // abilities that act in the weather a move calls (Gens 3-4)
function stockReady() {
  var none = function () { return null; };   // the field evidence, the ecotypes and the capability tags only feed the card on what a set might suggest
  if (!S.stockP) S.stockP = Promise.all([labsReady(), API.data('breeding'), fieldReady().catch(none), Eco.ready(['ecotypes']).catch(none), capReady().catch(none)])
    .then(function (r) { if (!Stock.ready()) Stock.init(r[1]); return true; })
    .catch(function (e) { S.stockP = null; throw e; });
  return S.stockP;
}
function stockGame() { var g = store('stock-game'); return Stock.GAMES[g] ? g : 'heartgold'; }
function blueprints(filter) {
  var out = []; Object.keys(S.store.builds || {}).forEach(function (k) { var b = S.store.builds[k]; if (b.kind === 'blueprint' && (!filter || filter(b))) out.push(b); });
  return out.sort(function (a, b) { return String(b.at || '').localeCompare(String(a.at || '')); });
}
function mineList() { return Object.keys(S.store.individuals || {}).map(function (k) { return S.store.individuals[k]; }); }
function bpRead(b) { try { return Stock.blueprint(b.species, b.moves || [], b.game, mineList()); } catch (e) { return {error: String(e.message || e)}; } }
function howChip(h) { var c = HOW_CHIP[h] || [h || 'not in the set', 'ember']; return chip(c[0], c[1]); }
function vgName(v) { return {1: 'Red/Blue', 2: 'Yellow', 3: 'Gold/Silver', 4: 'Crystal', 5: 'Ruby/Sapphire', 6: 'Emerald', 7: 'FireRed/LeafGreen', 8: 'Diamond/Pearl', 9: 'Platinum', 10: 'HeartGold/SoulSilver'}[v] || 'vg' + v; }
function prettyRoute(r) {   // "Sunflora level-up L33 (vg10)" -> "Sunflora at Lv 33 (HeartGold/SoulSilver)"
  return String(r).replace(/ level-up L(\d+)/, ' at Lv $1').replace(/ machine/, ' by TM/HM').replace(/ tutor/, ' from the move tutor').replace(/ egg/, ' as an egg move')
    .replace(/\(vg(\d+)\)/, function (m, v) { return '(' + vgName(+v) + ')'; });
}
function verdictStrip(v, compact) {
  var box = function (label, ok, why, cls, extra) {
    var col = ok === true || ok === 'expected' ? 'var(--forest-3)' : ok === false ? 'var(--ember-2)' : 'var(--text-2)';
    return '<div class="vbox" style="flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:8px 10px"><div class="tiny muted">' + esc(label) + ' <span title="what kind of claim this is">· ' + esc(cls) + '</span></div>' +
      '<b style="color:' + col + '">' + (ok === true ? 'Yes' : ok === 'expected' ? 'Expected' : 'No') + (extra ? ' <span class="tiny">' + esc(extra) + '</span>' : '') + '</b>' + (compact ? '' : '<div class="tiny" style="margin-top:4px">' + esc(why) + '</div>') + '</div>';
  };
  return '<div style="display:flex;gap:8px;flex-wrap:wrap">' + box('1 · Possible under the hatch rules', v.possible.ok, v.possible.why, v.possible['class']) +
    box('2 · Obtainable in the generation', v.obtainable.ok, v.obtainable.why, v.obtainable['class'], v.obtainable.scope) +
    box('3 · PKHeX should accept it', v.pkhex.ok, v.pkhex.why, v.pkhex['class']) + box('4 · Documented in your collection', v.documented.ok, v.documented.why, 'yours') + '</div>';
}
function verdictChips(v) {
  return [v.possible.ok ? chip('possible', 'forest') : chip('not possible', 'ember'), v.obtainable.ok ? chip('obtainable ' + v.obtainable.scope, 'forest') : v.possible.ok ? chip('not obtainable', 'ember') : '',
    v.documented.ok ? chip('documented', 'gold') : ''].filter(Boolean).join(' ');
}
function chainSteps(plan, res) {   // a lineage, oldest father first, as steps you'd actually do
  var chain = [], n = plan; while (n) { chain.push(n); n = n.via; } chain.reverse();
  var own = function (st) { return Object.keys(st.learns_itself).map(function (mv) { return '<b>' + esc(mv) + '</b> <span class="tiny muted">(' + esc(prettyRoute(st.learns_itself[mv][0])) + ')</span>'; }).join(', '); };
  var steps = chain.map(function (st, i) {
    var line = st.family[0] === st.father ? st.father : st.family[0] + ' line, as ' + st.father;
    if (i === 0) return '<li>A <b>' + esc(st.father) + '</b> ♂ learns ' + (own(st) || 'nothing it needs') + (st.catchable_in_game ? '' : ' <span class="tiny muted">(not found in this game: a trade)</span>') + '.</li>';
    return '<li>Breed him with a female of the <b>' + esc(st.family[0]) + '</b> line: the egg hatches knowing ' + esc(st.inherits.join(', ')) + '. Raise it (' + esc(line) + ' ♂)' + (Object.keys(st.learns_itself).length ? ' and teach it ' + own(st) : '') + '.</li>';
  });
  steps.push('<li>Breed the last father with a female <b>' + esc(res.species) + '</b>-line Pokémon' + (res.recipe && res.recipe.mother.length ? ' that knows ' + esc(res.recipe.mother.join(', ')) : '') + ': the egg hatches with the set.</li>');
  return '<ol class="small" style="margin:6px 0 0 18px;padding:0">' + steps.join('') + '</ol>';
}

/* ---- the parts every stock page shares: the tabs, a showcase card (v2.5) ---- */
function stockNav(on) {
  return '<div class="tabs">' + [['show', '#/stock', 'Showcase'], ['new', '#/stock/new', 'New stock'], ['compare', '#/stock/compare', 'Compare']].map(function (t) {
    return '<a href="' + t[1] + '" class="' + (t[0] === on ? 'on' : '') + '">' + t[2] + '</a>'; }).join('') + '<a href="#/breeding" style="margin-left:auto" class="tiny">Lineage &amp; studbook →</a></div>';
}
function labelsOf(b) { return String(b.labels || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean); }
function isFeatured(b) { return labelsOf(b).some(function (x) { return x.toLowerCase() === 'featured'; }); }
function hatchedFrom(id) { return mineList().filter(function (i) { return i.blueprint === id && i.status !== 'retired'; }); }
function stockTitle(b) { return b.name ? esc(b.name) : '<span class="ph" title="Not named yet: name it on its page">' + esc(b.species) + ', unnamed</span>'; }
function stockMoveChips(b, r) {   // the four moves, coloured by how each gets into the egg
  var how = {}; ((r && r.recipe) ? r.recipe.slots : []).forEach(function (s) { how[s.move] = s.how; });
  return (b.moves || []).map(function (m) { var c = HOW_CHIP[how[m]] || ['not in the set', 'ember']; return '<span class="chip ' + c[1] + '" title="' + esc(c[0]) + '">' + esc(m) + '</span>'; }).join('');
}
function stockCard(b, big) {
  var r = bpRead(b), v = r.verdict, n = hatchedFrom(b.id).length, t = (dexOf(b.species) || {t: ['Normal']}).t;
  var hay = [b.name, b.species, Battle.GAME_TITLE[b.game] || b.game, b.purpose, b.labels].concat(b.moves || []).join(' ').toLowerCase();
  return '<a class="stkcard' + (big ? ' big' : '') + '" href="#/stock/bp/' + encodeURIComponent(b.id) + '" data-hay="' + esc(hay) + '" data-game="' + esc(b.game) + '" data-purpose="' + esc(b.purpose || '') + '" data-at="' + esc(b.at || '') +
      '" data-name="' + esc((b.name || '~' + b.species).toLowerCase()) + '" data-sp="' + esc(b.species) + '" data-n="' + n + '" style="--tc:' + (TYPE[t[0]] || '#888') + '">' +
    '<div class="stkart"><img src="' + art(numOf(b.species)) + '" alt="" loading="lazy">' + (isFeatured(b) ? '<span class="stkstar" title="Signature stock">★</span>' : '') + '</div>' +
    '<div class="stkbody"><div class="stkname">' + stockTitle(b) + '</div><div class="tiny muted">' + esc(b.species) + ' · ' + esc(Battle.GAME_TITLE[b.game] || b.game) + ' · v' + (b.v || 1) + (n ? ' · ' + n + ' hatched' : '') + '</div>' +
    '<div class="stkmoves">' + stockMoveChips(b, r) + '</div><div style="margin-top:8px">' + (v ? verdictChips(v) : chip('can\'t read: ' + (r.error || '?'), 'ember')) + (b.purpose ? ' ' + chip(b.purpose, '') : '') +
    labelsOf(b).filter(function (x) { return x.toLowerCase() !== 'featured'; }).map(function (x) { return ' ' + chip(x, 'violet'); }).join('') + '</div></div></a>';
}

/* ---- #/stock: the showcase of your designer stock ---- */
function stockHome() {
  return stockReady().then(function () {
    var game = stockGame(), bps = blueprints(), feat = bps.filter(isFeatured), sps = {}, hatched = 0;
    bps.forEach(function (b) { sps[b.species] = 1; hatched += hatchedFrom(b.id).length; });
    var games = Object.keys(Stock.GAMES).filter(function (g) { return bps.some(function (b) { return b.game === g; }); });
    var f = store('stock-filter') || {};
    after(function (p) { stockPickBind(p); stockFilterBind(p); });
    var lines = (typeof linesAll === 'function' ? linesAll() : []);
    return stockNav('show') + '<div class="eyebrow">Builder &amp; Studio · breeding stock</div><h1 style="margin:6px 0">Designer breeding stock</h1>' +
      '<p class="lede">Your designer stock: the exact starting sets your eggs hatch with, each one named by you, kept in versions, and checked against the game\'s own hatch rules. Design one in the lab, then show it off here.</p>' +
      '<div class="stkstats"><div><b>' + bps.length + '</b>' + (bps.length === 1 ? 'design' : 'designs') + '</div><div><b>' + Object.keys(sps).length + '</b>species</div><div><b>' + feat.length + '</b>signature</div><div><b>' + hatched + '</b>hatched from them</div></div>' +
      '<div class="grid" style="margin-top:12px"><div class="c8">' +
      (feat.length ? card('Signature stock', '<div class="stkgrid big">' + feat.map(function (b) { return stockCard(b, true); }).join('') + '</div>', {eyebrow: 'Starred on its own page', tools: false, style: 'margin-bottom:16px'}) : '') +
      card('All your stock', bps.length ? '<div class="stkfilter"><input class="f" id="stkq" placeholder="Search a name, species, move or label" value="' + esc(f.q || '') + '">' +
          '<select class="f" id="stkg"><option value="">Every game</option>' + games.map(function (g) { return '<option value="' + g + '"' + (f.g === g ? ' selected' : '') + '>' + esc(Battle.GAME_TITLE[g] || g) + '</option>'; }).join('') + '</select>' +
          '<select class="f" id="stkp"><option value="">Any purpose</option>' + PURPOSES.map(function (x) { return '<option' + (f.p === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>' +
          '<select class="f" id="stks">' + [['new', 'Newest first'], ['name', 'By name'], ['sp', 'By species'], ['n', 'Most hatched']].map(function (x) { return '<option value="' + x[0] + '"' + (f.s === x[0] ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select></div>' +
          '<div class="stkgrid" id="stkall">' + bps.map(function (b) { return stockCard(b); }).join('') + '</div><div class="tiny muted" id="stknone" style="display:none;margin-top:8px">Nothing matches.</div>'
        : '<div class="stkempty"><b style="color:var(--ivory)">Your showcase is empty.</b><div class="small" style="margin-top:6px">Design a starting set in the lab: pick a species, choose the moves its egg hatches with, name it and save it. Every save is a version, and each one is checked against the game\'s hatch rules.</div>' +
          '<div style="margin-top:12px"><a class="btn gold" href="#/stock/new">New breeding stock</a></div></div>', {eyebrow: plural(bps.length, 'design') + ' · saved in My Builds', tools: false}) + '</div>' +
      '<div class="c4">' + card('Start new stock', stockPicker(game, 'new'), {eyebrow: 'Pick a species: the lab opens', tools: false}) +
      card('How each one is read', '<div class="small"><b>1 · Possible.</b> The hatch rules can make this exact set from parents who know the right moves.</div><div class="small" style="margin-top:6px"><b>2 · Obtainable.</b> Those parents can actually be had in the generation, fathers bred up to three generations back.</div>' +
        '<div class="small" style="margin-top:6px"><b>3 · PKHeX.</b> PKHeX checks each move\'s source and the hatch order, not whether a father could carry the set. Not run here.</div><div class="small" style="margin-top:6px"><b>4 · Documented.</b> One of your Pokémon is recorded as hatching with it.</div>' +
        '<div class="tiny muted" style="margin-top:8px">The move chips are coloured by how each gets into the egg: gold an egg move, blue the father\'s TM, green both parents, plain at hatch.</div>', {eyebrow: 'The four answers', tools: false, style: 'margin-top:16px'}) +
      (lines.length ? card('Lines to start from', lines.map(function (l) {
          return '<div class="small" style="padding:6px 0;border-top:1px solid var(--line)">' + portrait(l.offspring, 28) + ' <b>' + esc(l.offspring) + '</b> <span class="tiny muted">' + esc(Battle.GAME_TITLE[l.game] || l.game) + ' · ' + esc(l.moves.join(', ')) + '</span> ' +
            '<a class="link" href="' + designHref(l.game, l.offspring, l.moves, null) + '">Open in the lab →</a></div>'; }).join(''), {eyebrow: 'The breeding lab\'s lines', tools: false, style: 'margin-top:16px'}) : '') + '</div></div>';
  });
}
function stockFilterBind(p) {
  var box = p.querySelector('#stkall'); if (!box) return;
  var cards = Array.prototype.slice.call(box.children), q = p.querySelector('#stkq'), g = p.querySelector('#stkg'), pu = p.querySelector('#stkp'), so = p.querySelector('#stks');
  var run = function () {
    var f = {q: q.value.trim().toLowerCase(), g: g.value, p: pu.value, s: so.value}, shown = 0; store('stock-filter', f);
    var key = {new: function (c) { return c.getAttribute('data-at'); }, name: function (c) { return c.getAttribute('data-name'); }, sp: function (c) { return c.getAttribute('data-sp'); }, n: function (c) { return ('000' + c.getAttribute('data-n')).slice(-4); }}[f.s] || null;
    var desc = f.s === 'new' || f.s === 'n';
    cards.slice().sort(function (a, b) { if (!key) return 0; var x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * (desc ? -1 : 1); }).forEach(function (c) { box.appendChild(c); });
    cards.forEach(function (c) { var ok = (!f.q || c.getAttribute('data-hay').indexOf(f.q) >= 0) && (!f.g || c.getAttribute('data-game') === f.g) && (!f.p || c.getAttribute('data-purpose') === f.p);
      c.style.display = ok ? '' : 'none'; if (ok) shown++; });
    p.querySelector('#stknone').style.display = shown ? 'none' : '';
  };
  [q, g, pu, so].forEach(function (el) { el.addEventListener(el === q ? 'input' : 'change', run); });
  run();
}

/* ---- #/stock/new: pick a species, and the lab opens ---- */
function stockNew() {
  return stockReady().then(function () {
    var game = stockGame(), ok = function (sp) { try { Stock.hatchSpecies(sp, game); return true; } catch (e) { return false; } };
    var uniq = function (xs) { return xs.filter(function (x, i) { return xs.indexOf(x) === i && ok(x); }); };
    var team = uniq(Teams.members(Teams.get(game)).filter(Boolean).map(function (m) { return m.ind.species; }));
    var recent = uniq(blueprints(function (b) { return b.game === game; }).map(function (b) { return b.species; })).slice(0, 8);
    var quick = function (list, title) { return list.length ? '<div class="eyebrow" style="margin:14px 0 6px">' + esc(title) + '</div><div class="pickgrid">' + list.map(function (sp) {
      return '<a class="pick" href="' + designHref(game, sp, [], null) + '"><img src="' + sprite(numOf(sp), game) + '" alt=""><div><b>' + esc(sp) + '</b><div class="tiny muted">design its stock →</div></div></a>'; }).join('') + '</div>' : ''; };
    after(function (p) { stockPickBind(p); });
    return stockNav('new') + '<div class="eyebrow">Breeding stock · the lab</div><h1 style="margin:6px 0">New breeding stock</h1>' +
      '<p class="lede">Pick a species and a game. The lab opens with every move its egg can start with, ideas from the line, and how to make each set, live as you choose.</p>' +
      '<div class="grid" style="margin-top:12px"><div class="c6">' + card('Pick a species', stockPicker(game, 'new'), {eyebrow: 'The adult or the egg: it reads what hatches', tools: false}) + '</div>' +
      '<div class="c6">' + card('Quick picks', (quick(team, 'On your ' + (GAME_NAME[game] || game) + ' team') + quick(recent, 'Designed before in ' + (GAME_NAME[game] || game))) ||
        '<div class="tiny muted">Your ' + esc(GAME_NAME[game] || game) + ' team and earlier designs show here. Change the game on the left to see another\'s.</div>', {eyebrow: GAME_NAME[game] || game, tools: false}) + '</div></div>';
  });
}
function stockPicker(game, mode, species) {
  return '<form id="stpick"><div class="row"><div><label class="l">Game</label><select class="f" name="game">' + Object.keys(Stock.GAMES).map(function (g) { return '<option value="' + g + '"' + (g === game ? ' selected' : '') + '>' + esc(Battle.GAME_TITLE[g] || g) + '</option>'; }).join('') + '</select></div>' +
    '<div><label class="l">Species</label><input class="f" name="species" list="stsp" value="' + esc(species || '') + '" placeholder="Larvitar, Swinub…" autocomplete="off"></div></div>' +
    '<datalist id="stsp">' + Stock.breedable(game).map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>' +
    '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' + (mode === 'explore' ? '<button class="btn gold" data-go="explore">Explore the line</button>' :
      '<button class="btn gold" data-go="design">Design it in the lab</button><button class="btn" data-go="explore">What can its eggs start with?</button>') + '</div></form>';
}
function stockPickBind(p) {
  var f = p.querySelector('#stpick'); if (!f) return;
  var mode = 'design';
  f.querySelectorAll('[data-go]').forEach(function (b) { b.addEventListener('click', function () { mode = b.getAttribute('data-go'); }); });
  f.game.onchange = function () { store('stock-game', f.game.value); var dl = p.querySelector('#stsp'); if (dl) dl.innerHTML = Stock.breedable(f.game.value).map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
    if (/^#\/stock\/new/.test(NAVI.hash)) nav('#/stock/new', true); };   // the quick picks are the game's
  f.onsubmit = function (e) { e.preventDefault(); var sp = f.species.value.trim(); if (!sp) { toast('Type a species first.'); return false; }
    try { Stock.sid(sp); } catch (err) { toast('No species called ' + esc(sp) + '.'); return false; }
    store('stock-game', f.game.value); nav(mode === 'explore' ? '#/stock/' + f.game.value + '/' + encodeURIComponent(sp) : designHref(f.game.value, sp, [], null)); return false; };
}
function bpRow(b) {
  var r = bpRead(b), v = r.verdict;
  return '<a class="pick" href="#/stock/bp/' + encodeURIComponent(b.id) + '" style="align-items:flex-start;margin-top:6px"><img src="' + sprite(numOf(b.species), b.game) + '" alt=""><div style="flex:1"><b>' + (b.name ? esc(b.name) : '<span class="ph">⟨unnamed⟩</span>') + '</b> <span class="tiny muted">' + esc(Battle.GAME_TITLE[b.game] || b.game) + ' · v' + (b.v || 1) + '</span>' +
    '<div class="tiny">' + esc((b.moves || []).join(' · ')) + '</div><div style="margin-top:4px">' + (v ? verdictChips(v) : chip('can\'t read: ' + (r.error || '?'), 'ember')) + (b.purpose ? ' ' + chip(b.purpose, '') : '') +
    (b.labels ? String(b.labels).split(',').map(function (x) { return x.trim() ? ' ' + chip(x.trim(), 'violet') : ''; }).join('') : '') + '</div></div></a>';
}
function designHref(game, species, moves, bp) {
  return '#/stock/' + game + '/' + encodeURIComponent(species) + '/design' + (moves && moves.length ? '?m=' + moves.map(encodeURIComponent).join('|') : '') + (bp ? (moves && moves.length ? '&' : '?') + 'bp=' + encodeURIComponent(bp) : '');
}

/* ---- #/stock/<game>/<species>: everything its eggs can start with ---- */
function stockLine(game, species) {
  return stockReady().then(function () {
    if (!Stock.GAMES[game]) return '<div class="notice">No game called ' + esc(game) + '.</div>';
    var e; try { e = Stock.explore(species, game); } catch (err) { return '<div class="notice">No species called ' + esc(species) + '. <a href="#/stock">Breeding stock</a></div>'; }
    var gen = e.generation, mine = blueprints(function (b) { return b.game && Stock.GAMES[b.game] && Stock.GAMES[b.game][0] === gen && e.family.indexOf(b.species) >= 0; });
    var mvLine = function (m) { var x = ''; try { x = Explain.move(m, gen); } catch (err) { x = ''; } return x; };
    after(function (p) {
      var cmp = p.querySelector('#stcmp'); if (cmp) cmp.onclick = function () { var ids = Array.prototype.slice.call(p.querySelectorAll('input[data-bp]:checked')).map(function (x) { return x.getAttribute('data-bp'); });
        if (ids.length !== 2) { toast('Tick two blueprints to compare.'); return; } nav('#/stock/compare/' + encodeURIComponent(ids[0]) + '/' + encodeURIComponent(ids[1])); };
    });
    var eggRows = e.egg.map(function (x) {
      return '<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="small"><b>' + esc(x.move) + '</b> ' + (x.one_step.length ? chip(plural(x.one_step.length, 'father') + ' learn it themselves', 'forest') : chip('a father must be bred to it first', 'ember')) +
        ' <a class="link tiny" href="' + designHref(game, e.species, [x.move], null) + '">design with it →</a></div>' + mvLine(x.move) +
        (x.also.length ? '<div class="tiny" style="color:var(--gold)">Also learnable without breeding: ' + esc(x.also.join('; ')) + '</div>' : '') +
        (x.one_step.length ? '<div class="tiny muted">One-step fathers: ' + esc(x.one_step.slice(0, 12).join(', ')) + (x.one_step.length > 12 ? '…' : '') + '</div>' : '') + '</div>'; }).join('');
    var bundles = e.bundles.map(function (b) {
      return '<div style="padding:8px 0;border-top:1px solid var(--line)"><div>' + b.moves.map(function (m) { return chip(m, 'gold'); }).join(' ') + '</div><div class="tiny muted" style="margin-top:4px">A ' + esc(b.fathers.join(', ')) + ' ♂ can learn ' + (b.moves.length > 4 ? 'any four of these' : 'these') + ' himself and pass them in one egg. ' +

    if ((A.purpose || '') !== (B.purpose || '')) diffs.push('Purpose: ' + esc(A.purpose || 'none') + ' vs ' + esc(B.purpose || 'none') + '.');
    var col = function (x, r) {
      return card(title(x), '<div class="tiny muted">' + esc(Battle.GAME_TITLE[x.game] || x.game) + ' · ' + esc(x.species) + ' · v' + (x.v || 1) + (x.purpose ? ' · ' + esc(x.purpose) : '') + '</div>' +
        (r.recipe ? r.recipe.slots.map(function (s) { return '<div class="small" style="padding:4px 0;border-top:1px solid var(--line)"><b' + (both.indexOf(s.move) < 0 ? ' style="color:var(--gold)"' : '') + '>' + esc(s.move) + '</b> ' + howChip(s.how) + ' <span class="tiny muted">' + esc(desc(r, s.move)) + '</span></div>'; }).join('') : '<div class="notice">' + esc(r.verdict ? r.verdict.possible.why : r.error) + '</div>') +
        (r.verdict ? '<div style="margin-top:8px">' + verdictStrip(r.verdict, true) + '</div>' : '') +
        '<div style="margin-top:8px"><a class="link" href="#/stock/bp/' + encodeURIComponent(x.id) + '">Its page →</a></div>', {tools: false});
    };
    return stockNav('compare') + '<a class="link" href="#/stock">← The showcase</a><div class="eyebrow" style="margin-top:10px">Breeding stock · compare</div><h1 style="margin:6px 0">What makes these two different</h1>' +
      card('The differences', (diffs.length ? diffs.map(function (x) { return '<div class="small" style="padding:4px 0">' + x + '</div>'; }).join('') : '<div class="small">The same starting set, made the same way.</div>') +
        (both.length ? '<div class="tiny muted" style="margin-top:8px">Both start with ' + esc(both.join(', ')) + '.</div>' : ''), {eyebrow: 'Moves, how they get in, effort, verdict', tools: false, style: 'margin-top:12px'}) +
      '<div class="grid" style="margin-top:16px"><div class="c6">' + col(A, ra) + '</div><div class="c6">' + col(B, rb) + '</div></div>';
  });
}
route(/^\/stock\/?$/, stockHome, 'Breeding stock', '#/stock');
route(/^\/stock\/new\/?$/, stockNew, 'Breeding stock · new', '#/stock');
route(/^\/stock\/compare\/?$/, stockComparePick, 'Breeding stock · compare', '#/stock');
route(/^\/stock\/bp\/(.+)$/, stockShow, function (i) { var b = storeBuild(i); return 'Breeding stock · ' + (b && b.name || i); }, '#/stock');
route(/^\/stock\/compare\/([^/]+)\/([^/]+)$/, stockCompare, 'Breeding stock · compare', '#/stock');
route(/^\/stock\/(\w+)\/([^/?]+)\/design\/?(\?.*)?$/, stockDesign, function (g, s) { return 'Breeding stock · ' + s + ' · the lab'; }, '#/stock');
route(/^\/stock\/(\w+)\/([^/?]+)\/?$/, stockLine, function (g, s) { return 'Breeding stock · ' + s; }, '#/stock');
</script>
