<script>

  function opts(list, label) { return '<option value="">' + label + '</option>' + list.map(function (x) { return '<option value="' + esc(x[0]) + '">' + esc(x[1]) + '</option>'; }).join(''); }

function srcShort(src) { src = String(src || ''); return /replay\.pokemonshowdown/.test(src) ? 'a ladder replay' : src.replace(/https?:\/\/\S+/, '').replace(/[:\s]+$/, ''); }

      block('Journal', jn, function (e) { return '<div class="line small">' + kindChip(e.kind) + ' <b>' + esc(e.sp || '') + '</b> ' + esc(e.text) + '</div>'; }) +
      block('Decisions', dc, function (d) { return '<a class="line small" style="display:block;color:inherit" href="#/record"><b class="mono">' + esc(d.id) + '</b> ' + esc(d.title) + ' ' + chip(d.status) + '</a>'; });
    return '<div class="eyebrow">Search</div><h1 style="margin:6px 0">“' + esc(q) + '”</h1>' + (body || '<div class="empty" style="margin-top:16px">Nothing found for that.</div>');
  });
}
route(/^\/atlas\/?$/, atlas, 'Biological atlas', '#/atlas');
route(/^\/atlas\/(\w+)$/, species, function (n) { var s = DEX.byNum[n] || dexOf(n); return 'Atlas · ' + (s ? s.name : n); }, '#/atlas');
route(/^\/journal\/?$/, journal, 'Research journal', '#/journal');
route(/^\/search\/(.*)$/, search, 'Search', '-');
</script>
