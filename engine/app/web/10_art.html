  function rng(seed) { var s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function phaseNow(d) {
    var h = (d || new Date()).getHours();
    return h >= 5 && h < 8 ? 'dawn' : h >= 8 && h < 17 ? 'day' : h >= 17 && h < 20 ? 'dusk' : 'night';
  }
  function seasonNow(d) {
    var m = (d || new Date()).getMonth();

  }
  var SKY = {

  /* ---- the hero panorama: Blackthorn, the Ice Path, Dragon's Den, the Glasshouse ---- */

    o.push('<g fill="' + (night ? '#9AA3B0' : '#2C2A26') + '" opacity=".6"><path d="M560 150 q6 -6 12 0 q6 -6 12 0"/><path d="M600 132 q5 -5 10 0 q5 -5 10 0"/><path d="M630 158 q4 -4 8 0 q4 -4 8 0"/></g>');
    // framing pines
    function pine(x, h, c) { return '<path d="M' + x + ' 560 L' + x + ' ' + (560 - h * .18) + ' L' + (x - h * .22) + ' ' + (560 - h * .18) + ' L' + x + ' ' + (560 - h) + ' L' + (x + h * .22) + ' ' + (560 - h * .18) + ' L' + x + ' ' + (560 - h * .18) + 'Z" fill="' + c + '"/>'; }

    o.push('</svg>');
    return o.join('');

  /* ---- the crest ---- */

      '<path d="M15 30 Q16 18 24 14 Q32 18 33 30 Q28 26 24 27 Q20 26 15 30Z" fill="none" stroke="url(#cg)" stroke-width="1.4"/>' +

  var PLACES = {
    'glasshouse': {x: 560, y: 410, label: 'The Glasshouse', kind: 'glass'},
    'nursery & hatchery': {x: 615, y: 455, label: 'Nursery & hatchery', kind: 'glass'},
    'studbook & archive': {x: 690, y: 300, label: 'Studbook & archive'},
    'day-care preserve': {x: 905, y: 560, label: 'Day-Care preserve', kind: 'open'},
    'clinic': {x: 760, y: 410, label: 'Clinic'},
    'kitchen & orchard': {x: 410, y: 520, label: 'Kitchen & orchard'},
    'works (building & upkeep)': {x: 330, y: 640, label: 'Works'},
    'transport': {x: 980, y: 380, label: 'Transport field'},
    'security & watch': {x: 285, y: 300, label: 'Watchtower'},
    'climate': {x: 470, y: 340, label: 'Climate'},
    'cold vault': {x: 205, y: 205, label: 'Cold vault (Ice Path)', kind: 'ice'},
    "dragon's den": {x: 985, y: 160, label: "Dragon's Den", kind: 'sacred'},
    'blackthorn city': {x: 690, y: 205, label: 'Blackthorn City', kind: 'town'}
  };
  function estateMap(facilities, onclick) {
    var o = ['<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" style="font-family:Cormorant Garamond,serif">'];
    o.push('<defs><pattern id="paper" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#F1EADB"/><circle cx="1" cy="1" r=".5" fill="#D8CCB6"/></pattern>' +
      '<linearGradient id="lk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9CDD9"/><stop offset="1" stop-color="#7FAFC1"/></linearGradient></defs>');
    o.push('<rect x="8" y="8" width="1184" height="744" rx="14" fill="url(#paper)" stroke="#8E7647" stroke-width="1.5"/>');
    o.push('<rect x="20" y="20" width="1160" height="720" rx="8" fill="none" stroke="#8E7647" stroke-width=".7" stroke-dasharray="2 4"/>');
    // mountains, hachured
    var R = rng(7);
    for (var i = 0; i < 46; i++) {
      var x = 40 + R() * 1120, y = 40 + R() * 150 + (x < 380 ? 60 : 0), s = 18 + R() * 26;

      o.push('<path d="M' + (x - s) + ' ' + (y + s * .7) + ' L' + x + ' ' + (y - s * .5) + ' L' + (x + s) + ' ' + (y + s * .7) + '" fill="#E4DACA" stroke="#6B5B44" stroke-width="1"/>' +
             '<path d="M' + x + ' ' + (y - s * .5) + ' L' + (x + s * .35) + ' ' + (y + s * .7) + '" stroke="#6B5B44" stroke-width=".6"/>');
    }
    // the Ice Path glacier
    o.push('<path d="M60 150 Q140 120 260 170 Q300 230 230 270 Q150 290 90 250 Q50 210 60 150Z" fill="#DCEEF5" stroke="#4F7E92" stroke-width="1.2"/>');
    o.push('<text x="150" y="160" font-size="15" fill="#4F7E92" font-style="italic">Ice Path</text>');
    // Dragon's Den lake
    o.push('<path d="M880 120 Q1000 90 1080 140 Q1110 200 1040 220 Q940 230 890 190 Q860 150 880 120Z" fill="url(#lk)" stroke="#4F7E92" stroke-width="1.2"/>');
    // Route 44 lake, west
    o.push('<path d="M60 430 Q120 400 180 430 Q200 470 150 490 Q80 495 60 460Z" fill="url(#lk)" stroke="#4F7E92" stroke-width="1"/><text x="72" y="520" font-size="14" fill="#4F7E92" font-style="italic">Route 44</text>');
    // the river: Route 45, north to south
    o.push('<path d="M760 210 C740 300 600 330 610 400 C620 470 760 500 760 600 C760 660 720 700 700 740" stroke="#7FAFC1" stroke-width="9" fill="none" stroke-linecap="round"/>');
    o.push('<text x="770" y="660" font-size="14" fill="#4F7E92" font-style="italic" transform="rotate(-70 770 660)">Route 45</text>');
    // meadows and orchards
    for (var t = 0; t < 70; t++) { var tx = 320 + R() * 220, ty = 470 + R() * 120; o.push('<circle cx="' + tx.toFixed(0) + '" cy="' + ty.toFixed(0) + '" r="4" fill="#A9C7A8" stroke="#5E8F68" stroke-width=".8"/>'); }
    o.push('<path d="M820 500 Q900 470 1010 500 Q1060 560 1000 640 Q900 680 830 630 Q790 560 820 500Z" fill="#E2EAD6" stroke="#5E8F68" stroke-width="1.2" stroke-dasharray="5 4"/>');
    o.push('<text x="850" y="620" font-size="13" fill="#2F4D3A" font-style="italic">the preserve (open, by invitation)</text>');
    // the town
    for (var h = 0; h < 14; h++) { var hx = 640 + (h % 7) * 16, hy = 190 + Math.floor(h / 7) * 16; o.push('<rect x="' + hx + '" y="' + hy + '" width="11" height="9" fill="#C9B79A" stroke="#6B5B44" stroke-width=".8"/>'); }
    // the Glasshouse plan
    o.push('<circle cx="560" cy="410" r="52" fill="#EDF5EF" stroke="#8E7647" stroke-width="1.6"/><circle cx="560" cy="410" r="34" fill="none" stroke="#5E8F68" stroke-width="1"/><circle cx="560" cy="410" r="12" fill="#F4AE76" stroke="#DE7C42"/>');
    // pins
    Object.keys(PLACES).forEach(function (k) {
      var p = PLACES[k], f = (facilities || []).filter(function (x) { return x.name === k; })[0];
      var open = f && f.open && f.open.length, c = p.kind === 'ice' ? '#4F7E92' : p.kind === 'sacred' ? '#7B2F25' : p.kind === 'open' ? '#2F4D3A' : open ? '#DE7C42' : '#8E7647';
      o.push('<g class="hot" data-place="' + k + '" transform="translate(' + p.x + ' ' + p.y + ')">' +
        '<circle r="13" fill="#FBF7EE" stroke="' + c + '" stroke-width="2"/><circle r="5" fill="' + c + '"/>' +
        '<text y="-20" text-anchor="middle" font-size="17" font-weight="700" fill="#24211C">' + p.label + '</text></g>');
    });
    // cartouche, compass, scale
    o.push('<g transform="translate(60 640)"><rect width="250" height="82" rx="6" fill="#FBF7EE" stroke="#8E7647"/>' +
      '<text x="125" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#24211C">The Blackthorn Estate</text>' +
      '<text x="125" y="58" text-anchor="middle" font-size="13" fill="#5B554A" font-style="italic">headquarters · Johto · D-041</text></g>');
    o.push('<g transform="translate(1110 660)"><circle r="38" fill="none" stroke="#8E7647"/><path d="M0 -34 L7 0 L0 34 L-7 0Z" fill="#8E7647"/><text y="-44" text-anchor="middle" font-size="14" fill="#24211C" font-weight="700">N</text></g>');
    o.push('<g transform="translate(1040 300)"><text font-size="13" fill="#5B554A" font-style="italic">→ satellite: Sevii Islands</text><text y="18" font-size="13" fill="#5B554A" font-style="italic">or the Battle Zone (your call)</text></g>');
    o.push('</svg>');
    return o.join('');
  }

  /* ---- the Glasshouse, in plan ---- */
  function glasshouse(g, eggs) {
    var cx = 450, cy = 330, o = ['<svg viewBox="0 0 900 676" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,sans-serif">'];
    o.push('<defs><radialGradient id="gh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFC07A"/><stop offset=".5" stop-color="#DE7C42"/><stop offset="1" stop-color="#8E4320"/></radialGradient>' +
      '<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#DE7C42" stop-opacity=".45"/><stop offset="1" stop-color="#DE7C42" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="amph" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A0" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/></radialGradient></defs>');
    o.push('<rect width="900" height="676" rx="16" fill="#171A20"/>');
    // the rock and the cold vault, north
    o.push('<path d="M0 0 H900 V70 Q700 110 450 96 Q200 110 0 70Z" fill="#2B3138"/>');
    o.push('<g class="hot" data-k="Cold vault"><path d="M380 18 H520 L500 92 H400Z" fill="#9CCBDD" opacity=".55" stroke="#DCEFF5"/><text x="450" y="56" text-anchor="middle" font-size="13" fill="#0F1A20" font-weight="700">COLD VAULT</text><text x="450" y="74" text-anchor="middle" font-size="11" fill="#0F1A20">seed & berry store · Mamoswine</text></g>');
    // crop rings
    var crops = (g && g.crops) || [];
    var colors = {Cheri: '#E86A5B', Chesto: '#7C6FD0', Pecha: '#F2A7C3', Rawst: '#7CC7A2', Aspear: '#F2D24E', Leppa: '#E0864D', Oran: '#5C8FE0', Persim: '#E88FB7', Sitrus: '#F2C14E', Lum: '#7CC77F'};
    var n = Math.max(crops.length, 1);
    for (var i = 0; i < n; i++) {
      var a0 = (i / n) * Math.PI * 2 - Math.PI / 2, a1 = ((i + 1) / n) * Math.PI * 2 - Math.PI / 2 - .03;
      var c = crops[i] ? (colors[crops[i].berry.split(' ')[0]] || '#7CC77F') : '#5E8F68';
      o.push('<path class="hot" data-k="crop:' + (crops[i] ? crops[i].berry : '') + '" d="' + arc(cx, cy, 250, 205, a0, a1) + '" fill="' + c + '" opacity=".55" stroke="#171A20" stroke-width="2"/>');
    }
    o.push('<circle cx="' + cx + '" cy="' + cy + '" r="254" fill="none" stroke="#C9A96A" stroke-width="2"/>');
    // the hatching loop
    o.push('<circle class="hot" data-k="Hatching loop" cx="' + cx + '" cy="' + cy + '" r="190" fill="none" stroke="#E2CC98" stroke-width="3" stroke-dasharray="10 9"/>');
    o.push('<text x="' + cx + '" y="' + (cy - 196) + '" text-anchor="middle" font-size="11" fill="#E2CC98" letter-spacing="2">THE HATCHING LOOP · 1 LAP = 1 EGG CYCLE</text>');
    // egg racks
    o.push('<circle cx="' + cx + '" cy="' + cy + '" r="160" fill="#20242B" stroke="#8E7647"/>');
    var lines = (g && g.eggs) || [];
    lines.forEach(function (e, j) {
      var a = (j / lines.length) * Math.PI * 2 - Math.PI / 2, ex = cx + Math.cos(a) * 128, ey = cy + Math.sin(a) * 128;
      o.push('<g class="hot" data-k="eggs:' + e.line + '" transform="translate(' + (ex - 13) + ' ' + (ey - 16) + ')"><path d="M13 1 C6 1 2 12 2 19 A11 11 0 0 0 24 19 C24 12 20 1 13 1Z" fill="#F3EDE2" stroke="#C9A96A"/>' +
        '<text x="13" y="44" text-anchor="middle" font-size="10" fill="#B7AF9F">' + e.line + '</text></g>');
    });
    o.push('<text x="' + cx + '" y="' + (cy + 84) + '" text-anchor="middle" font-size="10" fill="#B7AF9F" letter-spacing="2">EGG RACKS</text>');
    // the hearth
    o.push('<circle cx="' + cx + '" cy="' + cy + '" r="110" fill="url(#glow)"/>');
    o.push('<g class="hot" data-k="Hearth hall"><circle cx="' + cx + '" cy="' + cy + '" r="58" fill="url(#gh)" stroke="#F4AE76" stroke-width="2"/>' +
      '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="15" font-weight="700" fill="#2A1408">THE HEARTH</text>' +
      '<text x="' + cx + '" y="' + (cy + 14) + '" text-anchor="middle" font-size="11" fill="#2A1408">Magcargo · Magma Armor</text></g>');
    // Ampharos beacons
    [[cx - 300, cy - 210], [cx + 300, cy - 210], [cx - 300, cy + 230], [cx + 300, cy + 230]].forEach(function (p) {
      o.push('<g class="hot" data-k="Glasshouse rings"><circle cx="' + p[0] + '" cy="' + p[1] + '" r="34" fill="url(#amph)"/><circle cx="' + p[0] + '" cy="' + p[1] + '" r="7" fill="#FFE9A0"/></g>');
    });
    o.push('<text x="' + (cx - 300) + '" y="' + (cy - 172) + '" text-anchor="middle" font-size="11" fill="#E2CC98">Ampharos light</text>');
    // annexes: nursery yard (south), studbook office (east)
    o.push('<g class="hot" data-k="Nursery yard"><rect x="370" y="596" width="160" height="34" rx="8" fill="#2F4D3A" stroke="#5E8F68"/><text x="450" y="618" text-anchor="middle" font-size="12" fill="#D9EBD6" font-weight="700">NURSERY YARD</text></g>');
    o.push('<g class="hot" data-k="Studbook office"><rect x="770" y="300" width="112" height="60" rx="8" fill="#252932" stroke="#8E7647"/><text x="826" y="326" text-anchor="middle" font-size="12" fill="#E2CC98" font-weight="700">STUDBOOK</text><text x="826" y="344" text-anchor="middle" font-size="11" fill="#B7AF9F">office</text></g>');
    o.push('<text x="450" y="662" text-anchor="middle" font-size="12" fill="#847D70">The greenhouse rings live on the hearth\'s heat; the egg walk is the harvest walk.</text>');
    o.push('</svg>');
    return o.join('');
  }
  function arc(cx, cy, r1, r0, a0, a1) {
    function p(r, a) { return (cx + Math.cos(a) * r).toFixed(1) + ' ' + (cy + Math.sin(a) * r).toFixed(1); }
    var big = a1 - a0 > Math.PI ? 1 : 0;
    return 'M' + p(r1, a0) + ' A' + r1 + ' ' + r1 + ' 0 ' + big + ' 1 ' + p(r1, a1) + ' L' + p(r0, a1) + ' A' + r0 + ' ' + r0 + ' 0 ' + big + ' 0 ' + p(r0, a0) + 'Z';
  }

  /* ---- a small trend line ---- */
  function spark(vals, color, w, h) {
    w = w || 120; h = h || 30; if (!vals || vals.length < 2) return '';
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), sp = hi - lo || 1;
    var pts = vals.map(function (v, i) { return (i / (vals.length - 1) * w).toFixed(1) + ',' + (h - 3 - (v - lo) / sp * (h - 6)).toFixed(1); });
    return '<svg width="' + w + '" height="' + h + '"><polyline points="' + pts.join(' ') + '" fill="none" stroke="' + (color || '#C9A96A') + '" stroke-width="1.6"/></svg>';
  }

  /* ---- a ring gauge ---- */
  function ring(pct, label, color, size) {
    size = size || 84; var r = 34, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct || 0));
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 84 84"><circle cx="42" cy="42" r="' + r + '" fill="none" stroke="#30353F" stroke-width="7"/>' +
      '<circle cx="42" cy="42" r="' + r + '" fill="none" stroke="' + (color || '#C9A96A') + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (c * p).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 42 42)"/>' +
      '<text x="42" y="47" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="20" font-weight="700" fill="#F3EDE2">' + (label == null ? Math.round(p * 100) + '%' : label) + '</text></svg>';
  }

  return {hero: hero, crest: crest, icon: icon, egg: egg, estateMap: estateMap, glasshouse: glasshouse, spark: spark, ring: ring,
          phaseNow: phaseNow, seasonNow: seasonNow, PLACES: PLACES};
})();
