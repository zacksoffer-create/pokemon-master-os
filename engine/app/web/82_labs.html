<script>
/* ===== The four labs: shared pieces, the Pokémon lab, the build compare screen and PKHeX export ================

   species (reference data, never stored), build (moves, nature, ability, item, IVs, EVs) and individual (one of

   page: the four team roles and the build name from 28_teamroles (held to Python by app/test_roles4_parity.mjs),
   the role engine and the trainer report from 25_scout, fights and scouting lines from 27_battle. A change shows
   before and after; what moved is highlighted. Nothing here writes to canon. */
var LABS = {reads: {}};
function labsReady() {
  if (!S.labsP) S.labsP = Promise.all([scoutReady(), battleReady(), API.data('roles4'), API.data('store'), withBuilds()]).then(function (r) {

  }).catch(function (e) { S.labsP = null; throw e; });

}
function labsSeed() {   // the pack's reads (computed in Python, matched by the parity test) stand in for a live read of the same build
  Object.keys(S.store.individuals || {}).forEach(function (id) { var ind = S.store.individuals[id], r = packRead(id);
    if (r && !r.error) LABS.reads[readKey(indBuild(ind), ind.game)] = r; });
  Object.keys(S.store.builds || {}).forEach(function (id) { var b = S.store.builds[id], r = packRead(id);
    if (r && !r.error) LABS.reads[readKey(buildOf(b), gameOf(b))] = r; });
}
var PROV = {yours: ['yours', 'gold'], canonical: ['canonical', 'violet'], stock: ['stock', ''], ingested: ['ingested', 'ice'], competitive: ['competitive', 'ember']};
var PROV_ORDER = ['yours', 'canonical', 'stock', 'ingested', 'competitive'];
var ALL_GAMES = ['crystal', 'emerald', 'firered', 'platinum', 'heartgold', 'soulsilver'];
function provChip(p) { var k = PROV[p] || [p, '']; return chip(k[0], k[1]); }

function storeBuild(id) { return (S.store.builds || {})[id] || (S.store.builds || {})[(S.store.aliases || {})[id]] || null; }

  if (id || rec.id) b.id = id || rec.id;

}

/* hand overrides (D-059: team roles are computed, and can be set by hand). Approved ones live in trainers/team_roles.json →

function trialOverrides() { return store('role-overrides') || {}; }

  var roles = read.roles.map(function (r) { return r.role in o ? Object.assign({}, r, {earned: !!o[r.role], trial: true,

  var earned = roles.filter(function (r) { return r.earned; }), best = earned.slice().sort(function (a, b) { return b.score - a.score; })[0];
  var tokens = read.name.tokens.map(function (t) { if (t.slot !== 'team_role') return t; var id_ = best ? best.role : 'none', w = (TeamRoles.config().naming.words.team_role || {})[id_];
    return {slot: 'team_role', id: id_, word: w || null, placeholder: best ? roleName(best.role) : 'no team role'}; });
  return Object.assign({}, read, {roles: roles, earned: earned.map(function (r) { return r.role; }),
    name: Object.assign({}, read.name, {tokens: tokens, text: tokens.map(function (t) { return t.word || '⟨' + t.placeholder + '⟩'; }).join(' ')})});
}

  }).join('');
}

/* ---- team composition (the team lab's reads; the Pokémon lab uses them for "how it fits") ---- */
function teamComp(members, game) {   // members: [{build, read}] -> type, move and role reads, the questions and the shape
  var gen = Battle.GAME_GEN[game], cfg = TeamRoles.config();
  var TY = Battle.TYPES.filter(function (t) { try { Battle.effectiveness(gen, t, ['Normal'], null); return t !== '???'; } catch (e) { return false; } });

    return {m: m, sp: sp, ability: gen >= 3 ? (m.build.ability || Battle.abilities(gen, m.build.species)[0] || null) : null, moves: m.read && !m.read.error ? m.read.moves : m.build.moves}; });
  var defense = TY.map(function (t) {
    var row = {type: t, weak: [], resist: [], immune: [], neutral: []};
    info.forEach(function (x) { var e = Battle.effectiveness(gen, t, x.sp.types, x.ability);

    return row; });
  var offense = TY.map(function (t) {

    return {ok: !bad.length, answer: bad.length ? bad.map(function (r) { return r.type; }).join(', ') : 'none', detail: bad.map(function (r) { return r.type + ': ' + r.weak.join(', ') + ' weak, nobody resists'; }).join('; '), types: bad.map(function (r) { return r.type; })};

  if (q.kind === 'coverage_gap') {

/* ---- the Pokémon lab ---- */
var PL = null;

function pokemonLab(id) {

function plInputs() {

function plBind(p) {

    else if ((k = el.getAttribute('data-plev'))) { var ev = Object.assign({}, PL.cur.evs || {}); if (el.value === '') delete ev[k]; else ev[k] = Math.max(0, Math.min(255, +el.value || 0)); if (Object.keys(ev).length) PL.cur.evs = ev; else delete PL.cur.evs; }

function plReset() { PL.cur = buildOf(PL.base); PL.maxIV = !PL.base.ivs; PL.game = PL.rec.game; document.getElementById('plin').innerHTML = plInputs(); plRun(); }

function plOvId() { return PL.rec.kind === 'slot' ? (tlLoad(PL.rec.game)[PL.rec.slot] || {})._from || null : PL.id; }

function plOutput(cur, rb, rc, lb, lc, fb, fc) {

    card('What moved', (moved.length ? '<table class="t"><tr><th></th><th>Before</th><th>Now</th></tr>' + moved.map(function (m) { return '<tr class="moved"><td>' + m[0] + '</td><td>' + m[1] + '</td><td>' + m[2] + '</td></tr>'; }).join('') + '</table>' : '<div class="tiny muted">The name, the earned roles and the primary role are unchanged.</div>') +

/* ---- the build compare screen ---- */
function compare(speciesName) {

    if (!rows.length) return '<div class="notice">No builds of ' + esc(speciesName) + ' on record. <a href="#/pokemon">Back to the lab</a></div>';

      setTimeout(function () { try { var r = liveRead(buildOf(b), gameOf(b)); bt.outerHTML = r.error ? '<span class="tiny muted">' + esc(r.error) + '</span>' : cmpRoles(r); } catch (e) { bt.textContent = 'couldn\'t read: ' + e.message; } }, 20); }; }); });
    var sp = rows[0].species, counts = {}; rows.forEach(function (b) { counts[b.provenance] = (counts[b.provenance] || 0) + 1; });

/* ---- PKHeX export (its own screen) ---- */

route(/^\/pokemon\/?$/, pokemonIndex, 'The Pokémon lab', '#/pokemon');
route(/^\/pokemon\/(.+)$/, pokemonLab, function (i) { return 'Pokémon lab · ' + i; }, '#/pokemon');
