<script>
/* ===== The four labs: shared pieces, the Pokémon lab, the build compare screen and PKHeX export ================
   docs/design/FOUR_LABS.md. Records come in three tiers (app/data/store.json, from engine/store/migrate.py):
   species (reference data, never stored), build (moves, nature, ability, item, IVs, EVs) and individual (one of
   your Pokémon: ball, met, gender, nickname...). Every number on these pages comes from the engines running in the
   page: the six team roles and the build name from 28_teamroles (held to Python by app/test_roles4_parity.mjs),
   the role engine and the trainer report from 25_scout, fights and scouting lines from 27_battle. A change shows
   before and after; what moved is highlighted. Nothing here writes to canon. */
var LABS = {reads: {}};
function labsReady() {
  if (!S.labsP) S.labsP = Promise.all([scoutReady(), battleReady(), API.data('roles4'), recordsReady(), withBuilds(), API.data('recognition'), Explain.ready(), API.data('identity')]).then(function (r) {
    S.r4 = r[2]; TeamRoles.init(r[2], Scout, Battle); Recognize.init(r[5], Scout, Battle); Identity.init(r[7], r[2].config, Battle); labsSeed(); return true;
  }).catch(function (e) { S.labsP = null; throw e; });
  return S.labsP;
}
function labsSeed() {   // the pack's reads (computed in Python, matched by the parity test) stand in for a live read of the same build
  Object.keys(S.store.individuals || {}).forEach(function (id) { var ind = S.store.individuals[id], r = packRead(id);
    if (r && !r.error && indPackFresh(ind)) LABS.reads[readKey(indBuild(ind), ind.game)] = r; });
  Object.keys(S.store.builds || {}).forEach(function (id) { var b = S.store.builds[id], r = packRead(id);
    if (r && !r.error && packFresh(id)) LABS.reads[readKey(buildOf(b), gameOf(b))] = r; });
}
// a pack read is only good for the version it was made from: anything saved since reads live (by content)
function packFresh(id) { var sv = Records.seedV(id), b = storeBuild(id); return sv != null && !!b && (b.v || 1) === sv; }
function indPackFresh(ind) { var seed = Records.seedInd(ind.id); return !!seed && seed.build === ind.build && (!ind.build || packFresh(ind.build)); }
function freshPackRead(id) { var ind = (S.store.individuals || {})[id]; if (ind ? !indPackFresh(ind) : !packFresh(id)) return null; return packRead(id); }
// whose record it is (docs/design/DATA_CONTRACT.md §1.1): mine, a trainer's, or reference; the provenance stays underneath
var PROV = {yours: ['mine', 'gold'], canonical: ['trainer', 'violet'], stock: ['reference · stock', ''], ingested: ['reference · ingested', 'ice'], competitive: ['reference · ladder', 'ember'], variant: ['variant · mine', 'gold']};

var ALL_GAMES = ['crystal', 'emerald', 'firered', 'platinum', 'heartgold', 'soulsilver'];
function provChip(p, rec) { if (rec && rec.parent) p = 'variant'; var k = PROV[p] || [p, '']; return chip(k[0], k[1]); }
function gamesOfGen(gen) { return ALL_GAMES.filter(function (g) { return Battle.GAME_GEN[g] === gen; }); }
function storeBuild(id) { return (S.store.builds || {})[id] || (S.store.builds || {})[(S.store.aliases || {})[id]] || null; }
function buildOf(rec, id) {   // a store record as the engines take it: species, moves, and only the fields it sets

  if (id || rec.id) b.id = id || rec.id;

}
function indBuild(ind) { var sb = ind.build ? storeBuild(ind.build) : null; return buildOf(sb || {species: ind.species, moves: []}, ind.id); }

  var k = readKey(b, game);

/* hand overrides (D-059: team roles are computed, and can be set by hand). Approved ones live in trainers/team_roles.json →

      '<div class="bar ' + (r.earned ? 'forest' : '') + '"><i style="width:' + Math.round(100 * Math.max(0, Math.min(1, r.score))) + '%"></i></div>' +
      '<span class="num">' + r.score.toFixed(2) + '</span><span>' + (r.earned ? chip('earned', 'forest') : '<span class="tiny muted">not earned</span>') + (hand ? ' ' + chip(r.trial ? 'by hand, trial' : 'by hand', 'gold') : '') +
      (trial ? ' <select class="f" data-ov="' + r.role + '" title="Set this role by hand" style="width:auto;display:inline-block;padding:2px 6px;font-size:11px"><option value="">computed</option><option value="yes"' + (trial[r.role] === true ? ' selected' : '') + '>earned</option><option value="no"' + (trial[r.role] === false ? ' selected' : '') + '>not earned</option></select>' : '') + '</span>' +
      (moved ? '<span class="tiny muted">was ' + b.score.toFixed(2) + (b.earned !== r.earned ? (b.earned ? ' and earned' : ' and not earned') : '') + ' ' + delta(b.score, r.score) + '</span>' : '') + '</div>';

}
function workHtml(read) {   // show your work: every rule, number and fight behind the four roles
  return read.roles.map(function (r) {
    var cfg = TeamRoles.config().roles[r.role], n = r.numbers || {}, extra = '';

      r.why.map(function (w) { return '<div class="small">· ' + esc(w) + '</div>'; }).join('') + extra + '</div>';
  }).join('') +
    '<div class="tiny muted">Name: match ' + read.name.match.toFixed(2) + ' (the role engine\'s primary score) puts it in the ' + (read.name.band == null ? 'unnamed band' : read.name.band.toFixed(2) + '+ band') + ': ' + esc(read.name.tokens.map(function (t) { return t.slot; }).join(' + ')) + '.</div>' +
    '<div class="tiny muted">Role engine underneath (trainers/roles.json): ' + esc(read.second_layer.top.map(function (x) { return x.name + ' ' + x.score.toFixed(2); }).join(' · ')) + '</div>' +

/* ---- team composition (the team lab's reads; the Pokémon lab uses them for "how it fits") ---- */
function teamComp(members, game) {   // members: [{build, read}] -> type, move and role reads, the questions and the shape
  var gen = Battle.GAME_GEN[game], cfg = TeamRoles.config();
  var TY = Battle.TYPES.filter(function (t) { try { Battle.effectiveness(gen, t, ['Normal'], null); return t !== '???'; } catch (e) { return false; } });

    return {m: m, sp: sp, ability: gen >= 3 ? (m.build.ability || Battle.abilities(gen, m.build.species)[0] || null) : null, moves: m.read && !m.read.error ? m.read.moves : m.build.moves}; });

    info.forEach(function (x) { var e = Battle.effectiveness(gen, t, x.sp.types, x.ability);
      (e === 0 ? row.immune : e > 1 ? row.weak : e < 1 ? row.resist : row.neutral).push(x.m.build.species); });
    return row; });
  var offense = TY.map(function (t) {

      if (e > best) { best = e; by = []; } if (e === best && e > 1) by.push(x.m.build.species + ' (' + mv + ')'); }); });

    var r; try { r = Scout.moveR(mv, gen); } catch (e) { return; }
    side[r['class']] = (side[r['class']] || 0) + 1;
    r.categories.forEach(function (c) { (cats[c] = cats[c] || []).push(x.m.build.species + ': ' + mv); }); }); });

/* ---- move families (v2.1, trainers/families.json): one job in several forms, read across the team ----

  function cfg() { var x = Explain.data(); return x && x.families || null; }
  function member(name, moves, ability, types) {   // what one Pokémon does in each family
    var C = cfg(), out = {name: name, sets: [], thrive: [], suffer: [], noChip: {}}; if (!C) return out;
    C.order.forEach(function (fid) { var F = C[fid];
      Object.keys(F.forms).forEach(function (k) { var f = F.forms[k];
        (f.moves || []).forEach(function (m) { if (moves.indexOf(m) >= 0) out.sets.push({fam: fid, form: k, how: 'move', what: m}); });
        (f.abilities || []).forEach(function (a) { if (a === ability) out.sets.push({fam: fid, form: k, how: 'ability', what: a}); });
        if (fid !== 'weather') return;
        ['thrive', 'suffer'].forEach(function (side) { var t = f[side] || {};
          Object.keys(t.abilities || {}).forEach(function (a) { if (a === ability) out[side].push({form: k, what: a, why: t.abilities[a]}); });
          Object.keys(t.moves || {}).forEach(function (m) { if (moves.indexOf(m) >= 0) out[side].push({form: k, what: m, why: t.moves[m]}); });
          Object.keys(t.types || {}).forEach(function (ty) { if (types.indexOf(ty) >= 0) out[side].push({form: k, what: ty + ' type', why: t.types[ty], type: true}); });

        r.suffer.forEach(function (t) { W.suffer.push({who: r.name, form: t.form, what: t.what, why: t.why, type: !!t.type}); });
      });
      ['sand', 'hail'].forEach(function (k) { if (!W.forms[k]) return;   // the chip this team sets: who takes none of it, who pays it too

    return keys.map(function (k) { var x = by[k]; return x.who + '\'s ' + x.what + ' (' + x.why + ' in ' + join(x.forms) + ')'; });

    one.sets.forEach(function (s) { var F = T[s.fam]; if (F && F.n && !F.forms[s.form]) out.push('adds ' + cfg()[s.fam].forms[s.form].label.toLowerCase() + ' to the ' + F.label.toLowerCase()); });
    return out;

})();
function famList(info) {   // teamComp's members as the families read them: your own moves (the engine's set only for an empty build)
  return info.map(function (x) { var own = (x.m.build.moves || []).filter(Boolean); return {name: x.m.build.species, moves: own.length ? own : x.moves, ability: x.ability, types: x.sp.types}; });
}
function teamCounts(roles, info, cats, fam) {   // v2: what the shapes count, roles (by who earns them) and features (by moves and abilities)
  var n = {}; TeamRoles.ORDER.forEach(function (r) { n[r] = roles[r].length; });
  n.sweeper_or_ace = uniqS(roles.sweeper.concat(roles.ace)).length; n.wall_or_tank = uniqS(roles.wall.concat(roles.tank)).length;
  var who = function (c) { return uniqS((cats[c] || []).map(function (h) { return h.split(':')[0]; })); };
  n.slow = info.filter(function (x) { return x.sp.bs.spe <= 60; }).length;
  n['feature:trick_room'] = who('trick_room').length;
  var W = (fam || {}).weather || {setters: [], users: []};   // v2.1: any form counts, the four weathers being one job (trainers/families.json)
  n['feature:weather_setter'] = uniqS(who('weather').concat(W.setters)).length;
  n['feature:weather_user'] = (W.users || []).length;
  n['feature:baton_pass'] = who('baton_pass').length;
  n['feature:setup'] = uniqS(['setup_physical', 'setup_special', 'setup_speed', 'setup_defense'].reduce(function (a, c) { return a.concat(who(c)); }, [])).length;
  return n;
}
function teamQuestion(q, comp, members, info, gen) {
