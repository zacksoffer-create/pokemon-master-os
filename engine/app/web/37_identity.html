<script>
// Battle identity v0 in the browser: trainers/identity.py line for line (app/test_identity_parity.mjs holds the two together).
// What a build does and what to call it, from the League fights its team-role read already has (TeamRoles.read → lens).
// Every rule and word is in the pack's identity config (trainers/identity.json); this only evaluates them.
var Identity = (function () {
  var C = null, RC = null, B = null, Bt = null, HEADS = {}, HEAD_ORDER = [], MODS = {}, MOD_ORDER = [], SWITCH = [];
  function lookup(roles, path) { var p = path.split('.'); return roles[p[0]][p[1]]; }
  function init(cfg, rolesCfg, battle) {
    C = cfg; RC = rolesCfg; Bt = battle; B = {};
    Object.keys(C.bars).forEach(function (k) { if (k.charAt(0) !== '_') B[k] = lookup(RC.roles, C.bars[k]); });
    SWITCH = lookup(RC.roles, C.switch_abilities);
    HEADS = {}; HEAD_ORDER = []; C.heads.forEach(function (h) { HEADS[h.id] = h; HEAD_ORDER.push(h.id); });
    MODS = {}; MOD_ORDER = []; C.modifiers.forEach(function (m) { MODS[m.id] = m; MOD_ORDER.push(m.id); });
    return api;
  }
  function r4(x) { return Bt.pyRound(x, 4); }
  function pct(n, of) { return of ? Bt.pyRound(100 * n / of) : 0; }
  function share(n, of) { return of ? n / of : 0.0; }
  function has(list, x) { return list.indexOf(x) >= 0; }
  function inter(a, b) { return a.some(function (x) { return b.indexOf(x) >= 0; }); }
  function cat(gen, mv) { return Bt.move(gen, mv).cat; }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : s; }
  function cmpArr(a, b) { for (var i = 0; i < Math.min(a.length, b.length); i++) { if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; } return a.length - b.length; }
  function cmpKey(a, b) {   // tuples as Python compares them
    for (var i = 0; i < a.length; i++) {
      var x = a[i], y = b[i];
      if (Array.isArray(x)) { var c = cmpArr(x, y); if (c) return c; continue; }
      if (x < y) return -1; if (x > y) return 1;
    }
    return 0;
  }

  // --- the set's commitments: its four moves, its item and its spread ---
  function tagsOfMove(m, gen) {
    var K = C.categories, cats = m.categories, hasK = function (k) { return inter(cats, K[k]); }, out = [];
    var damaging = m['class'] === 'physical' || m['class'] === 'special';
    if (damaging && !hasK('dedicated')) out.push('attack');
    if (damaging && (m.priority || 0) > 0 && !has(cats, 'fake_out')) out.push('priority');
    ['setup', 'recovery', 'support', 'status', 'pivot', 'hazard', 'screens', 'weather', 'room', 'cleric', 'self_ko', 'trap'].forEach(function (k) { if (hasK(k)) out.push(k); });
    if (has(C.self_side_removal[String(gen)] || [], m.name)) out.push('removal');
    if (has(cats, 'substitute')) out.push('substitute');
    return out;
  }
  function spreadOf(ctx, gen) {
    if (gen < 3 || !ctx.evs_recorded) return null;
    var S = C.spread, f = ctx.filled, evs = f.evs, ivs = f.ivs, nd = C.natures[f.nature || ''] || [null, null], up = nd[0], down = nd[1], out = [];
    ['offense', 'defense', 'speed'].forEach(function (lean) {
      var rule = S[lean], tot = 0;
      rule.evs.forEach(function (s) { tot += evs[s] || 0; });
      if (tot >= S.full || has(rule.nature_up, up)) out.push(lean);
    });
    var spe = ivs.spe == null ? 31 : ivs.spe;
    if (has(S.slow.nature_down, down) || (spe <= S.slow.spe_iv_at_most && !evs.spe)) out.push('slow');
    return out;
  }
  function resources(ctx, gen) {
    var I = C.items, out = [];
    ctx.moves.forEach(function (m) { out.push({id: 'move:' + m.name, kind: 'move', label: m.name, tags: tagsOfMove(m, gen)}); });
    var item = ctx.item;
    if (item) out.push({id: 'item', kind: 'item', label: item,
      tags: ['offense', 'choice', 'speed', 'sustain', 'setup', 'field', 'weather', 'slow'].filter(function (k) { return has(I[k], item); })});
    var lean = spreadOf(ctx, gen);
    if (lean !== null) out.push({id: 'spread', kind: 'spread', label: 'its spread', tags: lean});
    return out;
  }
  function selects(sel, res) { var p = sel.split(':'), want = {moves: 'move', items: 'item', spread: 'spread'}[p[0]]; return res.kind === want && has(res.tags, p[1]); }

  // --- measures, from the League lens rows ---
  function stageMult(stage) { var st = Math.max(0, Math.min(Math.trunc(stage || 0), 2)); return (2 + st) / 2; }
  function reach(lens, gen, mult) {
    var ko2 = 0, ko1 = 0;
    lens.forEach(function (foe) {
      var best = 0.0;
      Object.keys(foe.d).sort().forEach(function (mv) {
        var lo = foe.d[mv][0], k = mult(mv), c = cat(gen, mv);
        if (k === null || (c !== 'Physical' && c !== 'Special')) return;
        best = Math.max(best, lo * k);
      });
      if (best >= 50) ko2++;
      if (best >= 100) ko1++;
    });
    return {ko2: ko2, ko1: ko1};
  }
  function first(lens, mult) { return lens.filter(function (foe) { return Math.trunc(foe.s[0] * mult) > foe.s[1]; }).length; }
  function measures(read, ctx, gen, res) {
    var lens = read.lens, N = lens.length, byName = {}, tags = {}, boosts = read.facts.boosts, roles = {};
    ctx.moves.forEach(function (m) { byName[m.name] = m; });
    res.forEach(function (r) { if (r.kind === 'move') tags[r.label] = r.tags; });
    var tg = function (mv) { return tags[mv] || []; };
    var side = function (mv) { return {Physical: 'atk', Special: 'spa'}[cat(gen, mv)]; };
    var bst = function (mv) { return boosts[side(mv) || ''] || 0; };
    var reusable = function (mv) { return has(tg(mv), 'self_ko') ? null : 1.0; };
    var boosted = function (mv) { return has(tg(mv), 'self_ko') ? null : stageMult(bst(mv)); };
    var prio = function (mv) { return has(tg(mv), 'priority') ? 1.0 : null; };
    var prioB = function (mv) { return has(tg(mv), 'priority') ? stageMult(bst(mv)) : null; };
    var selfko = function (mv) { return has(tg(mv), 'self_ko') ? 1.0 : null; };
    read.roles.forEach(function (r) { roles[r.role] = r; });
    var M = {N: N, first: first(lens, 1.0), first_boosted: first(lens, stageMult(boosts.spe || 0)),
      room_first: lens.filter(function (foe) { return foe.s[0] < foe.s[1]; }).length,
      plain: reach(lens, gen, reusable), boosted: reach(lens, gen, boosted),
      priority: reach(lens, gen, prio), priority_boosted: reach(lens, gen, prioB),
      self_ko: reach(lens, gen, selfko),
      take3: roles.tank.numbers.take_share, take2: roles.support.numbers.survive,
      wall: {physical: roles.wall.numbers.physical, special: roles.wall.numbers.special},
      sustain: roles.wall.numbers.sustain,
      sub_safe: lens.filter(function (foe) { return Object.keys(foe.i).every(function (k) { return foe.i[k][1] < 100 * C.pinch.substitute_cost; }); }).length,
      setup_moves: ctx.moves.filter(function (m) { return has(tg(m.name), 'setup'); }).map(function (m) { return m.name; }),
      priority_moves: ctx.moves.filter(function (m) { return has(tg(m.name), 'priority'); }).map(function (m) { return m.name; })};
    var ev = read.evidence;
    var phys = ev.physical ? (ev.physical['2hko'] == null ? -1 : ev.physical['2hko']) : -1;
    var spec = ev.special ? (ev.special['2hko'] == null ? -1 : ev.special['2hko']) : -1;
    M.side = phys > spec ? 'physical' : (spec > phys ? 'special' : null);
    // own weather and what it does for the set
    var W = C.weather, own = null;
    for (var i = 0; i < ctx.moves.length; i++) { if (W.moves[ctx.moves[i].name]) { own = W.moves[ctx.moves[i].name]; break; } }
    if (own === null && W.abilities[ctx.ability]) own = W.abilities[ctx.ability];
    M.weather = null;
    if (own) {
      var fast = W.speed_abilities[ctx.ability] === own, btype = W.boost_type[own] || null;
      var boostedTypes = ctx.moves.filter(function (m) { return btype && m.type === btype && (m['class'] === 'physical' || m['class'] === 'special'); }).map(function (m) { return m.name; });
      var typeOf = function (mv) { return (byName[mv] || {}).type; };
      var wmult = function (mv) { return has(tg(mv), 'self_ko') ? null : (btype && typeOf(mv) === btype ? 1.5 :
        (own === 'rain' && typeOf(mv) === 'Fire' ? 0.5 : (own === 'sun' && typeOf(mv) === 'Water' ? 0.5 : 1.0))); };
      var wmultB = function (mv) { return wmult(mv) === null ? null : wmult(mv) * stageMult(bst(mv)); };
      var byMove = ctx.moves.some(function (m) { return !!W.moves[m.name]; }), rock = W.rocks[own];
      M.weather = {kind: own, name: W.names[own], speed_ability: fast, boosted_moves: boostedTypes,
        by: byMove ? 'move' : 'ability',
        turns: byMove ? (ctx.item === rock ? W.rock_turns : W.turns) : null,
        rock: ctx.item === rock ? rock : null,
        benefits: !!(fast || boostedTypes.length),
        first: first(lens, fast ? 2.0 : 1.0),
        first_boosted: first(lens, (fast ? 2.0 : 1.0) * stageMult(boosts.spe || 0)),
        plain: reach(lens, gen, wmult), boosted: reach(lens, gen, wmultB)};
    }
    // a low-HP window: a pinch ability with moves of its type, reached by Substitute and a pinch berry
    var P = C.pinch;
    M.window = null;
    var ptype = P.abilities[ctx.ability] || null, berry = C.items.pinch_berries[ctx.item || ''] || null;
    var subs = ctx.moves.some(function (m) { return has(tg(m.name), 'substitute'); });
    if (ptype && ctx.moves.some(function (m) { return m.type === ptype && (m['class'] === 'physical' || m['class'] === 'special'); }) && (berry || subs)) {
      var st = Object.assign({}, boosts);
      if (berry) st[berry] = (st[berry] || 0) + 1;
      var wm = function (mv) { return has(tg(mv), 'self_ko') ? null : ((byName[mv] || {}).type === ptype ? 1.5 : 1.0) * stageMult(st[side(mv) || ''] || 0); };
      M.window = {ability: ctx.ability, type: ptype, berry: berry ? ctx.item : null, berry_stat: berry,
        substitute: subs, first: first(lens, stageMult(st.spe || 0)), reach: reach(lens, gen, wm), sub_safe: M.sub_safe};
    }
    // Eruption and Water Spout: power falls with HP; Stealth Rock takes its share on entry
    var sr = C.stealth_rock;
    var srShare = ctx.ability === 'Magic Guard' ? 0.0 : sr.share * Bt.effectiveness(gen, sr.type, ctx.types.slice());
    M.stealth_rock = r4(srShare);
    var hpMoves = ctx.moves.filter(function (m) { return has(C.hp_power.moves, m.name); }).map(function (m) { return m.name; });
    M.hp_power = null;
    if (hpMoves.length) {
      var left = 1 - srShare, power = Math.max(1, Math.floor(150 * left)) / 150;
      var hm = function (mv) { return has(tg(mv), 'self_ko') ? null : (has(hpMoves, mv) ? power : 1.0); };
      M.hp_power = {moves: hpMoves, after_rocks: r4(left), reach: reach(lens, gen, hm)};
    }
    // Taunt, Encore and the like matter against League Pokémon with non-damaging moves
    M.status_users = lens.filter(function (foe) { return foe.m.some(function (mv) { return cat(gen, mv) === 'Status'; }); }).length;
    return M;
  }

  // --- the fourteen functions ---
  function functions(read, ctx, gen, res, M) {
    var N = M.N, mtags = [], lean = [], roles = {}, F = {};
    res.forEach(function (r) { if (r.kind === 'move') mtags = mtags.concat(r.tags); });
    for (var i = 0; i < res.length; i++) { if (res[i].kind === 'spread') { lean = res[i].tags || []; break; } }
    var hasT = function (t) { return has(mtags, t); };
    read.roles.forEach(function (r) { roles[r.role] = r; });
    var sh = function (n) { return share(n, N); };
    var put = function (fid, plausible, supported, why, numbers, extra) {
      var rec = {id: fid, name: C.functions.names[fid], plausible: !!plausible, supported: supported, observed: null, why: why, numbers: numbers || {}};
      if (supported === null && plausible) rec.pending = C.functions.pending[fid] == null ? null : C.functions.pending[fid];
      if (extra) Object.assign(rec, extra);
      F[fid] = rec;
    };
    var b = M.boosted, pb = M.priority_boosted, paths = [];
    if (sh(M.first_boosted) >= B.sweep_first && sh(b.ko2) >= B.sweep_ko2 && sh(b.ko1) >= B.sweep_ko1) paths.push('speed');
    if (M.take3 >= B.bulk_take3 && sh(b.ko2) >= B.sweep_ko2 && sh(b.ko1) >= B.sweep_ko1) paths.push('bulk');
    if (sh(pb.ko2) >= B.sweep_ko2 && sh(b.ko2) >= B.sweep_ko2) paths.push('priority');
    var setupOk = hasT('setup') && hasT('attack');
    put('setup_sweeper', setupOk, setupOk ? paths.length > 0 : false,
      ['after one use of ' + (M.setup_moves.join(', ') || 'a setup move') + ': moves first against ' + M.first_boosted + ' of ' + N + ' League Pokémon ' +
       '(bar ' + pct(B.sweep_first, 1) + '%), 2HKOs ' + b.ko2 + ' and OHKOs ' + b.ko1 + ' with attacks it can repeat ' +
       '(bars ' + pct(B.sweep_ko2, 1) + '% and ' + pct(B.sweep_ko1, 1) + '%)',
       'or it lasts instead: takes three hits from ' + pct(M.take3, 1) + '% of the 100 hardest League attacks (bar ' + pct(B.bulk_take3, 1) + '%)',
       'or its priority does it: ' + (M.priority_moves.join(', ') || 'no priority attack') + ' 2HKOs ' + pb.ko2 + ' of ' + N + ' after the setup'],
      {first_boosted: M.first_boosted, ko2_boosted: b.ko2, ko1_boosted: b.ko1, take3: M.take3, priority_ko2_boosted: pb.ko2, of: N, paths: paths});
    var p = M.plain;
    var sw = sh(M.first) >= B.sweep_first && sh(p.ko2) >= B.sweep_ko2 && sh(p.ko1) >= B.sweep_ko1;
    put('sweeper', hasT('attack'), hasT('attack') ? sw : false,
      ['moves first against ' + M.first + ' of ' + N + ' (bar ' + pct(B.sweep_first, 1) + '%), 2HKOs ' + p.ko2 + ' and OHKOs ' + p.ko1 + ' ' +
       'with attacks it can repeat, no setup (bars ' + pct(B.sweep_ko2, 1) + '% and ' + pct(B.sweep_ko1, 1) + '%)'],
      {first: M.first, ko2: p.ko2, ko1: p.ko1, of: N});
    put('wallbreaker', hasT('attack') && has(lean, 'offense'), null,
      ['its attacks 2HKO ' + p.ko2 + ' of ' + N + ' League Pokémon, but the League isn\'t a pool of walls'], {ko2: p.ko2, of: N});
    put('cleaner', hasT('attack') && (hasT('priority') || sh(M.first) >= B.sweep_first), null,
      ['moves first against ' + M.first + ' of ' + N + '; priority: ' + (M.priority_moves.join(', ') || 'none')], {first: M.first, of: N});
    put('revenge_killer', hasT('attack') && (hasT('priority') || has(C.items.speed, ctx.item) || sh(M.first) >= B.sweep_first), null,
      ['moves first against ' + M.first + ' of ' + N + '; priority: ' + (M.priority_moves.join(', ') || 'none')], {first: M.first, of: N});
    var t = roles.tank;
    put('tank', hasT('attack'), hasT('attack') ? !!t.earned : false, t.why.slice(), {take3: M.take3, ko2: t.numbers.ko2});
    var w = roles.wall;
    var sides = M.sustain.length ? ['physical', 'special'].filter(function (s) { return M.wall[s] >= B.wall_take4; }) : [];
    put('wall', !!M.sustain.length || has(lean, 'defense'), !!w.earned, w.why.slice(),
      {physical: M.wall.physical, special: M.wall.special, sustain: M.sustain}, {sides: w.earned ? sides : []});
    var pv = roles.pivot;
    var byMove = hasT('pivot') && (M.take2 >= B.lasts_take2 || sh(M.first) >= B.pivot_first);
    put('pivot', hasT('pivot') || has(SWITCH, ctx.ability), !!pv.earned, pv.why.slice(),
      {take2: M.take2, first: M.first, of: N}, {path: byMove ? 'move' : (pv.earned ? 'ability' : null)});
    var s = roles.support;
    put('support', hasT('support'), !!s.earned, s.why.slice(), {moves: s.numbers.support_moves});
    put('disruptor', ctx.moves.some(function (m) { return inter(m.categories, C.categories.disrupt); }), null,
      [M.status_users + ' of ' + N + ' League Pokémon carry a non-damaging move (what Taunt stops)'], {status_users: M.status_users, of: N});
    var lasts = M.take2 >= B.lasts_take2 || sh(M.first) >= B.lasts_first, methods = [];
    if (hasT('hazard')) methods.push('hazard');
    if (hasT('removal')) methods.push('removal');
    if (hasT('screens')) methods.push('screens');
    if (M.weather && (M.weather.by === 'move' || M.weather.rock)) methods.push('weather');   // invested: its move or its rock
    if (hasT('room')) methods.push('room');
    var defog = gen === 4 && ctx.moves.some(function (m) { return m.name === 'Defog'; });
    var why = ['field moves: ' + (methods.join(', ') || 'none'),
      'it lasts to use them: takes two hits from ' + pct(M.take2, 1) + '% of the 100 hardest League attacks (bar ' + pct(B.lasts_take2, 1) + '%) ' +
      'or moves first against ' + M.first + ' of ' + N + ' (bar ' + pct(B.lasts_first, 1) + '%)'];
    if (defog) why.push('Defog in Gen IV clears the target\'s side only, so it isn\'t hazard removal for this team');
    if (M.weather && M.weather.by === 'ability' && !has(methods, 'weather'))
      why.push(ctx.ability + ' sets ' + M.weather.name.toLowerCase() + ' as it comes in (until another weather replaces it): a fact about it, not a move it spends');
    put('field_controller', methods.length > 0, methods.length > 0 && lasts, why, {take2: M.take2, first: M.first, of: N},
      {methods: lasts ? methods : [], candidate_methods: methods});
    put('trapper', hasT('trap') || has(C.trap_abilities, ctx.ability), null,
      ['Pursuit, binding and trapping moves need an opponent that switches; the League lens has none']);
    put('stallbreaker', ctx.moves.some(function (m) { return has(m.categories, 'taunt') || has(m.categories, 'trick'); }), null, []);
    put('setup_enabler', hasT('screens') || hasT('status') || hasT('pivot') || hasT('hazard'), null, []);
    put('attacker', hasT('attack'), hasT('attack') ? sh(p.ko2) >= B.attack_ko2 : false,
      ['its attacks 2HKO ' + p.ko2 + ' of ' + N + ' League Pokémon from full, no boosts (bar ' + pct(B.attack_ko2, 1) + '%, the Tank\'s)'],
      {ko2: p.ko2, ko1: p.ko1, of: N});
    return F;
  }

  // --- the name ---
  function headTest(hid, F, M) {
    var h = HEADS[hid], f = F[h['function']];
    if (!f.plausible) return ['absent', null];
    if (hid === 'pivot') {
      if (f.supported && f.path === 'move') return [true, null];
      return [f.supported !== null ? false : null, 'a pivoting move that it lasts to use (two hits from most hard attacks, or moving first)'];
    }
    if (h.method || hid === 'field_controller') {
      var cand = F.field_controller.candidate_methods, got = F.field_controller.methods;
      if (hid === 'field_controller') {
        if (cand.length < h.needs_methods) return ['absent', null];
        return [got.length >= h.needs_methods, 'it has to last to use its field moves'];
      }
      if (!has(cand, h.method)) return ['absent', null];
      return [has(got, h.method), 'it has to last to use its field move'];
    }
    if (hid === 'cleric' && !has(M._tags, 'cleric')) return ['absent', null];
    return [f.supported, f.pending || f.why.join('; ')];
  }
  function nearness(kind, eid, hid, F, M, sustain) {
    var N = M.N;
    var q = function (v, bar) { return bar ? Math.min(1.0, share(v, N) / bar) : 1.0; };
    var r = function (v, bar) { return bar ? Math.min(1.0, v / bar) : 1.0; };
    var lasts = Math.max(r(M.take2, B.lasts_take2), q(M.first, B.lasts_first));
    if (kind === 'head') {
      var f = F[HEADS[eid]['function']];
      if (f.supported === null) return null;
      if (eid === 'setup_sweeper') {
        var b = M.boosted, pb = M.priority_boosted;
        return Math.max(Math.min(q(M.first_boosted, B.sweep_first), q(b.ko2, B.sweep_ko2), q(b.ko1, B.sweep_ko1)),
          Math.min(r(M.take3, B.bulk_take3), q(b.ko2, B.sweep_ko2), q(b.ko1, B.sweep_ko1)),
          Math.min(q(pb.ko2, B.sweep_ko2), q(b.ko2, B.sweep_ko2)));
      }
      if (eid === 'sweeper') return Math.min(q(M.first, B.sweep_first), q(M.plain.ko2, B.sweep_ko2), q(M.plain.ko1, B.sweep_ko1));
      if (eid === 'attacker') return q(M.plain.ko2, B.attack_ko2);
      if (eid === 'tank') return Math.min(r(M.take3, B.bulk_take3), q(M.plain.ko2, B.attack_ko2));
      if (eid === 'wall') { var best = Math.max(r(M.wall.physical, B.wall_take4), r(M.wall.special, B.wall_take4)); return sustain.length ? best : 0.0; }
      if (eid === 'support' || eid === 'cleric') return Math.min(1.0, (F.support.numbers.moves || []).length / RC.roles.support.moves_at_least) * lasts;
      if (eid === 'pivot') return has(M._tags, 'pivot') ? Math.max(r(M.take2, B.lasts_take2), q(M.first, B.pivot_first)) : 0.0;
      return lasts;
    }
    if (eid === 'window' || eid === 'trapping') return null;
    if (eid === 'rain' || eid === 'sun') {
      var w = M.weather;
      if (hid === 'setup_sweeper') return Math.min(q(w.first_boosted, B.sweep_first), q(w.boosted.ko2, B.sweep_ko2), q(w.boosted.ko1, B.sweep_ko1));
      if (hid === 'sweeper') return Math.min(q(w.first, B.sweep_first), q(w.plain.ko2, B.sweep_ko2), q(w.plain.ko1, B.sweep_ko1));
      return q(w.plain.ko2, B.attack_ko2);
    }
    if (eid === 'room') return Math.min(lasts, q(M.room_first, B.sweep_first));
    if (eid === 'fast') return q(M.first, B.sweep_first);
    if (eid === 'offensive') return q(M.plain.ko2, B.attack_ko2);
    if (eid === 'bulky') return r(M.take3, B.bulk_take3);
    if (eid === 'specially_defensive' || eid === 'physically_defensive') { var v = r(M.wall[MODS[eid].side], B.wall_take4); return sustain.length ? v : 0.99 * v; }
