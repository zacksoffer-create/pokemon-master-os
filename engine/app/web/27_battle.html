<script>
/* ===== The battle engine, in the browser =======================================================================
   A line-for-line port of engine/battle (engine.py, moves.py, knowledge.py, evaluate.py, trainer_policy.py,
   grid.py, scouting.py, playsheet.py, profile.py, phrases.py and scouting_report.py), reading the battle pack
   (app/battle_pack.py → battle.json) and running Smogon's damage calculator in the page (calc.json, the same
   @smogon/calc the node bridge runs). The parity test rebuilds the whole Journey Scouting File here and in Python
   and requires the same file, number for number and sentence for sentence. Python's rounding (half to even), its
   exact means, its random team draws (MT19937) and its sort orders are kept, and so is the damage table's
   fetch-and-replay, so a fight that needed several rounds settles the same way.
   Battle.init(pack, calc) once; Battle.engine() → a scouting engine (it keeps its damage table between calls);
   eng.chapter(lineup, coach, progress) → one lineup's packet; eng.league(teams) → the what-if league. */
var Battle = (function () {
  var P = null, C = null;
  var STATS = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'];

  var DEFENSIVE_ABILITIES = {'Levitate': [3, {Ground: 0}], 'Volt Absorb': [3, {Electric: 0}], 'Water Absorb': [3, {Water: 0}],

  /* ---- Python's semantics ---- */
  function has(o, k) { return o != null && Object.prototype.hasOwnProperty.call(o, k); }

  /* ---- rules.py ---- */
  function toId(s) { return String(s).toLowerCase().replace(/[^a-z0-9]/g, ''); }

  /* ---- battle/moves.py: the move book ---- */

    return {name: name, gen: gen, type: e[0], category: e[1], power: e[2], accuracy: e[3], priority: e[4], pp: e[5], target: e[6],
      meta_category: e[7], effect: P.text[e[8]], el: P.text[e[8]].toLowerCase(), ailment: e[9], ailment_chance: e[10],
      self_changes: e[11], foe_changes: e[12], stat_chance: e[13], drain: e[14], healing: e[15], hits: e[16], turns: e[17],
      flinch: e[18], crit: e[19], flags: flags, plays: e[21].map(function (p) { var o = {play: p[0], primary: p[1], chance: p[2]}; if (p[3] != null) o.detail = p[3]; return o; }),
      damaging: e[1] !== 'Status'};
  }
  function mbGet(gen, name) {
    var canonName = move(gen, name).name, key = gen + '|' + canonName;
    if (!BOOK[key]) { var e = P.movebook[gen][canonName]; if (!e) throw new Error(canonName + ': not in the move book'); BOOK[key] = inflateMove(gen, canonName, e); }
    return BOOK[key];
  }

  /* ---- battle/engine.py ---- */
  var ROLES = {
    setup: ['Swords Dance', 'Dragon Dance', 'Calm Mind', 'Nasty Plot', 'Bulk Up', 'Curse', 'Agility', 'Belly Drum', 'Growth', 'Rock Polish', 'Iron Defense', 'Amnesia'],
    recovery: ['Recover', 'Roost', 'Slack Off', 'Soft-Boiled', 'Milk Drink', 'Rest', 'Synthesis', 'Morning Sun', 'Moonlight', 'Wish', 'Aqua Ring', 'Ingrain', 'Leech Seed', 'Heal Order'],
    status_care: ['Heal Bell', 'Aromatherapy', 'Refresh'], pivot: ['U-turn', 'Baton Pass'],
    hazards: ['Spikes', 'Stealth Rock', 'Toxic Spikes'], hazard_control: ['Rapid Spin', 'Defog'],
    phazing: ['Roar', 'Whirlwind', 'Haze'],
    status: ['Toxic', 'Thunder Wave', 'Will-O-Wisp', 'Hypnosis', 'Sleep Powder', 'Spore', 'Stun Spore', 'Glare', 'Yawn', 'Lovely Kiss', 'Sing', 'Dark Void', 'Confuse Ray'],
    disruption: ['Taunt', 'Encore', 'Disable', 'Trick', 'Switcheroo', 'Knock Off', 'Perish Song', 'Destiny Bond', 'Counter', 'Mirror Coat', 'Sucker Punch'],
    screens: ['Reflect', 'Light Screen', 'Safeguard'], weather: ['Sunny Day', 'Rain Dance', 'Sandstorm', 'Hail'],
    speed_control: ['Thunder Wave', 'Trick Room', 'Tailwind', 'Icy Wind']};
  var STAT_FOR = {Physical: 'atk', Special: 'spa'};
  var LEARN = {};
  function learnable(speciesName, game) {
    var gen = GAME_GEN[game], id = toId(speciesName), key = gen + '|' + id;
    if (!LEARN[key]) {
      var g = P.gens[gen], b64 = g.learn[id];
      if (b64 == null) throw new Error(speciesName + ': no learnable pool in the pack');
      var bin = typeof atob === 'function' ? atob(b64) : Buffer.from(b64, 'base64').toString('binary'), out = [];

  function Member(speciesName, o) { o = o || {}; return {species: speciesName, moves: o.moves || [], ability: o.ability || null, item: o.item || null, nature: o.nature || null, evs: o.evs || {}, ivs: o.ivs || {}, level: o.level || 50}; }

  function movesOf(m, game, potential) { return potential || !m.moves.length ? learnable(m.species, game) : m.moves; }
  function abilityOf(m, gen) { var o = abilities(gen, m.species); return m.ability || (o.length ? o[0] : null); }

  /* ---- the damage calculator (battle/calc_bridge.mjs, in the page) ---- */
  function calcRun(req) {

  var TURN_CAP = 100, PP_UPS = 1.6, SLEEP_TURNS = {2: 3, 3: 2, 4: 2}, REST_TURNS = 2, ENCORE_TURNS = {2: 2, 3: 2, 4: 4},

  var WEATHER_ROCKS = {'Damp Rock': 'Rain', 'Heat Rock': 'Sun', 'Smooth Rock': 'Sand', 'Icy Rock': 'Hail'};

    return [Team(game, built.map(function (x) { return x[0]; })), built];
  };
  G.situations = function (sh, m, coach) {
    var ev = this.ev;
    return sh.calls.map(function (row, i) {
      var names = m.our_names;
      var send = row.call ? row.call.member : maxBy(names, function (n) { return outcomeValue(m.evaluated[i + ',' + names.indexOf(n)].outcome); });
      var mt = m.evaluated[i + ',' + names.indexOf(send)];
      return {theirs: row.species, send: send, result: mt.outcome.winner, plan: planLabel(mt.plan), answer: planLabel(mt.answer), turns: mt.outcome.turns,
        odds: mt.outcome.odds.map(function (x) { return pyRound(x, 2); }), credits: mt.credits, ours: sheetFor(ev, mt, coach), their: theirSheet(ev, mt, null),
        notes: mt.outcome.notes.slice().sort(), _matchup: mt};
    });
  };
  /* the coach profile, one member against the field at a time (the same fights versus() plays all at once) */
  G.profileGen = function* (team, coach) {
    var ev = this.ev, gen = team.gen, ours = this.grid.ours(team), field = usageField(gen), res = {}, i;
    for (i = 0; i < ours.length; i++) { Object.assign(res, ev.versus([ours[i]], field)); yield 'the profile: ' + ours[i].name + ' against the field'; }
    var p = profileTeam(res, ours, field, P.baseline[gen], gen), members = {};
    for (i = 0; i < p.order.length; i++) {
      var name = p.order[i], m = p.members[name], sl = {}, dc = {};
      SLIDERS.forEach(function (k) { sl[k] = pyRound(m.sliders[k], 1); });
      Object.keys(m.sliders.decisive).forEach(function (k) { dc[k] = pyRound(m.sliders.decisive[k], 1); });
      members[name] = {sliders: sl, decisive: dc, percentiles: m.percentiles, record: m.record, assumed: m.combatant.assumed, play_sheet: memberSheet(ev, m.matchups, coach), _matchups: m.matchups};
      yield 'the profile: ' + name + '\'s play sheet';
    }
    return {gen: gen, field_n: field.length, sliders: p.sliders, percentiles: p.percentiles, philosophy: p.philosophy, record: p.record, members: members, coach: coach};
  };
  /* one lineup's packet (chapter_data), as steps: each yield is a label for the progress line */
  G.chapterGen = function* (lineup, coach, opts) {
    opts = opts || {};
    var self = this, game = lineup.game, team = this.team(lineup)[0], book = this.book, opps = this.opponents(game), sheets = [], i;
    coach = coach || {};
    for (i = 0; i < opps.length; i++) {
      var cs = callSheet(this.grid, team, opps[i], book), sh = cs[0];
      sh.situations = this.situations(sh, cs[1], coach);
      sh._matchups = cs[1];
      sheets.push(sh);
      yield 'call sheet vs ' + opps[i].name;
    }
    var record = {};
    team.members.forEach(function (m) { record[species(team.gen, m.species).name] = [0, 0]; });
    sheets.forEach(function (sh) { sh.anchors.forEach(function (a) { record[a[0]][0] += a[1]; record[a[0]][1] += sh.calls.length - a[1]; }); });
    var cards = lineup.members.map(function (sb) { return report(sb[0], game, sb[1], record[species(team.gen, sb[0]).name].slice(), book); });
    var out = {id: lineup.id, chapter: lineup.chapter, game: game, title: lineup.title, thesis: lineup.thesis, status: lineup.status, decision: lineup.decision,
      variation: lineup.variation, cards: cards, sheets: sheets, self_scout: selfScout(team, cards, [], book), profile: null};
    yield 'member reports and the self-scout';
    if (opts.profile !== false) out.profile = yield* this.profileGen(team, coach);
    out.members = team.members;
    return out;
  };
  G.chapter = function (lineup, coach, opts) {
    var it = this.chapterGen(lineup, coach, opts), r;
    while (!(r = it.next()).done) if (opts && opts.progress) opts.progress(r.value);
    return r.value;
  };
  /* the same, a step at a time so the page can breathe: resolves with the packet */
  G.chapterAsync = function (lineup, coach, onStep, opts) { return this.run(this.chapterGen(lineup, coach, opts), onStep); };
  G.leagueGen = function* (teams) {
    var labels = Object.keys(teams), matrix = {}, drawn = {}, i, j;
    labels.forEach(function (a) { matrix[a] = {}; drawn[a] = {}; });
    for (i = 0; i < labels.length; i++) {
      var a = labels[i];
      for (j = 0; j < labels.length; j++) {
        var b = labels[j];
        if (a === b) continue;
        var res = this.grid.matchups(Team('heartgold', teams[a]), asOpponent(b, teams[b]));
        matrix[a][b] = sum(res.grid.map(function (r) { return sum(Object.keys(r.vs).map(function (s) { return r.vs[s].wins ? 1 : 0; })); }));
        drawn[a][b] = sum(res.grid.map(function (r) { return sum(Object.keys(r.vs).map(function (s) { return r.vs[s].draw ? 1 : 0; })); }));
        yield a + ' vs ' + b;
      }
    }
    var standings = labels.map(function (a) {
      var won = sum(Object.keys(matrix[a]).map(function (b) { return matrix[a][b]; })), played = 36 * (labels.length - 1), draws = sum(Object.keys(drawn[a]).map(function (b) { return drawn[a][b]; }));
      return {team: a, wins: won, draws: draws, losses: played - won - draws, pct: pyRound(won / played, 3),
        series_won: count(labels, function (b) { return b !== a && matrix[a][b] > matrix[b][a]; })};
    });
    standings = sortBy(standings, function (r) { return [-r.series_won, -r.pct]; });
    return {rules: 'Lv 100, Gen 4 rules, IVs 31, EVs 85 in every stat unless recorded, builds as recorded; each one-on-one played out by the scouting engine',
      standings: standings, matrix: matrix, draws: drawn};
  };
  G.league = function (teams, progress) { var it = this.leagueGen(teams), r; while (!(r = it.next()).done) if (progress) progress(r.value); return r.value; };
  G.run = function (gen, onStep) {   // any of the generators, a step at a time
    return new Promise(function (resolve, reject) {
      var n = 0;
      (function step() {
        var r;
        try { r = gen.next(); } catch (e) { reject(e); return; }
        if (r.done) { resolve(r.value); return; }

    });
  };
  /* export_data(): every lineup in order with its coach, then the league */
  G.exportData = function (lineups, coaches, progress) {
    var self = this, out = lineups.map(function (lu) { var d = self.chapter(lu, (coaches || {})[lu.id]); if (progress) progress(lu.id); return d; });

    var league = this.league(teams);
    out.forEach(function (d) { delete d.members; });
    var titles = Object.assign({}, GAME_TITLE); out.forEach(function (d) { titles[d.id] = d.title; });
    return {method: P.method, lineups: out, league: league, titles: titles,
      chapters: Object.keys(GAME_TITLE).filter(function (g) { return out.some(function (d) { return d.chapter === g; }); }), sections: SECTION_TITLES,
      situations: SITUATIONS.map(function (s) { return {id: s[0], name: s[1], state: s[2]}; }),
      sliders: SLIDERS.map(function (k) { return {id: k, name: SLIDER_NAMES[k], left: POLES[k][0], right: POLES[k][1]}; }),
      rules: sum(Object.keys(this.book).map(function (k) { return this.book[k].length; }, this))};
  };
  G.stats = function () { return {damage_numbers: Object.keys(this.ev.table.cache).length, calculator_calls: this.ev.table.fetched, fights: this.ev.fightsRun}; };

  /* lineups.json's rules, so the lab can build variations the same way (load_lineups) */
  function resolveLineup(base, v, characters) {
    var resolve = function (b) { return typeof b === 'string' ? clone(characters[b]) : clone(b); }, members = base.members.slice();
    Object.keys(v.change || {}).forEach(function (sp) { members = members.map(function (x) { return x[0] === sp ? [x[0], resolve(v.change[sp])] : x; }); });
    Object.keys(v.swap || {}).forEach(function (old) { var nb = resolve(v.swap[old]); members = members.map(function (x) { return x[0] === old ? [nb.species, nb] : x; }); });
    if (v.members) members = v.members.map(function (b) { var r = resolve(b); return [r.species, r]; });
    return Object.assign({}, base, {id: v.id, title: base.title + ' · ' + v.title, status: 'variation', decision: null, variation: {title: v.title, why: v.why || null}, members: members});
  }

  function init(pack, calcLib) {
    P = pack; C = calcLib;
    [2, 3, 4].forEach(function (g) {
      var gd = P.gens[g]; SP[g] = {}; MV[g] = {};
      Object.keys(gd.species).forEach(function (id) { var s = gd.species[id], bs = {}; STATS.forEach(function (k, i) { bs[k] = s[2][i]; }); SP[g][id] = {id: id, name: s[0], types: s[1], bs: bs}; });
      Object.keys(gd.moves).forEach(function (id) { var m = gd.moves[id]; MV[g][id] = {id: id, name: m[0], type: m[1], cat: m[2], bp: m[3], priority: m[4], recoil: m[5], drain: m[6]}; });
    });
    SIGNATURE = P.signature || {}; ITEM_KNOWN = null; POP = {}; BOOK = {}; LEARN = {}; TEAM_BASE = {};
  }
  function ready() { return !!(P && C); }

  return {init: init, ready: ready, engine: function (o) { return new Engine(o); }, speak: speak, resolveLineup: resolveLineup,
    species: species, move: move, abilities: abilities, learnable: learnable, strongestSet: strongestSet, memberFor: memberFor, mbGet: mbGet,
    fromBuild: fromBuild, Combatant: Combatant, Plan: Plan, planLabel: planLabel, outcomeValue: outcomeValue, Fight: Fight, calcRun: calcRun,
    pyRound: pyRound, mean: mean, Random: Random, SITUATIONS: SITUATIONS, SLIDERS: SLIDERS, SLIDER_NAMES: SLIDER_NAMES, POLES: POLES,
    SECTION_TITLES: SECTION_TITLES, GAME_TITLE: GAME_TITLE, GAME_GEN: GAME_GEN, TYPES: TYPES, ROLES: ROLES,
    pack: function () { return P; }};
})();
