<script>
/* ===== One Pokémon: the builder (v2, D-078; docs/design/V2_PLAN.md §4) =========================================
   Zack: "this is my individual Typhlosion ... I want to be able to choose all of its moves, its nature, its ability,
   its item, all of the EVs ... its ball ... see the stats."
   Left: your inputs (who it is, its ball, four moves from dropdowns of every legal move, nature, ability, item,
   IVs, EVs, the stats they make). Right, in Zack's order: the species and every Gen I-IV Pokédex entry; the five
   team roles with their work shown; badges; its scouting report; wilderness tags; homestead tags. The page shows the
   build as it is now: there's no before-and-after. Every read is the engines' in the page (28_teamroles,
   29_recognition, 27_battle, 34_capability). Saving writes a new build version and the individual (My Builds, My
   Pokémon); nothing here writes canon. */
var PB = null;
var HELD_CATS = ['held-items', 'choice', 'type-enhancement', 'type-protection', 'plates', 'species-specific', 'in-a-pinch', 'picky-healing', 'bad-held-items', 'effort-training', 'training', 'evolution'];
function builderReady() {
  return Promise.all([labsReady(), gearReady().catch(function () { return null; }), capReady().catch(function () { return null; }), API.data('biology').catch(function () { return null; }),
    API.data('naming').catch(function () { return null; })])
    .then(function (r) { if (r[4]) S.naming = r[4].words; if (r[3] && !S.bioBy) { S.bioBy = {}; r[3].species.forEach(function (s) { S.bioBy[s.name] = s; }); S.bioVersions = r[3].versions; } return true; });
}
function proposedName(name) {   // the name the generated words would make (docs/naming/proposed_words.json; proposals, not applied)
  var W = S.naming; if (!W || !name || !name.tokens) return '';
  return name.tokens.map(function (t) { return t.word || (t.slot === 'unnamed' ? W.unnamed : (W[t.slot] || {})[t.id]) || t.placeholder; }).join(' ');
}
function spriteOf(n, game, shiny) { return n ? SPR + 'pokemon/' + (GAME_SET[game] || GAME_SET.heartgold) + (shiny ? 'shiny/' : '') + n + '.png' : ''; }
function inBall(species, game, ballName, shiny, size) {   // the Pokémon shown in its ball: the ball behind, the game's sprite in front
  size = size || 96;
  var n = numOf(species), G = typeof Gear !== 'undefined' && Gear.ready && Gear.ready() ? Gear : null, id = G && ballName ? G.ballIdOf(ballName, game) : null, b = id ? G.ball(id) : null;
  var ball = b ? '<div class="ib-ball">' + ballArt(b, Math.round(size * 0.92), {sprite: false}) + '</div>' : '<div class="ib-ball ib-plain"></div>';
  return '<div class="inball" style="width:' + size + 'px;height:' + size + 'px" title="' + esc((ballName || 'no ball') + (shiny ? ', shiny' : '')) + '">' + ball +
    (n ? '<img class="ib-mon pix" src="' + spriteOf(n, game, shiny) + '" alt="' + esc(species) + '" loading="lazy">' : '') + (shiny ? '<span class="ib-shiny">✦</span>' : '') + '</div>';
}
function familyOf(species) {   // its evolution line, base first (for changing species as it evolves)
  var all = S.atlas && S.atlas.species || [], d = dexOf(species); if (!d) return [species];
  var root = d; while (root.from && DEX.byNum[root.from]) root = DEX.byNum[root.from];
  var out = [], walk = function (x) { out.push(x.name); all.filter(function (y) { return y.from === x.n; }).forEach(walk); };
  walk(root); return out;
}

/* ---- your Pokémon: every one, by team ---- */
function pokemonIndex() {
  return labsReady().then(function () {
    var inds = Object.keys(S.store.individuals || {}).map(function (k) { return S.store.individuals[k]; }).filter(function (i) { return i.status !== 'retired'; });
    var byGame = {}; inds.forEach(function (i) { (byGame[i.game] = byGame[i.game] || []).push(i); });
    var blocks = JOURNEYS.map(function (g) {
      var list = (byGame[g] || []).sort(function (a, b) { return (a.nickname || a.species).localeCompare(b.nickname || b.species); }), t = Teams.get(g);
      var on = {}; t.slots.forEach(function (s, k) { if (s) on[s.ind] = k + 1; });
      return '<div class="card" style="margin-top:14px"><div class="hd"><div style="flex:1"><div class="eyebrow">' + esc(GAME_NAME[g]) + ' · ' + plural(list.length, 'Pokémon') + '</div><h3>' + esc(whose(t) + ' ' + GAME_NAME[g]) + '</h3></div>' +
        '<a class="link" href="#/team/' + g + '">The team →</a> <a class="btn sm" href="#/pokemon/new/' + g + '" style="margin-left:10px">Add a Pokémon</a></div><div class="bd">' +
        (list.length ? '<div class="pickgrid">' + list.map(function (i) { return '<a class="pick" href="#/pokemon/' + encodeURIComponent(i.id) + '">' + inBall(i.species, i.game, i.ball, i.shiny, 56) +
          '<div><b>' + esc(i.nickname || i.species) + '</b>' + (i.nickname ? ' <span class="tiny muted">' + esc(i.species) + '</span>' : '') +
          '<div class="tiny muted">' + (on[i.id] ? 'on the team, slot ' + on[i.id] : 'not on the team') + (i.build ? '' : ' · not built yet') + '</div></div></a>'; }).join('') + '</div>'
          : '<div class="tiny muted">None yet.</div>') + '</div></div>';
    }).join('');
    return '<div class="eyebrow">Build · your Pokémon</div><h1 style="margin:6px 0">Your Pokémon</h1>' +
      '<p class="lede">Every Pokémon of yours, by journey. Open one to build it: its moves, nature, ability, item, ball and spread, with its roles, badges and scouting report read live as you go. The quickest way in is through a team: open it and click a slot.</p>' +
      '<div class="tabs" style="margin:12px 0">' + JOURNEYS.map(function (g) { return '<a href="#/team/' + g + '">' + esc(GAME_NAME[g]) + ' team</a>'; }).join('') + '</div>' + blocks +
      card('Any species', '<div style="display:flex;gap:8px;flex-wrap:wrap"><input class="f" id="plq" placeholder="A species, e.g. Typhlosion" style="flex:1;min-width:180px"><button class="btn" onclick="var v=document.getElementById(\'plq\').value.trim();if(v)nav(\'#/compare/\'+encodeURIComponent(cap(v.toLowerCase())))">Its builds in the builds book</button></div>',
        {eyebrow: 'Reference', tools: false, style: 'margin-top:16px'});
  });
}

/* ---- a new Pokémon: pick the species (into a team slot when one is given) ---- */
function newPokemon(game, slot) {
  if (JOURNEYS.indexOf(game) < 0) return '<div class="notice">No game called ' + esc(game) + '.</div>';
  return labsReady().then(function () {
    var gen = Battle.GAME_GEN[game], all = (S.atlas.species || []).filter(function (s) { return s.gen <= gen && s.n <= 493; });
    var TY = Battle.TYPES.filter(function (t) { try { Battle.effectiveness(gen, t, ['Normal'], null); return t !== '???'; } catch (e) { return false; } });
    after(function (p) {
      var f = p.querySelector('#npf'), apply = function () { var q = f.q.value.trim().toLowerCase(), t = f.t.value, fe = f.fe.checked, n = 0;
        p.querySelectorAll('[data-np]').forEach(function (a) { var s = DEX.byName[a.getAttribute('data-np')];
          var ok = (!q || s.name.toLowerCase().indexOf(q) >= 0 || String(s.n) === q) && (!t || s.t.indexOf(t) >= 0) && (!fe || !(S.atlas.species || []).some(function (y) { return y.from === s.n && y.gen <= gen; }));
          a.style.display = ok ? '' : 'none'; if (ok) n++; });
        p.querySelector('#npn').textContent = plural(n, 'species'); };
      f.addEventListener('input', apply); f.addEventListener('change', apply); apply(); f.q.focus();
      p.addEventListener('click', function (e) { var a = e.target.closest && e.target.closest('[data-np]'); if (!a) return; e.preventDefault(); addPokemon(a.getAttribute('data-np'), game, slot); });
    });
    var t = Teams.get(game);
    return '<a class="link" href="#/team/' + game + '">← ' + esc(GAME_NAME[game]) + ' team</a><div class="eyebrow" style="margin-top:10px">' + esc(GAME_NAME[game]) + (slot != null ? ' · slot ' + (+slot + 1) : '') + '</div>' +
      '<h1 style="margin:6px 0">Add a Pokémon</h1><p class="lede">Pick the species. It becomes yours at once' + (slot != null ? ', in slot ' + (+slot + 1) + ' of ' + esc(whose(t).toLowerCase() === 'your' ? 'your' : whose(t)) + ' team' : '') + ', and opens in the builder. Every Pokémon up to Gen ' + ['', 'I', 'II', 'III', 'IV'][gen] + ' is here (D-024: if it can be learned or caught in the story, it counts).</p>' +
      '<form id="npf" class="row" style="flex-wrap:wrap;align-items:flex-end" onsubmit="return false"><div style="flex:1;min-width:200px"><label class="l">Search</label><input class="f" name="q" placeholder="Name or number" autocomplete="off"></div>' +
      '<div><label class="l">Type</label><select class="f" name="t"><option value="">any</option>' + TY.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select></div>' +
      '<label class="small" style="padding-bottom:8px"><input type="checkbox" name="fe"> Fully evolved only</label><div class="tiny muted" id="npn" style="padding-bottom:10px"></div></form>' +
      '<div class="npgrid" style="margin-top:12px">' + all.map(function (s) { return '<a class="npick" href="javascript:void 0" data-np="' + esc(s.name) + '"><img class="pix" src="' + sprite(s.n, game) + '" alt="" loading="lazy"><b>' + esc(s.name) + '</b><span class="tiny muted">#' + s.n + '</span><span>' + types(s.t) + '</span></a>'; }).join('') + '</div>';
  });
}
function addPokemon(species, game, slot) {
  var d = dexOf(species) || {}, g = d.gr === -1 ? 'genderless' : d.gr === 8 ? 'F' : 'M', here = NAVI.hash;
  Records.saveIndividual({species: species, game: game, gender: g, shiny: false, ball: 'Poké Ball', origin: 'added in the app', status: 'working'}, 'Added ' + species + ' (' + GAME_NAME[game] + ')')
    .then(function (ind) {
      var t = Teams.get(game), k = slot != null ? +slot : t.slots.indexOf(null);
      if (k < 0) { toast('Added. The team is full, so it\'s in your Pokémon, not on the team.'); if (NAVI.hash === here) nav('#/pokemon/' + encodeURIComponent(ind.id)); return; }
      t.slots[k] = {ind: ind.id, species: species};
      return Teams.save(t).then(function () { toast(esc(species) + ' is in slot ' + (k + 1) + '. Build it here.'); if (NAVI.hash === here) nav('#/pokemon/' + encodeURIComponent(ind.id)); });
    }).catch(function (e) { toast('Couldn\'t save: ' + esc(e && e.message || e)); });
}

/* ---- the builder ---- */
function pbRecord(id) {   // one of yours, or a reference build (from the builds book) to make your own
  var ind = (S.store.individuals || {})[id];
  if (ind) { var sb = ind.build ? storeBuild(ind.build) : null; return {kind: 'individual', ind: ind, build: indBuild(ind), buildId: ind.build || null, v: sb ? (sb.v || 1) : null, game: ind.game}; }

}
var IND_KEYS = ['nickname', 'gender', 'shiny', 'ball', 'met_location', 'caught_level', 'note'];
function pokemonLab(id) {
  return builderReady().then(function () {
    var rec = pbRecord(id);

    var ind = rec.kind === 'individual' ? rec.ind : null, dr = Records.draft(id);
    var who = {}; IND_KEYS.forEach(function (k) { who[k] = ind ? (ind[k] == null ? null : ind[k]) : null; });
    var saved = pbNormal(rec.build, rec.build.species, rec.kind === 'individual' ? (storeBuild(rec.buildId) || {}).level : rec.rec.level);
    PB = {id: id, rec: rec, game: rec.game, gen: Battle.GAME_GEN[rec.game], baseCur: saved, cur: dr && dr.build ? pbNormal(dr.build, dr.build.species || saved.species, dr.build.level) : JSON.parse(JSON.stringify(saved)),
      who: Object.assign({}, who, dr && dr.who || {}), whoBase: who, token: 0, draftAt: dr ? dr.at : null, team: ind ? Teams.onTeam(ind.id) : null};
    PB.species = PB.cur.species;

  });
}
function pbShell() {
  var rec = PB.rec, ind = rec.ind, t = PB.team ? Teams.get(PB.team.game) : null;
  var back = t ? '<a class="link" href="#/team/' + t.game + '">← ' + esc(whose(t) + ' ' + GAME_NAME[t.game]) + ' team</a>' : '<a class="link" href="#/pokemon">← Your Pokémon</a>';
  var strip = t ? '<div class="teamstrip">' + t.slots.map(function (s, k) { var x = s && (S.store.individuals || {})[s.ind];
    if (!x) return '<a class="ts empty" href="#/pokemon/new/' + t.game + '/' + k + '" title="Slot ' + (k + 1) + ': add a Pokémon">+</a>';
    return '<a class="ts' + (x.id === PB.id ? ' on' : '') + '" href="#/pokemon/' + encodeURIComponent(x.id) + '" title="' + esc(x.nickname || x.species) + '"><img class="pix" src="' + spriteOf(numOf(x.species), x.game, x.shiny) + '" alt=""></a>'; }).join('') + '</div>' : '';
  var actions = rec.kind === 'individual' ?
    '<input class="f" id="pbnote" placeholder="What this version is for (optional)" style="width:240px"><button class="btn gold" id="pbsave">Save</button><button class="btn" id="pbrevert">Revert</button>' +
      '<details class="more"><summary class="btn">More ▾</summary><div class="menu"><a href="#/mon/' + encodeURIComponent(PB.id) + '">Its profile and career</a><a href="#/pkhex/' + encodeURIComponent(PB.id) + '">PKHeX export</a>' +
      '<a href="#/compare/' + encodeURIComponent(PB.species) + '">Every build of ' + esc(PB.species) + '</a><a href="#/bench?ind=' + encodeURIComponent(PB.id) + '">Benchmark it</a>' +
      (PB.team ? '<a href="javascript:void 0" onclick="pbOffTeam()">Take it off the team</a>' : '<a href="javascript:void 0" onclick="pbOnTeam()">Put it on the ' + esc(GAME_NAME[PB.game]) + ' team</a>') + '</div></details>'
    : '<button class="btn gold" id="pbmine">Make it mine (' + esc(GAME_NAME[PB.game]) + ')</button><a class="btn" href="#/compare/' + encodeURIComponent(PB.species) + '">Every build of ' + esc(PB.species) + '</a>';
  return '<div class="pbtop">' + back + strip + '</div>' +
    '<div class="pbhead"><div id="pbportrait">' + inBall(PB.species, PB.game, PB.who.ball, PB.who.shiny, 112) + '</div><div style="flex:1;min-width:220px">' +
      '<div class="eyebrow">' + (ind ? 'Your ' + esc(GAME_NAME[PB.game]) + ' Pokémon' + (PB.team ? ' · slot ' + (PB.team.slot + 1) : '') : 'A reference build · ' + esc(rec.prov || '')) + (rec.v ? ' · build v' + rec.v : '') + '</div>' +
      '<h1 style="margin:4px 0" id="pbtitle">' + esc(PB.who.nickname || PB.species) + (PB.who.nickname ? ' <span class="muted" style="font-size:.6em">' + esc(PB.species) + '</span>' : '') + '</h1>' +
      '<div class="small" id="pbname"></div><div id="pbearned" style="margin-top:6px"></div></div>' +
      '<div class="pbactions">' + actions + '</div></div><div id="pbdraft">' + pbDraftLine() + '</div>' +
    '<div class="labgrid pbgrid" style="margin-top:14px"><div id="pbin">' + pbInputs() + '</div><div id="pbout">' +
      '<div id="pbspecies">' + pbSpecies() + '</div><div id="pbroles" style="margin-top:16px"><div class="empty">Reading it against every Elite Four and Champion Pokémon…</div></div>' +
      '<div id="pbbadges" style="margin-top:16px"></div><div id="pbscout" style="margin-top:16px"></div><div id="pbwild" style="margin-top:16px"></div><div id="pbhome" style="margin-top:16px"></div></div></div>';

/* ---- left: your inputs ---- */
function pbHeld(gen) {
  var X = Explain.data() || {items: {}};
  return Object.keys(X.items).filter(function (n) { var it = X.items[n]; return it.gens.indexOf(gen) >= 0 && (HELD_CATS.indexOf(it.category) >= 0 || (it.category === 'medicine' && /Berry$/.test(n))); }).sort();
}
function pbMoveLabel(m, gen) { var d; try { d = Battle.mbGet(gen, m); } catch (e) { return m; } return m + ' · ' + d.type + ' · ' + d.category + (d.power ? ' · ' + d.power : ''); }
function pbMoveInfo(m, gen) {
  if (!m) return '<div class="mvinfo empty tiny muted">Empty: the engines fill it with its strongest move until you pick one.</div>';
  var d; try { d = Battle.mbGet(gen, m); } catch (e) { return '<div class="mvinfo tiny" style="color:var(--ember-2)">' + esc(m) + ' isn\'t a Gen ' + gen + ' move.</div>'; }
  var tx = ((Explain.data() || {moves: {}}).moves[d.name] || {}).game_text || {}, game = tx[String(gen)] || tx['4'] || tx['3'] || tx['2'] || '';
  var stab = Battle.species(gen, PB.species).types.indexOf(d.type) >= 0 && d.category !== 'Status';
  return '<div class="mvinfo">' + typeBadge(d.type) + ' <span class="chip">' + esc(d.category) + '</span>' + (stab ? ' <span class="chip gold" title="Same-type attack bonus: ×1.5">STAB</span>' : '') +
    '<span class="mvnums"><span>Power <b>' + (d.power || '—') + '</b></span><span>Accuracy <b>' + (d.accuracy ? d.accuracy + '%' : '—') + '</b></span><span>PP <b>' + (d.pp || '—') + '</b></span>' + (d.priority ? '<span>Priority <b>' + (d.priority > 0 ? '+' : '') + d.priority + '</b></span>' : '') + '</span>' +
    (d.category === 'Status' || d.effect && !/^Inflicts regular damage with no additional effect/.test(d.effect) ? '<div class="tiny" style="margin-top:4px">' + (d.category === 'Status' ? '<b>What it does:</b> ' : '') + esc(d.effect) + '</div>' : '') +
    (game ? '<div class="tiny muted" style="margin-top:3px"><i>“' + esc(game) + '”</i></div>' : '') + '</div>';
}
function pbNatureInfo(name, gen) {
  if (gen < 3) return '<div class="tiny muted">Gen II has no natures.</div>';
  var n = name ? (Explain.data() || {natures: {}}).natures[name] : null;
  if (!n) return '<div class="tiny muted">No nature yet: the engines read it as neutral.</div>';
  return '<div class="tiny"><b>' + esc(name) + ':</b> ' + esc(n.line) + '</div><div class="tiny muted">' + esc(n.taste || '') + (n.same_up && n.same_up.length ? ' Others that raise the same stat: ' + esc(n.same_up.join(', ')) + '.' : '') + '</div>';
}
function pbAbilityInfo(name, gen) {
  if (gen < 3) return '<div class="tiny muted">Gen II has no abilities.</div>';
  var a = name ? (Explain.data() || {abilities: {}}).abilities[name] : null; if (!a) return '';
  var game = a.game_text[String(gen)] || a.game_text['4'] || a.game_text['3'] || '';
  return '<div class="tiny"><b>' + esc(name) + ':</b> ' + esc(game || a.summary || '') + '</div>' + (a.summary && game ? '<div class="tiny muted">How it works: ' + esc(a.summary) + '</div>' : '');
}
function pbItemInfo(name, gen) {
  if (!name) return '<div class="tiny muted">No held item.</div>';
  var it = (Explain.data() || {items: {}}).items[name]; if (!it) return '<div class="tiny muted">' + esc(name) + '</div>';
  var game = it.game_text[String(gen)] || it.game_text['4'] || it.game_text['3'] || '';
  return '<div class="tiny"><img class="pix" src="' + itemSprite(name) + '" alt="" style="width:24px;height:24px;vertical-align:middle"> <b>' + esc(name) + ':</b> ' + esc(game || it.summary || '') + '</div>' + (it.summary && game ? '<div class="tiny muted">How it works: ' + esc(it.summary) + '</div>' : '');
}
function pbSets() {   // reference builds of this species in this generation, to start from
  var gen = PB.gen;
  return Object.keys(S.store.builds || {}).map(function (k) { return Object.assign({id: k}, S.store.builds[k]); })
    .filter(function (b) { return b.species === PB.species && (b.generation || 4) === gen && b.provenance !== 'yours'; })
    .sort(function (a, b) { return PROV_ORDER.indexOf(a.provenance) - PROV_ORDER.indexOf(b.provenance) || String(a.name || a.id).localeCompare(String(b.name || b.id)); });
}
function pbInputs() {
  var b = PB.cur, gen = PB.gen, sp = PB.species, w = PB.who, d = dexOf(sp) || {}, moves = [];
  try { moves = Battle.learnable(sp, PB.game); } catch (e) { moves = []; }
  var abil = Battle.abilities(gen, sp), natures = (S.builds.natures || []).map(function (x) { return x.name; }), held = pbHeld(gen), ivs = b.ivs || {}, evs = b.evs || {};
  var sexes = d.gr === -1 ? ['genderless'] : d.gr === 0 ? ['M'] : d.gr === 8 ? ['F'] : ['M', 'F'];
  var G = typeof Gear !== 'undefined' && Gear.ready && Gear.ready() ? Gear : null, balls = G ? G.ballsIn(PB.game).map(function (x) { return G.nameIn(x.id, PB.game); }) : ['Poké Ball'];
  if (w.ball && balls.indexOf(w.ball) < 0) balls.unshift(w.ball);
  var fam = familyOf(sp).filter(function (x) { var dd = dexOf(x); return dd && dd.gen <= gen; }), sets = pbSets(), own = PB.rec.kind === 'individual';
  var opt = function (v, label, cur) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(label) + '</option>'; };
  return (own ? card('Who it is', '<div class="row"><div style="flex:2"><label class="l">Nickname</label><input class="f" data-who="nickname" value="' + esc(w.nickname || '') + '" placeholder="' + esc(sp) + '"></div>' +
      '<div><label class="l">Species</label><select class="f" data-pb="species">' + fam.map(function (x) { return opt(x, x, sp); }).join('') + '</select></div></div>' +
      '<div class="row" style="margin-top:6px"><div><label class="l">Sex</label><select class="f" data-who="gender">' + sexes.map(function (s) { return opt(s, s === 'M' ? 'Male' : s === 'F' ? 'Female' : 'Genderless', w.gender); }).join('') + '</select></div>' +
      '<div><label class="l">Shiny</label><select class="f" data-who="shiny">' + opt('no', 'No', w.shiny ? 'yes' : 'no') + opt('yes', 'Yes ✦', w.shiny ? 'yes' : 'no') + '</select></div>' +
      '<div><label class="l">Level</label><input class="f" type="number" min="1" max="100" data-pb="level" value="' + (b.level || 100) + '"></div></div>' +
      '<div class="row" style="margin-top:6px;align-items:center"><div style="flex:2"><label class="l">Ball</label><select class="f" data-who="ball">' + balls.map(function (x) { return opt(x, x, w.ball || 'Poké Ball'); }).join('') + '</select>' +
      '<div class="tiny muted" id="pbballfit">' + pbBallFit() + '</div></div><div id="pbballpic">' + inBall(sp, PB.game, w.ball, w.shiny, 72) + '</div></div>' +
      '<details style="margin-top:8px"><summary class="tiny">Where it came from (optional)</summary><div class="row" style="margin-top:6px"><div><label class="l">Met at</label><input class="f" data-who="met_location" value="' + esc(w.met_location || '') + '"></div>' +
