<script>
/* ===== The team homepage (v2, D-078; docs/design/V2_PLAN.md §3) ===============================================
   Zack: "I just want this page to be about the team ... like a mini dashboard where I can see all of the sections."
   One team per game (81_teams.html), its own trainer. Six tiles you can drag (or nudge with the arrows) into order,
   each opening that Pokémon's builder; a strip of links to every section; then, read live from each member's
   newest build:
   - this team's trainer;
   - a scouting report (strengths, weaknesses, tendencies);
   - shapes and roles;
   - type coverage;
   - a small swap tool;
   - candidates;
   - achievements;
   - battle it in the Arena.
   Nothing here writes canon. */
var TM = null;
function teamLab(game) {
  game = game || 'heartgold';
  if (JOURNEYS.indexOf(game) < 0) return '<div class="notice">No game called ' + esc(game) + '.</div>';
  return Promise.all([labsReady(), gearReady().catch(function () { return null; })]).then(function () {
    TM = {game: game, gen: Battle.GAME_GEN[game], team: Teams.get(game), reads: {}, token: 0, filters: {type: '', move: '', role: '', prov: '', fills: '', legend: ''}, target: null, saveT: null};
    after(function (p) { tmBind(p); tmRead(); });
    var t = TM.team, J = JOURNEY[game];
    return '<div class="tabs" style="margin:0 0 12px">' + JOURNEYS.map(function (g) { var x = Teams.get(g), n = Teams.filled(x);
        return '<a' + (g === game ? ' class="on"' : '') + ' href="#/team/' + g + '">' + esc(GAME_NAME[g]) + (n ? ' <span class="tiny muted">' + n + '/6</span>' : '') + '</a>'; }).join('') + '</div>' +
      '<div class="thero" style="--hue:' + J.hue + '33"><div><div class="eyebrow">Journey · ' + esc(journeyRegions(game).map(function (r) { return r.name; }).filter(function (x, i, a) { return a.indexOf(x) === i; }).join(' and ')) + ' · ' + esc(GAME_NAME[game]) + '</div>' +
        '<h1 id="tmtitle">' + esc(whose(t) + ' ' + GAME_NAME[game]) + '</h1><div class="small muted" id="tmphil">' + (t.profile.philosophy ? '“' + esc(t.profile.philosophy) + '”' : 'A team of its own, with its own trainer and philosophy.') + '</div></div>' +
        '<div class="kv" id="tmkv">' + tmKV(null) + '</div></div>' +
      '<nav class="tnav">' + [['six', 'The six'], ['trainer', 'Trainer'], ['scout', 'Scouting report'], ['shape', 'Shapes & roles'], ['cover', 'Coverage'], ['swap', 'Swap'], ['cand', 'Candidates'], ['ach', 'Achievements'], ['battle', 'Battle']]
        .map(function (x) { return '<a href="javascript:void 0" data-jump="tm-' + x[0] + '">' + x[1] + '</a>'; }).join('') + '</nav>' +
      '<section id="tm-six">' + tmSix() + '</section>' +
      '<div class="grid" style="margin-top:16px"><div class="c5" id="tm-trainer">' + tmTrainer() + '</div><div class="c7" id="tm-scout">' + card('Scouting report', '<div class="empty">Reading the six against the League…</div>', {tools: false}) + '</div></div>' +
      '<section id="tm-shape" style="margin-top:16px"></section><section id="tm-cover" style="margin-top:16px"></section>' +
      '<div class="grid" style="margin-top:16px"><div class="c5" id="tm-swap"></div><div class="c7" id="tm-battle">' + tmBattleCard() + '</div></div>' +
      '<section id="tm-cand" style="margin-top:16px"></section><section id="tm-ach" style="margin-top:16px"></section>';
  });
}
function tmMembers() { return Teams.members(TM.team); }
function tmKV(comp) {
  var n = Teams.filled(TM.team), rolesN = comp ? TeamRoles.ORDER.filter(function (r) { return comp.roles[r].length; }).length : null;
  var cover = comp ? (comp.questions.filter(function (q) { return q.id === 'champions'; })[0] || {}).answer : null;
  return '<div><b>' + n + ' of 6</b>Pokémon</div>' + (comp ? '<div><b>' + rolesN + ' of 5</b>team roles</div><div><b>' + shapeHtml(comp.shape) + '</b>shape</div><div><b>' + esc(String(cover || '—').split(' beaten')[0]) + '</b>Champion Pokémon answered</div>' : '');
}

/* ---- the six: tiles you can drag into order ---- */
function tmSix() {
  var mem = tmMembers();
  return '<div class="six" id="tmsix">' + mem.map(function (m, i) {
    if (!m) return '<a class="tile add" href="#/pokemon/new/' + TM.game + '/' + i + '" data-slot="' + i + '"><div><span class="no">' + (i + 1) + '</span><b>+</b>Add a Pokémon</div></a>';
    var x = m.ind, r = TM.reads[x.id], b = m.build, gen = TM.gen;
    var roles = r && !r.error ? (r.earned.length ? r.earned.map(function (e) { return chip(roleName(e), 'forest'); }).join(' ') : '<span class="tiny muted">no team role</span>') : r && r.error ? '<span class="tiny" style="color:var(--ember-2)">couldn\'t read</span>' : '<span class="tiny muted">reading…</span>';
    return '<div class="tile" draggable="true" data-slot="' + i + '" data-go="' + esc(x.id) + '"><span class="no">' + (i + 1) + '</span>' +
      '<span class="mv"><button data-nudge="' + i + ':-1" title="Move left">◀</button><button data-nudge="' + i + ':1" title="Move right">▶</button><button data-out="' + i + '" title="Take it off the team">✕</button></span>' +
      inBall(x.species, x.game, x.ball, x.shiny, 104) + '<div class="nm">' + esc(x.nickname || x.species) + '</div><div class="sub">' + (x.nickname ? esc(x.species) + ' · ' : '') + types(Battle.species(gen, x.species).types) + '</div>' +
      '<div class="moves">' + (b.moves && b.moves.length ? esc(b.moves.join(' · ')) : '<span class="muted">no moves yet: open it to build</span>') + (b.item ? '<div class="muted">@ ' + esc(b.item) + '</div>' : '') + '</div>' +
      '<div style="margin-top:6px" data-roles="' + i + '">' + roles + '</div>' + (r && !r.error ? '<div class="tiny" style="margin-top:4px">' + nameHtml(r.name) + '</div>' : '') + '</div>';
  }).join('') + '</div><div class="tiny muted" style="margin-top:6px">Click a Pokémon to build it. Drag the tiles (or use ◀ ▶) to set the order: slot 1 leads in battle. Changes save to your My Teams tab as you make them.</div>';
}
function tmSaveSoon(msg) {   // order changes come in bursts: save once they settle
  clearTimeout(TM.saveT);
  TM.saveT = setTimeout(function () { Teams.save(TM.team).then(function (t) { TM.team = t; if (msg) toast(msg); }).catch(function (e) { toast('Couldn\'t save: ' + esc(e && e.message || e)); }); }, 900);
}
function tmMove(from, to) {
  if (to < 0 || to > 5 || from === to) return;
  var s = TM.team.slots, x = s[from]; s.splice(from, 1); s.splice(to, 0, x);
  document.getElementById('tm-six').innerHTML = tmSix(); tmSaveSoon('Order saved.'); tmRender();
}
function tmOut(i) {
  var x = Teams.members(TM.team)[i]; TM.team.slots[i] = null;
  document.getElementById('tm-six').innerHTML = tmSix(); tmSaveSoon(x ? esc(x.ind.nickname || x.ind.species) + ' is off the team (still in your Pokémon).' : ''); tmRender();
}

/* ---- this team's trainer ---- */
function tmTrainer() {
  var p = TM.team.profile, styles = typeof TR_PHILOSOPHY !== 'undefined' ? TR_PHILOSOPHY : {default: {name: 'Default', why: ''}};
  return card('This team\'s trainer', '<form id="tmtf"><div class="row"><div><label class="l">Trainer name</label><input class="f" name="name" value="' + esc(p.name || '') + '" placeholder="You"></div>' +
      '<div><label class="l">Coaching style</label><select class="f" name="style">' + Object.keys(styles).map(function (k) { return '<option value="' + k + '"' + (k === (p.style || 'default') ? ' selected' : '') + '>' + esc(styles[k].name) + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="tiny muted" id="tmstylewhy" style="margin-top:4px">' + esc((styles[p.style || 'default'] || {}).why || '') + '</div>' +
      '<label class="l" style="margin-top:8px">Philosophy <span class="tiny muted">(how you approach this team, in your words)</span></label><textarea class="f" name="philosophy" style="height:74px" placeholder="What this team is about, how it wins, what it believes">' + esc(p.philosophy || '') + '</textarea>' +
      '<details style="margin-top:8px" id="tmdials"><summary class="tiny">Fine-tune the nine dials</summary><div id="tmdialbox" class="tiny muted" style="margin-top:6px">Opening the dials loads the 6v6 engine…</div></details>' +
      '<div id="tmtraits" style="margin-top:8px"></div><div style="margin-top:10px"><button class="btn gold sm">Save the trainer</button></div></form>' +
    '<div class="tiny muted" style="margin-top:8px">Each team is its own trainer: the Arena plays this team with this style and these dials (the same nine every trainer in the library is read onto), whatever your other teams do.</div>',
    {eyebrow: 'Name · style · philosophy · dials', tools: false});
}
function tmDials() {
  var box = document.getElementById('tmdialbox'); if (!box || box.getAttribute('data-on')) return;
  Arena.ready().then(function () {
    var D = Arena.X().TRAINER_DEFAULTS, p = Object.assign({}, (TR_PHILOSOPHY[TM.team.profile.style || 'default'] || {}).params || {}, TM.team.profile.params || {});
    box.setAttribute('data-on', '1'); box.className = '';
    box.innerHTML = Object.keys(TR_PARAMS).map(function (k) { var v = p[k] != null ? p[k] : D[k];
      return '<div style="margin-top:8px"><div class="small"><b>' + esc(TR_PARAMS[k][0]) + '</b> <span id="tmv-' + k + '">' + v + '</span> <span class="tiny muted">(default ' + D[k] + ')</span></div><input type="range" min="0" max="100" data-dial="' + k + '" value="' + v + '" style="width:100%"><div class="tiny muted">' + esc(TR_PARAMS[k][1]) + '</div></div>'; }).join('');
    tmTraits();
  }).catch(function (e) { box.innerHTML = arNeedsEngine(e); });
}
function tmDialValues() {
  var out = {}, D = (Arena.X() || {}).TRAINER_DEFAULTS || {};
  document.querySelectorAll('[data-dial]').forEach(function (el) { var k = el.getAttribute('data-dial'); if (+el.value !== D[k]) out[k] = +el.value; });
  return out;
}
function tmTraits() {
  var el = document.getElementById('tmtraits'); if (!el || typeof trTraits === 'undefined' || !Arena.X()) return;
  var params = document.querySelector('[data-dial]') ? tmDialValues() : Object.assign({}, (TR_PHILOSOPHY[TM.team.profile.style || 'default'] || {}).params || {}, TM.team.profile.params || {});
  var t = trTraits(params); el.innerHTML = t.length ? t.map(function (x) { return chip(x[0], 'gold') + ' <span class="tiny muted">' + esc(x[1]) + '</span>'; }).join(' ') : '<span class="tiny muted">No trait yet: every dial near the middle reads as a balanced trainer.</span>';
}
function tmSaveTrainer(f) {
  var p = Object.assign({}, TM.team.profile, {name: f.name.value.trim() || 'You', style: f.style.value, philosophy: f.philosophy.value.trim()});
  if (document.querySelector('[data-dial]')) p.params = tmDialValues();
  else if (f.style.value !== (TM.team.profile.style || 'default')) p.params = Object.assign({}, (TR_PHILOSOPHY[f.style.value] || {}).params || {});
  TM.team.profile = p;
  Teams.save(TM.team).then(function (t) { TM.team = t; document.getElementById('tmtitle').textContent = whose({profile: p}) + ' ' + GAME_NAME[TM.game];
    document.getElementById('tmphil').innerHTML = p.philosophy ? '“' + esc(p.philosophy) + '”' : ''; toast('Saved. The Arena plays this team this way.'); })
    .catch(function (e) { toast('Couldn\'t save: ' + esc(e && e.message || e)); });
}

/* ---- the reads: each member through its newest build, one at a time so the page stays live ---- */
function tmRead() {
  var tok = ++TM.token, mem = tmMembers().filter(Boolean), k = 0;
  var step = function () {
    if (tok !== TM.token || !document.getElementById('tmsix')) return;
    if (k >= mem.length) { tmRender(); return; }
    var m = mem[k++], key = m.ind.id;
    try { TM.reads[key] = liveRead(m.build, TM.game); } catch (e) { TM.reads[key] = {error: e && e.message || String(e)}; }
    var el = document.querySelector('[data-roles="' + m.slot + '"]'), r = TM.reads[key];
    if (el) el.innerHTML = r.error ? '<span class="tiny" style="color:var(--ember-2)">couldn\'t read</span>' : r.earned.length ? r.earned.map(function (e) { return chip(roleName(e), 'forest'); }).join(' ') : '<span class="tiny muted">no team role</span>';
    setTimeout(step, 10);
  };
  if (!mem.length) { tmRender(); return; }
  setTimeout(step, 30);
}
function tmLive() { return tmMembers().filter(Boolean).map(function (m) { return {build: Object.assign({}, m.build, {species: m.ind.species}), read: TM.reads[m.ind.id], ind: m.ind, slot: m.slot}; }).filter(function (m) { return m.read && !m.read.error; }); }
function tmRender() {
  var live = tmLive(), comp = live.length ? teamComp(live, TM.game) : null; TM.comp = comp; TM.live = live;
  var set = function (id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; };
  set('tmkv', tmKV(comp));
  if (!comp) {
    var empty = '<div class="empty">Add a Pokémon to the team and this fills in.</div>';
    set('tm-scout', card('Scouting report', empty, {tools: false})); set('tm-shape', card('Shapes & roles', empty, {tools: false})); set('tm-cover', '');
    set('tm-swap', card('Swap', empty, {tools: false})); set('tm-cand', tmCandidates()); set('tm-ach', tmAchievements(null)); tmCandRun(); return;
  }
  set('tm-scout', tmScouting(comp, live)); set('tm-shape', tmShapes(comp, live)); set('tm-cover', tmCoverage(comp));
  set('tm-swap', tmSwap(live)); set('tm-cand', tmCandidates()); set('tm-ach', tmAchievements(comp)); tmSwapFields(); tmCandRun();
}

/* ---- the scouting report: strengths, weaknesses, tendencies ---- */
function tmScouting(comp, live) {
  var Q = {}; comp.questions.forEach(function (q) { Q[q.id] = q; });
  var S1 = [], W = [], T = [], n = live.length, names = function (xs) { return esc(join(xs)); };
  TeamRoles.ORDER.forEach(function (r) { if (comp.roles[r].length) S1.push('<b>' + esc(roleName(r)) + '</b>: ' + names(comp.roles[r])); });
  if (Q.champions && Q.champions.ok) S1.push('Every Champion Pokémon is beaten one-on-one by at least one of the ' + n);
  if (Q.elite_four && Q.elite_four.ok) S1.push('Every Elite Four Pokémon is beaten one-on-one by at least one of them');
  var strongD = comp.defense.filter(function (r) { return r.resist.length + r.immune.length >= 3 && !r.weak.length; }).map(function (r) { return r.type; });
  if (strongD.length) S1.push('Walls off ' + strongD.join(', ') + ' (three or more resist, nobody is weak)');
  var se = comp.offense.filter(function (r) { return r.best > 1; }).length; if (se >= 14) S1.push('Hits ' + se + ' of ' + comp.offense.length + ' types super-effectively');
  var fast = live.filter(function (m) { return (m.read.facts || {}).first >= 0.8; }).map(function (m) { return m.build.species; }); if (fast.length >= 3) S1.push('Speed: ' + names(fast) + ' move first against 80% or more of the League');
  if (Q.hazards && Q.hazards.ok) S1.push('Hazards: ' + esc(Q.hazards.answer));
  if (Q.healing && Q.healing.ok) S1.push('Healing: ' + esc(Q.healing.answer));
  if (Q.stacked_weakness && !Q.stacked_weakness.ok) W.push('Stacked weakness: ' + esc(Q.stacked_weakness.detail));
  if (Q.coverage_gap && !Q.coverage_gap.ok) W.push('Nobody hits ' + esc(Q.coverage_gap.answer) + ' super-effectively');
  var who = function (q) { var xs = uniqS((q.left || []).slice()); return esc(xs.slice(0, 8).join(', ') + (xs.length > 8 ? ' and ' + (xs.length - 8) + ' more' : '')); };
  if (Q.champions && !Q.champions.ok) W.push('Champion Pokémon nobody beats one-on-one (' + Q.champions.answer.split(' beaten')[0] + ' answered): ' + who(Q.champions));
  if (Q.elite_four && !Q.elite_four.ok) W.push('Elite Four Pokémon nobody beats one-on-one (' + Q.elite_four.answer.split(' beaten')[0] + ' answered): ' + who(Q.elite_four));
  var miss = TeamRoles.ORDER.filter(function (r) { return !comp.roles[r].length; }); if (miss.length) W.push('No ' + esc(join(miss.map(roleName))) + ' yet');
  if (Q.hazards && !Q.hazards.ok) W.push('Nobody sets or clears entry hazards');
  if (Q.setup_answer && !Q.setup_answer.ok) W.push('Nothing stops a Dragon Dance or Swords Dance sweeper (no phazing, Haze, Encore or priority)');
  var slow = live.filter(function (m) { return (m.read.facts || {}).first < 0.35; }).map(function (m) { return m.build.species; }); if (slow.length >= 3) W.push('Slow: ' + names(slow) + ' are outsped by most of the League');
  var side = comp.moves.side, tot = side.physical + side.special + side.status || 1;
  T.push('Shape: <b>' + shapeHtml(comp.shape) + '</b>. ' + esc(((TeamRoles.config().team.shapes[comp.shape.id] || {}).explain) || ''));
  T.push('Moves: ' + side.physical + ' physical, ' + side.special + ' special, ' + side.status + ' status (' + Math.round(100 * (side.physical + side.special) / tot) + '% attacking)' + (side.physical > 2 * side.special ? ': a physical team' : side.special > 2 * side.physical ? ': a special team' : ''));
  var setup = live.filter(function (m) { var b = (m.read.facts || {}).boosts || {}; return b.atk || b.spa || b.spe; }).map(function (m) { return m.build.species; }); if (setup.length) T.push('Sets up: ' + names(setup));
  var cat = function (c) { return uniqS((comp.moves.categories[c] || []).map(function (h) { return h.split(':')[0]; })); };
  var piv = cat('pivot_move').concat(cat('baton_pass')); if (piv.length) T.push('Pivots: ' + names(uniqS(piv)));
  var pri = cat('priority_attack'); if (pri.length) T.push('Priority: ' + names(pri));
  var st = cat('status_infliction'); if (st.length) T.push('Spreads status: ' + names(st));
  var p = TM.team.profile; if (p.style && p.style !== 'default' && typeof TR_PHILOSOPHY !== 'undefined') T.push('Coached as <b>' + esc(TR_PHILOSOPHY[p.style].name) + '</b>: ' + esc(TR_PHILOSOPHY[p.style].why));
  var list = function (xs, cls) { return xs.length ? '<ul class="scout ' + cls + '">' + xs.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>' : '<div class="tiny muted">Nothing stands out.</div>'; };
  return card('Scouting report', '<div class="scout3"><div><div class="eyebrow" style="color:var(--forest-3)">Strengths</div>' + list(S1, 'pos') + '</div><div><div class="eyebrow" style="color:var(--ember-2)">Weaknesses</div>' + list(W, 'neg') + '</div><div><div class="eyebrow">Tendencies</div>' + list(T, '') + '</div></div>' +
    '<div class="tiny muted" style="margin-top:8px">From each member\'s one-on-ones against the generation\'s Elite Four and Champions (level 100), the type chart (abilities included) and the moves the engines read (empty slots filled with each one\'s strongest set). The checks behind it are in trainers/team_roles.json → team.questions.</div>',
    {eyebrow: 'Strengths · weaknesses · tendencies · ' + plural(live.length, 'Pokémon') + ' read', tools: false});
}

/* ---- shapes and roles ---- */
function tmShapes(comp, live) {
  var cfg = TeamRoles.config(), sh = cfg.team.shapes;
  var head = '<tr><th>Pokémon</th>' + TeamRoles.ORDER.map(function (r) { return '<th>' + esc(roleName(r)) + '</th>'; }).join('') + '<th>Plays like</th></tr>';
  var rows = live.map(function (m) { return '<tr><td><a href="#/pokemon/' + encodeURIComponent(m.ind.id) + '">' + esc(m.ind.nickname || m.build.species) + '</a></td>' + TeamRoles.ORDER.map(function (r) { var x = roleOf(m.read, r);
    return '<td><span class="rcell' + (x.earned ? ' on' : '') + '" title="' + esc(x.why.join(' · ')) + '">' + x.score.toFixed(2) + '</span></td>'; }).join('') + '<td class="tiny">' + esc(m.read.second_layer.primary.name || '—') + '</td></tr>'; }).join('');
  var tot = '<tr><td class="tiny muted">earned by</td>' + TeamRoles.ORDER.map(function (r) { return '<td><b>' + comp.roles[r].length + '</b></td>'; }).join('') + '<td></td></tr>';
  var shapes = sh.order.map(function (id) { var s = sh[id], gap = shapeGap(s, comp.counts), fit = id === comp.shape.id;
    return '<div class="shape' + (fit ? ' fit' : '') + '"><div class="small"><b>' + shapeHtml({id: id, label: s.label, word: (cfg.naming.words.team_shape || {})[id]}) + '</b> ' + (fit ? chip('this team', 'gold') : gap.length ? '' : chip('fits', '')) + '</div>' +
      '<div class="tiny muted">' + esc(s.explain || '') + '</div><div class="tiny" style="margin-top:3px">' + (gap.length ? 'needs ' + esc(gap.join(', ')) : 'its needs are met') + '</div></div>'; }).join('');
  var missing = TeamRoles.ORDER.filter(function (r) { return !comp.roles[r].length; });
  return card('Shapes & roles', '<div class="grid"><div class="c7"><div class="eyebrow">Each Pokémon on the five team roles</div><div style="overflow-x:auto"><table class="t rmatrix">' + head + rows + tot + '</table></div>' +
      '<div class="tiny muted" style="margin-top:6px">The score is 0-1; green is earned. Hover a score for the numbers behind it, or open the Pokémon for its full work.</div>' +
      (missing.length ? '<div class="small" style="margin-top:10px"><b>Missing:</b> ' + esc(join(missing.map(roleName))) + '. <a class="link" href="javascript:void 0" onclick="tmFill(\'role:' + missing[0] + '\')">Find a ' + esc(roleName(missing[0])) + '</a></div>' : '<div class="small" style="margin-top:10px">Every team role is covered.</div>') +
      '<div class="eyebrow" style="margin-top:14px">What each role asks</div>' + TeamRoles.ORDER.map(function (r) { return '<div class="tiny" style="margin:3px 0"><b>' + esc(roleName(r)) + ':</b> ' + esc(cfg.roles[r].question) + ' <span class="muted">' + esc(cfg.roles[r].explain) + '</span></div>'; }).join('') + '</div>' +
    '<div class="c5"><div class="eyebrow">The team\'s shape: the first that fits, in this order</div><div class="shapes" style="margin-top:6px">' + shapes + '</div></div></div>',
    {eyebrow: 'Roles · shape · what\'s missing', tools: false});
}
function shapeGap(s, n) {   // what a shape still needs, in words
  var out = [], word = {sweeper: 'Sweeper', wall: 'Wall', tank: 'Tank', support: 'Support', ace: 'Ace', sweeper_or_ace: 'Sweeper or Ace', wall_or_tank: 'Wall or Tank', slow: 'slow Pokémon (base Speed 60 or less)',
    'feature:trick_room': 'Trick Room setter', 'feature:weather_setter': 'weather setter', 'feature:weather_user': 'Pokémon that uses the weather', 'feature:baton_pass': 'Baton Pass user', 'feature:setup': 'setup user'};
  Object.keys(s.needs || {}).forEach(function (k) { var d = s.needs[k] - (n[k] || 0); if (d > 0) out.push(d + ' more ' + (word[k] || k)); });
  Object.keys(s.at_most || {}).forEach(function (k) { var d = (n[k] || 0) - s.at_most[k]; if (d > 0) out.push(d + ' fewer ' + (word[k] || k)); });
  return out;
}

/* ---- coverage ---- */
function tmCoverage(comp) {
  var defCells = comp.defense.map(function (r) {

  return card('Battle with this team', '<div class="small">Six on six in the Arena, with this team\'s trainer making the calls.</div><div class="row" style="margin-top:8px;flex-wrap:wrap"><div style="flex:2;min-width:200px"><label class="l">Against</label><select class="f" id="tmvs"><option value="lib:' + champ + '">loading the trainers…</option></select></div>' +
      '<div><label class="l">Battles</label><select class="f" id="tmn"><option>10</option><option selected>20</option><option>50</option><option>100</option></select></div></div>' +
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" id="tmgo">Battle</button><a class="btn" id="tmopen" href="#/arena?a=' + encodeURIComponent('mine:' + Teams.id(TM.game)) + '">Open in the Arena</a><a class="btn" href="#/legends">Legends</a><a class="btn" href="#/leagues">Leagues</a></div>' +
      arProgress('tmprog') + '<div id="tmbout" style="margin-top:10px"></div>',
    {eyebrow: 'The Arena · Showdown\'s Gen IV engine', tools: false});
}
function tmBattleSetup() {
  var sel = document.getElementById('tmvs'); if (!sel || sel.getAttribute('data-on')) return;
  Arena.ready().then(function () {
    var g = Arena.choices(), cur = sel.value, grp = [['champions', 'Champions and Red'], ['legends', 'Legends'], ['anime', 'The anime and the all-time'], ['cartridge', 'The games\' trainers'], ['converted', 'Gen II-III under Gen IV rules']];
    sel.innerHTML = grp.filter(function (x) { return (g[x[0]] || []).length; }).map(function (x) { return '<optgroup label="' + esc(x[1]) + '">' + g[x[0]].map(function (o) { return '<option value="' + esc(o.ref) + '"' + (o.ref === cur ? ' selected' : '') + '>' + esc(o.label) + '</option>'; }).join('') + '</optgroup>'; }).join('');
    sel.setAttribute('data-on', '1');
    var upd = function () { var a = document.getElementById('tmopen'); if (a) a.href = '#/arena?a=' + encodeURIComponent('mine:' + Teams.id(TM.game)) + '&b=' + encodeURIComponent(sel.value); }; sel.onchange = upd; upd();
  }).catch(function (e) { var b = document.getElementById('tmbout'); if (b) b.innerHTML = arNeedsEngine(e); });
}
function tmBattle() {
  if (!Teams.filled(TM.team)) { toast('Add a Pokémon to the team first.'); return; }
  var bare = Teams.members(TM.team).filter(function (m) { return m && !(m.build.moves || []).filter(Boolean).length; });   // the engine won't invent a set
  if (bare.length) { document.getElementById('tmprog').innerHTML = '<div class="notice">Pick moves first: ' + bare.map(function (m) { return '<a class="link" href="#/pokemon/' + encodeURIComponent(m.ind.id) + '">' + esc(m.ind.nickname || m.ind.species) + '</a>'; }).join(', ') +
    (bare.length > 1 ? ' have' : ' has') + ' none yet, and the Arena only plays the moves you\'ve given it.</div>'; return; }
  var btn = document.getElementById('tmgo'), a = 'mine:' + Teams.id(TM.game), b = document.getElementById('tmvs').value, n = +document.getElementById('tmn').value; btn.disabled = true;
  Arena.match(a, b, {n: n, lens: 'standardized', ours: 'blackthorn', theirs: 'blackthorn', onProgress: arTick('tmprog', 'Playing')}).then(function (m) {
    btn.disabled = false; document.getElementById('tmprog').innerHTML = '';
    var key = 'm' + Date.now(); Arena.save(key, m); document.getElementById('tmbout').innerHTML = arResult(m, key);
    var r = m.result;
    arRecord({kind: 'match', a: a, b: b, a_name: m.a.label, b_name: m.b.label, n: r.n, won: r.won, lost: r.lost, drew: r.drew, lens: 'standardized', ours: 'blackthorn', theirs: 'blackthorn',
      ruleset: r.job.ruleset, seed: r.seed, members: JSON.stringify(r.summary.members.a.map(function (x) { return arMembersRow(x, a, r.n); })), them: JSON.stringify(r.summary.members.b.map(function (x) { return arMembersRow(x, b, r.n); })),
      _timeline: 'Arena: ' + m.a.label + ' ' + r.won + '–' + r.lost + (r.drew ? '–' + r.drew : '') + ' against ' + m.b.label}).then(function () { var el = document.getElementById('tmarena'); if (el) el.innerHTML = tmArenaLine(); });
  }).catch(function (e) { btn.disabled = false; arFail('tmprog', e); });
}

/* ---- binding ---- */
function tmBind(p) {
  var drag = null, t = null;
  p.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target : null; if (!el) return;
    var j = el.closest('[data-jump]'); if (j) { var s = document.getElementById(j.getAttribute('data-jump')); if (s) s.scrollIntoView({behavior: 'smooth', block: 'start'}); if (j.getAttribute('data-jump') === 'tm-battle') tmBattleSetup(); return; }
    var nu = el.closest('[data-nudge]'); if (nu) { e.stopPropagation(); var a = nu.getAttribute('data-nudge').split(':'); tmMove(+a[0], +a[0] + +a[1]); return; }
    var o = el.closest('[data-out]'); if (o) { e.stopPropagation(); tmOut(+o.getAttribute('data-out')); return; }
    var put = el.closest('[data-tmput]'); if (put) { tmPut(put.getAttribute('data-tmput'), +(document.querySelector('[data-tmf="slot"]') || {value: 0}).value); return; }
    if (el.closest('#tmswgo')) { tmSwapTry(); return; }
    if (el.closest('#tmgo')) { tmBattle(); return; }
    var tile = el.closest('[data-go]'); if (tile) nav('#/pokemon/' + encodeURIComponent(tile.getAttribute('data-go')));
  });
  p.addEventListener('dragstart', function (e) { var tl = e.target.closest && e.target.closest('.tile[data-slot]'); if (!tl) return; drag = +tl.getAttribute('data-slot'); tl.classList.add('drag'); try { e.dataTransfer.setData('text/plain', String(drag)); e.dataTransfer.effectAllowed = 'move'; } catch (x) {} });
  p.addEventListener('dragend', function () { p.querySelectorAll('.tile').forEach(function (x) { x.classList.remove('drag', 'over'); }); });
  p.addEventListener('dragover', function (e) { var tl = e.target.closest && e.target.closest('.tile[data-slot]'); if (!tl || drag == null) return; e.preventDefault(); p.querySelectorAll('.tile').forEach(function (x) { x.classList.toggle('over', x === tl); }); });
  p.addEventListener('drop', function (e) { var tl = e.target.closest && e.target.closest('.tile[data-slot]'); if (!tl || drag == null) return; e.preventDefault(); var to = +tl.getAttribute('data-slot'), from = drag; drag = null; tmMove(from, to); });
  p.addEventListener('submit', function (e) { if (e.target.id === 'tmtf') { e.preventDefault(); tmSaveTrainer(e.target); } });
  p.addEventListener('toggle', function (e) { if (e.target.id === 'tmdials' && e.target.open) tmDials(); }, true);
  p.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-dial'); if (k) { var v = document.getElementById('tmv-' + k); if (v) v.textContent = e.target.value; tmTraits(); return; }
    var f = e.target.getAttribute && e.target.getAttribute('data-tmf'); if (f && f !== 'slot') { TM.filters[f] = e.target.value; clearTimeout(t); t = setTimeout(tmCandRun, 250); } });
  p.addEventListener('change', function (e) {
    var el = e.target;
    if (el.name === 'style' && el.form && el.form.id === 'tmtf') { var w = document.getElementById('tmstylewhy'); if (w) w.textContent = (TR_PHILOSOPHY[el.value] || {}).why || '';
      var ph = (TR_PHILOSOPHY[el.value] || {}).params || {}, D = Arena.X() ? Arena.X().TRAINER_DEFAULTS : null;
      if (D) document.querySelectorAll('[data-dial]').forEach(function (d) { var k = d.getAttribute('data-dial'); d.value = ph[k] != null ? ph[k] : D[k]; var v = document.getElementById('tmv-' + k); if (v) v.textContent = d.value; }); tmTraits(); return; }
    if (el.form && el.form.id === 'tmswf' && (el.name === 'who' || el.name === 'what')) { tmSwapFields(); return; }
    var f = el.getAttribute && el.getAttribute('data-tmf'); if (f) { if (f === 'slot') TM.target = +el.value; else TM.filters[f] = el.value; tmCandRun(); }
  });
  if ('IntersectionObserver' in window) { var io = new IntersectionObserver(function (es) { es.forEach(function (x) { if (x.isIntersecting) { tmBattleSetup(); io.disconnect(); } }); }); var bb = document.getElementById('tm-battle'); if (bb) io.observe(bb); }
}
function teamsHome() {   // #/team: the six teams side by side
  return labsReady().then(function () {
    return '<div class="eyebrow">Your teams</div><h1 style="margin:6px 0">Six journeys, six trainers</h1><p class="lede">One team for each game, each with its own trainer and philosophy. Open one to build it.</p>' + journeyCards();
  });
}
function journeyCards() {
  return '<div class="jcards">' + JOURNEYS.map(function (g) { var t = Teams.get(g), mem = Teams.members(t), n = mem.filter(Boolean).length, J = JOURNEY[g];
    return '<a class="jcard" href="#/team/' + g + '" style="--hue:' + J.hue + '"><div class="eyebrow">' + esc(journeyRegions(g).map(function (r) { return r.name; }).filter(function (x, i, a) { return a.indexOf(x) === i; }).join(' · ')) + '</div>' +
      '<h3>' + esc(GAME_NAME[g]) + '</h3><div class="tiny muted">' + esc(n ? whose(t) + ' team · ' + n + ' of 6' : 'Not started') + '</div>' +
      '<div class="jsix">' + mem.map(function (m) { return m ? '<img class="pix" src="' + spriteOf(numOf(m.ind.species), g, m.ind.shiny) + '" alt="' + esc(m.ind.species) + '">' : '<span></span>'; }).join('') + '</div>' +
      '<div class="tiny" style="margin-top:6px;color:var(--gold-2)">' + (n ? 'Open the team →' : 'Start the ' + esc(GAME_NAME[g]) + ' team →') + '</div></a>'; }).join('') + '</div>';
}
route(/^\/team\/?$/, teamsHome, 'Your teams', '#/team');
route(/^\/team\/(\w+)$/, teamLab, function (g) { return 'Your teams · ' + (GAME_NAME[g] || g); }, '#/team');
</script>
