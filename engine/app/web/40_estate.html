<script>
/* ===== The Estate, the Glasshouse, the preserve and the satellite (v2.5, docs/ESTATE.md) ======================
   One compound, one drill-down (A-117): the estate → a facility (#/facility/<id>, web/93_survival.html) → its jobs and
   who could hold them. #/homestead opens the estate. Who lives here and who could do what is read from your teams by
   the Estate engine (web/39_estate.html) over the capability records; the design and the reference from estate.json.
   Nothing on these pages is generated: a job nobody of yours holds says so. */
function landName(z) { return String(z).replace('_', ' & '); }
var ESTATE_OLD = {"dragon's den": 'dragons-den', 'blackthorn city': 'blackthorn-city', 'cold vault': 'cold-vault', 'day-care preserve': 'daycare', 'nursery & hatchery': 'nursery',
  'kitchen & orchard': 'kitchen-orchard', 'works (building & upkeep)': 'works', 'security & watch': 'security', 'studbook & archive': 'glasshouse'};   // v1's place names, for old links
var TONE_DOT = {ok: '', part: 'gold', open: 'warn'};
function estateAll() { return !!store('estate-all'); }
function estateRes() { return Estate.residents(estateAll()); }
function estateReports(res) {   // every facility against the residents, with its newest staff plan
  return Cap.pack().facilities.map(function (f) { var plan = staffPlans(f.id)[0], r = Estate.report(f.id, res, plan ? planStaff(plan) : []); r.plan = plan || null; r.fac = f; return r; });
}
function jobsOf(reps, res) {   // per resident: the jobs it can hold on a game mechanic or your record
  var out = res.map(function () { return []; });
  reps.forEach(function (r) { r.requirements.forEach(function (q) { q.candidates.forEach(function (c) { if (c.can_staff) out[c.i].push(r.name + ': ' + q.name.toLowerCase()); }); }); });
  return out;
}
function facilityHref(id) { return id === 'glasshouse' ? '#/glasshouse' : id === 'daycare' ? '#/preserve' : '#/facility/' + id; }
function siteChip(s) { return !s ? chip('no site has its land', 'ember') : s.role === 'headquarters' ? chip('Blackthorn', 'forest') : chip('Sevii Islands', 'ice'); }
function estate(query) {
  var q = qparse(query);
  if (q.all != null) store('estate-all', q.all === '1');
  return estateReady().then(function () {
    var E = Estate.pack(), res = estateRes(), c = Estate.census(res), reps = estateReports(res), jobs = jobsOf(reps, res), tones = {};
    reps.forEach(function (r) { tones[r.facility] = Estate.tone(r); });
    var hq = Estate.hq(), sats = Estate.satellites(), atHq = c.at[hq.id].length, atSat = sats.reduce(function (n, s) { return n + c.at[s.id].length; }, 0);
    var lands = Object.keys(c.land).sort(function (a, b) { return c.land[b] - c.land[a] || (a < b ? -1 : 1); });
    var pens = Object.keys(c.pens).filter(function (g) { return g !== 'Undiscovered'; }).sort(function (a, b) { return c.pens[b].length - c.pens[a].length || (a < b ? -1 : 1); });
    var top = function (o, ks) { return Math.max.apply(null, ks.map(function (k) { return o(k); }).concat([1])); };
    var maxLand = top(function (z) { return c.land[z]; }, lands), maxPen = top(function (g) { return c.pens[g].length; }, pens);
    var quote = E.words[Math.floor(Date.now() / 864e5) % E.words.length], others = myInds(null).length - Estate.residents(false).length;
    after(function (p) { bindMap(p.querySelector('#bigmap')); bindFilter(p); var t = p.querySelector('#estall'); if (t) t.onchange = function () { nav('#/estate?all=' + (t.checked ? 1 : 0)); }; });
    return '<div class="eyebrow">My World · the compound</div><h1 style="margin:6px 0 6px">The Blackthorn Estate</h1>' +
      '<p class="lede">One headquarters in the Blackthorn highlands (D-041) and one satellite on the Sevii Islands (D-079). The residents are your teams: any Pokémon on them could retire to the ranch, and nobody is assigned (D-037). ' +
        (res.length ? '<b>' + atHq + '</b> would live at Blackthorn and <b>' + atSat + '</b> on the Sevii Islands, each where its own land is. ' : '') +
        'A Pokémon holds a job here on a game mechanic it has or a world record you approved (D-039); the land meets a few jobs on its own.</p>' +
      '<div class="small" style="margin:10px 0 0;color:var(--text-2);font-style:italic">“' + esc(quote[0]) + '” <span class="tiny muted" style="font-style:normal">you, ' + esc(quote[1]) + '</span></div>' +
      (res.length ? '' : '<div class="notice" style="margin-top:14px">Nobody lives on the estate yet: your six teams are empty' + (others > 0 ? ' (you have ' + plural(others, 'Pokémon') + ' off the teams: tick “your other Pokémon” below to count them)' : '') + '. Put Pokémon on a team and they move in here, each to its own land. <a href="#/team">Your teams →</a></div>') +
      '<div class="grid" style="margin-top:18px"><div class="c8">' + card('The plate', '<div class="svgwrap" id="bigmap" style="border-radius:12px;overflow:hidden">' + Art.estateMap(tones) + '</div><p class="tiny muted" style="margin:8px 0 0">Tap a place to open it. A pin\'s colour is its jobs against your residents: green, every job is held by one of yours or by the land; gold, some are open; ember, a critical job nobody of yours holds.</p>', {eyebrow: 'Headquarters · Johto', tools: false}) + '</div>' +
      '<div class="c4">' + card('Sites', E.sites.map(function (s) { var n = c.at[s.id].length;
          return '<div class="line ' + (s.role === 'headquarters' ? 'forest' : 'ice') + '"><a href="' + (s.role === 'headquarters' ? '#/estate/blackthorn-city' : '#/sevii') + '"><b>' + esc(s.name) + '</b></a> ' + chip(s.status, s.status.indexOf('approved') === 0 ? 'forest' : 'ember') +
            '<div class="tiny muted">' + esc(s.anchor) + ' · ' + plural(n, 'resident') + '</div><div class="small" style="margin-top:4px;color:var(--text-2)">' + esc(s.why || '') + '</div>' +
            '<div style="margin-top:6px">' + s.offers.map(function (o) { return '<span title="' + esc((s.offers_note || {})[o] || E.zones[o] || '') + '">' + chip(landName(o) + ((s.offers_note || {})[o] ? ' *' : ''), (s.offers_note || {})[o] ? 'gold' : '') + '</span>'; }).join(' ') + '</div>' +
            ((s.offers_note || {}).volcanic ? '<div class="tiny muted" style="margin-top:4px">* ' + esc(s.offers_note.volcanic) + '</div>' : '') + '</div>'; }).join('') +
        (c.homeless.length ? '<div class="line ember small" style="margin-top:10px">' + esc(c.homeless.map(function (r) { return r.label; }).join(', ')) + ': no site offers ' + esc(c.homeless.map(function (r) { return landName(r.primary); }).filter(function (x, i, a) { return a.indexOf(x) === i; }).join(' or ')) + ' yet.</div>' : '') +
        '<div class="tiny muted" style="margin-top:8px">Not chosen: ' + esc(E.not_chosen.join('; ')) + ' (D-079).</div>', {eyebrow: 'One headquarters, one satellite'}) + '</div>' +
      '<div class="c12">' + card('Facilities', '<div class="fac">' + reps.map(function (r) { return facilityCard(r, tones[r.facility]); }).join('') + '</div>', {eyebrow: 'Each is a set of jobs · staff are Pokémon and people (D-039)'}) + '</div>' +
      '<div class="c4">' + card('Land', lands.length ? lands.map(function (z) { return '<div class="goal"><div><div class="small">' + esc(landName(z)) + ' <span class="tiny muted">' + esc(E.zones[z] || '') + '</span></div><div class="bar forest" style="margin-top:4px"><i style="width:' + (c.land[z] / maxLand * 100) + '%"></i></div></div><b class="num">' + c.land[z] + '</b></div>'; }).join('') : '<div class="tiny muted">Nobody yet.</div>', {eyebrow: 'Residents by their own primary land'}) + '</div>' +
      '<div class="c4">' + card('Nursery pens', pens.length ? pens.map(function (g) { return '<div class="goal"><div><div class="small">' + esc(g) + ' <span class="tiny muted">' + esc(c.pens[g].map(function (r) { return r.label; }).slice(0, 6).join(', ')) + (c.pens[g].length > 6 ? '…' : '') + '</span></div><div class="bar" style="margin-top:4px"><i style="width:' + (c.pens[g].length / maxPen * 100) + '%"></i></div></div><b class="num">' + c.pens[g].length + '</b></div>'; }).join('') : '<div class="tiny muted">Nobody yet.</div>', {eyebrow: 'Residents per egg group'}) + '</div>' +
      '<div class="c4">' + worldCard() + '</div>' +
      '<div class="c12">' + card('Residents', '<div class="row" style="margin-bottom:10px;align-items:center"><input class="f" data-filter="#restable" placeholder="Filter by Pokémon, team, land, job…"><label class="small" style="white-space:nowrap"><input type="checkbox" id="estall"' + (estateAll() ? ' checked' : '') + '> your other Pokémon too</label></div>' +
        (res.length ? '<div class="scroll"><table class="t" id="restable"><thead><tr><th></th><th>Pokémon</th><th>Team</th><th>Lives at</th><th>Land</th><th>Size</th><th>Climate</th><th>Water</th><th>Egg groups</th><th>Jobs it can hold</th></tr></thead><tbody>' +
        res.map(function (r, i) { var j = jobs[i]; return '<tr class="click" onclick="nav(\'#/mon/' + encodeURIComponent(r.id) + '\')"><td><img src="' + spriteOf(numOf(r.species), r.game, r.ind.shiny) + '" style="width:40px;height:40px;image-rendering:pixelated" onerror="this.style.opacity=0"></td><td><b>' + esc(r.label) + '</b>' + (r.label !== r.species ? ' <span class="tiny muted">' + esc(r.species) + '</span>' : '') + '</td>' +
          '<td>' + (r.team ? esc(GAME_NAME[r.team.game]) : '<span class="muted">' + esc(GAME_NAME[r.game]) + ', off the team</span>') + '</td><td>' + siteChip(r.site) + '</td><td>' + esc(r.habitat.zones.map(landName).join(', ')) + '</td><td>' + esc(r.habitat.size) + '</td><td>' + esc(r.habitat.climate) + '</td><td>' + esc(r.habitat.water) + '</td>' +
          '<td class="small">' + esc(r.eggs.groups.join(', ')) + '</td><td class="tiny muted">' + (j.length ? esc(j.slice(0, 3).join('; ')) + (j.length > 3 ? ' +' + (j.length - 3) : '') : 'none on a mechanic or a record yet') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">No residents.</div>'),
        {eyebrow: 'Every Pokémon on your teams, a possible resident (D-037, A-109)'}) + '</div></div>';
  });
}
function facilityCard(r, tone) {
  var f = r.fac, st = FAC_STATUS[f.status] || [f.status, ''], n = r.requirements.length, can = r.requirements.filter(function (q) { return q.can_staff.length; }).length, land = r.requirements.filter(function (q) { return q.land.length && !q.can_staff.length; }).length;
  var nobody = r.requirements.filter(function (q) { return !q.can_staff.length && !q.land.length; });
  return '<a class="f" href="' + facilityHref(f.id) + '"><div style="display:flex;justify-content:space-between;align-items:center"><span class="fn">' + esc(f.name) + '</span><span class="status-dot ' + TONE_DOT[tone] + '"></span></div>' +
    '<div class="tiny muted" style="margin:4px 0 8px">' + esc(st[0] + (f.decision ? ' · ' + f.decision : '')) + (f.people && f.people.length ? ' · people: ' + esc(f.people.join(', ')) : '') + '</div>' +
    '<div class="small" style="color:var(--text-2)">' + esc(f['function']) + '</div>' +
    '<div class="tiny" style="margin-top:8px">' + can + ' of ' + n + ' jobs one of yours can hold' + (land ? '; the land meets ' + land + ' more' : '') + '</div>' +
    (nobody.length ? '<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">' + nobody.map(function (q) { return chip('open: ' + q.name.toLowerCase(), q.priority === 'critical' ? 'ember' : ''); }).join('') + '</div>' : '') +
    '<div class="tiny muted" style="margin-top:6px">' + (r.plan ? 'Staff plan “' + esc(r.plan.title || 'yours') + '”: ' + r.staffed.length + ' of ' + n + ' staffed' : 'No staff plan yet') + '</div></a>';
}
function worldCard() {
  var P = Cap.pack(), world = Estate.world(), ok = world.filter(function (w) { return w.status === 'approved'; }), wait = world.filter(function (w) { return w.status !== 'approved'; });
  var unbound = P.world.filter(function (w) { return !world.some(function (x) { return x.id === w.id; }); }).map(function (w) { return w.species; }).filter(function (x, i, a) { return a.indexOf(x) === i; });
  var line = function (w) { var i = S.store.individuals[w.ind] || {}; return '<div class="tiny" style="margin:3px 0"><b>' + esc(w.id) + '</b> <a href="#/mon/' + encodeURIComponent(w.ind) + '">' + esc(i.nickname || w.species) + '</a> <span class="muted">' + esc(GAME_NAME[i.game] || '') + '</span> · ' + esc(Cap.capName(w.cap).toLowerCase()) + '</div>'; };
  return card('World records', '<div class="goal"><div class="small">Approved, on your Pokémon</div><b class="num">' + ok.length + '</b></div>' + ok.map(line).join('') +
    (wait.length ? '<div class="eyebrow" style="margin:10px 0 4px">Waiting on you</div>' + wait.map(line).join('') : '') +
    (unbound.length ? '<div class="tiny muted" style="margin-top:8px">Waiting for a Pokémon: ' + esc(unbound.join(', ')) + '. Each record follows your Pokémon of that species in its own game: the D-033 ones your HeartGold Pokémon (A-111).</div>' : '') +
    '<div class="tiny muted" style="margin-top:8px">Approve a new one from a facility\'s job: the button sits on each candidate of yours.</div>', {eyebrow: 'Records you approve make a Pokémon staff (D-039)'});
}
function bindFilter(root) {
  root.querySelectorAll('[data-filter]').forEach(function (inp) {
    var t = root.querySelector(inp.getAttribute('data-filter')); if (!t) return;
    inp.addEventListener('input', function () { var q = inp.value.toLowerCase(); t.querySelectorAll('tbody tr').forEach(function (tr) { tr.style.display = tr.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none'; }); });
  });
}
function place(name) {
  var id = ESTATE_OLD[name] || name;
  if (id === 'sevii') return seviiPage();
  if (id === 'daycare') return preservePage();
  if (id === 'glasshouse') return glasshouse('overview');
  return estateReady().then(function () {
    var P = Cap.pack(), E = Estate.pack(), hq = Estate.hq(), res = estateRes();
    if (P.facilities.some(function (f) { return f.id === id; })) return facilityPage(id);
    var head = function (eyebrow, title, lede) { return '<a class="link" href="#/estate">← The estate</a><div class="eyebrow" style="margin-top:12px">' + eyebrow + '</div><h1 style="margin:6px 0">' + esc(title) + '</h1><p class="lede">' + esc(lede) + '</p>'; };
    if (id === 'blackthorn-city') return head('The headquarters · ' + esc(hq.region), hq.name, hq.why || '') + '<div class="grid" style="margin-top:14px"><div class="c7">' +
      card('What the games say', hq.game_facts.map(function (g) { return '<div class="line small">' + esc(g) + '</div>'; }).join('') + (hq.heritage ? '<p class="small muted">' + esc(hq.heritage) + '</p>' : ''), {eyebrow: esc(hq.anchor)}) + '</div>' +
      '<div class="c5">' + card('Its land', hq.offers.map(function (o) { return '<div class="line small"><b>' + esc(landName(o)) + '</b> <span class="muted">' + esc((hq.offers_note || {})[o] || E.zones[o] || '') + '</span></div>'; }).join(''), {eyebrow: 'What Blackthorn offers'}) + '</div></div>';
    if (id === 'geothermal') {
      var met = []; P.facilities.forEach(function (f) { f.requirements.forEach(function (q) { (q.infrastructure || []).forEach(function (x) { if (x.land) met.push({f: f, q: q, x: x}); }); }); });
      var hot = res.filter(function (r) { return r.habitat.zones.indexOf('volcanic') >= 0; });
      return head('The land · A-110, provisional', 'Geothermal ground', (hq.offers_note || {}).volcanic || '') + '<div class="grid" style="margin-top:14px"><div class="c7">' +
        card('Jobs the land meets', met.map(function (m) { return '<div class="line small"><a href="' + facilityHref(m.f.id) + '"><b>' + esc(m.f.name) + '</b></a>: ' + esc(m.q.name.toLowerCase()) + ' <span class="muted">· ' + esc(m.x.name) + (m.x.note ? ' (' + esc(m.x.note) + ')' : '') + '</span></div>'; }).join(''), {eyebrow: 'Land infrastructure counts; built infrastructure doesn\'t (A-112)'}) + '</div>' +
        '<div class="c5">' + card('Who it\'s home to', hot.length ? hot.map(function (r) { return '<div class="line small"><b>' + esc(r.label) + '</b> <span class="muted">' + esc(r.habitat.zones.map(landName).join(', ')) + '</span></div>'; }).join('') : '<div class="tiny muted">None of your residents lives on volcanic ground.</div>', {eyebrow: 'Residents with volcanic land'}) + '</div></div>';
    }
    return '<div class="notice">No place called ' + esc(name) + ' on the estate. <a href="#/estate">The estate →</a></div>';
  });
}

/* ---- the satellite: the Sevii Islands (D-079, A-115) ---- */
function seviiPage() {
  return estateReady().then(function () {
    var E = Estate.pack(), s = Estate.satellites()[0], res = estateRes(), c = Estate.census(res), here = c.at[s.id], hq = Estate.hq();
    var only = s.offers.filter(function (o) { return hq.offers.indexOf(o) < 0; }), places = Object.keys(E.sevii.wild);
    return '<a class="link" href="#/estate">← The estate</a><div class="eyebrow" style="margin-top:12px">The satellite · ' + esc(s.region) + ' · ' + esc(s.status) + '</div><h1 style="margin:6px 0">' + esc(s.name) + '</h1><p class="lede">' + esc(s.why) + ' Blackthorn has every land but ' + esc(only.map(landName).join(' and ')) + ', so the islands are where the sea Pokémon live.</p>' +
      '<div class="grid" style="margin-top:14px"><div class="c5">' + card('What the games say', s.game_facts.map(function (g) { return '<div class="line small">' + esc(g) + '</div>'; }).join('') + (s.heritage ? '<p class="small muted">Heritage: ' + esc(s.heritage) + '</p>' : ''), {eyebrow: esc(s.anchor)}) +
        card('Who lives here', here.length ? here.map(function (r) { return '<div class="line small"><img src="' + spriteOf(numOf(r.species), r.game, r.ind.shiny) + '" style="width:32px;height:32px;vertical-align:middle;image-rendering:pixelated"> <b>' + esc(r.label) + '</b> <span class="muted">' + esc(landName(r.primary)) + ' · ' + esc(r.team ? GAME_NAME[r.team.game] + ' team' : GAME_NAME[r.game]) + '</span></div>'; }).join('') : '<div class="tiny muted">None of your residents needs the islands: Blackthorn has their land.</div>', {eyebrow: 'Residents whose land is only here', style: 'margin-top:16px'}) + '</div>' +
      '<div class="c7">' + card('The islands\' wild Pokémon', places.map(function (p) { var sp = E.sevii.wild[p];
          return '<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)"><b class="small">' + esc(p) + '</b> <span class="tiny muted">' + plural(sp.length, 'species', 'species') + '</span><div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:2px">' +
            sp.map(function (n) { return '<a href="#/atlas/' + numOf(n) + '" title="' + esc(n) + '"><img src="' + sprite(numOf(n), 'firered') + '" style="width:34px;height:34px;image-rendering:pixelated" onerror="this.style.opacity=0"></a>'; }).join('') + '</div></div>'; }).join(''),
        {eyebrow: esc(E.sevii.source)}) + '</div></div>';
  });
}

/* ---- the Day-Care preserve (D-040, D-079, A-114) ---- */
function preservePage() {
  return Promise.all([estateReady(), libReady().catch(function () { return null; })]).then(function () {
    var E = Estate.pack(), d = E.preserve, res = estateRes(), plan = staffPlans('daycare')[0], r = Estate.report('daycare', res, plan ? planStaff(plan) : []);
    var clients = Library.ready() ? Library.identities().filter(function (x) { return x.categories.some(function (c) { return c === 'champion' || c === 'elite_four'; }); })
      .sort(function (a, b) { return a.name < b.name ? -1 : 1; }) : [];
    return '<a class="link" href="#/estate">← The estate</a><div class="eyebrow" style="margin-top:12px">' + esc(d.access) + ' · the one open part of the ranch (D-040)</div><h1 style="margin:6px 0">The Day-Care preserve</h1><p class="lede">' + esc(d.design) + '</p>' +
      '<div class="grid" style="margin-top:14px"><div class="c7">' + card('Its jobs', r.requirements.map(function (q) {
          return '<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)"><b>' + esc(q.name) + '</b> ' + standChip(q.standing) + ' <span class="tiny muted">' + esc(q.why) + '</span><div class="tiny" style="margin-top:3px">' +
            (q.can_staff.length ? 'Yours who can hold it: ' + esc(q.can_staff.join(', ')) : '<span style="color:var(--ember-2)">none of yours on a mechanic or a record</span>' + (q.candidates.length ? ' <span class="muted">(' + plural(q.candidates.length, 'candidate') + ' on other evidence)</span>' : '')) + '</div></div>'; }).join('') +
          '<div style="margin-top:10px"><a class="btn sm gold" href="#/facility/daycare">Staff it →</a></div>', {eyebrow: 'Read against your residents (D-039)'}) +
        card('Not decided yet', d.open.map(function (x) { return '<div class="line small">' + esc(x) + '</div>'; }).join('') + '<div class="tiny muted" style="margin-top:6px">Left open on purpose: nothing about stays, prices or the land is made up.</div>', {eyebrow: 'Your calls', style: 'margin-top:16px'}) + '</div>' +
      '<div class="c5">' + card('People', d.people.map(function (p) { return '<div class="line">' + esc(p) + ' <span class="tiny muted">(to author)</span></div>'; }).join(''), {eyebrow: 'D-039'}) +
        card('Who could be a client', '<p class="tiny muted" style="margin-top:0">A proposal (A-114): “it\'s other amazing trainers” (you, D-079). The Champions and the Elite Four from the Trainer Library. Nobody has booked.</p>' +
          (clients.length ? clients.map(function (x) { return '<div class="line small"><a href="#/trainers/' + encodeURIComponent(x.id) + '"><b>' + esc(x.name) + '</b></a> <span class="muted">' + esc((x.titles || [])[0] || '') + '</span>' + ((x.signature || []).length ? '<div class="tiny muted">' + esc(x.signature.join(', ')) + '</div>' : '') + '</div>'; }).join('') : '<div class="tiny muted">The Trainer Library didn\'t load.</div>'),
          {eyebrow: 'Possible clients', style: 'margin-top:16px'}) + '</div></div>';
  });
}
route(/^\/estate\/?(\?.*)?$/, estate, 'The Estate', '#/estate');
route(/^\/homestead\/?(\?.*)?$/, estate, 'The Estate', '#/estate');   // one compound (A-117): the homestead is the estate
route(/^\/estate\/([^?]+)$/, place, function (n) { return 'Estate · ' + n; }, '#/estate');
route(/^\/sevii\/?$/, seviiPage, 'The Sevii Islands', '#/sevii');
route(/^\/preserve\/?$/, preservePage, 'The Day-Care preserve', '#/preserve');

/* ---- the Glasshouse (D-045), on your records (A-116) ---- */
function ghData() { return {crops: Estate.crops(), eggs: Estate.lines()}; }
function ghReports(res) { var p = function (id) { var x = staffPlans(id)[0]; return x ? planStaff(x) : []; };
  return {glasshouse: Estate.report('glasshouse', res, p('glasshouse')), 'cold-vault': Estate.report('cold-vault', res, p('cold-vault'))}; }
function ghRoomJobs(room, reps) { var r = reps[room.facility];
  return room.facility === 'cold-vault' ? r.requirements : r.requirements.filter(function (q) { return room.requirements.indexOf(q.id) >= 0; }); }
function ghWho(q) { return q.can_staff.length ? esc(q.can_staff.join(', ')) : q.land.length ? '<span class="muted">the land: ' + esc(q.land.map(function (l) { return l.who; }).join(', ')) + '</span>' : '<span style="color:var(--ember-2)">nobody of yours</span>'; }
function glasshouse(tab) {
  tab = tab || 'overview';
  return Promise.all([estateReady(), loadLive()]).then(function () {
    var d = Estate.pack().glasshouse, g = ghData(), res = estateRes(), reps = ghReports(res);
    var tabs = [['overview', 'The building'], ['eggs', 'Eggs & walking'], ['berries', 'Berry cultivation'], ['environment', 'Environment'], ['nutrition', 'Nutrition'], ['studbook', 'Studbook']];
    var body = ({overview: ghOverview, eggs: ghEggs, berries: ghBerries, environment: ghEnv, nutrition: ghNutrition, studbook: ghStudbook}[tab] || ghOverview)(g, res, reps);
    return '<div class="eyebrow"><a href="#/estate">The Estate</a> · featured living facility · ' + esc(d.status) + '</div><h1 style="margin:6px 0">The Glasshouse</h1><p class="lede">' + esc(d.idea) + '</p>' +
      '<div style="margin-top:8px"><a class="btn sm gold" href="#/facility/glasshouse">Staff its jobs →</a> <a class="btn sm" href="#/facility/cold-vault">The cold vault</a> <a class="btn sm" href="#/facility/nursery">The nursery</a></div>' +
      '<div class="tabs" style="margin-top:16px">' + tabs.map(function (t) { return '<a href="#/glasshouse/' + t[0] + '" class="' + (t[0] === tab ? 'on' : '') + '">' + t[1] + '</a>'; }).join('') + '</div>' + body;
  });
}
function ghOverview(g, res, reps) {
  var d = Estate.pack().glasshouse;
  after(function (p) { p.querySelectorAll('#ghplan .hot').forEach(function (el) { el.addEventListener('click', function () { ghDetail(el.getAttribute('data-k'), g, reps); }); }); ghDetail('Hearth hall', g, reps); });
  return '<div class="grid"><div class="c7">' + card('In plan', '<div class="svgwrap" id="ghplan">' + Art.glasshouse(g) + '</div><p class="tiny muted" style="margin:8px 0 0">Tap any part of the building.</p>', {tools: false, eyebrow: 'Hearth · racks · loop · rings · vault'}) + '</div>' +
    '<div class="c5"><div id="ghd"></div></div>' +
    '<div class="c12">' + card('Rooms and their jobs', '<table class="t"><thead><tr><th>Room</th><th>Job</th><th></th><th>Who of yours could hold it</th></tr></thead><tbody>' +
      d.rooms.map(function (room) { var js = ghRoomJobs(room, reps);
        if (!js.length) return '<tr><td><b>' + esc(room.name) + '</b></td><td class="muted" colspan="3">' + esc(room.people.length ? 'people: ' + room.people.join(', ') : 'no Pokémon job') + '</td></tr>';
        return js.map(function (q, k) { return '<tr><td>' + (k ? '' : '<b>' + esc(room.name) + '</b>') + '</td><td>' + esc(q.name) + (q.priority === 'critical' ? ' ' + chip('critical', 'ember') : '') + '</td><td>' + standChip(q.standing) + '</td><td class="small">' + ghWho(q) + '</td></tr>'; }).join(''); }).join('') +
      '</tbody></table><p class="tiny muted">Read against your residents, in HeartGold. A plan on the facility page assigns them; nothing here does.</p>', {eyebrow: 'The approved design (D-045) · staffed only on a mechanic, your record or the land'}) + '</div></div>';
}
function ghDetail(k, g, reps) {
  var el = document.getElementById('ghd'); if (!el) return;
  var d = Estate.pack().glasshouse, html;
  if (k.indexOf('crop:') === 0) {
    var c = g.crops.filter(function (x) { return x.berry === k.slice(5); })[0];
    html = c ? card(esc(c.berry), '<div style="display:flex;gap:12px;align-items:center"><img src="' + itemSprite(c.berry) + '" style="width:48px;height:48px;image-rendering:pixelated"><div><div class="small">' + esc(c.why) + '</div><div class="tiny muted">' + c.hours_to_harvest + ' hours to harvest · up to ' + c.max_harvest + ' a plant · watering ' + esc(c.watering) + '</div></div></div><div style="margin-top:12px"><button class="btn sm" onclick="openForm(\'plant\')">Plant ' + esc(c.berry) + '</button></div>', {eyebrow: 'Glasshouse rings · crop', tools: false}) : '';
  } else if (k.indexOf('eggs:') === 0) {
    var e = g.eggs.filter(function (x) { return x.line === k.slice(5); })[0];
    html = e ? card(esc(e.line) + ' rack', '<div style="display:flex;gap:16px;align-items:center">' + Art.egg(0, TYPE[(dexOf(e.line) || {t: ['Normal']}).t[0]], 'd1', 64) + '<dl class="kv"><dt>Egg cycles</dt><dd>' + e.cycles + ' (' + e.steps.toLocaleString() + ' steps)</dd><dt>Laps</dt><dd>' + e.laps + ' · ' + e.laps_with_flame_body + ' with Flame Body or Magma Armor</dd><dt>Why</dt><dd>' + esc(e.why) + '</dd></dl></div><div style="margin-top:12px"><button class="btn sm" onclick="openForm(\'egg\')">Lay an egg</button></div>', {eyebrow: 'Egg racks', tools: false}) : '';
  } else {
    var room = d.rooms.filter(function (r) { return r.name === k; })[0];
    if (!room) return;
    var js = ghRoomJobs(room, reps);
    html = card(esc(room.name), '<p class="small" style="color:var(--text-2);margin-top:0">' + esc(cap(room.what)) + '.</p>' +
      js.map(function (q) { return '<div class="line small ' + (q.can_staff.length || q.land.length ? 'forest' : 'ember') + '"><b>' + esc(q.name) + '</b> · ' + ghWho(q) + '</div>'; }).join('') +
      (room.name === 'Hatching loop' ? '<div class="tiny muted" style="margin-top:8px">' + esc(cap(d.loop.note)) + '. ' + esc(d.loop.verify) + '.</div>' : '') +
      (room.people.length ? '<div class="tiny muted" style="margin-top:8px">People: ' + esc(room.people.join(', ')) + '</div>' : ''), {eyebrow: 'Room', tools: false});
  }
  el.innerHTML = html;
}
function ghEggs(g) {
  var eggs = eggsModel(), walks = (S.L['Egg Walks'] || []).slice(-12).reverse();
  return '<div class="grid"><div class="c8">' + card('In the racks', eggs.length ? '<div class="eggs">' + eggs.map(function (e, i) {
      return '<div class="egg">' + Art.egg(e.pct, TYPE[(dexOf(e.line) || {t: ['Normal']}).t[0]], 'r' + i, 64) + '<div class="ln">' + esc(e.line) + '</div><div class="sub">' + e.laps + ' / ' + e.cycles + ' laps · ' + e.left + ' to go</div><div class="tiny muted mono">' + esc(e.id) + '</div><button class="btn sm" style="margin-top:6px" onclick="openForm(\'walk\',\'' + esc(e.id) + '\')">Walk</button></div>'; }).join('') + '</div>'
      : '<div class="empty">No eggs in the racks yet. Lay one from a line below.</div>', {eyebrow: 'Egg walking & incubation', link: null}) +
    card('The schedule', (g.eggs.length ? '<table class="t"><thead><tr><th>Line</th><th>Why</th><th>Egg cycles</th><th>Steps</th><th>Laps</th><th>With Flame Body</th><th></th></tr></thead><tbody>' + g.eggs.map(function (e) {
      return '<tr><td><img src="' + sprite(numOf(e.line)) + '" style="width:32px;height:32px;vertical-align:middle;image-rendering:pixelated"> <b>' + esc(e.line) + '</b></td><td class="tiny muted">' + esc(e.why) + '</td><td class="num">' + e.cycles + '</td><td class="num">' + e.steps.toLocaleString() + '</td><td class="num">' + e.laps + '</td><td class="num">' + e.laps_with_flame_body + '</td><td style="width:22%"><div class="bar ember"><i style="width:' + Math.min(100, e.laps / 40 * 100) + '%"></i></div></td></tr>'; }).join('') + '</tbody></table>'
      : '<div class="empty">No lines yet: your blueprints and the Pokémon on your teams give the schedule its lines.</div>') +
      '<p class="tiny muted">Gen 4 counts hatch time in egg cycles of ' + Estate.pack().glasshouse.loop.steps_per_cycle + ' steps; Flame Body or Magma Armor halves it. One lap of the hatching loop = one cycle (a proposal, RANCH §2b). Your blueprints\' lines come first, then your teams\', slowest first; species that can\'t breed are left out.</p>', {eyebrow: 'Lines, slowest first'}) + '</div>' +
    '<div class="c4">' + card('Walk log', '<div style="margin-bottom:10px"><button class="btn sm gold" onclick="openForm(\'walk\')">Record a walk</button> <button class="btn sm" onclick="openForm(\'egg\')">Lay an egg</button></div>' +
      (walks.length ? walks.map(function (w) { return '<div class="line small">' + esc(w.laps) + ' laps · <span class="mono tiny">' + esc(w.egg) + '</span>' + (String(w.magcargo) === 'true' ? ' ' + chip('Flame Body', 'ember') : '') + '<div class="tiny muted">' + ago(w.at) + '</div></div>'; }).join('') : '<div class="empty">No walks logged.</div>'), {eyebrow: 'Accumulated walking'}) + '</div></div>';
}
function ghBerries(g) {
  var plots = berriesModel(), harvests = (S.L.Harvests || []).slice(-10).reverse(), lum = g.crops.filter(function (c) { return c.berry === 'Lum Berry'; })[0];
  return '<div class="grid"><div class="c7">' + card('Growing now', plots.length ? plots.map(function (b) { return '<div class="berry"><img src="' + itemSprite(b.berry) + '"><div style="flex:1"><div class="small"><b>' + esc(b.berry) + '</b> <span class="muted">· plot ' + esc(b.plot) + ' · ' + b.hours + ' h cycle</span></div><div class="bar forest"><i style="width:' + (b.pct * 100).toFixed(0) + '%"></i></div></div><div style="text-align:right"><div class="tiny">' + (b.done ? '<b style="color:var(--forest-3)">ready</b>' : 'ready in ' + hrs((b.ready - Date.now()) / 3600e3)) + '</div>' + (b.done ? '<button class="btn sm" onclick="openForm(\'harvest\',\'' + esc(b.id) + '\')">Harvest</button>' : '') + '</div></div>'; }).join('')
      : '<div class="empty">Nothing planted. The plan below is the Gen 4 medicine crop and every berry one of your builds holds.</div>', {eyebrow: 'Harvest timers'}) +
    card('The crop plan', '<table class="t"><thead><tr><th></th><th>Berry</th><th>Why</th><th>Hours</th><th>Per plant</th><th>Watering</th><th></th></tr></thead><tbody>' + g.crops.map(function (c) {
      return '<tr><td><img src="' + itemSprite(c.berry) + '" style="width:28px;height:28px;image-rendering:pixelated"></td><td><b>' + esc(c.berry) + '</b></td><td class="small">' + esc(c.why) + '</td><td class="num">' + c.hours_to_harvest + '</td><td class="num">up to ' + c.max_harvest + '</td><td>' + esc(c.watering) + '</td><td><button class="btn sm" onclick="openForm(\'plant\')">Plant</button></td></tr>'; }).join('') + '</tbody></table><p class="tiny muted">' + esc(Estate.pack().glasshouse.crops_note) + ' Growth times are Gen 4\'s (4 × the berry\'s growth time).</p>', {eyebrow: 'Gen 4 berry data'}) + '</div>' +
    '<div class="c5">' + card('Harvest records', harvests.length ? harvests.map(function (h) { var p = (S.L.Plantings || []).filter(function (x) { return x.id === h.planting; })[0] || {}; return '<div class="line forest small"><b>' + esc(p.berry || h.planting) + '</b> · ' + esc(h.yield) + ' berries<div class="tiny muted">' + ago(h.at) + '</div></div>'; }).join('') : '<div class="empty">No harvests yet.</div>', {eyebrow: 'What came in'}) +
    card('What they\'re for', '<div class="line small"><b>Status cures</b> · Cheri, Chesto, Pecha, Rawst, Aspear: the clinic\'s first shelf</div><div class="line small"><b>Recovery</b> · Oran and Sitrus for HP, Leppa for PP, Persim for confusion</div>' +
      (lum ? '<div class="line small"><b>Lum</b> · cures any status: ' + esc(lum.held.length ? 'held by ' + lum.held.join(', ') : 'the medicine crop\'s catch-all') + '</div>' : ''), {eyebrow: 'Biological applications'}) + '</div></div>';
}
function ghEnv() {
  var env = envModel(), none = env.every(function (e) { return e.none; });
  return (none ? '<div class="notice" style="margin-bottom:16px">No readings logged yet, so the instruments are empty: nothing here is generated. The targets are proposals for the design, not measurements. A reading you log shows on its instrument with its source.</div>' : '') +
    '<div class="grid">' + env.map(function (e) { return '<div class="c4">' + card(esc(e.metric), '<div style="display:flex;justify-content:space-between;align-items:flex-end"><div><div class="serif num" style="font-size:42px;color:var(--ivory);line-height:1">' + (e.none ? '—' : e.now) + '<span class="small muted"> ' + esc(e.unit) + '</span></div><div class="tiny muted">target ' + e.target + ' ' + esc(e.unit) + ' (proposed)</div></div>' + chip(e.src, e.none ? '' : 'forest') + '</div>' +
      (e.series.length > 1 ? '<div style="margin-top:12px">' + Art.spark(e.series, e.color, 320, 60) + '</div><div class="tiny muted">last ' + e.series.length + ' readings</div>' : '<div class="tiny muted" style="margin-top:12px">' + (e.none ? 'Log a reading to start this instrument.' : 'One reading so far.') + '</div>'), {eyebrow: e.room, tools: false}) + '</div>'; }).join('') + '</div>' +
    '<div style="margin-top:16px"><button class="btn gold" onclick="openForm(\'reading\')">Log a reading</button></div>';
}
function ghNutrition(g, res) {
  var P = Cap.pack(), feeds = (S.L.Feedings || []).slice().reverse(), milk = Estate.world().filter(function (w) { return w.cap === 'food_source'; })[0];
  var per = function (r) { return P.model.provisions.per_day[r.habitat.size] || 0; }, total = res.reduce(function (n, r) { return n + per(r); }, 0);
  var progs = [['Hatchlings', 'Milk in the nursery yard', 'the design (D-045): the nursery\'s first meals are berries from the rings and Miltank\'s milk', milk ? (milk.status === 'approved' ? 'approved: ' : 'waiting on you: ') + milk.id + ', your ' + (S.store.individuals[milk.ind] || {}).species : 'needs a Miltank of yours (W-017 follows your ' + GAME_NAME[(Cap.pack().world.filter(function (w) { return w.id === 'W-017'; })[0] || {}).game] + ' Miltank)'],
    ['Residents', 'Berries from the rings; Apricorns', 'the crop plan covers the medicine crop and every berry your builds hold', g.crops.length ? 'planned' : 'open'],
    ['Your teams', 'Camp cooking', 'camp life is authored per team (D-034)', 'open']];
  return '<div class="grid"><div class="c7">' + card('Feeding programs', '<table class="t"><thead><tr><th>Who</th><th>Program</th><th>Why</th><th>Status</th></tr></thead><tbody>' +
      progs.map(function (r) { return '<tr><td><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) + '</td><td class="small muted">' + esc(r[2]) + '</td><td>' + chip(r[3], /^approved|^planned/.test(r[3]) ? 'forest' : /^waiting/.test(r[3]) ? 'gold' : 'ember') + '</td></tr>'; }).join('') + '</tbody></table>', {eyebrow: 'Diet & development'}) +
    card('What the residents eat', res.length ? '<table class="t"><thead><tr><th>Resident</th><th>Size</th><th>Rations a day</th></tr></thead><tbody>' + res.map(function (r) { return '<tr><td><b>' + esc(r.label) + '</b></td><td>' + esc(r.habitat.size) + '</td><td class="num">' + per(r) + '</td></tr>'; }).join('') +
      '<tr><td><b>All of them</b></td><td></td><td class="num"><b>' + total + '</b></td></tr></tbody></table><p class="tiny muted">A Blackthorn standard by body size (capability/model.json), the same one the Survival Lab packs by. Not canon.</p>' : '<div class="empty">No residents yet.</div>', {eyebrow: 'By body size', style: 'margin-top:16px'}) + '</div>' +
    '<div class="c5">' + card('Feeding log', '<div style="margin-bottom:10px"><button class="btn sm gold" onclick="openForm(\'feeding\')">Log a feeding</button></div>' + (feeds.length ? feeds.slice(0, 14).map(function (f) { return '<div class="line small"><b>' + esc(f.who) + '</b> · ' + esc(f.food) + (f.amount ? ' · ' + esc(f.amount) : '') + '<div class="tiny muted">' + ago(f.at) + (f.note ? ' · ' + esc(f.note) : '') + '</div></div>'; }).join('') : '<div class="empty">No feedings logged.</div>'), {eyebrow: 'Records'}) + '</div></div>';
}
function ghStudbook() {
  var bred = Estate.studbook(), name = function (id) { var i = id && S.store.individuals[id]; return i ? '<a href="#/mon/' + encodeURIComponent(id) + '">' + esc(i.nickname || i.species) + '</a>' : esc(id || '—'); };
  return card('Bred at Blackthorn', (bred.length ? '<div class="scroll"><table class="t"><thead><tr><th></th><th>Pokémon</th><th>Game</th><th>Sire</th><th>Dam</th><th>Blueprint</th><th>Hatched with</th></tr></thead><tbody>' + bred.map(function (i) { var bp = i.blueprint && storeBuild(i.blueprint);
      return '<tr><td><img src="' + spriteOf(numOf(i.species), i.game, i.shiny) + '" style="width:36px;height:36px;image-rendering:pixelated" onerror="this.style.opacity=0"></td><td>' + name(i.id) + '</td><td>' + esc(GAME_NAME[i.game]) + '</td><td>' + name(i.sire) + '</td><td>' + name(i.dam) + '</td><td class="small">' + (bp ? esc(bp.name || bp.species) : esc(i.blueprint || '—')) + '</td><td class="tiny">' + esc((i.hatch_moves || []).join(', ') || '—') + '</td></tr>'; }).join('') + '</tbody></table></div>'
    : '<div class="empty">Nobody bred yet. Record a Pokémon\'s parents in the builder, or breed one to a blueprint, and it\'s listed here with what it hatched knowing.</div>') +
    '<p class="tiny muted">Your Pokémon with a sire, a dam, a blueprint or hatch moves on record. The canon studbook from before the fresh start is under <a href="#/breeding/studbook">Breeding & lineage</a>.</p>', {eyebrow: 'The studbook office · pedigrees'});
}
route(/^\/glasshouse\/?$/, function () { return glasshouse('overview'); }, 'The Glasshouse', '#/glasshouse');
route(/^\/glasshouse\/(\w+)$/, glasshouse, function (t) { return 'Glasshouse · ' + t; }, '#/glasshouse');
</script>
