<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackthorn HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== Blackthorn HQ · Pokémon Heritage Solarpunk ============================================================
   Charcoal and gold are the foundation; ivory carries reading; forest, ice and ember are the living systems.
   Type colours stay true wherever they carry meaning. */
:root {
  --charcoal: #15171C; --charcoal-2: #1C1F26; --charcoal-3: #252932; --charcoal-4: #30353F;
  --gold: #C9A96A; --gold-2: #E2CC98; --gold-3: #8E7647; --gold-line: rgba(201,169,106,.22); --gold-glow: rgba(201,169,106,.10);
  --ivory: #F3EDE2; --ivory-2: #E9E0CF; --ivory-3: #D8CCB6; --ink: #24211C; --ink-2: #5B554A;
  --forest: #5E8F68; --forest-2: #2F4D3A; --forest-3: #A9C7A8; --ice: #9CCBDD; --ice-2: #D8EEF5; --ice-3: #4F7E92;
  --ember: #DE7C42; --ember-2: #F4AE76; --ember-3: #8E4320; --violet: #8C7BC9;
  --text: #EDE6D9; --text-2: #B7AF9F; --text-3: #847D70;
  --r: 14px; --r-sm: 9px; --shadow: 0 18px 40px -22px rgba(0,0,0,.65);
  --serif: "Cormorant Garamond", Georgia, serif; --sans: Inter, system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--charcoal); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--gold-2); text-decoration: none; } a:hover { color: var(--ivory); }
button { font: inherit; color: inherit; }
::selection { background: rgba(201,169,106,.35); }

/* ---- the frame: rail + top bar + page ---- */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; background: linear-gradient(90deg, #14161B 232px, transparent 232px); }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: linear-gradient(180deg, #121419, #17191F 60%, #13151A);
        border-right: 1px solid var(--gold-line); padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 4px; }
.crest { display: flex; gap: 12px; align-items: center; padding: 4px 8px 20px; border-bottom: 1px solid var(--gold-line); margin-bottom: 14px; }
.crest svg { flex: none; }
.crest b { display: block; font: 600 21px/1.05 var(--serif); letter-spacing: .02em; color: var(--ivory); }
.crest span { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.nav-group { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-3); padding: 14px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 10px; color: var(--text-2); font-weight: 500; position: relative; }
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .8; }
.nav a:hover { background: var(--charcoal-3); color: var(--ivory); }
.nav a.on { background: linear-gradient(90deg, rgba(201,169,106,.16), rgba(201,169,106,.03)); color: var(--ivory); }
.nav a.on::before { content: "▶"; position: absolute; left: -9px; font-size: 9px; color: var(--gold); }
.nav a.on svg { opacity: 1; color: var(--gold-2); }
.rail-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--gold-line); font-size: 11px; color: var(--text-3); }
.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 12px 28px;
          background: rgba(21,23,28,.86); backdrop-filter: blur(10px); border-bottom: 1px solid var(--gold-line); }
.crumbs { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
.crumbs b { color: var(--gold-2); font-weight: 600; }
.topbar .sp { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; background: var(--charcoal-3); border: 1px solid var(--gold-line); border-radius: 999px; padding: 6px 14px; width: 300px; }
.search input { background: none; border: 0; outline: none; color: var(--text); width: 100%; font: inherit; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--gold-line); color: var(--text-2); white-space: nowrap; }
.pill.gold { color: var(--charcoal); background: var(--gold); border-color: var(--gold); font-weight: 600; }
.page { padding: 26px 28px 60px; max-width: 1560px; }
.menu-btn { display: none; background: none; border: 1px solid var(--gold-line); border-radius: 8px; padding: 6px 9px; cursor: pointer; }

/* ---- type and headings ---- */
h1, h2, h3 { font-family: var(--serif); font-weight: 600; color: var(--ivory); margin: 0; letter-spacing: .01em; }
h1 { font-size: 40px; line-height: 1.05; }
h2 { font-size: 27px; line-height: 1.15; }
h3 { font-size: 20px; line-height: 1.2; }
.eyebrow { font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.lede { color: var(--text-2); font-size: 15px; max-width: 760px; }
.muted { color: var(--text-3); } .small { font-size: 12px; } .tiny { font-size: 11px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.mono { font-family: var(--mono); font-size: 12px; }
.serif { font-family: var(--serif); }
.rule { height: 1px; background: var(--gold-line); margin: 18px 0; border: 0; }
.ornament { display: flex; align-items: center; gap: 12px; color: var(--gold-3); font-size: 10px; letter-spacing: .3em; text-transform: uppercase; }
.ornament::before, .ornament::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-line), transparent); }

/* ---- grid and cards ---- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 18px; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
.c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
.card { background: linear-gradient(180deg, var(--charcoal-2), #1A1D23); border: 1px solid var(--gold-line); border-radius: var(--r); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.card > .hd { display: flex; align-items: center; gap: 10px; padding: 15px 18px 10px; }
.card > .hd h3 { flex: 1; font-size: 19px; }
.card > .bd { padding: 4px 18px 18px; }
.card.ivory { background: linear-gradient(180deg, #F6F1E7, #EEE6D6); color: var(--ink); border-color: rgba(142,118,71,.35); }
.card.ivory h2, .card.ivory h3 { color: var(--ink); }
.card.ivory .muted { color: var(--ink-2); }
.card .corner { position: absolute; width: 14px; height: 14px; border-color: var(--gold-3); border-style: solid; opacity: .55; pointer-events: none; }
.card .corner.tl { top: 5px; left: 5px; border-width: 1px 0 0 1px; } .card .corner.br { bottom: 5px; right: 5px; border-width: 0 1px 1px 0; }
.mod-tools { display: flex; gap: 4px; }
.mod-tools button { background: none; border: 0; color: var(--text-3); cursor: pointer; padding: 2px 5px; border-radius: 6px; font-size: 12px; }
.mod-tools button:hover { color: var(--gold-2); background: var(--charcoal-3); }
.card.collapsed > .bd { display: none; }
.link { font-size: 12px; color: var(--gold-2); white-space: nowrap; }
.empty { padding: 18px; border: 1px dashed var(--gold-line); border-radius: var(--r-sm); color: var(--text-3); font-size: 13px; text-align: center; }

/* ---- pieces ---- */
.type { display: inline-flex; align-items: center; height: 19px; padding: 0 8px; border-radius: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.25); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--charcoal-3); color: var(--text-2); border: 1px solid rgba(255,255,255,.04); white-space: nowrap; }
.chip.forest { background: rgba(94,143,104,.16); color: var(--forest-3); } .chip.ice { background: rgba(156,203,221,.14); color: var(--ice-2); }
.chip.ember { background: rgba(222,124,66,.16); color: var(--ember-2); } .chip.gold { background: rgba(201,169,106,.16); color: var(--gold-2); }
.chip.violet { background: rgba(140,123,201,.16); color: #CFC6F0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--text-3); } .kv dd { margin: 0; color: var(--text); }
.bar { height: 6px; background: var(--charcoal-4); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold-3), var(--gold-2)); }
.bar.forest > i { background: linear-gradient(90deg, var(--forest-2), var(--forest)); } .bar.ember > i { background: linear-gradient(90deg, var(--ember-3), var(--ember)); }
.bar.ice > i { background: linear-gradient(90deg, var(--ice-3), var(--ice)); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--gold-line); background: var(--charcoal-3); color: var(--ivory); cursor: pointer; font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--gold); background: var(--charcoal-4); }
.btn.gold { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: #201A10; border-color: var(--gold); font-weight: 600; }
.btn.ghost { background: none; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--gold-line); position: sticky; top: 0; background: var(--charcoal-2); }
table.t td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,.04); vertical-align: top; }
table.t tr:hover td { background: rgba(201,169,106,.04); }
table.t tr.click { cursor: pointer; }
.scroll { overflow: auto; max-height: 560px; }
input.f, select.f, textarea.f { width: 100%; background: var(--charcoal); border: 1px solid var(--gold-line); color: var(--text); border-radius: 9px; padding: 8px 10px; font: inherit; outline: none; }
input.f:focus, select.f:focus, textarea.f:focus { border-color: var(--gold); }
label.l { display: block; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); margin: 10px 0 5px; font-weight: 600; }
.row { display: flex; gap: 12px; } .row > * { flex: 1; min-width: 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--gold-line); margin-bottom: 16px; overflow-x: auto; }
.tabs a { padding: 9px 14px; color: var(--text-2); border-bottom: 2px solid transparent; font-weight: 500; white-space: nowrap; }
.tabs a.on { color: var(--ivory); border-color: var(--gold); }
.notice { display: flex; gap: 10px; padding: 10px 14px; border-radius: var(--r-sm); background: rgba(201,169,106,.08); border: 1px solid var(--gold-line); color: var(--text-2); font-size: 12.5px; }
.notice.sim { background: rgba(156,203,221,.07); border-color: rgba(156,203,221,.25); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.mcard { display: block; padding: 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: rgba(255,255,255,.015); text-decoration: none; color: inherit; }
.mcard:hover { border-color: var(--gold-line); } .mcard .nm { font-weight: 600; margin-top: 6px; }
.mhero { display: grid; grid-template-columns: minmax(240px, 420px) 1fr; gap: 24px; align-items: center; }
.mhero .mart { background: radial-gradient(circle at 50% 45%, rgba(201,169,106,.14), transparent 65%); border-radius: var(--r); padding: 12px; }
@media (max-width: 820px) { .mhero { grid-template-columns: 1fr; } }
.mgal { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; } .mgal figure { margin: 0; } .mgal figcaption { margin-top: 4px; }
.tool { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; } .tool:first-child { border-top: 0; }
.evd { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 5px; vertical-align: middle; background: var(--text-3); cursor: help; }
.evd.ev-confirmed { background: var(--forest-3); } .evd.ev-strongly-inferred { background: var(--ice-2); } .evd.ev-standardized { background: var(--text-2); }
.evd.ev-hypothetical { background: #CFC6F0; } .evd.ev-unknown { background: transparent; border: 1px solid var(--ember-2); }
img.pix { image-rendering: pixelated; image-rendering: crisp-edges; }
.ballgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.ballcard { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 10px; border: 1px solid var(--gold-line); border-radius: 14px; background: var(--charcoal-2); color: inherit; text-decoration: none; text-align: center; transition: border-color .15s, transform .15s; }
.ballcard:hover { border-color: var(--gold); transform: translateY(-2px); }
.ballart { width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: radial-gradient(circle at 50% 42%, rgba(201,169,106,.16), rgba(201,169,106,0) 62%); }
.ballstage { width: 300px; max-width: 100%; height: 300px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: zoom-in;
  background: radial-gradient(circle at 50% 40%, rgba(201,169,106,.22), rgba(201,169,106,.04) 55%, rgba(0,0,0,0) 70%); }
.ballhero { margin-top: 10px; overflow: hidden; }
.thumb { background: var(--charcoal-3); border: 1px solid var(--line); border-radius: 10px; padding: 4px; cursor: zoom-in; }
.thumb:hover { border-color: var(--gold); }
.interior { border-radius: 12px; overflow: hidden; cursor: zoom-in; }
.interior.empty-int { cursor: default; aspect-ratio: 16/9; display: flex; align-items: center; padding: 26px; border: 1px dashed var(--gold-line);
  background: radial-gradient(ellipse at 50% 30%, rgba(201,169,106,.12), rgba(0,0,0,0) 70%), var(--charcoal-2); }
.strip { display: flex; gap: 10px; flex-wrap: wrap; }
.ballmini { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 76px; color: inherit; text-decoration: none; text-align: center; }
.lightbox { position: fixed; inset: 0; z-index: 90; background: rgba(8,9,11,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
.callout { display: block; padding: 10px 14px; border-radius: var(--r-sm); background: rgba(124,170,140,.07); border: 1px solid rgba(124,170,140,.28); color: var(--text-2); font-size: 12.5px; }
.draftline { display: block; padding: 10px 14px; border-radius: var(--r-sm); background: rgba(201,169,106,.05); border: 1px dashed var(--gold-line); color: var(--text-2); font-size: 12.5px; }
.xp { margin: 3px 0 2px; color: var(--text-2); } .xp summary { cursor: pointer; list-style: none; } .xp summary::-webkit-details-marker { display: none; } details.xp summary::after { content: ' ⓘ'; color: var(--gold); }
.toast { position: fixed; right: 22px; bottom: 22px; z-index: 99; background: var(--charcoal-3); border: 1px solid var(--gold); color: var(--ivory); padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); max-width: 380px; }

/* ---- hero ---- */
.hero { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--gold-line); min-height: 380px; box-shadow: var(--shadow); }
.hero svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,15,19,.82) 0%, rgba(14,15,19,.45) 38%, rgba(14,15,19,0) 62%), linear-gradient(0deg, rgba(14,15,19,.55), transparent 35%); }
.hero .say { position: relative; padding: 38px 40px; max-width: 640px; }
.hero .say h1 { font-size: 50px; text-shadow: 0 2px 18px rgba(0,0,0,.45); }
.hero .say .lede { color: #E4DCCD; margin-top: 10px; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.hero .meta .pill { background: rgba(21,23,28,.55); color: #E9E1D2; backdrop-filter: blur(4px); }
.hero .marks { position: absolute; right: 18px; bottom: 14px; display: flex; gap: 8px; }
.hero .marks a { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; background: rgba(21,23,28,.6); border: 1px solid var(--gold-line); padding: 6px 10px; border-radius: 999px; color: var(--ivory); backdrop-filter: blur(4px); }

/* ---- party ---- */
.party { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 12px; }
.slot { position: relative; border-radius: 13px; padding: 10px 10px 12px; background: radial-gradient(120% 90% at 50% 0%, var(--tint, #2a2f39) 0%, var(--charcoal-2) 70%); border: 1px solid var(--gold-line); cursor: pointer; transition: transform .15s ease, border-color .15s; text-align: center; }
.slot:hover { transform: translateY(-3px); border-color: var(--gold); }
.slot img { width: 100%; aspect-ratio: 1; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
.slot .nm { font: 600 18px/1.1 var(--serif); color: var(--ivory); margin-top: 2px; }
.slot .ty { display: flex; gap: 4px; justify-content: center; margin: 6px 0; }
.slot .life { font-size: 11px; color: var(--text-2); min-height: 32px; }
.slot .no { position: absolute; top: 8px; left: 10px; font: 600 11px var(--mono); color: var(--gold-3); }
.slot .lock { position: absolute; top: 8px; right: 10px; font-size: 11px; color: var(--gold); }
.hpline { height: 4px; border-radius: 99px; background: var(--charcoal-4); margin-top: 8px; overflow: hidden; }
.hpline i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--forest), #8FC48E); }

/* ---- drawers ---- */
.drawer-bg { position: fixed; inset: 0; background: rgba(8,9,12,.62); z-index: 60; display: none; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 96vw); background: var(--charcoal-2); border-left: 1px solid var(--gold); z-index: 61; overflow-y: auto; transform: translateX(102%); transition: transform .25s ease; box-shadow: -30px 0 60px rgba(0,0,0,.5); }
.drawer.on { transform: none; } .drawer-bg.on { display: block; }
.drawer .x { position: sticky; top: 0; display: flex; justify-content: flex-end; padding: 12px; background: linear-gradient(180deg, var(--charcoal-2), transparent); z-index: 2; }
.drawer .in { padding: 0 30px 40px; }

/* ---- facilities, eggs, berries ---- */
.fac { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap: 12px; }
.fac a.f { display: block; border: 1px solid var(--gold-line); border-radius: 12px; padding: 14px; background: linear-gradient(160deg, rgba(255,255,255,.02), transparent); color: var(--text); }
.fac a.f:hover { border-color: var(--gold); }
.fac .fn { font: 600 17px/1.15 var(--serif); color: var(--ivory); text-transform: capitalize; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--forest); box-shadow: 0 0 0 3px rgba(94,143,104,.18); }
.status-dot.warn { background: var(--ember); box-shadow: 0 0 0 3px rgba(222,124,66,.18); } .status-dot.gold { background: var(--gold); box-shadow: 0 0 0 3px rgba(201,169,106,.18); }
.eggs { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px,1fr)); gap: 10px; }
.egg { text-align: center; padding: 10px 6px; border-radius: 12px; background: var(--charcoal-3); border: 1px solid rgba(255,255,255,.04); }
.egg .ln { font: 600 15px var(--serif); color: var(--ivory); } .egg .sub { font-size: 11px; color: var(--text-3); }
.berry { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
.berry:last-child { border-bottom: 0; }
.berry img { width: 30px; height: 30px; image-rendering: pixelated; }
.gauge { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 12px; background: var(--charcoal-3); }
.gauge .v { font: 600 26px/1 var(--serif); color: var(--ivory); } .gauge .u { font-size: 12px; color: var(--text-3); }
.timeline { position: relative; padding-left: 18px; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 1px; background: var(--gold-line); }
.tl { position: relative; padding: 0 0 14px; }
.tl::before { content: ""; position: absolute; left: -17px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--charcoal); border: 2px solid var(--gold); }
.tl.ember::before { border-color: var(--ember); } .tl.forest::before { border-color: var(--forest); } .tl.ice::before { border-color: var(--ice); }
.tl .when { font-size: 11px; color: var(--text-3); letter-spacing: .06em; }
.goal { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 8px 0; }

/* ---- atlas ---- */
.dexgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px,1fr)); gap: 10px; }
.dex { border-radius: 12px; padding: 8px; background: var(--charcoal-2); border: 1px solid rgba(255,255,255,.04); text-align: center; cursor: pointer; position: relative; }
.dex:hover { border-color: var(--gold-line); background: var(--charcoal-3); }
.dex img { width: 92px; height: 92px; object-fit: contain; }
.dex .no { position: absolute; top: 6px; left: 8px; font: 11px var(--mono); color: var(--text-3); }
.dex .res { position: absolute; top: 6px; right: 8px; color: var(--gold); font-size: 12px; }
