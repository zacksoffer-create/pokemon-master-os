<script>
/* ===== The record: your calls (what's waiting on you), decisions, locks, world records, evidence ============== */
function statusChip(s) { s = String(s || ''); var k = /^LOCKED/.test(s) ? 'gold' : /REJECT|ARCHIVE/.test(s) ? '' : /PROPOSED|OPEN|PROVISIONAL/.test(s) ? 'ember' : /WORKING|RECORDED/.test(s) ? 'ice' : /approved/.test(s) ? 'forest' : /proposed/.test(s) ? 'ember' : '';
  return chip(s, k); }
function answers() {
  return Promise.all([API.tab('Your Calls').catch(function () { return []; }), API.tab('Answers').catch(function () { return []; })]).then(function (r) {
    var by = {}; (r[0] || []).forEach(function (x) { var id = x.id || x.ID; if (id && (x['Your call'] || x.Status !== 'open')) by[id] = {text: x['Your call'] || '', status: x.Status || 'open'}; });
    (r[1] || []).forEach(function (x) { by[x.id] = {text: x.text, status: x.status, at: x.at}; });
    return by;
  });
}
/* ---- your calls (v2.1): a review queue, newest first, one tap each ----
   Zack, 2026-10-26: "I can't find the your calls list ... that needs to be better presented to me." The calls now open
   with the newest batch, each answered with one tap (Keep, Change, Reject, Later) and updated in place; the menu and the
   top bar carry how many are waiting. */
function callVerdict(ans) {
  if (!ans || !ans.status || ans.status === 'open') return null;
  if (ans.status === 'deferred') return ['later', ''];
  return /^keep|^approve|^confirm(?! with)/i.test(ans.text) ? ['kept', 'forest'] : /^reject/i.test(ans.text) ? ['rejected', 'ember'] : ['changed', 'gold'];
}
function callItem(x, ans) {   // x: {id, kind: 'assumption'|'question', eyebrow, title, why, see, options, blocks}
  var v = callVerdict(ans), done = v && v[0] !== 'later', quick = x.kind === 'assumption' ? [['Keep', '✓ Keep'], ['Reject', '✕ Reject']] : x.options.slice(0, 3).map(function (o) { return [o, o]; });
  var change = x.kind === 'assumption' ? x.options.map(function (o) { return 'Change: ' + o; }) : [];
  return '<div class="card call' + (done ? ' done' : '') + '" id="call-' + esc(x.id) + '" data-call="' + esc(x.id) + '"><div class="hd"><div style="flex:1"><div class="eyebrow">' + esc(x.id) + ' · ' + esc(x.eyebrow) + '</div>' +
    '<h3 class="calltitle">' + esc(x.title) + '</h3></div>' + (v ? chip(v[0], v[1]) : chip('waiting on you', 'ember')) + '</div><div class="bd">' +
    '<p class="small" style="color:var(--text-2);margin:0">' + (x.why ? '<b>Why:</b> ' + esc(x.why) : '') + (x.see ? ' <a class="link" href="' + esc(x.see[0]) + '">See it: ' + esc(x.see[1]) + ' →</a>' : '') + '</p>' +
    (x.blocks ? '<div class="tiny" style="color:var(--ember-2);margin-top:6px">Blocks: ' + esc(x.blocks) + '</div>' : '') +
    (done ? '<div class="small" style="margin-top:8px"><b>You said:</b> ' + esc(ans.text) + (ans.at ? ' <span class="tiny muted">' + esc(fmtLoose(ans.at) || '') + '</span>' : '') + ' <a class="link tiny" href="javascript:void 0" data-callredo="1">change my answer</a></div>' : '') +
    '<div class="callacts"' + (done ? ' style="display:none"' : '') + '>' + quick.map(function (q) { return '<button type="button" class="btn sm' + (/^(Keep|Approve|Confirm)$/.test(q[0]) ? ' gold' : '') + '" data-callquick="' + esc(q[0]) + '">' + esc(q[1]) + '</button>'; }).join('') +
      '<button type="button" class="btn sm" data-callopen="1">' + (x.kind === 'assumption' ? '✎ Change…' : '✎ In my words…') + '</button><button type="button" class="btn sm" data-calllater="1">Later</button></div>' +
    '<div class="callmore" style="display:none">' + (change.length ? '<div class="opts">' + change.map(function (o) { return '<button type="button" class="opt" onclick="pickOpt(this)">' + esc(o) + '</button>'; }).join('') + '</div>' : '') +
      '<textarea class="f" rows="2" data-ans="' + esc(x.id) + '" placeholder="' + (x.kind === 'assumption' ? 'How it should be instead, in your words' : 'Your call, in your words') + '">' + esc(ans && ans.text || '') + '</textarea>' +
      '<div style="margin-top:8px"><button type="button" class="btn sm gold" data-callsave="1">Record my call</button></div></div></div></div>';
}
function pickOpt(b) { var t = b.closest('.card').querySelector('textarea'); t.value = b.textContent; b.parentNode.querySelectorAll('.opt').forEach(function (x) { x.classList.toggle('on', x === b); }); t.focus(); }
function answerCall(id, status, text) {
  if (text == null) { var t = document.querySelector('[data-ans="' + id + '"]'); text = t ? t.value.trim() : ''; }
  if (status === 'answered' && !text) { toast('Write your call first (or tap an option).'); return Promise.resolve(); }
  return API.run('apiAnswer', id, text, status, (S.callMeta || {})[id] || {}).then(function () {
    S.live['Your Calls'] = null; S.live.Answers = null;
    var a = (S.callAns = S.callAns || {})[id] = {text: text, status: status, at: new Date().toISOString()};
    var el = document.getElementById('call-' + id), x = (S.callIdx || {})[id];
    if (el && x) { el.outerHTML = callItem(x, a); callsProgress(); }
    callsBadge();
    toast(status === 'answered' ? 'Recorded: <b>' + esc(id) + '</b>. ' + (x && x.kind === 'assumption' ? 'I\'ll act on it in the next update.' : 'It becomes a decision when it\'s written into canon.') : 'Left for later.');
  }).catch(function (e) { toast('Couldn\'t save: ' + esc(e && e.message || e)); });
}
document.addEventListener('click', function (e) {   // the call cards' buttons, wherever a card is shown (Your calls, #/v1, #/v2)
  var b = e.target.closest && e.target.closest('[data-callquick],[data-callopen],[data-calllater],[data-callsave],[data-callredo]'); if (!b) return;
  var card = b.closest('[data-call]'), id = card && card.getAttribute('data-call'); if (!id) return;
  if (b.hasAttribute('data-callquick')) answerCall(id, 'answered', b.getAttribute('data-callquick'));
  else if (b.hasAttribute('data-calllater')) answerCall(id, 'deferred', '');
  else if (b.hasAttribute('data-callsave')) answerCall(id, 'answered');
  else if (b.hasAttribute('data-callopen')) { card.querySelector('.callmore').style.display = ''; card.querySelector('textarea').focus(); }
  else if (b.hasAttribute('data-callredo')) { card.querySelector('.callacts').style.display = ''; b.parentNode.style.display = 'none'; }
});
function callBrow(a) { var tail = ' · ' + a.area; return a.phase.toLowerCase().slice(-tail.length) === tail.toLowerCase() ? a.phase : a.phase + tail; }   // "v2.1 · Your calls", not twice
function assumptionCard(a, ans) {   // the same card on the v1 and v2 pages
  var x = {id: a.id, kind: 'assumption', eyebrow: callBrow(a), title: a.what, why: a.why, see: a.where, options: a.instead || []};
  (S.callIdx = S.callIdx || {})[a.id] = x; (S.callMeta = S.callMeta || {})[a.id] = {area: 'assumption · ' + x.eyebrow, question: x.title};
  return callItem(x, ans);
}
function callsAll(h) {   // every call, newest batch first: [{section, items}]
  var asm = (h.assumptions || []).slice(), phases = [], v2 = [], old = [];
  asm.forEach(function (a) { if (phases.indexOf(a.phase) < 0) phases.push(a.phase); });
  var item = function (a) { return {id: a.id, kind: 'assumption', eyebrow: callBrow(a), title: a.what, why: a.why, see: a.where, options: a.instead || []}; };
  var latest = phases.filter(function (p) { return /^v2/.test(p); });
  var qs = h.questions.map(function (q) { return {id: q.id, kind: 'question', eyebrow: q.area, title: q.question, why: q.why, options: q.options || [], blocks: q.blocks}; });
  var world = h.world.filter(function (w) { return w.status === 'proposed'; }).map(function (w) { return {id: w.id, kind: 'question', eyebrow: 'world record · ' + w.species, title: w.statement, why: w.note + '. ' + w.capability.replace(/_/g, ' ') + ' for ' + w.species + ' (' + (GAME_NAME[w.game] || w.game) + ').', options: ['Approve', 'Reject', 'Approve with changes']}; });
  var dec = h.decisions.filter(function (d) { return /^PROPOSED/.test(d.status); }).map(function (d) { return {id: d.id, kind: 'question', eyebrow: 'decision · ' + d.area, title: d.title, why: 'Proposed ' + fmtLoose(d.date) + ' and not yet confirmed. Confirming makes it working canon.', options: ['Confirm', 'Reject', 'Confirm with changes']}; });
  var out = [];
  latest.slice().reverse().forEach(function (ph) { out.push({id: 'new', title: ph, items: asm.filter(function (a) { return a.phase === ph; }).map(item)}); });
  out.push({id: 'questions', title: 'Open questions: the ranch, the breeding lab and the chapters', items: qs});
  out.push({id: 'world', title: 'World records waiting on approval', items: world});
  out.push({id: 'decisions', title: 'Decisions proposed, not confirmed', items: dec});
  phases.filter(function (p) { return latest.indexOf(p) < 0; }).reverse().forEach(function (ph) { out.push({id: 'earlier', title: 'Earlier · ' + ph, items: asm.filter(function (a) { return a.phase === ph; }).map(item)}); });
  return out.filter(function (sec) { return sec.items.length; });
}
function callsWaiting(secs, ans) {   // {waiting, all, fresh}: fresh counts the newest batch (the sections marked new)
  var n = 0, all = 0, fresh = 0; secs.forEach(function (s) { s.items.forEach(function (x) { all++; var v = callVerdict(ans[x.id]); if (!v || v[0] === 'later') { n++; if (s.id === 'new') fresh++; } }); });
  return {waiting: n, all: all, fresh: fresh};
}
function callsBadge() {   // the count beside Your calls in the menu and the top bar
  if (!S.hq) return;
  answers().then(function (ans) { Object.assign(ans, S.callAns || {}); var c = callsWaiting(callsAll(S.hq), ans);
    var lead = c.fresh || c.waiting, word = c.fresh ? 'new' : 'waiting';   // the newest batch first; the rest are counted on the page
    document.querySelectorAll('[data-nav="#/calls"] .navcount').forEach(function (el) { el.textContent = lead || ''; el.title = c.waiting + ' waiting in all'; });
    var top = document.getElementById('topcalls'); if (top) { top.style.display = lead ? '' : 'none'; top.textContent = lead + ' ' + word + ' call' + (lead === 1 ? '' : 's'); top.title = c.waiting + ' waiting in all'; }
    var hr = document.getElementById('homecallsrow'), hc = document.getElementById('homecalls');
    if (hr && hc) { hr.style.display = lead ? '' : 'none'; hc.textContent = (c.fresh ? c.fresh + ' new choice' + (c.fresh === 1 ? '' : 's') + ' from this update' : c.waiting + ' choice' + (c.waiting === 1 ? '' : 's')) + ' waiting on you' + (c.waiting > lead ? ' (' + c.waiting + ' in all)' : '') + ', newest first'; } }).catch(function () {});
}
function callsProgress() {
  var all = document.querySelectorAll('#page [data-call]').length, done = document.querySelectorAll('#page [data-call].done').length, el = document.getElementById('callsprog');
  if (el) el.innerHTML = '<div class="bar forest" style="height:6px"><i style="width:' + (all ? Math.round(100 * done / all) : 0) + '%"></i></div><div class="tiny muted" style="margin-top:4px">' + done + ' of ' + all + ' answered</div>';
  document.querySelectorAll('[data-secn]').forEach(function (h) { var sec = h.closest('.callsec'); if (!sec) return; var n = sec.querySelectorAll('[data-call]').length, d = sec.querySelectorAll('[data-call].done').length; h.textContent = d + ' of ' + n + ' answered'; });
}
function calls(q) {
  var m = /show=(\w+)/.exec(q || ""), show = m ? m[1] : "waiting";
  return answers().then(function (ans) {
    Object.assign(ans, S.callAns || {}); S.callAns = ans;
    var secs = callsAll(S.hq), c = callsWaiting(secs, ans);
    S.callMeta = {}; S.callIdx = {};
    secs.forEach(function (sec) { sec.items.forEach(function (x) { S.callIdx[x.id] = x; S.callMeta[x.id] = {area: x.kind === 'assumption' ? 'assumption · ' + x.eyebrow : x.eyebrow, question: x.title}; }); });
    var keep = function (x) { var v = callVerdict(ans[x.id]); return show === 'all' || (show === 'answered' ? v && v[0] !== 'later' : !v || v[0] === 'later'); };
    after(function () { callsProgress(); });
    var tabs = [['waiting', 'Waiting on you', c.waiting], ['answered', 'Answered', c.all - c.waiting], ['all', 'All', c.all]];
    return '<div class="eyebrow">What the estate is waiting on</div><h1 style="margin:6px 0">Your calls</h1>' +
      '<p class="lede">' + (c.waiting ? '<b>' + c.waiting + '</b> waiting on you' + (c.fresh ? ', <b>' + c.fresh + '</b> of them new in this update and shown first' : '') + '.' : 'Nothing is waiting on you.') +
      ' Each call is something I chose while building, or a question only you can answer. One tap answers it: <b>Keep</b> it, <b>Change</b> it (say how), <b>Reject</b> it, or leave it for <b>Later</b>. Your answer goes to the Your Calls tab of your Sheet; nothing changes in the app until I act on it.</p>' +
      '<div id="callsprog" style="max-width:420px;margin:10px 0 4px"></div>' +
      '<div class="tabs" style="margin-top:12px">' + tabs.map(function (t) { return '<a href="#/calls' + (t[0] === 'waiting' ? '' : '?show=' + t[0]) + '"' + (t[0] === show ? ' class="on"' : '') + '>' + t[1] + ' <span class="tiny muted">' + t[2] + '</span></a>'; }).join('') + '</div>' +
      secs.map(function (sec) { var xs = sec.items.filter(keep); if (!xs.length) return '';
        return '<div class="callsec"><div class="ornament" style="margin:22px 0 4px">' + esc(sec.title) + '</div><div class="tiny muted" style="text-align:center;margin-bottom:10px" data-secn="1"></div><div class="grid">' +
          xs.map(function (x) { return '<div class="c6">' + callItem(x, ans[x.id]) + '</div>'; }).join('') + '</div></div>'; }).join('') +
      (secs.every(function (sec) { return !sec.items.filter(keep).length; }) ? '<div class="empty" style="margin-top:18px">' + (show === 'answered' ? 'Nothing answered yet.' : 'Nothing waiting on you. <a href="#/calls?show=all">See every call</a>') + '</div>' : '') +
      '<div id="assumptions"></div>';
  });
}
function recordPage(tab) {
  tab = tab || 'decisions';
  var h = S.hq, k = h.kpis || {};
  var tabs = [['decisions', 'Decisions', h.decisions.length], ['locks', 'Locks', h.locks.length], ['world', 'World records', h.world.length], ['evidence', 'Verified mechanics', null]];
  var head = '<div class="eyebrow">Canon, decisions and evidence</div><h1 style="margin:6px 0">The record</h1><p class="lede">Every decision with its number, every lock and the rule that guards it, every world record and what it rests on. Locked means Claude refuses to change it without a decision that reopens it.</p>' +
    '<div class="kpis" style="margin-top:14px">' + [['Decisions', k.decisions], ['Locked', h.decisions.filter(function (d) { return /^LOCKED/.test(d.status); }).length], ['World records', k.world_records], ['Open questions', k.open_questions], ['Rule issues', k.rule_issues]].map(function (x) {
      return '<div class="kpi"><div class="eyebrow">' + x[0] + '</div><div class="serif num" style="font-size:34px;color:var(--ivory)">' + (x[1] == null ? '—' : x[1]) + '</div></div>'; }).join('') + '</div>' +
    '<div class="tabs" style="margin-top:18px">' + tabs.map(function (t) { return '<a href="#/record/' + t[0] + '"' + (t[0] === tab ? ' class="on"' : '') + '>' + t[1] + (t[2] != null ? ' <span class="tiny muted">' + t[2] + '</span>' : '') + '</a>'; }).join('') + '</div>';
  if (tab === 'decisions') {
    after(function (p) { bindFilter(p); });
    return head + card('All decisions', '<input class="f" data-filter="#dt" placeholder="Filter: a number, a word, a status (LOCKED, WORKING, PROPOSED)…" style="margin-bottom:10px"><table class="t" id="dt"><thead><tr><th>#</th><th>Date</th><th>Decision</th><th>Area</th><th>Status</th><th>Who</th></tr></thead><tbody>' +
      h.decisions.slice().reverse().map(function (d) { return '<tr><td class="mono small" style="white-space:nowrap">' + esc(d.id) + '</td><td class="small" style="white-space:nowrap">' + esc(fmtLoose(d.date) || d.date) + '</td><td>' + esc(d.title) + '</td><td class="small muted">' + esc(d.area) + '</td><td>' + statusChip(d.status) + '</td><td class="small">' + esc(d.who) + '</td></tr>'; }).join('') + '</tbody></table>', {eyebrow: 'Newest first', tools: false});
  }
  if (tab === 'locks') return head + '<div class="grid">' + h.locks.map(function (l) { return '<div class="c6"><div class="card lock"><div class="bd"><div style="display:flex;gap:12px;align-items:flex-start"><div class="lockmark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div><div style="flex:1"><div class="eyebrow">' + esc(l.decision) + '</div><div class="serif" style="font-size:20px;color:var(--ivory);margin:2px 0 4px">' + esc(l.what) + '</div><div class="small" style="color:var(--text-2)">' + esc(l.detail) + '</div><div class="tiny muted" style="margin-top:6px">' + esc(l.rule) + '</div></div></div></div></div></div>'; }).join('') + '</div>';
  if (tab === 'world') return head + '<div class="grid">' + h.world.map(function (w) { var n = numOf(w.species);
    return '<div class="c6"><div class="card"><div class="bd" style="display:grid;grid-template-columns:72px 1fr;gap:14px"><img src="' + art(n) + '" style="width:72px;height:72px;object-fit:contain" loading="lazy"><div><div style="display:flex;justify-content:space-between;gap:8px"><div class="eyebrow">' + esc(w.id) + ' · ' + esc(GAME_NAME[w.game] || w.game) + ' ' + esc(w.species) + '</div>' + statusChip(w.status) + '</div>' +
      '<div class="serif" style="font-size:19px;color:var(--ivory);margin:4px 0">' + esc(w.statement) + '</div><div class="small">' + chip(w.capability.replace(/_/g, ' '), 'violet') + (w.decision ? ' <span class="tiny muted">' + esc(w.decision) + '</span>' : '') + '</div>' +
      '<div class="tiny muted" style="margin-top:6px">' + esc(w.source) + '</div>' + (w.note ? '<div class="tiny" style="margin-top:4px;color:var(--text-2)">' + esc(w.note) + '</div>' : '') + '</div></div></div></div>'; }).join('') + '</div>';
  return API.data('journal').then(function (j) {
    var ev = j.entries.filter(function (e) { return e.kind === 'verified mechanic'; });
    return head + card('Verified mechanics', ev.map(function (e) { return '<div style="display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)"><b class="mono small" style="color:var(--gold-2)">' + esc(e.id || '') + '</b><div><div class="small" style="color:var(--text)">' + esc(e.text) + '</div><div class="tiny muted" style="margin-top:3px">' + esc(e.src) + '</div></div></div>'; }).join(''),
      {eyebrow: 'Checked against PokeAPI, Showdown and Smogon', tools: false});
  });
}
route(/^\/calls\/?(\?.*)?$/, calls, 'Your calls', '#/calls');
route(/^\/record\/?(\w*)$/, recordPage, 'The record', '#/record');
</script>
