(() => {
  const D = SchoolData, Sim = SchoolSim, E = SchoolEvents;
  const store = SaveStore.create('living-school-v1', () => ({ game: null }));
  let save = store.load();
  let st = save.game;
  let view = null;         // what the page is showing right now
  let phoneTab = null;
  let engine = null;
  const app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const N = id => D.BY_ID[id];
  const face = (id, expr, cls, opt) => {
    const look = id === 'me' ? st.player.look : N(id).look;
    const name = id === 'me' ? st.player.name : N(id).first;
    return `<span class="av ${cls || ''}">${Faces.svg(look, expr || 'neutral', Object.assign({ id: id + (cls || '') + Math.floor(Math.random() * 1e6), label: name }, opt || {}))}</span>`;
  };
  function persist() { save.game = st; store.state = save; store.save(); }
  store.onRemote(s => { save = s; st = s.game; if (st) slotStart(); else titleScreen(); });

  // ---------- rendering helpers ----------
  function header() {
    const di = Sim.dayInfo(st.day), P = st.player;
    const ss = Sim.slots(st);
    const cls = Sim.classToday(st);
    const parts = [];
    ss.forEach((s, i) => {
      parts.push(`<span class="slot ${i < st.slot ? 'done' : i === st.slot && st.phase !== 'class' ? 'now' : ''}">${esc(s.label)}</span>`);
      if (i === 0 && cls) parts.push(`<span class="slot ${st.phase === 'class' ? 'now' : st.slot > 0 ? 'done' : ''}">${esc(cls.name)}</span>`);
    });
    const meter = (label, v, low) => `<div class="meter ${v < low ? 'low' : ''}"><span>${label}</span><i><b style="width:${Math.round(v)}%"></b></i></div>`;
    return `<div class="top"><div class="when"><small>Hollow Creek High${st.semester > 1 ? ` · Semester ${st.semester}` : ''}</small>Week ${di.week} · ${di.name}</div>
      <div class="meters">${meter('Energy', P.energy, 25)}${meter('Mood', P.mood, 30)}</div></div>
      <div class="slots">${parts.join('')}</div>`;
  }
  function show(html, opts) {
    app.innerHTML = (opts && opts.bare ? '' : header()) + `<div class="stack" style="margin-top:14px">${html}</div>`;
    document.getElementById('phone-btn').hidden = !st || !!(opts && opts.noPhone);
    updateBadge();
    if (!(opts && opts.keepScroll)) window.scrollTo(0, 0);
  }
  function updateBadge() {
    const b = document.querySelector('#phone-btn .badge');
    const n = st ? st.inbox.filter(m => !m.read).length : 0;
    b.hidden = !n; b.textContent = n;
  }
  function card(title, lede, body, choices, faces, opts) {
    const o = opts || {};
    return `<section class="card ${o.plain ? '' : 'index'}"><h2>${esc(title)}</h2>${lede ? `<p class="lede">${esc(lede)}</p>` : ''}
      <div class="body">${faces && faces.length ? `<div class="faces" style="margin-bottom:10px">${faces.join('')}</div>` : ''}${body}</div>
      ${choices ? `<div class="choices">${choices}</div>` : ''}</section>`;
  }
  const choiceBtn = (act, label, sub, primary, extra) => `<button class="choice ${primary ? 'primary' : ''}" type="button" data-act="${act}" ${extra || ''}><span>${esc(label)}</span>${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;

  // ---------- title and creation ----------
  function titleScreen() {
    document.getElementById('phone-btn').hidden = true;
    app.innerHTML = `<div class="stack"><section class="card title-card"><h1>Living School</h1><p>Hollow Creek High. Eight weeks. Nine people with their own lives, who remember what you do.</p></section>
      ${save.game ? `<div class="choices">${choiceBtn('continue', 'Keep going', save.game.ended ? 'Yearbook' : Sim.dayInfo(save.game.day).label, true)}${choiceBtn('new', 'New student', 'Starts over')}</div>` : `<div class="choices">${choiceBtn('new', 'Enroll', 'Make your character', true)}</div>`}</div>`;
    view = { type: 'title' };
  }
  const draft = { name: '', pro: 'they', look: { skin: Faces.SKINS[3], hair: Faces.HAIRS[1], style: 'short', shirt: Faces.SHIRTS[0] }, likes: ['sports', 'music'], focus: 'athlete', romance: true };
  const FOCUS = { athlete: ['Athlete', { athletics: 58, smarts: 36, charm: 42, creativity: 34 }], brain: ['Brain', { smarts: 60, athletics: 34, charm: 38, creativity: 40 }], charmer: ['Charmer', { charm: 60, athletics: 40, smarts: 36, creativity: 38 }], creative: ['Creative', { creativity: 60, charm: 42, smarts: 38, athletics: 34 }] };
  function createScreen() {
    view = { type: 'create' };
    document.getElementById('phone-btn').hidden = true;
    const sw = (key, list) => `<div class="chips">${list.map(c => `<button class="swatch" type="button" data-look="${key}" data-v="${c}" style="background:${c}" aria-label="${key} ${c}" aria-pressed="${draft.look[key] === c}"></button>`).join('')}</div>`;
    const chips = (key, opts, multi) => `<div class="chips">${opts.map(([v, l]) => `<button class="chip" type="button" data-pick="${key}" data-v="${v}" aria-pressed="${multi ? draft[key].includes(v) : String(draft[key]) === String(v)}">${esc(l)}</button>`).join('')}</div>`;
    app.innerHTML = `<div class="stack"><section class="card"><h2>Enrollment form</h2><p class="lede">You just transferred to Hollow Creek. Fill this out in pen.</p>
      <div class="stack" style="margin-top:14px">
        <div class="preview"><span class="av lg">${Faces.svg(draft.look, 'happy', { id: 'prev', label: 'You' })}</span></div>
        <label class="field"><span>Name</span><input type="text" id="c-name" maxlength="18" placeholder="First name" value="${esc(draft.name)}"></label>
        <div class="field"><span>Pronouns</span>${chips('pro', [['he', 'he/him'], ['she', 'she/her'], ['they', 'they/them']])}</div>
        <div class="field"><span>Skin</span>${sw('skin', Faces.SKINS)}</div>
        <div class="field"><span>Hair</span>${chips('style', Faces.HAIR_STYLES.map(s => [s, s[0].toUpperCase() + s.slice(1)]))}${sw('hair', Faces.HAIRS)}</div>
        <div class="field"><span>Shirt</span>${sw('shirt', Faces.SHIRTS)}</div>
        <div class="field"><span>What are you into? Pick up to three</span>${chips('likes', Object.entries(D.TOPICS).map(([k, v]) => [k, v[0].toUpperCase() + v.slice(1)]), true)}</div>
        <div class="field"><span>What's your thing?</span>${chips('focus', Object.entries(FOCUS).map(([k, v]) => [k, v[0]]))}</div>
        <div class="field"><span>Romance storylines</span>${chips('romance', [['true', 'On'], ['false', 'Off']])}</div>
      </div>
      <div class="choices">${choiceBtn('enroll', 'Start at Hollow Creek', 'Week 1, Monday', true)}</div></section></div>`;
  }
  function enroll() {
    const name = (document.getElementById('c-name').value || '').trim().slice(0, 18) || 'Alex';
    st = Sim.newState({ name, pro: draft.pro, look: Object.assign({}, draft.look), likes: draft.likes.slice(0, 3).length ? draft.likes.slice(0, 3) : ['music'], focus: draft.focus, stats: Object.assign({}, FOCUS[draft.focus][1]) });
    st.settings.romance = draft.romance === true || draft.romance === 'true';
    Sim.log(st, `${name} transferred to Hollow Creek High.`, 'big');
    persist();
    slotStart();
  }

  // ---------- the day loop ----------
  function slotStart(newDay, notes) {
    if (!st) return titleScreen();
    if (st.ended) return yearbook();
    if (newDay) return morningCard(notes || []);
    if (st.phase === 'class') return classCard();
    const beat = E.beatFor(st);
    if (beat) return beatCard(beat);
    const slot = Sim.curSlot(st);
    const plan = st.plans.find(p => p.day === st.day && p.slot === slot.id && p.status === 'set');
    if (plan) return planCard(plan);
    placesCard();
  }
  function morningCard(notes) {
    const di = Sim.dayInfo(st.day);
    const unread = st.inbox.filter(m => !m.read).length;
    const items = notes.filter(n => n.kind !== 'life' || Math.random() < 0.5).slice(0, 3);
    const upcoming = [];
    if (di.week === 2 && di.dow === 1 && st.player.signedUp && !st.player.team) upcoming.push('Basketball tryouts after school.');
    if (st.player.team && di.dow === 4 && di.week >= 3) { const o = D.OPPONENTS.find(x => x.week === di.week); upcoming.push(`Game tonight vs ${o.name}.`); }
    if (di.week === 4 && di.dow === 5) upcoming.push(st.player.date ? `Snow Ball tonight with ${N(st.player.date).first}.` : 'The Snow Ball is tonight.');
    if (di.week === 5 && di.dow === 3) upcoming.push('Midterms today.');
    if (di.week === 8 && di.dow === 3) upcoming.push('Finals today.');
    if (di.week === 8 && di.dow === 6) upcoming.push('Last day of the semester.');
    st.plans.filter(p => p.day === st.day && p.status === 'set').forEach(p => upcoming.push(`Plans with ${N(p.with).first} at ${D.PLACES[p.place].name}.`));
    const cls = Sim.classToday(st);
    const body = `<p>${di.weekend ? 'No school today.' : `Today's class: <span class="hl">${esc(cls.name)}</span> with ${esc(cls.teacher)}.`}</p>
      ${upcoming.length ? `<div class="notes">${upcoming.map(u => `<div class="note"><b>Today</b> · ${esc(u)}</div>`).join('')}</div>` : ''}
      ${items.length ? `<div class="notes">${items.map(n => `<div class="note">${esc(n.text)}</div>`).join('')}</div>` : ''}
      ${unread ? `<p class="small" style="margin-top:10px">${unread} new text${unread > 1 ? 's' : ''} on your phone.</p>` : ''}`;
    show(card(di.label, di.weekend ? 'Weekend' : 'School day', body, choiceBtn('go', di.weekend ? 'Start the day' : 'Head to school', '', true)));
    view = { type: 'morning' };
  }
  function placesCard() {
    const slot = Sim.curSlot(st);
    const di = Sim.dayInfo(st.day);
    const tiles = slot.places.filter(p => Sim.placeOpen(st, p)).map(pid => {
      const P = D.PLACES[pid];
      const who = P.solo ? [] : Sim.present(st, pid, slot.id);
      const gain = Object.entries(P.stat || {}).map(([k, v]) => `+${k[0].toUpperCase() + k.slice(1)}`).join(' ');
      const energy = P.cost < 0 ? '+Energy' : '';
      const money = P.money ? (P.money > 0 ? `+$${P.money}` : `−$${-P.money}`) : '';
      const tag = [gain, energy, money, P.mood ? '+Mood' : ''].filter(Boolean).join(' · ');
      return `<button class="place" type="button" data-act="place" data-p="${pid}"><b>${esc(P.name)}</b><span>${esc(P.blurb)}</span>${tag ? `<span class="tag">${esc(tag)}</span>` : ''}
        <span class="who">${who.slice(0, 5).map(id => face(id, 'neutral', 'sm')).join('')}${P.solo ? '' : who.length ? '' : '<span class="small">Nobody you know</span>'}</span></button>`;
    }).join('');
    const tired = st.player.energy < 20 ? `<p class="note" style="margin-top:0">You're running on fumes. Everything works less well until you rest.</p>` : '';
    show(`${tired}<section class="card"><h2>${esc(slot.label)}</h2><p class="lede">Where are you going? Faces show who's there.</p></section><div class="places">${tiles}</div>`);
    view = { type: 'places' };
  }
  function beatCard(beat) {
    const title = typeof beat.title === 'function' ? beat.title(st) : beat.title;
    const choices = beat.choices(st);
    view = { type: 'beat', beat, choices };
    const faces = (beat.faces ? beat.faces(st) : []).filter(Boolean).map(id => face(id, 'neutral', 'md'));
    show(card(title, Sim.curSlot(st) && st.phase !== 'class' ? Sim.curSlot(st).label : 'Class', `<p>${esc(beat.text(st))}</p>`, choices.map((c, i) => choiceBtn('beatpick', c.label, c.sub, i === 0, `data-i="${i}"`)).join(''), faces));
  }
  function planCard(plan) {
    const P = D.PLACES[plan.place];
    view = { type: 'plan', plan };
    show(card('Plans', Sim.curSlot(st).label, `<p>You told ${esc(N(plan.with).first)} you'd meet at ${esc(P.name)}.</p>`,
      choiceBtn('plango', `Meet ${N(plan.with).first}`, P.name, true) + choiceBtn('planbail', 'Bail', 'They will remember'), [face(plan.with, 'happy', 'md')]));
  }

  function goPlace(pid, opts) {
    const slot = Sim.curSlot(st), P = D.PLACES[pid];
    if (P.texting) return textPicker();
    if (P.solo && !(opts && opts.noEvent)) {
      const ev = E.eventFor(st, { place: pid, slot: slot.id, present: [], day: st.day });
      if (ev) return eventCard(ev, { place: pid, slot: slot.id, present: [] });
    }
    if (P.solo) {
      const lines = doActivity(pid, 1);
      if (pid === 'gaming' && st.npcs.eli.met && st.npcs.eli.friend >= 5) { Sim.adjust(st, 'eli', { friend: 3 }); lines.push('Eli is online. He destroys you in Smash, then sends a GIF.'); }
      return result(P.name, soloText(pid), lines, []);
    }
    const present = Sim.present(st, pid, slot.id);
    const ctx = { place: pid, slot: slot.id, present, day: st.day };
    if (!(opts && opts.noEvent)) {
      const ev = E.eventFor(st, ctx);
      if (ev) return eventCard(ev, ctx);
    }
    sceneCard(pid, present, opts);
  }
  function soloText(pid) {
    return ({
      sleep: 'You hit snooze twice and make it to homeroom with wet hair.', lunch_alone: 'You find a quiet corner and read. It\'s honestly great.',
      home: 'You lie on your bed and stare at the ceiling. Recharged.', homework: 'Two hours, one existential crisis, and the worksheet is done.',
      gaming: 'One more round turns into eleven.', sleep_early: 'Lights out by ten. Tomorrow-you says thanks.'
    })[pid] || 'Done.';
  }
  function doActivity(pid, scale) {
    const P = D.PLACES[pid], pl = st.player;
    const ef = pl.energy < 20 ? 0.5 : 1;
    const lines = [];
    Object.entries(P.stat || {}).forEach(([k, v]) => { const before = pl.stats[k]; Sim.stat(st, k, v * scale * ef); const d = pl.stats[k] - before; if (d >= 0.3) lines.push(`+${d.toFixed(1)} ${k}`); });
    if (P.grade) { const k = Sim.study(st, P.grade * scale * ef); lines.push(`${({ math: 'Algebra', chem: 'Chemistry', hist: 'History', eng: 'English' })[k]} grade up`); }
    if (P.money) { pl.money = Math.max(0, pl.money + P.money); lines.push(P.money > 0 ? `+$${P.money}` : `−$${-P.money}`); }
    if (P.mood) Sim.mood(st, P.mood);
    const cost = P.cost < 0 ? P.cost : P.cost * (scale < 1 ? 0.6 : 1);
    Sim.energy(st, -cost);
    if (pid === 'sleep_early') pl.flags.sleptEarly = true;
    if (P.cost < 0) lines.push('+Energy');
    return lines;
  }

  function sceneCard(pid, present, opts) {
    const P = D.PLACES[pid];
    view = { type: 'scene', pid, present };
    const people = present.map(id => {
      const n = st.npcs[id];
      return `<button class="choice" type="button" data-act="talk" data-id="${id}"><span style="display:flex;gap:10px;align-items:center">${face(id, n.mood < -0.35 ? 'sad' : n.friend < -24 ? 'annoyed' : n.friend > 24 ? 'happy' : 'neutral', 'sm')}Talk to ${esc(N(id).first)}</span><small>${esc(Sim.relLabel(st, id))}</small></button>`;
    }).join('');
    let acts = choiceBtn('act', P.act, Object.entries(P.stat || {}).map(([k]) => '+' + k).join(' ') || '', !present.length);
    if (P.hoops) {
      acts = choiceBtn('drill', pid === 'practice' ? 'Scrimmage' : 'Shooting drill', 'Play it · builds athletics', true) + choiceBtn('act', pid === 'practice' ? 'Run the drills' : P.act, 'Skip the game');
      present.filter(id => N(id).hoops && N(id).hoops.skill >= 0.45).slice(0, 2).forEach(id => { acts += choiceBtn('horse', `Challenge ${N(id).first} to HORSE`, st.rivalry[id] ? `${st.rivalry[id].w}-${st.rivalry[id].l}` : 'First game', false, `data-id="${id}"`); });
    }
    const body = `<p>${esc(P.blurb)}</p>${present.length ? '' : '<p class="small" style="margin-top:6px">Nobody you know is here.</p>'}`;
    show(card(P.name, Sim.curSlot(st).label, body, people + acts, present.map(id => face(id, 'neutral', 'md'))));
  }
  function eventCard(ev, ctx) {
    st.seen[ev.e.id] = st.day;
    const choices = ev.e.choices(st, ev.x);
    view = { type: 'event', ev, ctx, choices };
    const faces = (ev.e.faces ? ev.e.faces(ev.x, st) : []).filter(Boolean).map(id => face(id, 'neutral', 'md'));
    show(card(typeof ev.e.title === 'function' ? ev.e.title(st, ev.x) : ev.e.title, D.PLACES[ctx.place].name, `<p>${esc(ev.e.text(st, ev.x))}</p>`, choices.map((c, i) => choiceBtn('evpick', c.label, c.sub, i === 0, `data-i="${i}"`)).join(''), faces));
  }
  function runOutcome(out, title, faceIds) {
    if (out.hoops) {
      const h = out.hoops;
      return playHoops(h.spec, res => {
        if (h.then && !res.quit) {
          return playHoops(h.then, res2 => { const o2 = h.done(st, res, res2); result(title, out.text + ' ' + o2.text, [], faceIds); });
        }
        const o2 = h.done(st, res);
        result(title, (out.text ? out.text + ' ' : '') + o2.text, [], faceIds);
      });
    }
    if (out.exam) return runExam(out.exam, out.text);
    result(title, out.text, [], faceIds);
  }
  function result(title, text, lines, faceIds, opts) {
    view = { type: 'result', next: opts && opts.next };
    const notes = (lines || []).filter(Boolean);
    persist();
    show(card(title, opts && opts.lede || '', `<p>${esc(text)}</p>${notes.length ? `<div class="notes">${notes.map(n => `<div class="note">${n}</div>`).join('')}</div>` : ''}`, choiceBtn('done', opts && opts.cta || 'Continue', '', true), (faceIds || []).map(id => face(id, 'happy', 'md'))));
  }
  function endSlot() {
    const P = st.player;
    const wasMorning = Sim.curSlot(st).id === 'morning';
    const r = Sim.advance(st);
    if (!r.newDay && wasMorning && !Sim.dayInfo(st.day).weekend) st.phase = 'class';
    persist();
    if (r.ended) return yearbook();
    slotStart(r.newDay, r.notes);
  }

  // ---------- conversation ----------
  function startConvo(id, opts) {
    const s = Convo.start(st, id, opts);
    if (opts && opts.vibe) s.vibe = opts.vibe;
    view = { type: 'convo', s, last: null, opts: opts || {} };
    renderConvo();
  }
  function renderConvo() {
    const { s, last } = view;
    const c = N(s.id), n = st.npcs[s.id];
    const marks = { good: 'They like this', bad: 'They hate this', risky: 'Risky', unknown: '?' };
    const hand = s.done ? '' : `<div class="hand">${s.hand.map((h, i) => `<button class="cardbtn" type="button" data-act="card" data-i="${i}"><b>${esc(h.label)}</b>${h.sub ? `<small>${esc(h.sub)}</small>` : '<small>&nbsp;</small>'}${h.mark ? `<span class="mark ${h.mark}">${marks[h.mark]}</span>` : ''}</button>`).join('')}</div>`;
    const lastLine = last ? `<p class="react">${last.notes.map(x => esc(x)).join(' ')} <span class="delta ${last.delta >= 0 ? 'up' : 'down'}">${last.delta >= 0 ? '+' : ''}${Math.round(last.delta)}</span></p>` : '';
    const lede = s.mode === 'text' ? 'Texting' : D.PLACES[view.opts.place || 'hall'] ? '' : '';
    show(`<section class="convo">
      <div class="convo-head">${face(s.id, s.expr, 'lg', { blush: n.romance >= 55 })}<div><div class="nm">${esc(c.first)}</div><div class="rl">${esc(Sim.relLabel(st, s.id))}${s.mode === 'text' ? ' · texting' : ''}</div><div class="rl">${esc(c.bio)}</div></div></div>
      <div class="bubble">${esc(s.line)}</div>
      ${lastLine}
      <div class="vibe"><span>Vibe</span><i><b style="width:${Math.round((s.vibe - 0.6) / 1.6 * 100)}%"></b></i><span>${s.round}/${s.rounds}</span></div>
      ${s.done ? choiceBtn('endconvo', 'Wrap it up', '', true) : hand}
    </section>`, { keepScroll: false });
  }
  function playCard(i) {
    const { s } = view;
    const h = s.hand[i];
    if (!h) return;
    const rec = Convo.play(st, s, h);
    view.last = rec;
    try { Sfx.play(rec.tier === 'love' ? 'great' : rec.tier === 'like' ? 'good' : rec.tier === 'meh' ? 'pop' : 'bad'); } catch (_) {}
    renderConvo();
  }
  function endConvo() {
    const { s, opts } = view;
    const r = Convo.finish(st, s);
    const c = N(s.id);
    const lines = [];
    lines.push(`<b>${esc(c.first)}</b> ${r.df >= 0 ? '+' : ''}${r.df} · ${esc(r.tier)}`);
    if (r.change) lines.push(`${esc(c.first)}: ${esc(r.change.from)} → <b>${esc(r.change.to)}</b>`);
    if (r.romance > 0) lines.push(`Something's there with ${esc(c.first)}.`);
    if (r.number) lines.push(`${esc(c.first)} gave you their number.`);
    r.notes.forEach(n => lines.push(esc(n)));
    if (opts.place) doActivity(opts.place, 0.5); else if (s.mode === 'text') Sim.energy(st, -2);
    Sim.energy(st, -3);
    const tone = r.df >= 10 ? 'That went really well.' : r.df >= 3 ? 'That went fine.' : r.df > -3 ? 'That was a little flat.' : 'That did not go great.';
    result(s.mode === 'text' ? `Texting ${c.first}` : `Talking to ${c.first}`, tone, lines, [s.id]);
  }

  // ---------- texting from home ----------
  function textPicker() {
    const ids = D.CAST.filter(c => st.npcs[c.id].gaveNumber).map(c => c.id);
    view = { type: 'textpick' };
    if (!ids.length) {
      const lines = doActivity('phone', 1);
      Sim.mood(st, 3);
      return result('Your phone', 'Nobody\'s given you their number yet, so you scroll videos until your eyes hurt. Talk to people at school and they will.', lines, []);
    }
    show(card('Text somebody', 'Tonight', '<p>Who are you texting?</p>', ids.map(id => `<button class="choice" type="button" data-act="textwho" data-id="${id}"><span style="display:flex;gap:10px;align-items:center">${face(id, 'neutral', 'sm')}${esc(N(id).first)}</span><small>${esc(Sim.relLabel(st, id))}</small></button>`).join('') + choiceBtn('back', 'Never mind', '')));
  }

  // ---------- class ----------
  function classCard() {
    const beat = E.beatFor(st);
    if (beat) return beatCard(beat);
    const cls = Sim.classToday(st);
    view = { type: 'class', cls };
    const g = st.player.grades[cls.id];
    const help = { algebra: 'Solve for x, fast.', titration: 'Pour to the line.', timeline: 'Put history in order.', proofread: 'Catch the typos.', freethrows: 'Three free throws.', sketch: 'Draw a perfect circle.' }[cls.game];
    show(card(`Period 2 · ${cls.name}`, cls.teacher, `<p>${esc(help)} ${g != null ? `Current grade: <span class="hl">${Math.round(g)}</span>.` : ''}</p>`,
      choiceBtn('classplay', 'Pay attention', 'Play it', true) + choiceBtn('classskip', 'Zone out', 'Coast on what you know')));
  }
  function microOpts() {
    const e = st.player.energy;
    return { seconds: 13 * (e < 20 ? 0.75 : e < 40 ? 0.9 : 1), hard: st.player.stats.smarts > 60, rand: () => Sim.live(st) };
  }
  function runMicro(cls, done) {
    if (cls.game === 'freethrows') {
      return playHoops({ kind: 'shots', court: 'gym', title: 'Gym class', shots: [{ spot: 'ft', label: 'Free throw 1 of 3' }, { spot: 'ft', label: 'Free throw 2 of 3' }, { spot: 'ft', label: 'Free throw 3 of 3' }] }, res => done(res.quit ? 0.3 : res.makes / 3, `${res.makes}/3 free throws`));
    }
    view = { type: 'micro' };
    show('<section class="card" id="mg"></section>', { noPhone: true });
    Micro.run(cls.game, document.getElementById('mg'), microOpts(), done);
  }
  function gradeFrom(cls, score, label, examWeight) {
    const g = st.player.grades;
    const before = g[cls.id];
    const w = examWeight || 0.22;
    g[cls.id] = Sim.clamp(before * (1 - w) + (55 + score * 45) * w, 0, 100);
    Sim.stat(st, cls.id === 'pe' ? 'athletics' : cls.id === 'art' ? 'creativity' : 'smarts', 0.6 + score);
    return `${cls.name}: ${label}. Grade ${Math.round(before)} → ${Math.round(g[cls.id])}.`;
  }
  function finishClass(lines) {
    st.phase = 'slot';
    persist();
    result('Class', lines.length > 1 ? 'Exams done. Your brain is soup.' : 'Bell rings.', lines, []);
    view.next = 'slot';
  }
  function runExam(n, intro) {
    const pool = D.CLASSES.slice(0, 4);
    const order = pool.slice().sort(() => Sim.live(st) - 0.5).slice(0, n);
    const lines = [];
    const step = i => {
      if (i >= order.length) return finishClass(lines);
      runMicro(order[i], (score, label) => { lines.push(gradeFrom(order[i], score, label, 0.35)); step(i + 1); });
    };
    step(0);
  }

  // ---------- basketball ----------
  function hoopsSettings() {
    const a = st.player.stats.athletics;
    return { touchK: st.hoops.touchK || 1.75, feel: st.settings.feel, showTags: true, skin: st.player.look.skin, sleeve: st.player.team ? '#1e5b47' : st.player.look.shirt, rating: { shooting: Math.round(25 + a * 0.75), handle: Math.round(25 + a * 0.7) } };
  }
  function playHoops(spec, done) {
    const el = document.getElementById('hoops');
    if (!engine) engine = HoopsEngine.create(el, hoopsSettings());
    engine.setSettings(hoopsSettings());
    const open = () => { el.hidden = false; document.body.style.overflow = 'hidden'; };
    const close = () => { el.hidden = true; document.body.style.overflow = ''; };
    const run = () => {
      open();
      const full = Object.assign({ fatigue: Math.max(0, (35 - st.player.energy) / 70) }, spec);
      engine.run(full, { onEnd: r => { close(); done(r); }, onQuit: r => { close(); r.quit = true; done(r); } });
    };
    if (!st.hoops.touchK) {
      open();
      engine.run({ kind: 'shots', court: spec.court || 'gym', calibrate: true, title: 'Find your touch', shots: [{ spot: 'ft', label: 'Free throw 1 of 3' }, { spot: 'ft', label: 'Free throw 2 of 3' }, { spot: 'ft', label: 'Free throw 3 of 3' }] }, {
        onEnd: r => { if (r.touchK) { st.hoops.touchK = r.touchK; persist(); } run(); },
        onQuit: () => { close(); done({ quit: true, points: 0, makes: 0, attempts: 0, log: [] }); }
      });
      return;
    }
    run();
  }
  function drill(pid) {
    const team = pid === 'practice';
    const spec = team
      ? { kind: 'possessions', court: 'gym', count: 3, shotClock: 6, title: 'Scrimmage', situation: 'Coach Dwyer is running live reps' }
      : { kind: 'shots', court: pid === 'park' ? 'park' : 'gym', title: 'Shooting drill', shots: ['le', 'top', 're', 'lw', 'rw'].map((s, i) => ({ spot: s, label: `Shot ${i + 1} of 5` })) };
    playHoops(spec, res => {
      if (res.quit) { doActivity(pid, 0.5); return result('Drill', 'You cut it short.', [], []); }
      const lines = doActivity(pid, 1);
      const bonus = team ? (res.readIQ || 0) / 40 : res.makes / 2.5;
      Sim.stat(st, 'athletics', bonus);
      lines.push(team ? `Read IQ ${res.readIQ || 0}, ${res.points} points` : `${res.makes}/${res.attempts} made`);
      if (team) ['marcus', 'tyler', 'hannah'].forEach(id => Sim.adjust(st, id, { friend: res.points >= 4 ? 2 : 1 }));
      result(team ? 'Scrimmage' : 'Shooting drill', team ? (res.points >= 4 ? 'Coach Dwyer nods once. From him, that\'s a parade.' : 'Coach Dwyer makes you run a suicide. Character building.') : (res.makes >= 4 ? 'Stroke feels pure today.' : 'Some days the rim is a bottle cap.'), lines, []);
    });
  }

  // ---------- yearbook ----------
  function yearbook() {
    view = { type: 'yearbook' };
    const P = st.player;
    const met = D.CAST.filter(c => st.npcs[c.id].met);
    const usedRecall = new Set();
    const sigs = met.sort((a, b) => st.npcs[b.id].friend - st.npcs[a.id].friend).map(c => {
      const n = st.npcs[c.id];
      // each signature reaches for its own memory, so the page isn't ten copies of one game
      const ms = Sim.memories(st, c.id).filter(x => !x.resolved || x.v > 0).sort((a, b) => Math.abs(b.v) * b.w - Math.abs(a.v) * a.w);
      const m = ms.find(x => !usedRecall.has(x.recall)) || null;
      if (m) usedRecall.add(m.recall);
      const t = Sim.tierOf(n.friend).key;
      let msg;
      if (t === 'best') msg = `${P.name}! Best semester ever, mostly because of you.`;
      else if (t === 'good') msg = `${P.name}, so glad you transferred here.`;
      else if (t === 'friend') msg = `Hey ${P.name}, glad we got to hang out.`;
      else if (t === 'acq') msg = `${P.name} - have a good break.`;
      else if (t === 'stranger') msg = `Have a great break!`;
      else msg = `Have a break, I guess.`;
      if (m && m.v > 0 && n.friend > 5) msg += ` Never forgetting ${m.recall || 'that'}.`;
      if (m && m.v < 0) msg += ` Still not over ${m.recall || 'what happened'}.`;
      if (st.player.date === c.id && n.romance >= 40) msg += ' Call me.';
      return `<div class="sig">${face(c.id, t === 'best' || t === 'good' ? 'happy' : n.friend < -24 ? 'annoyed' : 'neutral', '')}<div>${esc(msg)} <br>- ${esc(c.first)}<small>${esc(Sim.relLabel(st, c.id))}</small></div></div>`;
    }).join('');
    const sup = [];
    const best = met.slice().sort((a, b) => st.npcs[b.id].friend - st.npcs[a.id].friend)[0];
    if (st.season.games.some(g => g.pts >= 4)) sup.push(['Most likely to hit a game-winner', 'Your fourth quarters were must-see.']);
    const topStat = Object.entries(P.stats).sort((a, b) => b[1] - a[1])[0][0];
    sup.push({ smarts: ['Most likely to cure something', 'Top of the class.'], athletics: ['Most athletic', 'Nobody outworked you.'], charm: ['Class charmer', 'Everybody knows your name.'], creativity: ['Most likely to be famous', 'Ms. Okafor saved your sketches.'] }[topStat]);
    const secretsKept = st.gossip.filter(g => g.secret && !D.CAST.some(c => st.npcs[c.id].mem.some(m => m.k === 'betrayed'))).length;
    if (secretsKept) sup.push(['Vault', `Kept ${secretsKept} secret${secretsKept > 1 ? 's' : ''}.`]);
    if (D.CAST.some(c => st.npcs[c.id].mem.some(m => m.k === 'betrayed'))) sup.push(['Loose lips', 'Some secrets got out. People noticed.']);
    if (best && st.npcs[best.id].friend >= 50) sup.push(['Best duo', `You and ${best.first}.`]);
    const big = st.journal.filter(j => ['big', 'win', 'hoops'].includes(j.kind)).slice(-8);
    document.getElementById('phone-btn').hidden = true;
    app.innerHTML = `<div class="stack yb"><section class="card"><p class="small">Hollow Creek High · ${st.semester > 1 ? 'Semester ' + st.semester : 'Winter'} yearbook</p>
      <div style="display:flex;gap:14px;align-items:center;margin-top:10px">${face('me', 'happy', 'lg')}<div><h1>${esc(P.name)}</h1><p class="small">${P.team ? (P.team === 'varsity' ? 'Varsity basketball' : 'JV basketball') : 'Transfer student'}${st.player.date ? ` · Snow Ball with ${esc(N(st.player.date).first)}` : ''}</p></div></div>
      <div class="statrow" style="margin-top:14px"><div><b>${Sim.gpa(st)}</b><span>GPA</span></div><div><b>${st.season.w}-${st.season.l}</b><span>Season</span></div><div><b>${met.filter(c => st.npcs[c.id].friend >= 24).length}</b><span>Friends</span></div></div></section>
      <section class="card"><h2>Superlatives</h2><div class="sup" style="margin-top:10px">${sup.map(([a, b]) => `<div><b>${esc(a)}</b> · ${esc(b)}</div>`).join('')}</div></section>
      ${big.length ? `<section class="card"><h2>The semester</h2><div class="notes">${big.map(j => `<div class="note"><b>W${Sim.dayInfo(j.day).week}</b> · ${esc(j.body)}</div>`).join('')}</div></section>` : ''}
      <h2 style="font:400 24px var(--display);margin-top:6px">Signatures</h2>${sigs || '<p class="small">Nobody signed it. Next semester, talk to people.</p>'}
      <div class="choices">${choiceBtn('nextsem', 'Start next semester', 'Same people, new weeks. They remember everything.', true)}${choiceBtn('new', 'New student', 'Start over')}</div></div>`;
    window.scrollTo(0, 0);
  }
  function nextSemester() {
    st.semester++; st.day = 0; st.slot = 0; st.phase = 'slot'; st.ended = false;
    st.season = { w: 0, l: 0, games: [] }; st.plans = []; st.player.date = null; st.player.flags = {}; st.player.energy = 90;
    st.seen = { first_day: 0 };
    D.CAST.forEach(c => { const n = st.npcs[c.id]; n.coming = null; n.askedDance = false; n.noteSent = false; n.told = []; });
    Sim.log(st, `Semester ${st.semester} started.`, 'big');
    persist(); slotStart(true, []);
  }

    if (b.dataset.look) { draft.look[b.dataset.look] = b.dataset.v; draft.name = (document.getElementById('c-name') || {}).value || draft.name; Sfx.play('ui'); return createScreen(); }

      if (k === 'likes') draft.likes = draft.likes.includes(v) ? draft.likes.filter(x => x !== v) : draft.likes.concat([v]).slice(-3);
      else if (k === 'style') draft.look.style = v;
      else if (k === 'romance') draft.romance = v === 'true';
      else draft[k] = v;
      Sfx.play('ui');
      return createScreen();

      case 'new': return createScreen();

      case 'go': return slotStart();

      case 'beatpick': { const c = view.choices[Number(b.dataset.i)]; const beat = view.beat; st.seen[beat.id] = st.day; const out = c.run(st); return runOutcome(out, typeof beat.title === 'function' ? beat.title(st) : beat.title, []); }
      case 'evpick': { const c = view.choices[Number(b.dataset.i)]; const ev = view.ev; const out = c.run(st, ev.x); return runOutcome(out, typeof ev.e.title === 'function' ? ev.e.title(st, ev.x) : ev.e.title, (ev.e.faces ? ev.e.faces(ev.x, st) : []).filter(Boolean)); }
      case 'plango': { const p = view.plan; p.status = 'done'; Sim.adjust(st, p.with, { friend: 4 }); Sim.remember(st, p.with, { k: 'hang' + p.day, v: 1.5, recall: `hanging out at ${D.PLACES[p.place].name}`, line: `That was fun at ${D.PLACES[p.place].name}. We should do it again.`, t: `We hung out at ${D.PLACES[p.place].name}.` }); return startConvo(p.with, { place: p.place, vibe: 1.3 }); }
      case 'planbail': { const p = view.plan; p.status = 'bailed'; Sim.adjust(st, p.with, { friend: -10, mood: -0.3 }); Sim.remember(st, p.with, { k: 'bailed', v: -2, recall: 'standing me up', line: 'Oh, you showed up. That\'s new.', t: 'You stood me up.' }); Sim.text(st, p.with, Sim.pickLive(st, ['so i guess you\'re not coming', 'cool. waited 40 min', 'ok then'])); return placesCard(); }
      case 'talk': return startConvo(b.dataset.id, { place: view.pid });
      case 'card': return playCard(Number(b.dataset.i));
      case 'endconvo': return endConvo();
      case 'act': { const pid = view.pid; const lines = doActivity(pid, 1); return result(D.PLACES[pid].name, actText(pid), lines, []); }
      case 'drill': return drill(view.pid);
      case 'horse': { const id = b.dataset.id, pid = view.pid; return playHoops({ kind: 'horse', court: D.PLACES[pid].outdoor ? 'park' : 'gym', title: 'HORSE', opponent: E.hoopsOpponent(st, id) }, res => { doActivity(pid, 0.6); const o = E.horseResult(st, id, res); result('HORSE', o.text, [], [id]); }); }
      case 'done': { if (view && view.next === 'slot') { view = null; return slotStart(); } return endSlot(); }
      case 'textwho': return startConvo(b.dataset.id, { mode: 'text' });
      case 'back': return placesCard();
      case 'classplay': { const cls = view.cls; return runMicro(cls, (score, label) => finishClass([gradeFrom(cls, score, label)])); }
      case 'classskip': { const cls = view.cls; const s = Sim.clamp(st.player.stats.smarts / 100 * 0.75 + (Sim.live(st) - 0.5) * 0.2, 0, 1); return finishClass([gradeFrom(cls, s, 'zoned out')]); }
      case 'nextsem': return nextSemester();
    }
  });

    const m = st.inbox.find(x => x.id === b.dataset.m);
    if (act === 'inv-yes' && m) { m.answered = true; st.plans.push({ day: m.invite.day, slot: m.invite.slot, with: m.from, place: m.invite.place, status: 'set' }); Sim.adjust(st, m.from, { friend: 2 }); Sim.text(st, m.from, 'yay ok see you there'); persist(); closePhone(); return slotStart(); }
    if (act === 'inv-no' && m) { m.answered = true; Sim.adjust(st, m.from, { friend: -1 }); persist(); return renderPhone(); }
    if (act === 'reply' && m) { m.answered = true; closePhone(); return startConvo(m.from, { mode: 'text', vibe: m.vent ? 1.3 : 1.1 }); }
    if (act === 'feel') { const order = ['arcade', 'normal', 'pro']; st.settings.feel = order[(order.indexOf(st.settings.feel) + 1) % 3]; persist(); return renderPhone(); }
    if (act === 'retouch') { st.hoops.touchK = null; persist(); closePhone(); return; }
    if (act === 'sound') { st.settings.sound = !st.settings.sound; Sfx.muted = !st.settings.sound; persist(); return renderPhone(); }
    if (act === 'quit-title') { closePhone(); persist(); return titleScreen(); }
  });

  // boot
  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
    try { window.claude.hot.snapshot(() => ({ v: 1 })); } catch (_) {}
  }
  const boot = () => { if (st) Sfx.muted = !st.settings.sound; titleScreen(); };
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
  window.__school = { get st() { return st; }, get view() { return view; }, refresh: () => slotStart() };
})();
</script>
