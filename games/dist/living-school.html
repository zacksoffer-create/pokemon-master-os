<style>
/* Layout: a student planner open on ruled paper. The day's page runs down the
   middle; your phone lives in the bottom corner. Index cards hold scenes. */
:root {
  --paper: #fbfbf8;
  --paper-2: #eef2f7;
  --rule: #dbe5f0;
  --margin: #eaa5a5;
  --ink: #1f2a44;
  --ink-soft: #5b667c;
  --hawk: #1e5b47;
  --hawk-ink: #ffffff;
  --gold: #c98f12;
  --hi: #fff27a;
  --good: #2f8a5c;
  --bad: #c2453a;
  --card: #ffffff;
  --card-line: #e3e8ef;
  --shadow: 0 1px 2px rgba(31, 42, 68, 0.08), 0 6px 18px rgba(31, 42, 68, 0.08);
  --face-bg: #e3ebf3;
  --phone: #141a24;
  --phone-ink: #eef2f8;
  --display: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
  --body: "Lexend", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #10161f; --paper-2: #182231; --rule: #1a2433; --margin: #4a2626; --ink: #e7edf6; --ink-soft: #9ba7ba;
  --hawk: #3fa57e; --hawk-ink: #08130e; --gold: #f0c45a; --hi: #6b5d12; --good: #5cc58e; --bad: #f07a6e;
  --card: #18212d; --card-line: #273244; --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 22px rgba(0,0,0,0.35); --face-bg: #233041; --phone: #0a0e14; --phone-ink: #eef2f8; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #10161f; --paper-2: #182231; --rule: #1a2433; --margin: #4a2626; --ink: #e7edf6; --ink-soft: #9ba7ba;
  --hawk: #3fa57e; --hawk-ink: #08130e; --gold: #f0c45a; --hi: #6b5d12; --good: #5cc58e; --bad: #f07a6e;
  --card: #18212d; --card-line: #273244; --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 22px rgba(0,0,0,0.35); --face-bg: #233041; --phone: #0a0e14; --phone-ink: #eef2f8; color-scheme: dark;
}
html, body { background: var(--paper); color: var(--ink); }
body { font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; background-image: repeating-linear-gradient(to bottom, transparent 0 29px, var(--rule) 29px 30px); background-attachment: local; }
body::after { content: ""; position: fixed; top: 0; bottom: 0; left: calc(max(16px, env(safe-area-inset-left, 0px)) - 8px); width: 1.5px; background: var(--margin); opacity: 0.7; pointer-events: none; }
#app { max-width: 600px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 110px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.face { display: block; width: 100%; height: 100%; }
.av { width: 44px; height: 44px; flex: none; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--card); }
.av.lg { width: 104px; height: 104px; box-shadow: 0 0 0 3px var(--card), var(--shadow); }
.av.md { width: 64px; height: 64px; }
.av.sm { width: 30px; height: 30px; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.when { font: 400 26px/1 var(--display); color: var(--hawk); }
.when small { display: block; font: 600 11px/1.2 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px; }
.meters { display: grid; gap: 4px; min-width: 128px; }
.meter { display: grid; grid-template-columns: 52px 1fr; gap: 6px; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
.meter i { display: block; height: 7px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.meter i b { display: block; height: 100%; background: var(--hawk); border-radius: 4px; }
.meter.low i b { background: var(--bad); }
.slots { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.slot { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; color: var(--ink-soft); background: var(--paper-2); }
.slot.now { background: var(--hi); color: var(--ink); }
.slot.done { text-decoration: line-through; opacity: 0.55; }

/* cards */
.card { background: var(--card); border: 1px solid var(--card-line); border-radius: 6px; box-shadow: var(--shadow); padding: 16px; position: relative; }
.card.index::before { content: ""; position: absolute; left: 0; right: 0; top: 40px; height: 1.5px; background: var(--margin); opacity: 0.8; }
.card h2 { font: 400 22px/1.15 var(--display); color: var(--ink); min-height: 26px; }
.card .lede { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
.card.index .body { margin-top: 16px; }
.body p + p { margin-top: 8px; }
.faces { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hl { background: linear-gradient(transparent 55%, var(--hi) 55%); padding: 0 2px; }
.choices { display: grid; gap: 8px; margin-top: 14px; }
.choice { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--card-line); background: var(--card); cursor: pointer; font-weight: 500; }
.choice:hover { border-color: var(--hawk); }
.choice small { color: var(--ink-soft); font-weight: 400; font-size: 12px; text-align: right; max-width: 55%; }
.choice > span { min-width: 0; }
.choice.primary { background: var(--hawk); border-color: var(--hawk); color: var(--hawk-ink); }
.choice.primary small { color: inherit; opacity: 0.85; }
.choice[disabled] { opacity: 0.45; cursor: default; }
.notes { display: grid; gap: 6px; margin-top: 12px; }
.note { font-size: 13px; padding: 7px 10px; border-radius: 6px; background: var(--paper-2); }
.note b { color: var(--hawk); }

/* places */
.places { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.place { text-align: left; padding: 12px; border-radius: 8px; border: 1.5px solid var(--card-line); background: var(--card); cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 92px; box-shadow: var(--shadow); }
.place:hover { border-color: var(--hawk); }
.place b { font-weight: 600; font-size: 15px; }
.place span { font-size: 12px; color: var(--ink-soft); line-height: 1.35; }
.place .who { display: flex; gap: 3px; margin-top: auto; padding-top: 6px; min-height: 30px; align-items: center; }
.place .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--hawk); }
.place.plan { border-color: var(--gold); }

/* conversation */
.convo { display: flex; flex-direction: column; gap: 12px; }
.convo-head { display: flex; gap: 14px; align-items: center; }
.convo-head .nm { font: 400 24px/1.1 var(--display); }
.convo-head .rl { font-size: 13px; color: var(--ink-soft); }
.bubble { position: relative; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--shadow); font-size: 16px; line-height: 1.45; }
.bubble::before { content: ""; position: absolute; left: 40px; top: -8px; width: 14px; height: 14px; background: var(--card); border-left: 1px solid var(--card-line); border-top: 1px solid var(--card-line); transform: rotate(45deg); }
.vibe { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
.vibe i { flex: 1; height: 8px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.vibe i b { display: block; height: 100%; background: linear-gradient(90deg, var(--hawk), var(--gold)); transition: width 0.3s; }
.hand { display: grid; gap: 8px; }
.cardbtn { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; padding: 11px 14px; border-radius: 8px; border: 1.5px solid var(--card-line); background: var(--card); cursor: pointer; box-shadow: var(--shadow); }
.cardbtn:hover { border-color: var(--hawk); transform: translateY(-1px); }
.cardbtn b { font-weight: 500; font-size: 15px; }
.cardbtn small { grid-column: 1; color: var(--ink-soft); font-size: 12px; }
.mark { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 3px 7px; border-radius: 999px; white-space: nowrap; }
.mark.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.mark.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.mark.risky { background: color-mix(in srgb, var(--gold) 20%, transparent); color: var(--gold); }
.mark.unknown { background: var(--paper-2); color: var(--ink-soft); }
.react { font-size: 13px; color: var(--ink-soft); }
.delta { font-weight: 700; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }

/* phone */
.phone-btn { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--phone); color: var(--phone-ink); box-shadow: 0 8px 20px rgba(0,0,0,0.3); cursor: pointer; display: grid; place-items: center; }
.phone-btn svg { width: 26px; height: 26px; }
.phone-btn .badge { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--bad); color: #fff; font: 700 12px/20px var(--body); }
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(10, 14, 20, 0.45); }
.phone { background: var(--phone); color: var(--phone-ink); border-radius: 22px 22px 0 0; max-height: 88vh; display: flex; flex-direction: column; width: 100%; max-width: 600px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up 0.22s ease-out; }
@keyframes up { from { transform: translateY(30px); } to { transform: none; } }
.phone header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; }
.phone header h3 { flex: 1; font: 600 17px/1 var(--body); }
.x { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.1); color: var(--phone-ink); cursor: pointer; font-size: 16px; }
.tabs { display: flex; gap: 6px; padding: 0 16px 10px; }
.tab { flex: 1; padding: 8px 4px; border-radius: 10px; border: 0; background: rgba(255,255,255,0.06); color: var(--phone-ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--phone-ink); color: var(--phone); }
.pbody { overflow-y: auto; padding: 4px 16px 18px; display: grid; gap: 8px; align-content: start; }
.msg { display: grid; grid-template-columns: 36px 1fr; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.06); }
.msg.unread { background: rgba(255,255,255,0.12); }
.msg .from { font-weight: 600; font-size: 13px; }
.msg .from span { font-weight: 400; opacity: 0.6; margin-left: 6px; }
.msg p { font-size: 14px; margin-top: 2px; }
.msg .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.pbtn { padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); background: transparent; color: var(--phone-ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.pbtn.go { background: #3fa57e; border-color: #3fa57e; color: #06110c; }
.person { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.06); }
.person .nm { font-weight: 600; }
.person .rl { font-size: 12px; opacity: 0.7; }
.bar2 { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); margin-top: 6px; overflow: hidden; position: relative; }
.bar2 b { position: absolute; top: 0; bottom: 0; background: #3fa57e; }
.bar2 b.neg { background: #f07a6e; }
.kv { font-size: 12px; margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.kv span { padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,0.08); }
.kv span.l { background: rgba(63,165,126,0.25); } .kv span.d { background: rgba(240,122,110,0.25); }
.mem { font-size: 12px; opacity: 0.85; margin-top: 6px; font-style: italic; }
.cal { display: grid; gap: 6px; }
.calrow { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.05); font-size: 13px; }
.calrow.today { background: rgba(255,242,122,0.18); }
.calrow b { font-weight: 600; }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.st { padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.06); }
.st b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.st span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }

/* microgames */
.mg { display: flex; flex-direction: column; gap: 10px; }
.mg-head b { display: block; font: 400 24px/1.1 var(--display); }
.mg-head span { font-size: 13px; color: var(--ink-soft); }
.mg-timer { height: 8px; border-radius: 4px; background: var(--paper-2); overflow: hidden; }
.mg-timer i { display: block; height: 100%; background: var(--hawk); }
.mg-timer i.low { background: var(--bad); }
.mg-body { min-height: 220px; display: flex; flex-direction: column; gap: 12px; justify-content: center; border-radius: 10px; transition: background 0.2s; }
.mg-body.ok { animation: okf 0.35s; } .mg-body.no { animation: nof 0.35s; }
@keyframes okf { 0% { background: color-mix(in srgb, var(--good) 25%, transparent); } 100% { background: transparent; } }
@keyframes nof { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.mg-eq { text-align: center; font: 600 34px/1.2 var(--body); font-variant-numeric: tabular-nums; }
.mg-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mg-opts button, .mg-list button { padding: 14px 8px; border-radius: 10px; border: 1.5px solid var(--card-line); background: var(--card); font-size: 17px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); }
.mg-list { display: grid; gap: 8px; }
.mg-list button { font-size: 15px; font-weight: 500; text-align: left; }
.mg-list button[disabled] { opacity: 0.6; background: var(--paper-2); }
.mg-list button b { color: var(--hawk); margin-right: 6px; }
.mg-sent { font-size: 19px; line-height: 2; text-align: center; }
.mg-sent button { border: 0; background: transparent; padding: 2px 3px; border-radius: 4px; cursor: pointer; font-size: 19px; }
.mg-sent button:hover { background: var(--hi); }
.mg-beaker { display: flex; justify-content: center; color: var(--ink-soft); }
.mg-beaker svg { width: 150px; height: auto; }
.mg-beaker .liq { fill: color-mix(in srgb, #d94f87 70%, transparent); }
.mg-beaker .tgt { stroke: var(--ink); }
.mg-hold { align-self: center; padding: 16px 30px; border-radius: 999px; border: 0; background: var(--hawk); color: var(--hawk-ink); font-weight: 700; font-size: 16px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
.mg-hold.on { transform: scale(0.96); filter: brightness(1.15); }
.mg-canvas { width: min(100%, 340px); aspect-ratio: 1; max-width: 100%; align-self: center; border-radius: 12px; background: var(--card); border: 1.5px dashed var(--card-line); touch-action: none; }
.mg-foot { min-height: 20px; font-size: 13px; color: var(--ink-soft); text-align: center; }

/* creation + title */
.title-card { text-align: center; padding: 28px 16px; }
.title-card h1 { font: 400 clamp(38px, 12vw, 64px)/0.95 var(--display); color: var(--hawk); }
.title-card p { color: var(--ink-soft); margin-top: 10px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--card-line); background: var(--card); cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--hawk); border-color: var(--hawk); color: var(--hawk-ink); }
.swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1.5px var(--card-line); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--hawk); }
input[type=text] { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 8px; border: 1.5px solid var(--card-line); background: var(--card); color: var(--ink); font: 500 16px var(--body); }
.preview { display: flex; justify-content: center; }

/* yearbook */
.yb h1 { font: 400 34px/1 var(--display); color: var(--hawk); }
.yb .sig { font: 400 17px/1.4 var(--display); color: var(--ink); padding: 12px 14px; border-radius: 6px; background: var(--card); border: 1px solid var(--card-line); box-shadow: var(--shadow); display: grid; grid-template-columns: 44px 1fr; gap: 10px; }
.yb .sig:nth-child(odd) { transform: rotate(-0.6deg); } .yb .sig:nth-child(even) { transform: rotate(0.5deg); }
.yb .sig small { display: block; font: 400 12px var(--body); color: var(--ink-soft); margin-top: 4px; }
.sup { display: grid; gap: 6px; }
.sup div { padding: 8px 12px; border-radius: 6px; background: var(--paper-2); font-size: 14px; }
.sup b { color: var(--hawk); }
.statrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.statrow div { padding: 10px; border-radius: 6px; background: var(--card); border: 1px solid var(--card-line); text-align: center; }
.statrow b { display: block; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.statrow span { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.06em; text-transform: uppercase; }
.small { font-size: 12px; color: var(--ink-soft); }
.linkish { border: 0; background: transparent; color: var(--ink-soft); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 4px; }

#hoops { position: fixed; inset: 0; z-index: 60; background: #0b0f18; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>
/* Engine 1 · Gesture
   One recognizer for every touch game: flicks, swipes, taps.
   Speeds come out in screen-heights per second and lengths in screen-heights,
   so a flick means the same thing on a small phone, a big phone, or a laptop. */
const Gesture = (() => {
  const TAP_PX = 12;
  const FLICK_MIN_PX = 24;
  const RELEASE_WINDOW_MS = 110;

  function classify(start, samples) {
    const last = samples[samples.length - 1];
    const dx = last.x - start.x, dy = last.y - start.y;
    const dist = Math.hypot(dx, dy);
    const dur = Math.max(1, last.t - start.t);
    const h = Math.max(320, window.innerHeight || 800);
    if (dist < TAP_PX) return dur < 380 ? { type: 'tap', x: last.x, y: last.y } : { type: 'hold', dur };

    // Release speed: displacement over the last ~110 ms, the part of a flick that throws.
    let k = samples.length - 1;
    while (k > 0 && last.t - samples[k - 1].t <= RELEASE_WINDOW_MS) k--;
    const ref = k === samples.length - 1 ? start : samples[k];
    const rdt = Math.max(8, last.t - ref.t) / 1000;
    const release = Math.hypot(last.x - ref.x, last.y - ref.y) / h / rdt;
    const avg = dist / h / (dur / 1000);
    const speed = Math.max(release, avg * 0.85);
    // Power blends how fast and how far the finger travelled. Length is easy to
    // repeat; speed is what "flick harder" feels like. Together they jitter less
    // than either alone.
    const power = Math.sqrt(speed * 4 * (dist / h));

    const base = { dx, dy, dist, dur, speed, power, startX: start.x, startY: start.y };
    if (-dy > Math.abs(dx) * 0.7 && dist >= FLICK_MIN_PX) {
      return Object.assign(base, { type: 'flick', angle: Math.atan2(dx, -dy) });
    }
    if (Math.abs(dx) >= Math.abs(dy)) return Object.assign(base, { type: 'swipe', dir: dx < 0 ? 'left' : 'right' });
    if (dy > 0) return Object.assign(base, { type: 'swipe', dir: 'down' });
    return Object.assign(base, { type: 'flick', angle: Math.atan2(dx, -dy) });
  }

  function attach(el, on) {
    let id = null, start = null, samples = null;
    const pt = e => ({ x: e.clientX, y: e.clientY, t: performance.now() });
    function down(e) {
      if (id !== null) return;
      id = e.pointerId;
      try { el.setPointerCapture(id); } catch (_) {}
      start = pt(e); samples = [start];
      on.down && on.down(start);
      e.preventDefault();
    }
    function move(e) {

  function drawFence(ctx, cam) {

  function drawRoom(ctx, cam, court, t) {

  function drawFloor(ctx, cam, court) {
    const hy = horizonY(cam);
    fillPoly(ctx, cam, [[-60, 0, -12], [60, 0, -12], [60, 0, 90], [-60, 0, 90]], court.floorFar);
    const g = ctx.createLinearGradient(0, hy, 0, cam.H);

    if (court.env === 'park') {

    fillPoly(ctx, cam, tr, court.env === 'park' ? 'rgba(255,255,255,0.03)' : 'rgba(255,240,210,0.08)');
    const hw = court.lane / 2;
    fillPoly(ctx, cam, [[-hw, 0, 0], [hw, 0, 0], [hw, 0, 19], [-hw, 0, 19]], court.key);

  function netPoints(net) {
    const top = [], bot = [], mid = [];
    const n = 12;
    const sway = net ? net.sway : 0, pull = net ? net.pull : 0, sx = net ? net.sx : 0, sz = net ? net.sz : 0;
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      top.push([RIM.x + RIM.r * Math.sin(a), RIM.y, RIM.z + RIM.r * Math.cos(a)]);
      const b = a + 0.26;
      const r2 = 0.42 + pull * 0.08;
      bot.push([RIM.x + r2 * Math.sin(b) + sx * sway, RIM.y - 1.55 - pull * 0.55, RIM.z + r2 * Math.cos(b) + sz * sway]);
      const m = a + 0.13;
      const r1 = 0.6 + pull * 0.04;
      mid.push([RIM.x + r1 * Math.sin(m) + sx * sway * 0.5, RIM.y - 0.8 - pull * 0.25, RIM.z + r1 * Math.cos(m) + sz * sway * 0.5]);

    ctx.strokeStyle = court && court.env === 'park' ? 'rgba(200,205,210,0.85)' : 'rgba(255,255,255,0.88)';
    ctx.lineCap = 'round';
    for (let i = 0; i < np.n; i++) {

      pairs.forEach(([a, b]) => {

    if (ro) ro.observe(root); else window.addEventListener('resize', resize);
    resize();

    // ---------- helpers ----------
    function after(sec, fn) { S.timers.push({ at: S.t + sec, fn }); }
    function banner(k, h, s, dur) {
      ui.banner.innerHTML = (k ? `<span class="k">${esc(k)}</span>` : '') + `<span class="h">${esc(h)}</span>` + (s ? `<span class="s">${esc(s)}</span>` : '');
      ui.banner.hidden = false;
      ui.banner.classList.remove('pop'); void ui.banner.offsetWidth; ui.banner.classList.add('pop');
      clearTimeout(banner._t);
      if (dur) banner._t = setTimeout(() => { ui.banner.hidden = true; }, dur * 1000);
    }
    function hideBanner() { clearTimeout(banner._t); ui.banner.hidden = true; }
    function hint(text) { ui.hint.textContent = text; ui.hint.hidden = !text; }
    function setTitle(a, b) { ui.title.textContent = a || ''; ui.sub.textContent = b || ''; }
    function setScore(n, sub) { ui.score.textContent = n; if (sub != null) ui.scoreSub.textContent = sub; }
    function popup(text, color, size, opt) {
      S.popups.push(Object.assign({ text, color: color || '#fff', size: size || 1, t: 0, life: 1.3, world: [RIM.x, RIM.y + 1.6, RIM.z] }, opt || {}));
    }
    function ratingFor(kind) { const r = settings.rating || {}; return r[kind] == null ? 60 : r[kind]; }

    function newShooter(pos) {
      return { pos: pos.slice(), from: null, to: null, moveT: 0, moveDur: 0, hasBall: true, reload: 0, jumpT: 9, fakeT: 9, catchT: 9, follow: 9 };
    }
    function moveShooter(dest, dur) {
      const sh = S.shooter;
      sh.from = sh.pos.slice(); sh.to = dest.slice(); sh.moveT = 0; sh.moveDur = dur;
    }
    function inBounds(p) { return Math.abs(p[0]) < 24.5 && p[2] > 0.6 && p[2] < 36 && Math.hypot(p[0] - RIM.x, p[2] - RIM.z) > 2.8; }

    // ---------- input ----------
    const detach = Gesture.attach(canvas, {
      down() { Sfx.unlock(); },
      gesture(g) {
        if (!S.running) return;
        if (g.type === 'flick') return onFlick(g);
        if (g.type === 'swipe') return onSwipe(g.dir);
        if (g.type === 'tap') return onTap(g);
      }
    });
    ui.quit.addEventListener('click', () => { Sfx.play('ui'); const q = S.onQuit; stop(); q && q(summary(true)); });
    ui.card.addEventListener('click', e => { if (e.target.closest('button') && S.cardNext) { const f = S.cardNext; S.cardNext = null; f(); } });

    function canShoot() {
      const sh = S.shooter;
      if (!sh || !sh.hasBall || sh.reload > 0) return false;
      if (S.phase === 'live' || S.phase === 'faking') return true;
      if (S.phase === 'moving' && sh.moveT / sh.moveDur > 0.55) return true;
      return false;
    }
    function onFlick(g) {
      if (!canShoot()) return;
      shoot(g);
    }
    function onSwipe(dir) {
      const k = S.spec && S.spec.kind;
      if (k === 'free' && S.phase === 'live') return freeMove(dir);
      if (!S.def || S.phase !== 'live' || !S.shooter.hasBall) return;
      if (dir === 'left' || dir === 'right') return driveMove(dir === 'left' ? -1 : 1);
      if (dir === 'down') return stepBack();
    }
    function onTap() {
      const k = S.spec && S.spec.kind;
      if (k === 'free' && S.phase === 'live' && S.shooter.hasBall) return openMap('Move to a new spot', 'Tap anywhere on the half court.', p => { placeShooter(p); S.phase = 'live'; });
      if (S.def && S.phase === 'live' && S.shooter.hasBall) pumpFake();
    }

    // ---------- moves ----------
    function driveMove(side) {
      const sh = S.shooter, d = S.def;
      const res = Defense.drive(d, side, ratingFor('handle'), S.rand);
      const pol = Court3D.polarOf(sh.pos);
      Sfx.play('dribble');
      if (res.steal) {
        S.poss.actions.push('drove into him and got stripped');
        S.poss.turnover = 'Stolen';
        sh.hasBall = false;
        popup('Stolen', '#ff7a66', 1.2, { world: V.add(d.pos, [0, 6, 0]) });
        Sfx.play('bad'); Sfx.buzz(60);
        S.phase = 'resolving';
        after(0.9, finishPossession);
        return;
      }
      let dest;
      if (res.win) {
        const nd = Math.max(3.3, Math.min(pol.dist * 0.34, 7));
        let na = pol.angle + side * 24;
        na = Math.max(-100, Math.min(100, na));
        dest = Court3D.polar(na, nd);
        S.poss.beatHim = true;
        S.poss.actions.push(`drove ${side < 0 ? 'left' : 'right'} and beat him`);
        popup('Blow-by', '#7ee2a8', 0.9, { world: V.add(sh.pos, V.add(V.mul(Court3D.dirToRim(sh.pos), 5), [0, 6.5, 0])) });
      } else {
        dest = Court3D.polar(Math.max(-100, Math.min(100, pol.angle + side * 7)), Math.max(3.5, pol.dist - 2));
        S.poss.actions.push(`drove ${side < 0 ? 'left' : 'right'} and got cut off`);
        popup('Cut off', '#ff9a66', 0.9, { world: V.add(d.pos, [0, 6.8, 0]) });
        Sfx.buzz(25);
      }
      if (!inBounds(dest)) dest = sh.pos.slice();
      moveShooter(dest, res.win ? 0.5 : 0.32);
      S.phase = 'moving';
      after(res.win ? 0.5 : 0.32, () => { if (S.phase === 'moving') S.phase = 'live'; });
    }
    function stepBack() {
      const sh = S.shooter;
      const dir = Court3D.dirToRim(sh.pos);
      const dest = V.sub(sh.pos, V.mul(dir, 3.2));
      if (!inBounds(dest)) return;
      S.poss.actions.push('stepped back');
      Sfx.play('dribble');
      moveShooter(dest, 0.28);
      S.phase = 'moving';
      after(0.28, () => { if (S.phase === 'moving') S.phase = 'live'; });
    }
    function pumpFake() {
      const sh = S.shooter;
      sh.fakeT = 0;
      const bit = Defense.pumpFake(S.def, sh.pos, S.rand);
      S.poss.actions.push(bit ? 'pump-faked and he bit' : 'pump-faked and he stayed down');
      if (bit) popup('He bit', '#7ee2a8', 0.9, { world: V.add(S.def.pos, [0, 7.5, 0]) });
      S.phase = 'faking';
      after(0.34, () => { if (S.phase === 'faking') S.phase = 'live'; });
    }
    function freeMove(dir) {
      const cur = S.freeRing || 'three';
      if (dir === 'down') {
        S.freeRing = cur === 'close' ? 'mid' : cur === 'mid' ? 'three' : 'close';
        S.freeIdx = Math.min(S.freeIdx, RINGS[S.freeRing].length - 1);
      } else {
        const ring = RINGS[cur];
        S.freeIdx = (S.freeIdx + (dir === 'left' ? -1 : 1) + ring.length) % ring.length;
      }
      const sp = Court3D.spotInfo(S.court, RINGS[S.freeRing][S.freeIdx]);
      moveShooter(sp.pos, 0.35);
      S.phase = 'moving';
      setTitle(S.spec.title || 'Shootaround', sp.label);
      after(0.35, () => { if (S.phase === 'moving') S.phase = 'live'; });
    }

    // ---------- shooting ----------
    function shoot(g) {
      const sh = S.shooter;
      const pos = sh.pos.slice();
      const dist = Math.hypot(pos[0] - RIM.x, pos[2] - RIM.z);
      let contest = S.def ? Defense.contest(S.def, pos) : 0;
      const fouled = !!(S.def && Defense.foulable(S.def, pos));
      if (fouled) contest = 0;
      const feel = FEEL[settings.feel] || FEEL.normal;
      const rating = S.cpuTurn ? 60 : ratingFor('shooting');
      const fatigue = S.spec.fatigue || 0;
      let w = feel.window * (1 + (rating - 60) / 160) * (dist < 6 ? 1.35 : dist > 22 ? 0.86 : 1) * (1 - 0.5 * contest) * (S.phase === 'moving' ? 0.82 : 1) * (1 - fatigue * 0.35);
      const calibrating = S.list && S.spec.calibrate;
      const touchK = calibrating ? g.power / HoopPhysics.idealFlick(dist) : settings.touchK;
      if (calibrating) S.calib.push(g.power / HoopPhysics.idealFlick(dist));
      const shot = HoopPhysics.shoot({ shooter: pos, flickSpeed: g.power, angle: g.angle, touchK, window: w, aimDead: feel.aim, contest, rating, fatigue, rand: S.rand });
      launch(shot, { contest, fouled, dist, by: 'you' });
      S.meter = { shot, t: 0, calibrating };
    }
    function launch(shot, info) {
      const sh = S.shooter;
      const held = heldBallScreen();
      const three = Court3D.isThree(S.court, sh.pos);
      const kind = S.spec.kind;
      const money = kind === 'rack' && !!S.spec.money && !!S.rack && S.rack.ball === S.spec.perRack - 1;
      const ft = kind === 'possessions' && S.ftMode;
      const ball = HoopPhysics.newBall(shot.release, shot.vel, {
        appear: 0.13, sx: held.x, sy: held.y, sr: held.r, trail: [], money,
        info: Object.assign({ three, ft, zone: Court3D.zoneOf(S.court, sh.pos), type: shot.type.id, green: shot.green, pos: sh.pos.slice(), poss: S.poss ? S.poss.i : null }, info)
      });
      if (S.def && !info.fouled && info.by === 'you') {
        const bc = Defense.blockChance(S.def, info.contest, shot.type.id);
        if (S.rand() < bc) ball.blockAt = 0.15;
      }
      S.balls.push(ball);
      sh.hasBall = false; sh.jumpT = 0; sh.follow = 0;
      if (S.def) Defense.reactToShot(S.def, sh.pos);
      if (S.poss && !ft) { S.poss.contest = info.contest; S.poss.fouled = info.fouled; S.poss.shotType = shot.type.label; S.poss.three = three; S.poss.dist = shot.dist; }
      if (info.by === 'you') { S.attempts++; S.zone[ball.info.zone] = S.zone[ball.info.zone] || [0, 0]; S.zone[ball.info.zone][1]++; }
      Sfx.play('release');
      if (kind === 'possessions' || kind === 'shots' || kind === 'horse') S.phase = 'flight';
      if (kind === 'rack') S.rackShot = true;
      hint('');
      return ball;
    }

    function onBallResult(b) {
      const info = b.info;
      const made = b.result === 'made' && !b.blocked;
      const kind = S.spec.kind;
      let pts = 0;
      if (kind === 'rack') pts = made ? (b.money ? 2 : 1) : 0;
      else if (info.ft) pts = made ? 1 : 0;
      else if (kind === 'possessions') pts = made ? (info.three ? 3 : 2) + (info.fouled ? 1 : 0) : 0;
      else pts = made ? 1 : 0;
      if (info.by === 'you') {
        if (made) {
          S.makes++; S.streak++; S.best = Math.max(S.best, S.streak);
          S.zone[info.zone][0]++;
        } else S.streak = 0;
        S.score += kind === 'horse' || kind === 'free' || kind === 'shots' ? (made ? 1 : 0) : pts;
      }
      // feedback
      const at = [RIM.x, RIM.y + 1.7, RIM.z];
      if (b.blocked) { /* already announced */ }
      else if (made) {
        if (b.swish) popup('Swish', '#ffffff', 1.25, { world: at });
        else if (b.rimHits >= 2) popup('Rattled in', '#ffd166', 1.05, { world: at });
        else if (b.boardHits && !b.rimHits) popup('Off the glass', '#ffd166', 1.0, { world: at });
        else popup('Good', '#ffffff', 1.05, { world: at });
        if (kind === 'possessions' || kind === 'rack') popup('+' + pts, info.three || b.money ? '#ffb547' : '#7ee2a8', 1.5, { world: [RIM.x, RIM.y + 3.4, RIM.z], life: 1.1 });
        if (info.fouled) popup('And one', '#ffb547', 1.1, { world: [RIM.x, RIM.y - 1, RIM.z] });
        if (info.by === 'you' && S.streak === 3) popup('Heating up', '#ff9a3c', 1.1, { world: [RIM.x, RIM.y + 5, RIM.z] });
        if (info.by === 'you' && S.streak === 5) popup('On fire', '#ff6a2a', 1.3, { world: [RIM.x, RIM.y + 5, RIM.z] });
        if (info.three || b.swish) Sfx.play('cheer');
        Sfx.buzz(18);
      } else {
        const airball = b.rimHits === 0 && b.boardHits === 0;
        popup(airball ? 'Airball' : (b.rimHits ? 'Rimmed out' : 'Miss'), '#ff9a66', 1.0, { world: at });
        if (airball) Sfx.play('groan');
      }
      updateScoreUi();
      if (kind === 'possessions') possessionBallDone(b, made, pts);
      else if (kind === 'shots') listBallDone(b, made);
      else if (kind === 'horse') horseBallDone(b, made);
      else if (kind === 'rack') { if (S.rackDone && !S.balls.some(x => !x.result)) after(1.0, endSession); }
    }

    function updateScoreUi() {
      const k = S.spec.kind;
      if (k === 'possessions') setScore(S.score, 'points');
      else if (k === 'rack') setScore(S.score, 'points');
      else if (k === 'free') setScore(S.attempts ? Math.round(S.makes / S.attempts * 100) + '%' : '0%', `${S.makes} of ${S.attempts}`);
      else if (k === 'shots') setScore(`${S.makes}/${S.attempts}`, 'made');
      else if (k === 'horse') setScore('', '');
    }

    // ---------- possessions ----------
    function pickFrom(list, prev) {
      const pool = list.filter(x => x !== prev);
      return (pool.length ? pool : list)[Math.floor(S.rand() * (pool.length ? pool.length : list.length))];
    }
    function startPossession(i) {
      const spec = S.spec;
      if (i >= spec.count) return endSession();
      const spots = spec.spots && spec.spots.length ? spec.spots : ['lw', 'rw', 'top', 'lc', 'rc', 'le', 're', 'lb', 'rb'];
      const defs = spec.defenders === 'none' ? [null] : (spec.defenders && spec.defenders.length ? spec.defenders : Defense.IDS);
      const plan = spec.plan && spec.plan[i];
      const spotId = plan && plan.spot ? plan.spot : pickFrom(spots, S.poss && S.poss.spotId);
      const archId = plan && plan.defender !== undefined ? plan.defender : pickFrom(defs, S.poss && S.poss.archId);
      const sp = Court3D.spotInfo(S.court, spotId);
      S.poss = { i, spotId, spotLabel: sp.label, archId, actions: [], contest: null, beatHim: false, fouled: false, points: 0, ftLeft: 0, ftMade: 0 };
      S.shooter = newShooter(sp.pos);
      S.shooter.hasBall = false;
      S.def = archId ? Defense.create(archId, sp.pos, S.rand) : null;
      S.balls = [];
      S.phase = 'intro';
      S.clock = null; ui.clock.hidden = true;
      setTitle(spec.title || 'Read & React', `Possession ${i + 1} of ${spec.count} · ${sp.label}`);
      const a = S.def ? S.def.arch : null;
      const showTag = a && (spec.showTags != null ? spec.showTags : settings.showTags);
      if (showTag) { ui.scout.innerHTML = `<b>${esc(a.name)}</b> · ${esc(a.tag)}`; ui.scout.hidden = false; } else ui.scout.hidden = true;
      const situation = plan && plan.situation ? plan.situation : spec.situation;
      banner(situation || `Possession ${i + 1}`, a ? (showTag ? a.name : 'Read him') : 'Open look', a ? (showTag ? a.tell : 'Watch what he gives you.') : sp.label, 1.25);
      after(1.15, () => {
        S.phase = 'catch';
        S.shooter.catchT = 0;
        Sfx.play('dribble');
        after(0.32, () => {
          S.shooter.hasBall = true;
          S.phase = 'live';
          S.clock = spec.shotClock || null;
          if (S.clock) ui.clock.hidden = false;
          if (settings.hints && S.hintShown < 2) {
            S.hintShown++;
            hint(S.def ? 'Flick up to shoot · Swipe left or right to drive · Swipe down to step back · Tap to pump fake' : 'Flick up to shoot');
          }
        });
      });
    }
    function possessionBallDone(b, made, pts) {
      const P = S.poss;
      if (!P) return;
      P.points += pts;
      if (b.info.ft) {
        P.ftMade += made ? 1 : 0;
        P.ftLeft--;
        after(1.0, () => P.ftLeft > 0 ? setupFreeThrow() : finishPossession());
        return;
      }
      P.made = made; P.blocked = !!b.blocked; P.swish = !!b.swish;
      P.actions.push(`${P.three ? 'three' : (P.shotType || 'shot').toLowerCase()}${made ? ' made' : (b.blocked ? ' blocked' : ' missed')}`);
      if (P.fouled) { P.ftLeft = made ? 1 : 2; after(1.0, setupFreeThrow); return; }
      after(0.9, finishPossession);
    }
    function setupFreeThrow() {
      const P = S.poss;
      const sp = Court3D.spotInfo(S.court, 'ft');
      S.shooter = newShooter(sp.pos);
      S.def = null; ui.contest.hidden = true;
      S.phase = 'live';
      banner('Free throw', `${P.ftLeft} to shoot`, '', 1.0);
      S.ftMode = true;
    }
    function narrate(P) {
      const parts = [];
      const acts = P.actions.slice();
      const shotAct = acts.length && /made|missed|blocked/.test(acts[acts.length - 1]) ? acts.pop() : null;
      if (acts.length) parts.push('You ' + acts.join(', then ') + '.');
      if (P.turnover) parts.push(P.turnover === 'Stolen' ? 'Turnover.' : 'Shot clock violation.');
      else if (shotAct) {
        const lab = Defense.contestLabel(P.contest || 0).text.toLowerCase();
        parts.push(`${P.three ? 'Three' : P.shotType || 'Shot'}, ${lab}: ${P.blocked ? 'blocked' : (P.made ? 'made' : 'missed')}.`);
      }
      if (P.fouled) parts.push(`Fouled. Free throws ${P.ftMade} of ${P.made ? 1 : 2}.`);
      parts.push(P.points ? `+${P.points}` : 'No points.');
      return parts.join(' ');
    }
    function finishPossession() {
      const P = S.poss;
      if (!P || P.finished) return;
      P.finished = true;
      S.ftMode = false;
      S.clock = null; ui.clock.hidden = true; ui.contest.hidden = true; hint('');
      const grade = Defense.grade({ turnover: P.turnover, fouled: P.fouled, blocked: P.blocked, contest: P.contest, beatHim: P.beatHim });
      P.grade = grade;
      const a = P.archId ? Defense.ARCHETYPES[P.archId] : null;
      S.log.push({ spot: P.spotId, arch: P.archId, points: P.points, grade, made: !!P.made, contest: P.contest, actions: P.actions, turnover: P.turnover || null });
      S.phase = 'card';
      const lesson = a ? a.read : 'Nobody on you. Take your time and find your touch.';
      ui.card.innerHTML = `<div class="k">Possession ${P.i + 1} · ${a ? esc(a.name) : 'Open'}</div><div class="w">${esc(narrate(P))}</div>
        <div class="r"><span class="hx-grade ${grade}">${grade}</span><span>${esc(lesson)}</span></div>
        <div class="row"><button class="hx-btn" type="button">${P.i + 1 >= S.spec.count ? 'See results' : 'Next possession'}</button></div>`;
      ui.card.hidden = false;
      ui.scout.hidden = true;
      if (grade === 'A') Sfx.play('great'); else if (grade === 'B') Sfx.play('good');
      const next = () => { ui.card.hidden = true; startPossession(P.i + 1); };
      S.cardNext = next;
    }

    // ---------- shot list (free throws, calibration, school drills) ----------
    function startListShot(i) {
      const L = S.list;
      if (i >= L.length) return endSession();
      S.listIdx = i;
      const item = L[i];
      const sp = Court3D.spotInfo(S.court, item.spot || 'ft');
      S.shooter = newShooter(item.pos || sp.pos);
      S.def = item.defender ? Defense.create(item.defender, S.shooter.pos, S.rand) : null;
      S.poss = item.defender ? { i, actions: [], spotId: item.spot } : null;
      S.phase = 'live';
      setTitle(S.spec.title || 'Shooting', item.label || `${sp.label} · ${i + 1} of ${L.length}`);
      if (S.spec.calibrate && i === 0) { banner('Find your touch', 'Three free throws', 'Flick up the way that feels natural. These set your touch.', 2.6); hint('Flick up toward the hoop'); }
      else if (S.spec.calibrate) hint('');
      else if (i === 0 && settings.hints) hint('Flick up to shoot');
    }
    function listBallDone(b, made) {
      after(0.9, () => startListShot(S.listIdx + 1));
    }

    // ---------- rack (3-point contest) ----------
    function startRack() {
      const spec = S.spec;
      S.rack = { idx: 0, ball: 0 };
      const sp = Court3D.spotInfo(S.court, spec.racks[0]);
      S.shooter = newShooter(sp.pos);
      S.def = null;
      S.gameClock = spec.time;
      S.rackDone = false;
      ui.clock.hidden = false;
      setTitle(spec.title || '3-Point Contest', `Rack 1 · ${sp.label}`);
      S.phase = 'intro';
      banner('Rack 1 of ' + spec.racks.length, 'Ready', 'Last ball on each rack is the money ball. Two points.', 1.3);
      after(1.3, () => { S.phase = 'live'; hint(settings.hints ? 'Flick fast. You can let the next one go before the last one lands.' : ''); });
    }
    function rackAfterShot() {
      const spec = S.spec, R = S.rack, sh = S.shooter;
      R.ball++;
      if (R.ball < spec.perRack) { sh.reload = 0.24; after(0.24, () => { sh.hasBall = true; }); return; }
      if (R.idx < spec.racks.length - 1) {
        R.idx++; R.ball = 0;
        const sp = Court3D.spotInfo(S.court, spec.racks[R.idx]);
        moveShooter(sp.pos, 0.55);
        S.phase = 'moving';
        setTitle(spec.title || '3-Point Contest', `Rack ${R.idx + 1} · ${sp.label}`);
        after(0.55, () => { S.phase = 'live'; sh.hasBall = true; });
      } else { S.rackDone = true; S.phase = 'waiting'; if (!S.balls.some(x => !x.result)) after(1.2, endSession); }
    }

    // ---------- HORSE ----------
    function horseUi() {
      const H5 = S.horse, w = S.spec.word || 'HORSE';
      const row = (who, n) => `<div><span>${esc(who)}</span>${w.split('').map((c, i) => `<i class="${i < n ? 'on' : ''}">${c}</i>`).join('')}</div>`;
      ui.horse.innerHTML = row('You', H5.letters.you) + row(S.spec.opponent.short || S.spec.opponent.name.split(' ')[0], H5.letters.cpu);
      ui.horse.hidden = false;
    }
    function startHorse() {
      const opp = S.spec.opponent;
      S.horse = { setter: 'you', stage: 'set', letters: { you: 0, cpu: 0 }, spot: null, shots: 0, history: [] };
      S.def = null;
      setTitle(S.spec.title || 'HORSE', `vs ${opp.name}`);
      horseUi();
      banner('HORSE', `vs ${opp.name}`, opp.blurb || 'Make it, and they have to match it.', 1.8);
      after(1.8, horseTurn);
    }
    function horseTurn() {
      const H5 = S.horse, opp = S.spec.opponent;
      horseUi();
      if (H5.setter === 'you' && H5.stage === 'set') {
        S.cpuTurn = null;
        openMap('Your shot', 'Pick a spot. If you make it, ' + (opp.short || opp.name.split(' ')[0]) + ' has to match.', p => {
          H5.spot = p; placeShooter(p); S.phase = 'live';
          setTitle('Your shot', describeSpot(p));
          hint('Flick up to shoot');
        });
      } else if (H5.setter === 'you' && H5.stage === 'match') {
        cpuShoot('match');
      } else if (H5.setter === 'cpu' && H5.stage === 'set') {
        H5.spot = cpuPickSpot();
        cpuShoot('set');
      } else {
        S.cpuTurn = null;
        placeShooter(H5.spot); S.phase = 'live';
        setTitle('Match it', describeSpot(H5.spot));
        banner('Your turn', 'Match it', describeSpot(H5.spot), 1.4);
        hint('Miss and you take a letter');
      }
    }
    function describeSpot(p) {
      const z = Court3D.zoneOf(S.court, p), d = Math.hypot(p[0] - RIM.x, p[2] - RIM.z);
      return `${Court3D.ZONES[z]} · ${Math.round(d)} ft`;
    }
    function cpuPickSpot() {
      const opp = S.spec.opponent;
      const favs = opp.favorites && opp.favorites.length ? opp.favorites : ['le', 're', 'top', 'lw', 'rw'];
      const id = favs[Math.floor(S.rand() * favs.length)];
      const sp = Court3D.spotInfo(S.court, id);
      const pol = Court3D.polarOf(sp.pos);
      const lead = S.horse.letters.you - S.horse.letters.cpu;
      const nd = pol.dist + (S.rand() - 0.5) * 2 + (lead < 0 ? 1.2 : 0);
      const na = pol.angle + (S.rand() - 0.5) * 12;
      let p = Court3D.polar(na, nd);
      if (!inBounds(p)) p = sp.pos;
      return p;
    }
    function cpuShoot(stage) {
      const opp = S.spec.opponent, H5 = S.horse;
      S.cpuTurn = { stage };
      placeShooter(H5.spot);
      S.shooter.hasBall = true;
      S.phase = 'cpu';
      const first = (opp.short || opp.name.split(' ')[0]);
      setTitle(`${first} shooting`, describeSpot(H5.spot));
      banner(stage === 'set' ? `${first} picks a spot` : `${first} has to match`, describeSpot(H5.spot), opp.lines ? opp.lines[Math.floor(S.rand() * opp.lines.length)] : '', 1.3);
      hint('');
      after(1.45, () => {
        const shot = HoopPhysics.cpuShot(S.shooter.pos, opp.skill, S.rand);
        launch(shot, { contest: 0, fouled: false, dist: shot.dist, by: 'cpu' });
      });
    }
    function horseBallDone(b, made) {
      const H5 = S.horse, opp = S.spec.opponent, first = (opp.short || opp.name.split(' ')[0]);
      const by = b.info.by;
      H5.history.push({ by, made, stage: H5.stage });
      let msg = null;
      if (H5.stage === 'set') {
        if (made) { H5.stage = 'match'; msg = by === 'you' ? [`Good`, `${first} has to match`] : [`${first} hits`, `Your turn to match`]; }
        else { H5.setter = by === 'you' ? 'cpu' : 'you'; msg = by === 'you' ? ['Missed', `${first}'s shot`] : [`${first} misses`, 'Your shot']; }
      } else {
        if (!made) {
          if (by === 'you') H5.letters.you++; else H5.letters.cpu++;
          const w = S.spec.word || 'HORSE';
          const n = by === 'you' ? H5.letters.you : H5.letters.cpu;
          msg = by === 'you' ? ['Letter', `You have ${w.slice(0, n)}`] : ['Letter', `${first} has ${w.slice(0, n)}`];
        } else msg = by === 'you' ? ['Matched', 'Still their shot'] : [`${first} matched`, 'Your shot again'];
        H5.stage = 'set';
      }
      horseUi();
      const w = S.spec.word || 'HORSE';
      S.phase = 'between';
      if (H5.letters.you >= w.length || H5.letters.cpu >= w.length) {
        const won = H5.letters.cpu >= w.length;
        banner(won ? 'You win' : `${first} wins`, won ? `${first} is a ${w}` : `You're a ${w}`, '', 2.2);
        if (won) Sfx.play('great'); else Sfx.play('bad');
        after(2.3, endSession);
        return;
      }
      banner(msg[0], msg[1], '', 1.2);
      after(1.35, horseTurn);
    }

    // ---------- spot picker ----------
    function openMap(title, text, onPick, marks) {
      S.phase = 'map';
      const c = S.court;
      const hw = c.lane / 2;
      const a0 = c.cornerZ > RIM.z ? Math.atan2(c.corner, c.cornerZ - RIM.z) : Math.asin(Math.min(1, c.corner / c.three));
      const arc = [];
      for (let i = 0; i <= 40; i++) { const a = -a0 + 2 * a0 * i / 40; arc.push(`${(RIM.x + c.three * Math.sin(a)).toFixed(2)},${(RIM.z + c.three * Math.cos(a)).toFixed(2)}`); }
      const threePath = `M${-c.corner},0 L${-c.corner},${c.cornerZ} L${arc.join(' L')} L${c.corner},${c.cornerZ} L${c.corner},0`;
      ui.map.innerHTML = `<h3>${esc(title)}</h3><p>${esc(text)}</p>
        <svg viewBox="-26 -2 52 36" role="img" aria-label="Half court. Tap to choose where to shoot from.">
          <rect x="-25" y="0" width="50" height="34" rx="0.6" fill="${c.env === 'park' ? '#2c5a46' : '#c99a62'}" stroke="#f3f1ea" stroke-width="0.25"/>
          <rect x="${-hw}" y="0" width="${c.lane}" height="19" fill="${c.key}" stroke="#f3f1ea" stroke-width="0.25"/>
          <path d="M-6,19 A6,6 0 0 0 6,19" fill="none" stroke="#f3f1ea" stroke-width="0.25"/>
          <path d="${threePath}" fill="none" stroke="#f3f1ea" stroke-width="0.3"/>
          <line x1="-3" y1="4" x2="3" y2="4" stroke="#f3f1ea" stroke-width="0.5"/>
          <circle cx="${RIM.x}" cy="${RIM.z}" r="0.75" fill="none" stroke="#e2581f" stroke-width="0.3"/>
          <g class="marks"></g>
          <circle class="pick" r="0.9" fill="#ffb547" stroke="#1a1206" stroke-width="0.25" visibility="hidden"/>
        </svg>
        <div class="row"><button class="hx-btn" type="button" disabled>Shoot from here</button></div>`;
      ui.map.hidden = false;
      const svg = ui.map.querySelector('svg'), dot = ui.map.querySelector('.pick'), btn = ui.map.querySelector('.hx-btn');
      let chosen = null;
      svg.addEventListener('pointerdown', e => {
        const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
        const m = svg.getScreenCTM(); if (!m) return;
        const q = pt.matrixTransform(m.inverse());
        const p = [Math.max(-24, Math.min(24, q.x)), 0, Math.max(0.8, Math.min(33, q.y))];
        if (Math.hypot(p[0] - RIM.x, p[2] - RIM.z) < 3) return;
        chosen = p;
        dot.setAttribute('cx', p[0]); dot.setAttribute('cy', p[2]); dot.setAttribute('visibility', 'visible');
        btn.disabled = false;
        btn.textContent = `Shoot from here · ${Math.round(Math.hypot(p[0] - RIM.x, p[2] - RIM.z))} ft${Court3D.isThree(S.court, p) ? ' · three' : ''}`;
        Sfx.play('ui');
      });
      btn.addEventListener('click', () => { if (!chosen) return; ui.map.hidden = true; ui.map.innerHTML = ''; onPick(chosen); });
    }
    function placeShooter(p) {
      S.shooter = newShooter(p);
    }

    // ---------- session ----------
    function run(spec, handlers) {
      stop(true);
      S.spec = Object.assign({}, spec);
      S.court = Court3D.COURTS[spec.court] || Court3D.COURTS.park;
      S.onEnd = handlers && handlers.onEnd; S.onQuit = handlers && handlers.onQuit;
      S.rand = spec.seed != null ? mulberry(spec.seed) : Math.random;
      Object.assign(S, { t: 0, balls: [], popups: [], timers: [], meter: null, clock: null, gameClock: null, score: 0, makes: 0, attempts: 0, streak: 0, best: 0, log: [], zone: {}, poss: null, rack: null, horse: null, list: null, cpuTurn: null, calib: [], hintShown: 0, cardNext: null, ftMode: false, rackDone: false, ended: false });
      ['clock', 'horse', 'scout', 'contest', 'banner', 'hint', 'card', 'map'].forEach(k => { ui[k].hidden = true; });
      setScore('', '');
      updateScoreUi();
      S.running = true;
      S.last = performance.now();
      S.raf = requestAnimationFrame(frame);
      const k = spec.kind;
      if (k === 'possessions') startPossession(0);
      else if (k === 'rack') startRack();
      else if (k === 'horse') startHorse();
      else if (k === 'shots') { S.list = spec.shots; startListShot(0); }
      else {
        S.freeRing = 'three'; S.freeIdx = Math.max(0, RINGS.three.indexOf(spec.spot || 'top'));
        const sp = Court3D.spotInfo(S.court, spec.spot || 'top');
        S.freeIdx = RINGS.three.indexOf(sp.id) >= 0 ? RINGS.three.indexOf(sp.id) : 2;
        S.shooter = newShooter(sp.pos);
        S.phase = 'live';
        setTitle(spec.title || 'Shootaround', sp.label);
        hint(settings.hints ? 'Flick up to shoot · Swipe left or right to move · Swipe down to change range · Tap to pick any spot' : '');
      }
    }
    function summary(quit) {
      const k = S.spec ? S.spec.kind : null;
      const out = { kind: k, quit: !!quit, points: S.score, makes: S.makes, attempts: S.attempts, bestStreak: S.best, zone: S.zone, log: S.log };
      if (k === 'possessions' && S.log.length) {
        const gp = { A: 4, B: 3, C: 2, D: 1, F: 0 };
        out.readIQ = Math.round(S.log.reduce((s, l) => s + gp[l.grade], 0) / S.log.length * 25);
      }
      if (k === 'horse' && S.horse) { out.letters = S.horse.letters; out.won = S.horse.letters.cpu >= (S.spec.word || 'HORSE').length; }
      if (S.spec && S.spec.calibrate && S.calib.length) {
        const c = S.calib.slice().sort((a, b) => a - b);
        out.touchK = Math.max(0.8, Math.min(4.5, c[Math.floor(c.length / 2)]));
      }
      return out;
    }
    function endSession() {
      if (S.ended) return;
      S.ended = true;
      const res = summary(false);
      const f = S.onEnd;
      stop();
      f && f(res);
    }
    function stop(silent) {
      S.running = false;
      cancelAnimationFrame(S.raf);
      S.timers = [];
      ui.map.hidden = true;
      hideBanner();
    }
    function destroy() { stop(); detach(); if (ro) ro.disconnect(); root.remove(); }

    // ---------- update ----------
    function update(dt) {
      S.t += dt;
      // timers
      const due = S.timers.filter(x => x.at <= S.t);
      if (due.length) { S.timers = S.timers.filter(x => x.at > S.t); due.forEach(x => x.fn()); }
      const sh = S.shooter;
      if (sh) {
        if (sh.to) {
          sh.moveT += dt;
          const k = Math.min(1, sh.moveT / sh.moveDur);
          sh.pos = V.lerp3(sh.from, sh.to, easeInOut(k));
          if (k >= 1) sh.to = null;
        }
        sh.jumpT += dt; sh.fakeT += dt; sh.catchT += dt; sh.follow += dt;
        if (sh.reload > 0) sh.reload -= dt;
      }
      if (S.def && S.phase !== 'intro' && S.phase !== 'card') Defense.update(S.def, dt, sh, S.rand);
      // clocks
      if (S.clock != null && (S.phase === 'live' || S.phase === 'moving' || S.phase === 'faking')) {
        S.clock -= dt;
        if (S.clock <= 0) {
          S.clock = 0; Sfx.play('buzzer');
          if (S.poss) { S.poss.turnover = 'Shot clock'; S.poss.actions.push('ran out the clock'); }
          sh.hasBall = false;
          popup('Shot clock', '#ff5d4a', 1.2, { world: [RIM.x, RIM.y + 2, RIM.z] });
          S.phase = 'resolving';
          after(0.8, finishPossession);
        }
      }
      if (S.gameClock != null && S.spec.kind === 'rack' && S.phase !== 'intro' && !S.rackDone) {
        S.gameClock -= dt;
        if (S.gameClock <= 0) {
          S.gameClock = 0; S.rackDone = true; sh.hasBall = false; Sfx.play('buzzer');
          banner('', 'Time', '', 1.2);
          if (!S.balls.some(x => !x.result)) after(1.2, endSession);
        }
      }
      // balls
      S.balls.forEach(b => {
        if (b.blockAt && !b.blocked && b.t >= b.blockAt) {
          b.blocked = true;
          const side = S.rand() < 0.5 ? -1 : 1;
          const dir = Court3D.dirToRim(b.info.pos);
          b.v = [-dir[0] * 9 + dir[2] * side * 7, 4, -dir[2] * 9 - dir[0] * side * 7];
          popup('Blocked', '#ff5d4a', 1.4, { world: V.add(b.p, [0, 1.5, 0]) });
          Sfx.play('block'); Sfx.buzz(50);
          if (S.def) S.def.lift = 2.5;
        }
        HoopPhysics.advance(b, dt, S.court);
        b.events.forEach(ev => {
          if (ev.type === 'rim') Sfx.play('rim', ev.s);
          else if (ev.type === 'board') Sfx.play('board');
          else if (ev.type === 'bounce') Sfx.play('bounce', ev.s);
          else if (ev.type === 'score') {
            Sfx.play('swish');
            S.net.pull = 1; S.net.sway = 0.45;
            const hv = Math.hypot(b.v[0], b.v[2]) || 1;
            S.net.sx = b.v[0] / hv; S.net.sz = b.v[2] / hv;
          }
        });
        b.events.length = 0;
        if (b.blocked && !b.result && b.t > 0.9) b.result = 'miss';
        if (b.result && !b.handled) { b.handled = true; onBallResult(b); }
        if (b.trail) { b.trail.push(b.p.slice()); if (b.trail.length > 7) b.trail.shift(); }
      });
      S.balls = S.balls.filter(b => !b.done);
      // shootaround: the next ball comes back to you
      if (sh && !sh.hasBall && S.spec.kind === 'free' && S.phase === 'live' && sh.jumpT > 0.7) { sh.hasBall = true; sh.catchT = 0; }
      // rack: count shots
      if (S.spec.kind === 'rack' && S.rackShot) { S.rackShot = false; rackAfterShot(); }
      // net and popups
      S.net.pull *= Math.exp(-dt * 3.5); S.net.sway *= Math.exp(-dt * 3);
      S.popups.forEach(p => { p.t += dt; });
      S.popups = S.popups.filter(p => p.t < p.life);
      if (S.meter) { S.meter.t += dt; if (S.meter.t > 1.8) S.meter = null; }
      // HUD: clock and contest
      if (S.clock != null && !ui.clock.hidden) {
        const v = S.clock;
        ui.clock.textContent = v < 5 ? v.toFixed(1) : Math.ceil(v);
        ui.clock.classList.toggle('low', v < 2);
      }
      if (S.gameClock != null && !ui.clock.hidden) {
        const v = Math.max(0, S.gameClock);
        ui.clock.textContent = v < 10 ? v.toFixed(1) : Math.ceil(v);
        ui.clock.classList.toggle('low', v < 10);
      }
      if (S.def && sh && (S.phase === 'live' || S.phase === 'moving' || S.phase === 'faking' || S.phase === 'catch')) {
        const lab = Defense.foulable(S.def, sh.pos) ? { text: 'Draw the foul', tone: 'open' } : Defense.contestLabel(Defense.contest(S.def, sh.pos));
        const txt = lab.text + lab.tone;
        if (txt !== S.lastContestText) {
          S.lastContestText = txt;
          ui.contest.className = 'hx-chip hx-contest ' + lab.tone;
          ui.contest.innerHTML = `<b>${esc(lab.text)}</b>`;
        }
        ui.contest.hidden = false;
      }
    }

    // ---------- render ----------
    function heldBallScreen() {
      const sh = S.shooter;
      const r = Math.min(W * 0.15, H * 0.085);
      let x = W / 2, y = H - r * 1.75;
      if (!sh) return { x, y, r };
      if (sh.fakeT < 0.34) y -= H * 0.09 * Math.sin(Math.PI * sh.fakeT / 0.34);
      if (sh.catchT < 0.32) { const k = sh.catchT / 0.32; x += (1 - k) * W * 0.7; y -= (1 - k) * H * 0.15; }
      if (sh.reload > 0) y += sh.reload / 0.24 * r * 2.5;
      if (sh.to) {
        const k = sh.moveT / sh.moveDur;
        y += Math.abs(Math.sin(k * Math.PI * 2)) * r * 0.5; // dribble bob
      }
      return { x, y, r };
    }
    function drawHands(held, alpha) {
      const skin = S.cpuTurn ? (S.spec.opponent.skin || '#8d5524') : settings.skin;
      const sleeve = S.cpuTurn ? (S.spec.opponent.sleeve || '#333') : settings.sleeve;
      const r = held.r;
      ctx.save();
      ctx.globalAlpha = alpha;
      [-1, 1].forEach(sd => {
        ctx.save();
        ctx.translate(held.x + sd * r * 0.92, held.y + r * 0.35);
        ctx.rotate(sd * -0.35);
        ctx.fillStyle = sleeve;
        ctx.beginPath(); ctx.ellipse(sd * r * 0.55, r * 1.6, r * 0.55, r * 0.9, sd * 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = skin;
        ctx.beginPath(); ctx.ellipse(0, r * 0.15, r * 0.36, r * 0.62, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.beginPath(); ctx.ellipse(sd * -r * 0.12, -r * 0.2, r * 0.12, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });
      ctx.restore();
    }
    function frame(now) {
      if (!S.running) return;
      const dt = Math.min(0.05, Math.max(0, (now - S.last) / 1000));
      S.last = now;
      update(dt);
      if (S.running) render();
      if (S.running) S.raf = requestAnimationFrame(frame);
    }
    function render() {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const sh = S.shooter;
      const pos = sh ? sh.pos : Court3D.spotInfo(S.court, 'top').pos;
      const lift = sh && sh.jumpT < 0.6 ? Math.sin(Math.PI * sh.jumpT / 0.6) * 0.9 : 0;
      const roll = sh && sh.to ? Math.sin(Math.PI * sh.moveT / sh.moveDur) * 0.05 * Math.sign((sh.to[0] - sh.from[0]) || 0) : 0;
      const cam = Court3D.shooterCamera(pos, W, H, { lift, roll });
      const court = S.court;
      ctx.fillStyle = '#0b0f18'; ctx.fillRect(0, 0, W, H);
      if (court.env === 'park') Court3D.drawPark(ctx, cam, S.t); else Court3D.drawRoom(ctx, cam, court, S.t);
      Court3D.drawFloor(ctx, cam, court);
      if (court.env === 'park') Court3D.drawFence(ctx, cam);
      S.balls.forEach(b => Court3D.drawShadow(ctx, cam, b.p, b.p[1]));
      // depth-sorted scene
      const items = [];
      const depth = p => Court3D.toCam(cam, p)[2];
      items.push({ d: depth([0, 10.5, 3.2]), f: () => { Court3D.drawSupport(ctx, cam, court); Court3D.drawBoard(ctx, cam, court); } });
      const rd = depth([RIM.x, RIM.y, RIM.z]);
      items.push({ d: rd + 0.6, f: () => Court3D.drawNetAndRim(ctx, cam, 'back', S.net, court) });
      items.push({ d: rd - 0.6, f: () => Court3D.drawNetAndRim(ctx, cam, 'front', S.net, court) });
      if (S.def) items.push({ d: depth(V.add(S.def.pos, [0, 4, 0])), f: () => Defense.drawDefender(ctx, cam, S.def) });
      S.balls.forEach(b => items.push({ d: depth(b.p), f: () => drawFlightBall(cam, b) }));
      items.sort((a, b) => b.d - a.d).forEach(it => it.f());
      // the defender can hide the rim; draw a faint ring so you never lose it
      if (S.def) {
        ctx.save(); ctx.globalAlpha = 0.35; ctx.strokeStyle = '#ff8a4c';
        const pts = []; for (let i = 0; i <= 24; i++) { const a = i / 24 * Math.PI * 2; pts.push([RIM.x + RIM.r * Math.sin(a), RIM.y, RIM.z + RIM.r * Math.cos(a)]); }
        for (let i = 0; i < 24; i++) Court3D.seg(ctx, cam, pts[i], pts[i + 1], 0.05, 1.2);
        ctx.restore();
      }
      // ball in hands
      if (sh && (sh.hasBall || sh.catchT < 0.32 || sh.reload > 0) && S.phase !== 'map') {
        const held = heldBallScreen();
        drawHands(held, 1);
        drawHeldBall(held, S.spec.kind === 'rack' && S.rack && S.rack.ball === S.spec.perRack - 1 && S.spec.money);
      } else if (sh && sh.follow < 0.3) {
        const held = heldBallScreen();
        held.y -= sh.follow / 0.3 * H * 0.25;
        drawHands(held, 1 - sh.follow / 0.3);
      }
      drawPopups(cam);
      if (S.meter) drawMeter();
      if (S.spec.kind === 'rack' && S.rack) drawRackDots();
    }
    function drawHeldBall(held, money) {
      const r = held.r;
      const g = ctx.createRadialGradient(held.x - r * 0.35, held.y - r * 0.4, r * 0.1, held.x, held.y, r);
      if (money) { g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#e6ecf8'); g.addColorStop(1, '#2a4fb0'); }
      else { g.addColorStop(0, '#f6a35c'); g.addColorStop(0.55, '#e0661f'); g.addColorStop(1, '#8f3509'); }
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(held.x, held.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = money ? 'rgba(200,30,40,0.8)' : 'rgba(40,15,5,0.7)'; ctx.lineWidth = Math.max(1, r * 0.06);
      ctx.beginPath(); ctx.moveTo(held.x - r, held.y + r * 0.05); ctx.quadraticCurveTo(held.x, held.y - r * 0.15, held.x + r, held.y + r * 0.05); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(held.x, held.y, r * 0.4, r, 0, -Math.PI / 2, Math.PI / 2); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(held.x, held.y, r * 0.4, r, 0, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
    }
    function drawFlightBall(cam, b) {
      const hot = b.info && b.info.by === 'you' && S.streak >= 3;
      if (b.t > b.appear) {
        // trail
        for (let i = 0; i < b.trail.length - 1; i++) {
          const p = Court3D.project(cam, b.trail[i]);
          if (!p) continue;
          const a = (i + 1) / b.trail.length * (hot ? 0.5 : 0.18);
          ctx.fillStyle = hot ? `rgba(255,120,40,${a})` : `rgba(255,255,255,${a})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, Court3D.BALL_R * p.s * (0.5 + i / b.trail.length * 0.5), 0, Math.PI * 2); ctx.fill();
        }
        Court3D.drawBall(ctx, cam, b);
        return;
      }
      const p = Court3D.project(cam, b.p);
      if (!p) return;

    let h = 2166136261 >>> 0;
    for (const x of arguments) {
      const s = String(x);

  function gameResult(st, o, margin, res) {
    const week = Sim.dayInfo(st.day).week;
    const yourPts = res ? res.points : 0;
    const team = st.player.team;
    const base = team === 'varsity' ? 0.55 : 0.45;
    const swing = res ? (yourPts - 2.2) * 1.4 + ((res.readIQ || 50) - 55) / 30 : 0;
    const finalMargin = Math.round(margin + swing + (base - o.strength) * 6 + (Sim.live(st) - 0.5) * 3);
    const won = finalMargin > 0 || (finalMargin === 0 && Sim.live(st) < 0.5);
    const us = 48 + Math.round(Sim.live(st) * 16), them2 = us + (won ? -Math.max(1, Math.abs(finalMargin)) : Math.max(1, Math.abs(finalMargin)));
    st.season[won ? 'w' : 'l']++;
    st.season.games.push({ week, opp: o.name, us, them: them2, won, pts: yourPts });
    const clutch = res && res.log && res.log.length >= 2 && res.log[1].points >= 2;
    const fans = D.CAST.filter(c => rel(st, c.id).coming === week).map(c => c.id);
    fans.forEach(id => {
      Sim.adjust(st, id, { friend: won ? 6 : 3 });
      Sim.remember(st, id, { k: 'game' + week, v: clutch ? 2.5 : 1, recall: `the ${o.name} game`, line: clutch ? `I still have the video of your shot against ${o.name}.` : `That ${o.name} game was fun. Loud, but fun.`, t: `I came to your game against ${o.name}.` });
      Sim.text(st, id, clutch ? Sim.pickLive(st, ['YOU HIT THAT SHOT', 'ok that last shot??? i screamed', 'i have it on video. framing it']) : won ? Sim.pickLive(st, ['good game!!', 'we WON', 'fun night']) : Sim.pickLive(st, ['you played good though', 'refs were blind', 'next week']));
    });
    D.CAST.filter(c => ['marcus', 'tyler', 'hannah'].includes(c.id)).forEach(c => {
      Sim.adjust(st, c.id, { friend: won ? 3 : 0 });
      if (clutch && c.id !== 'tyler') Sim.remember(st, c.id, { k: 'clutch' + week, v: 2, recall: `your shot against ${o.name}`, line: `Still thinking about your shot against ${o.name}.`, t: `You hit the big shot against ${o.name}.` });
    });
    if (clutch) { Sim.adjust(st, 'tyler', { rival: 8 }); Sim.mood(st, 15); }
    else Sim.mood(st, won ? 8 : -6);
    Sim.stat(st, 'athletics', 1.5);
    Sim.log(st, `${won ? 'Beat' : 'Lost to'} ${o.name}, ${Math.max(us, them2)}-${Math.min(us, them2)}.${yourPts ? ` You scored ${yourPts} in the fourth.` : ''}${clutch ? ' Hit the last shot.' : ''}`, won ? 'win' : 'loss');
    if (o.final) st.player.flags.finalWon = won;
    const head = won ? `Final: Hollow Creek ${us}, ${o.name} ${them2}.` : `Final: ${o.name} ${them2}, Hollow Creek ${us}.`;
    const body = !res ? 'You watch from the bench.' : clutch ? 'Your last-second bucket is the one everybody will talk about Monday.' : yourPts ? `You put up ${yourPts} in the fourth.` : 'Your looks didn\'t fall tonight.';
    return { text: `${head} ${body} Record: ${st.season.w}-${st.season.l}.${o.final && won ? ' Hollow Creek wins the rivalry, and the gym empties onto the floor.' : ''}` };
  }

const Micro = (() => {

  }

    const t0 = performance.now();

    const tick = () => {
      if (dead) return;
      const k = Math.min(1, (performance.now() - t0) / (f.seconds * 1000));
      f.bar.style.width = ((1 - k) * 100) + '%';
      f.bar.classList.toggle('low', k > 0.75);

  }

  // Algebra: solve for x, pick from three
  function algebra(el, o, done) {
    const r = o.rand, f = frame(el, 'Solve for x', 'Tap the right answer. As many as you can.', o.seconds);
    let right = 0, wrong = 0, over = false;
    function next() {
      const x = 1 + Math.floor(r() * (o.hard ? 12 : 9)), a = 2 + Math.floor(r() * (o.hard ? 8 : 5)), b = Math.floor(r() * 15) - 4;
      const c = a * x + b;

      while (opts.length < 3) opts.push(x + opts.length + 2);

      f.body.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
